<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>CLIMATH 수업</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Noto+Sans+KR:wght@400;500;700&display=swap');

*{box-sizing:border-box;}
html,body{margin:0; padding:0;}
#root{
  --navy:#15233f; --navy2:#27406e; --cream:#f4efe6; --paper:#fffdf8;
  --clay:#c2703f; --ink:#1c2333; --muted:#7c8294; --green:#3f7d5e; --line:#e7e0d2;
  font-family:'Noto Sans KR',system-ui,sans-serif;
  background:
    radial-gradient(1200px 400px at 80% -10%, rgba(39,64,110,.10), transparent),
    var(--cream);
  min-height:100vh; color:var(--ink);
}
.cm-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 22px; border-bottom:1px solid var(--line);
  background:var(--navy); color:#fff; position:sticky; top:0; z-index:5;
}
.cm-brand{display:flex; flex-direction:column; gap:2px;}
.cm-logo{font-family:'Fraunces',serif; font-weight:600; letter-spacing:.14em; font-size:20px;}
.cm-sub{font-size:11px; color:#aab6d0; letter-spacing:.02em;}
.cm-toggle{display:flex; background:rgba(255,255,255,.10); border-radius:999px; padding:3px;}
.cm-toggle button{border:0; background:transparent; color:#c4cde0; font-size:13px; font-weight:500; padding:7px 16px; border-radius:999px; cursor:pointer; font-family:inherit;}
.cm-toggle button.on{background:#fff; color:var(--navy);}

.cm-main{max-width:560px; margin:0 auto; padding:22px 16px 40px;}

/* ===== 사이드바 ===== */
.cm-hamb{display:none; border:0; background:rgba(255,255,255,.10); color:#fff; width:38px; height:38px; border-radius:10px; font-size:19px; cursor:pointer; align-items:center; justify-content:center; flex:none; margin-right:12px;}
.cm-shell{display:block;}
.cm-shell > .cm-main{display:flex; align-items:flex-start; gap:0; max-width:900px; margin:0 auto; padding:0 16px 40px;}
.cm-shell > .cm-main > .cm-side ~ *{flex:1; min-width:0; max-width:560px; padding-top:22px;}
.cm-shell > .cm-main > .cm-stack{flex:1; min-width:0; max-width:560px; padding-top:22px;}
.cm-shell > .cm-main > *:not(.cm-side):not(.cm-backdrop){flex:1; min-width:0; padding-top:22px;}

/* 안내문 편집처럼 좌우 두 판이 필요한 화면은 560px 컬럼에 가두지 않는다.
   .cm-shell-wide 는 그 화면이 떠 있는 동안에만 붙는다 (FlyerEditor가 붙였다 뗀다). */
@media (min-width: 1000px){
  .cm-shell.cm-shell-wide > .cm-main{max-width:1560px;}
  .cm-shell.cm-shell-wide > .cm-main > .cm-stack,
  .cm-shell.cm-shell-wide > .cm-main > .cm-side ~ *{max-width:none;}
}
/* 안내문 위쪽 버튼 줄 — 세로로 쌓이지 않게 폭을 내용에 맞춘다 */
.cm-fly-bar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px;}
.cm-fly-bar .cm-btn{width:auto; margin-top:0; padding:9px 16px; font-size:14px;}
.cm-side{
  flex:none; width:190px; padding:22px 12px 40px; margin-right:6px;
  position:sticky; top:69px; align-self:flex-start; max-height:calc(100vh - 69px); overflow-y:auto;
}
.cm-side-title{font-size:11px; color:var(--muted); font-weight:600; letter-spacing:.04em; padding:0 12px 8px;}
.cm-side-btn{
  display:flex; align-items:center; gap:9px; width:100%; border:0; background:transparent;
  padding:11px 12px; border-radius:10px; font-size:14px; font-weight:500; color:var(--ink);
  cursor:pointer; font-family:inherit; text-align:left; margin-bottom:2px; line-height:1.3;
}
.cm-side-btn:hover{background:rgba(21,35,63,.05);}
.cm-side-btn.on{background:var(--navy); color:#fff; font-weight:600;}
.cm-side-btn:disabled{opacity:.38; cursor:not-allowed;}
.cm-side-btn:disabled:hover{background:transparent;}
.cm-side-ico{font-size:15px; width:19px; text-align:center; flex:none;}
.cm-side-sep{height:1px; background:var(--line); margin:9px 12px;}
.cm-backdrop{display:none;}
/* PC에선 사이드바가 항상 보이므로 최상위 화면의 돌아가기 버튼 숨김 */
@media (min-width: 861px){ .cm-home-back{display:none;} }

/* ===== 학습관리 보고서 (A4 인쇄) ===== */
.rp-sheet{background:#fff; color:#1c2333; padding:26px 28px; border-radius:14px; border:1px solid var(--line); font-size:13px; line-height:1.6;}
.rp-head{display:flex; align-items:flex-end; justify-content:space-between; border-bottom:2px solid var(--navy); padding-bottom:12px; margin-bottom:18px;}
.rp-logo{font-family:'Fraunces',serif; font-size:19px; font-weight:600; letter-spacing:.13em; color:var(--navy);}
.rp-title{font-size:12px; color:#6b7280; margin-top:3px;}
.rp-who{text-align:right;}
.rp-who b{font-size:17px;}
.rp-sec{margin:18px 0 0;}
.rp-sec-h{font-family:'Fraunces',serif; font-size:14px; color:var(--navy); font-weight:600; border-left:3px solid var(--clay); padding-left:8px; margin-bottom:9px;}
.rp-stats{display:flex; gap:10px;}
.rp-stat{flex:1; background:#f7f4ee; border-radius:10px; padding:11px 8px; text-align:center;}
.rp-stat b{display:block; font-size:20px; font-family:'Fraunces',serif; color:var(--navy);}
.rp-stat span{font-size:11px; color:#6b7280;}
.rp-table{width:100%; border-collapse:collapse; font-size:12.5px;}
.rp-table th{background:#f7f4ee; padding:7px 9px; text-align:left; font-weight:600; color:#4b5563; border-bottom:1px solid #e5ded2;}
.rp-table td{padding:7px 9px; border-bottom:1px solid #f0ece5;}
.rp-note{background:#f7f4ee; border-radius:10px; padding:12px 14px; white-space:pre-wrap; min-height:56px;}
.rp-consult{padding:9px 0; border-bottom:1px solid #f0ece5;}
.rp-consult:last-child{border-bottom:0;}
.rp-foot{margin-top:22px; padding-top:11px; border-top:1px solid #e5ded2; font-size:11px; color:#9ca3af; display:flex; justify-content:space-between;}

@media print{
  @page{size:A4; margin:14mm;}
  body{background:#fff;}
  .cm-header, .cm-side, .cm-backdrop, .cm-hamb, .rp-noprint{display:none !important;}
  .cm-shell > .cm-main{display:block; max-width:none; padding:0;}
  .cm-main > *{max-width:none !important; padding-top:0 !important;}
  .rp-sheet{border:0; border-radius:0; padding:0; font-size:12px;}
  .rp-sheet + .rp-sheet{page-break-before:always;}
}

@media (max-width: 860px){
  .cm-hamb{display:flex;}
  .cm-shell > .cm-main{display:block; max-width:560px; padding:22px 16px 40px;}
  .cm-shell > .cm-main > *{padding-top:0 !important; max-width:none !important;}
  /* 높이를 직접 준다. top:0 + bottom:0 만으로는 상자가 안 늘어나고 내용 높이 그대로여서,
     메뉴가 길면 화면 밖으로 흘러나가기만 하고 스크롤이 안 걸렸다 (상자 입장에선 다 들어간 셈).
     100dvh 는 주소창이 접혔다 펴지는 아이폰 사파리에서 100vh 가 어긋나는 걸 피한다. */
  .cm-side{
    position:fixed; top:0; left:0; width:250px; z-index:40;
    height:100vh; height:100dvh; max-height:100vh; max-height:100dvh;
    overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
    background:var(--paper); box-shadow:2px 0 22px rgba(21,35,63,.18);
    padding:20px 12px 40px; transform:translateX(-102%); transition:transform .22s cubic-bezier(.25,.8,.25,1);
  }
  .cm-side.open{transform:translateX(0);}
  .cm-backdrop.show{display:block; position:fixed; inset:0; background:rgba(21,35,63,.42); z-index:39;}
  .cm-side-close{display:flex !important;}
}
.cm-side-close{display:none; align-items:center; gap:8px; width:100%; border:0; background:transparent; color:var(--muted); font-size:13px; padding:6px 12px 14px; cursor:pointer; font-family:inherit;}
.cm-stack{display:flex; flex-direction:column; gap:14px;}

.cm-card{background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:20px; box-shadow:0 1px 0 rgba(21,35,63,.03), 0 8px 24px -16px rgba(21,35,63,.25);}
.cm-h2{font-family:'Fraunces',serif; font-size:22px; margin:0 0 14px; color:var(--navy);}
.cm-h3{font-family:'Fraunces',serif; font-size:17px; margin:0 0 14px; color:var(--navy);}
.cm-h-hint{font-family:'Noto Sans KR',sans-serif; font-size:12px; font-weight:400; color:var(--muted);}
.cm-label{display:block; font-size:12px; color:var(--muted); margin:12px 0 5px; font-weight:500;}
.cm-input{width:100%; border:1px solid var(--line); background:#fff; border-radius:10px; padding:12px 13px; font-size:15px; font-family:inherit; color:var(--ink); outline:none; transition:border-color .15s;}
.cm-input:focus{border-color:var(--navy2);}
.cm-tilde{color:var(--muted);}

.cm-btn{width:100%; border:0; border-radius:11px; padding:13px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; margin-top:16px; transition:transform .08s, filter .15s;}
.cm-btn:active{transform:translateY(1px);}
.cm-btn-primary{background:var(--navy); color:#fff;}
.cm-btn-primary:hover{filter:brightness(1.12);}
.cm-big{padding:18px; font-size:17px;}
.cm-btn-ghost{width:auto; margin:0; background:transparent; color:var(--clay); border:1px solid var(--clay); padding:8px 16px; font-size:13px; border-radius:9px;}
.cm-btn-ghost:hover{background:var(--clay); color:#fff;}
.cm-link{background:none; border:0; color:var(--muted); font-size:13px; cursor:pointer; font-family:inherit; text-decoration:underline; text-underline-offset:3px;}
.cm-err{color:var(--clay); font-size:13px; margin-top:10px;}

.cm-welcome{display:flex; align-items:center; justify-content:space-between;}
.cm-welcome-name{font-family:'Fraunces',serif; font-size:20px; color:var(--navy);}
.cm-welcome-sub{font-size:13px; color:var(--muted); margin-top:3px;}

.cm-tabs{display:flex; gap:6px; background:#ece4d4; padding:5px; border-radius:12px;}
.cm-tabs button{flex:1; border:0; background:transparent; padding:10px 4px; border-radius:9px; font-size:14px; font-weight:500; color:var(--muted); cursor:pointer; font-family:inherit;}
.cm-tabs button.on{background:#fff; color:var(--navy); box-shadow:0 1px 4px rgba(21,35,63,.10);}
.cm-tabs button:disabled{opacity:.4; cursor:not-allowed;}

.cm-done{color:var(--green); font-weight:700; font-size:16px; text-align:center; padding:14px;}
.cm-sentlist{margin-top:18px; border-top:1px dashed var(--line); padding-top:14px;}
.cm-mini-h{font-size:12px; color:var(--muted); margin-bottom:8px; font-weight:500;}
.cm-sent-item{display:flex; justify-content:space-between; align-items:center; padding:8px 0; font-size:14px;}
.cm-tag-ok{font-size:12px; color:var(--green); font-weight:700;}
.cm-tag-wait{font-size:12px; color:var(--clay); font-weight:700;}

.cm-hint{font-size:13px; color:var(--muted); line-height:1.5;}
.cm-hint b{color:var(--clay);}

.cm-book-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px;}
.cm-book-count{font-family:'Fraunces',serif; font-size:15px; color:var(--green); font-weight:600;}
.cm-book-pct{font-size:13px; color:var(--ink2); font-weight:500; font-family:inherit;}
.cm-paintbadge{margin-left:10px; font-family:'Noto Sans KR',sans-serif; font-size:11px; font-weight:700; color:#fff; background:var(--green); padding:3px 10px; border-radius:999px; vertical-align:middle;}
.cm-rangebar{display:flex; align-items:center; gap:8px; margin-bottom:16px;}
.cm-rangebar .cm-input{padding:9px 11px; font-size:14px;}
.cm-rangebtn{white-space:nowrap;}
.cm-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(34px,1fr)); gap:5px; user-select:none; -webkit-user-select:none;}
.cm-cell{display:flex; align-items:center; justify-content:center; padding:7px 0; font-size:11px; border-radius:7px; background:#f0eadd; color:var(--muted); border:1px solid var(--line);}
button.cm-cell{cursor:pointer; font-family:inherit;}
.cm-cell.clickable:hover{border-color:var(--green); color:var(--green);}
.cm-cell.done{background:#dcefe3; color:var(--green); font-weight:700; border-color:#9fcfb4;}
.cm-cell.done.clickable:hover{border-color:var(--clay); color:var(--clay);}
.cm-cell.q{color:#d6453f; font-weight:700;}

.cm-daylist{display:flex; flex-direction:column; gap:8px;}
.cm-day{display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left; cursor:pointer; font-family:inherit; background:#fff; border:1px solid var(--line); border-radius:12px; padding:15px 16px; transition:border-color .15s, transform .08s;}
.cm-day:hover{border-color:var(--navy2);}
.cm-day:active{transform:translateY(1px);}
.cm-day.today{border-color:var(--navy); background:#f7f9fc;}
.cm-day-left{display:flex; align-items:center; gap:8px;}
.cm-day-date{font-weight:700; color:var(--navy); font-size:15px;}
.cm-day-badge{background:var(--navy); color:#fff; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px;}
.cm-day-sub{font-size:11px; color:var(--muted); background:#f0ece5; padding:2px 8px; border-radius:999px; margin-left:6px;}
.cm-ai-scroll{height:62vh; min-height:340px; overflow-y:auto; padding:10px 2px; display:flex; flex-direction:column; gap:10px;}
.cm-ai-msg{display:flex; flex-direction:column; max-width:88%;}
.cm-ai-msg.me{align-self:flex-end; align-items:flex-end;}
.cm-ai-msg.ai{align-self:flex-start; align-items:flex-start;}
.cm-ai-bubble{padding:10px 13px; border-radius:14px; font-size:14px; line-height:1.5; white-space:pre-wrap; word-break:break-word;}
.cm-ai-msg.me .cm-ai-bubble{background:var(--navy); color:#fff; border-bottom-right-radius:4px;}
.cm-ai-msg.ai .cm-ai-bubble{background:#f0ece5; color:var(--ink); border-bottom-left-radius:4px;}
.cm-ai-typing{color:var(--muted); font-style:italic;}
.cm-ai-img{max-width:180px; border-radius:10px; margin-bottom:4px;}
.cm-ai-preview{display:flex; align-items:center; gap:10px; margin:8px 0;}
.cm-ai-preview img{max-width:60px; max-height:60px; border-radius:8px; border:1px solid var(--line);}
.cm-ai-input{display:flex; gap:8px; align-items:center; margin-top:12px;}
.cm-ai-input .cm-input{flex:1 1 0%; min-width:0; height:48px; font-size:15px;}
.cm-ai-imgbtn{flex:0 0 48px; width:48px; height:48px; border:1px solid var(--line); border-radius:10px; background:#fff; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;}
.cm-ai-send{flex:0 0 auto; padding:0 18px; height:48px; border:none; border-radius:10px; background:var(--navy); color:#fff; font-size:15px; font-weight:600; cursor:pointer; white-space:nowrap;}
.cm-ai-send:disabled{opacity:.5;}
.cm-day-arrow{font-size:20px; color:var(--navy2); line-height:1;}

.cm-daybar{display:flex; align-items:center; justify-content:space-between; padding:8px 2px; position:sticky; top:0; z-index:100; background:var(--bg); margin:-4px -4px 4px -4px;}
.cm-back{background:none; border:0; color:var(--navy2); font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; padding:4px 0;}
@keyframes slideInRight{from{transform:translateX(60%);opacity:0;}to{transform:translateX(0);opacity:1;}}
.cm-slide-in{animation:slideInRight 0.2s cubic-bezier(.25,.8,.25,1) both;}
.cm-daybar-date{font-family:'Fraunces',serif; font-size:16px; color:var(--navy); display:flex; align-items:center; gap:8px;}
.cm-live{font-family:'Noto Sans KR',sans-serif; font-size:11px; color:var(--clay); font-weight:700; letter-spacing:.05em;}

.cm-admin-top{display:flex; align-items:center; gap:24px;}
.cm-stat{text-align:left;}
.cm-stat-num{font-family:'Fraunces',serif; font-size:30px; color:var(--navy); line-height:1;}
.cm-stat-num span{font-size:16px; color:var(--muted);}
.cm-clay{color:var(--clay)!important;}
.cm-stat-lab{font-size:12px; color:var(--muted); margin-top:4px;}
.cm-admin-top .cm-link{margin-left:auto;}

.cm-empty{color:var(--muted); font-size:14px; text-align:center; padding:14px;}

/* ===== 드래그 업로드 =====
   평소에는 테두리를 안 그린다. 파일을 끌고 들어와야 자리가 드러난다.
   터치 기기에는 드래그가 없으므로 버튼이 항상 같이 있어야 한다. */
/* 학생 명단 표 — 칸 안에서 바로 고친다 (엑셀처럼) */
.cm-sheet td{padding:3px;}
.cm-sheet-in{width:100%; box-sizing:border-box; border:1px solid transparent; background:transparent;
  border-radius:6px; padding:5px 6px; font-family:inherit; font-size:13px; color:var(--ink); outline:none;}
.cm-sheet-in:hover{border-color:#e0d9cb; background:#fff;}
.cm-sheet-in:focus{border-color:var(--navy); background:#fff;}
select.cm-sheet-in{cursor:pointer; appearance:none; -webkit-appearance:none;}
/* 폭을 선언한 대로 지킨다. auto로 두면 학교 select의 가장 긴 항목이 열을 밀어
   이름 칸까지 넓어졌다. 좁은 화면에선 눌러 찌그러지지 말고 가로로 넘기게 둔다. */
.cm-sheet{table-layout:fixed; width:100%; min-width:600px;}
.cm-sheet th.cm-sort{cursor:pointer; user-select:none;}
.cm-sheet th.cm-sort:hover{background:#efe9e0;}
.cm-sheet-ar{font-size:9px; color:var(--navy);}
.cm-sheet-ar.off{color:#cec5b7;}
/* 아는 학교가 아니면 표시해둔다 — "경기"처럼 후보가 갈려 못 맞춘 것도 여기 걸린다 */
.cm-sheet-in.odd{border-color:#e0b489; background:#fffaf3;}
.cm-sheet-grp{background:#f2eee7 !important; font-weight:700; color:#5a5248; font-size:12px;
  text-align:left !important; padding:6px 9px !important; position:sticky; left:0;}
.cm-sched{table-layout:fixed; width:100%; min-width:880px;}
.cm-sched input[type=date]{font-size:11px; padding:4px 5px;}
/* 날짜 칸 지우개. <input type=date>는 휴대폰에서 값을 비울 방법이 없다 —
   달력 휠은 늘 어떤 날짜를 고르게 되어 있어서, 잘못 넣으면 되돌리지 못한다. */
.cm-datewrap{display:flex; align-items:center; gap:1px;}
.cm-datewrap > input{flex:1; min-width:0;}
.cm-x{border:0; background:transparent; color:#b6ab9b; font-size:15px; line-height:1;
  padding:0 3px; cursor:pointer; font-family:inherit; flex:none;}
.cm-x:hover{color:#d6453f;}
.cm-x:disabled{opacity:.4; cursor:not-allowed;}

.cm-drop{border:1.5px dashed transparent; border-radius:12px; transition:border-color .15s, background-color .15s; padding:2px;}
.cm-drop.over{border-color:var(--clay); background:rgba(194,112,63,.06);}
.cm-drop-hint{display:flex; align-items:center; justify-content:center; gap:7px; color:var(--clay); font-size:13px; font-weight:500; padding:16px 10px; text-align:center;}
.cm-q{display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--line);}
.cm-q:last-child{border-bottom:0;}
.cm-q-main{flex:1; min-width:0;}
.cm-q-top{display:flex; justify-content:space-between; align-items:baseline;}
.cm-q-name{font-weight:700; color:var(--navy);}
.cm-q-time{font-size:12px; color:var(--muted);}
.cm-q-body{font-size:15px; margin-top:3px;}
.cm-q-body b{color:var(--clay);}
.cm-q-memo{color:var(--muted); font-size:13px;}
.cm-q.done{opacity:.5;}
.cm-resolved-box { border: 1px solid #e8e0d4; border-radius: 10px; overflow: hidden; }
.cm-resolved-summary { cursor: pointer; padding: 10px 14px; font-size: 13px; color: #8a7f72; font-weight: 600; list-style: none; background: #f7f4f0; user-select: none; }
.cm-resolved-summary::-webkit-details-marker { display: none; }
.cm-resolved-summary::before { content: "▶ "; font-size: 11px; }
details[open] .cm-resolved-summary::before { content: "▼ "; }
.cm-resolved-box .cm-q { margin: 0; border-radius: 0; border-top: 1px solid #ede8e0; }
.cm-q-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }

const { useState, useEffect, useRef } = React;
const db = window.db;

// ---- 초기 시딩용 반 데이터 (최초 1회만 Firestore에 복사됨. 이후 앱에서 관리) ----
const SEED_CLASSES = [
  { id: "s-mongeum", name: "고1S 월금반", classDays: [1, 5], roster: [
    { id: "s1", name: "김서진" }, { id: "s2", name: "임서윤" }, { id: "s3", name: "김태윤" },

    { id: "s1", name: "마서준" }, { id: "s2", name: "김하준" }, { id: "s3", name: "김중원" },

    { id: "t1", name: "한민수", teacher: true },
  ]},
];
let CLASSES = []; // Firestore에서 로드됨
const findClass = (id) => CLASSES.find((c) => c.id === id);

const DEFAULT_BOOKS = [
  { name: "수평교 + 최고난도", total: 404 },
  { name: "기출백서", total: 302 },
  { name: "BASECAMP공수1-2", total: 455 },
];
const getBooks = (cls) => (cls && cls.books) || [];
const isIndividual = (cls) => cls && cls.type === "individual";
// ----- 수강 기간: 시작일/마지막 등원일 -----
// endDate가 지나면 자동으로 명단에서 빠짐 (기록은 그대로 남음)
function isActiveOn(st, date) {
  if (!st) return false;
  const d = date || todayStr;
  if (st.startDate && d < st.startDate) return false;
  if (st.endDate && d > st.endDate) return false;
  return true;
}
const isEnded = (st) => !!(st && st.endDate && todayStr > st.endDate);
// ----- 반 종강: 학생 수강종료와 같은 문법을 반 단위로 -----
// 종강일이 지난 반은 목록·집계·학생 화면에서 빠지고, 기록은 전부 그대로 남는다.
// endDate를 지우면 그대로 되살아난다 (2학기 개강 등).
const isClassEnded = (cls) => !!(cls && cls.endDate && todayStr > cls.endDate);
// 담당 범위. 관리자와 학생은 null(제한 없음 - 학생 CLASSES는 이미 자기 반뿐이다).
// 일반 선생님은 담당 반 id 배열. 보안 규칙이 담당 반 밖을 막으므로 화면도 같이 맞춘다 —
// 안 맞추면 목록에는 보이는데 들어가면 아무것도 안 뜨는 상태가 된다.
let MY_SCOPE = null;
const inScope = (c) => !MY_SCOPE || MY_SCOPE.indexOf(c.id) >= 0;
const activeClasses = () => CLASSES.filter((c) => !isClassEnded(c) && inScope(c));
const endedClasses = () => CLASSES.filter((c) => isClassEnded(c) && inScope(c));
// 기간 연장: 기준일(없거나 이미 지났으면 오늘)에서 n개월 뒤
function addMonths(baseStr, n) {
  const base = (baseStr && baseStr >= todayStr) ? baseStr : todayStr;
  const d = new Date(base + "T00:00:00");
  const day = d.getDate();
  d.setMonth(d.getMonth() + n);
  if (d.getDate() < day) d.setDate(0); // 말일 보정 (1/31 +1개월 → 2/28)
  return ymd(d);
}
// 최근 n개월 목록 (YYYY-MM). 반드시 1일로 만들어야 한다 —
// 오늘이 29~31일이면 setMonth가 넘쳐 없는 달이 생긴다
// (8/29에서 6개월 전은 2/29인데 그런 날이 없어 3/1이 된다 → 2월이 사라지고 3월이 두 번).
function recentMonths(n) {
  const y = Number(todayStr.slice(0, 4)), m = Number(todayStr.slice(5, 7));
  const out = [];
  for (let i = 0; i < n; i++) {
    const d = new Date(y, m - 1 - i, 1);
    out.push(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"));
  }
  return out;
}

// 내신 참여표용 달 목록 — 다가올 달도 고를 수 있어야 한다.
// 9월 시험 준비를 8월에 하므로 지난 달만 주면 정작 필요한 달이 없다.
function examMonths(back, fwd) {
  const y = Number(todayStr.slice(0, 4)), m = Number(todayStr.slice(5, 7));
  const out = [];
  for (let i = (fwd == null ? 4 : fwd); i >= -(back == null ? 9 : back); i--) {
    const d = new Date(y, m - 1 + i, 1);
    out.push(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"));
  }
  return out;
}

// 그 달에 수업이 있는 날짜를 요일에서 만들어낸다.
// days 문서는 그날 뭔가 일어나야 생긴다. 출석을 한 번도 안 찍은 날은 문서가 없어서
// 월간 출석부에 칸 자체가 없었고, 그래서 나중에 채워 넣을 방법이 없었다.
// 개별진도반은 학생마다 요일이 다르므로 전원의 요일을 합친다 (표에서 학생별로 다시 거른다).
function scheduledDates(cls, ym) {
  const [y, m] = ym.split("-").map(Number);
  if (!y || !m) return [];
  let dows;
  if (isIndividual(cls)) {
    const seen = {};
    (cls.roster || []).forEach((r) => { if (!r.teacher) (r.days || []).forEach((d) => { seen[d] = 1; }); });
    dows = Object.keys(seen).map(Number);
  } else {
    dows = cls.classDays || [];
  }
  if (!dows.length) return [];
  const out = [];
  const last = new Date(y, m, 0).getDate();
  for (let d = 1; d <= last; d++) {
    const dt = new Date(y, m - 1, d);
    if (dows.indexOf(dt.getDay()) >= 0) out.push(ymd(dt));
  }
  return out;
}

// 그 날짜에 수업 대상인 학생인가 (요일 + 기간)
function attendsOn(cls, st, date) {
  if (!isActiveOn(st, date)) return false;
  if (!isIndividual(cls)) return true;
  return (st.days || []).includes(new Date(date + "T00:00:00").getDay());
}
const getStudentBooks = (cls, st) => isIndividual(cls) ? ((st && st.books) || []) : getBooks(cls);
function getClassAllBooks(cls) {
  if (!isIndividual(cls)) return getBooks(cls);
  const seen = {}; const out = [];
  (cls.roster || []).forEach((r) => {
    if (r.teacher) return;
    (r.books || []).forEach((b) => { if (!seen[b.name]) { seen[b.name] = 1; out.push(b); } });
  });
  return out;
}
// 기본 PIN·관리자 PIN 상수는 서버(/api/auth)로 옮겼다. 소스에 박아두면 소스 보기로 노출된다.

function ymd(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
const todayStr = ymd(new Date());
const WD = ["일", "월", "화", "수", "목", "금", "토"];
// "2026-08-17" → "8/17" (표·그래프에서 좁게 쓴다)
const shortDate = (d) => { const p = String(d).split("-"); return parseInt(p[1]) + "/" + parseInt(p[2]); };
function fmtDate(d) {
  const dt = new Date(d + "T00:00:00");
  return d.split("-").join(".") + " (" + WD[dt.getDay()] + ")";
}
const hhmm = (ts) => new Date(ts).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });

// ===== Firestore (반별로 분리: classes/{cid}/days/{date}/...) =====
const classDoc = (cid) => db.collection("classes").doc(cid);
const daysCol = (cid) => classDoc(cid).collection("days");

// 친 학교 이름을 아는 이름으로 맞춰준다.
// 34개를 훑어 고르는 것보다 치는 게 빠르다. 대신 그냥 두면 "중동고/중동고등학교/중동"이
// 섞여 같은 학교인지 판별이 안 되므로, 다 치고 칸을 벗어날 때 맞춘다.
//   숙명 · 숙명여 · 숙명여자고등학교 → 숙명여고
// 후보가 둘 이상이면 건드리지 않는다. 엉뚱한 학교로 바꾸는 게 오타보다 나쁘다.
function matchSchool(typed, opts) {
  const raw = String(typed || "").trim();
  if (!raw) return "";
  const norm = (x) => String(x || "").replace(/\s+/g, "")
    .replace(/등학교$/, "").replace(/학교$/, "")   // 중동고등학교 → 중동고
    .replace(/자/g, "");                            // 숙명여자고 → 숙명여고
  const n = norm(raw);
  const list = opts || [];
  if (!n) return raw;
  const exact = list.filter((x) => norm(x) === n);
  if (exact.length) return exact[0];
  const pre = list.filter((x) => norm(x).indexOf(n) === 0);
  if (pre.length === 1) return pre[0];
  const has = list.filter((x) => norm(x).indexOf(n) >= 0);
  if (has.length === 1) return has[0];
  return raw;
}

// 통째로 보내면, 화면이 들고 있던 옛 사본으로 덮게 되어 방금 넣은 옆 칸이 지워진다

async function saveSchoolTerm(term, school, grade, v) {
  const one = { term: term, school: school, grade: grade, updated: Date.now() };
  ["start", "end", "math", "back"].forEach((k) => {
    if (v && v[k] !== undefined) one[k] = v[k];
  });

}

// 그 회차에 적어둔 것만 골라낸다
function schoolTermsOf(all, term) {
  const pre = termKey(term) + "__";
  return Object.keys(all || {})
    .filter((k) => k.indexOf(pre) === 0 && all[k] && all[k].school)
    .map((k) => all[k]);
}
function findSchoolTerm(all, term, school, grade) {
  const v = (all || {})[schedKey(term, school, grade)];
  return v && v.school && v.start ? v : null;
}

// 점수는 날짜마다 흩어져 있다(days/{date}/scores). 추이를 그리려면 모아야 한다.
// 날짜 하나당 읽기가 한 번 나가므로 **기간을 받아서** 그만큼만 본다.
// 어차피 날짜별로 전원 것을 읽으므로 반 전체를 돌려준다 — 반 평균을 공짜로 낼 수 있다.
// 돌려주는 것: { rows, days, truncated }
const SCORE_MAX_DAYS = 120;
async function loadScoreHistory(cid, fromDate, toDate) {
  const snap = await daysCol(cid).get();
  let dates = [];
  snap.forEach((d) => dates.push(d.id));
  dates = dates.filter((d) => (!fromDate || d >= fromDate) && (!toDate || d <= toDate)).sort();
  const truncated = dates.length > SCORE_MAX_DAYS;
  const use = truncated ? dates.slice(-SCORE_MAX_DAYS) : dates;
  const rows = [];
  await Promise.all(use.map(async (date) => {
    try {
      const sc = await scoresCol(cid, date).get();
      sc.forEach((d) => rows.push({ id: d.id, date, ...d.data() }));
    } catch (e) { /* 권한 없는 날은 건너뛴다 */ }
  }));
  rows.sort((a, b) => a.date.localeCompare(b.date) || (a.time || 0) - (b.time || 0));
  return { rows, days: use.length, truncated };
}

// 예전에는 여기서 PIN을 읽어와 브라우저 안에서 비교했다. 검사하는 코드도 정답도
// 사용자 손 안에 있어서 아무 의미가 없었다. 이제 PIN은 브라우저로 내려오지 않고,
// 통과하면 위조 불가능한 커스텀 토큰만 받는다. 보안 규칙이 그 토큰을 보고 막는다.
const normName = (s) => (s || "").replace(/\s+/g, "");

async function authApi(body) {
  const r = await fetch("/api/auth", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  let j = null;
  try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((j && j.error) || ("요청 실패 (" + r.status + ")"));
  return j || {};
}

// 토큰으로 로그인하고 반 목록을 불러온다.
// 로그인 전에는 규칙이 막으므로 CLASSES는 이 시점에야 채워진다.
// 토큰에 실린 신분(role/tid/sname/cids). 규칙이 보는 것과 같은 값이다.
let AUTH = null;
async function authClaims(force) {
  const u = firebase.auth().currentUser;
  if (!u) { AUTH = null; return null; }
  if (AUTH && !force) return AUTH;
  try {
    const r = await u.getIdTokenResult();
    AUTH = r.claims && r.claims.role ? r.claims : null;
  } catch (e) { AUTH = null; }
  return AUTH;
}

async function signInWithToken(token) {
  await firebase.auth().signInWithCustomToken(token);
  await authClaims(true);
  await loadClasses();
}

async function linkRosterToStudent(cid, rosterId, person) {
  const cls = findClass(cid);
  if (!cls) return;
  const next = (cls.roster || []).map((r) => (r.id === rosterId
    ? { ...r, pid: person.pid, school: person.school || "", grade: person.grade || "" } : r));
  await saveClassRoster(cid, next);
  cls.roster = next;
}
// 사람 정보가 바뀌면 그 사람이 속한 모든 반의 미러도 갱신한다.
// **이름도 함께 보낸다** — 이름을 안 흘려보내면 학생 명단에서 고친 이름이 반 명단에
// 안 반영돼 두 화면이 어긋난다(출석부·참여표는 반 명단 이름을 쓴다).
async function syncStudentToRosters(person) {
  for (const c of CLASSES) {
    const hit = (c.roster || []).some((r) => r.pid === person.pid);
    if (!hit) continue;
    const next = c.roster.map((r) => {
      if (r.pid !== person.pid) return r;
      const n = { ...r, school: person.school || "", grade: person.grade || "" };
      if (person.name) n.name = person.name;
      return n;
    });
    try { await saveClassRoster(c.id, next); c.roster = next; } catch (e) {}
  }
}
// 반에 넣기 / 빼기.
// 명단 전체를 다시 쓰므로 **반드시 최신(cls.roster) 위에 얹는다** — 화면이 들고 있던
// 옛 사본으로 저장하면 그 사이 바뀐 다른 학생 내용이 날아간다.
async function assignToClass(cid, person) {
  const cls = findClass(cid);
  if (!cls) return;
  if ((cls.roster || []).some((r) => r.pid === person.pid)) return;   // 이미 있음
  const id = "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  const next = (cls.roster || []).concat([{
    id: id, pid: person.pid, name: person.name,
    school: person.school || "", grade: person.grade || "",
  }]);
  await saveClassRoster(cid, next);
  cls.roster = next;
}
async function unassignFromClass(cid, pid) {
  const cls = findClass(cid);
  if (!cls) return;
  const next = (cls.roster || []).filter((r) => r.pid !== pid);
  await saveClassRoster(cid, next);
  cls.roster = next;
}

}

//  - 학생: 토큰에 적힌 자기 반만 하나씩. 반 전체를 나열하면 규칙이 거부한다
//          (조건 없는 쿼리는 "안전하다"를 증명할 수 없다)
//  - 선생님: 전체 목록. 담당이 아닌 반은 화면에서 "열람 전용"으로 표시된다
// 시드 생성은 없앴다 - 이제 반 생성은 관리자만 할 수 있고, 실제 반은 이미 다 있다.
async function loadClasses() {
  const claims = await authClaims();
  if (!claims) { CLASSES = []; return CLASSES; }
  const arr = [];
  if (claims.role === "student") {
    const ids = claims.cids || [];
    const docs = await Promise.all(ids.map((id) => classesCol().doc(id).get().catch(() => null)));
    docs.forEach((d) => { if (d && d.exists) arr.push({ id: d.id, ...d.data() }); });
  } else {
    const s = await classesCol().orderBy("time").get();
    s.forEach((d) => arr.push({ id: d.id, ...d.data() }));
  }
  // 표시 순서: order 필드 우선 (없으면 생성순)
  arr.sort((a, b) => {
    const ao = a.order, bo = b.order;
    if (ao != null && bo != null) return ao - bo;
    if (ao != null) return -1;
    if (bo != null) return 1;
    return (a.time || 0) - (b.time || 0);
  });
  CLASSES = arr;
  return arr;
}

// ----- 진도계획표 (파일 게시: HTML/PDF/이미지를 base64 조각으로 Firestore에 저장) -----
const progressDoc = (cid, key) => classDoc(cid).collection("progress").doc(key || "class");
const PROGRESS_MAX_BYTES = 4.5 * 1024 * 1024;
const PROGRESS_CHUNK = 700000;
function guessMime(name) {
  const ext = (name.split(".").pop() || "").toLowerCase();
  if (ext === "html" || ext === "htm") return "text/html";
  if (ext === "pdf") return "application/pdf";
  if (["png", "jpg", "jpeg", "gif", "webp"].includes(ext)) return "image/" + (ext === "jpg" ? "jpeg" : ext);
  return "application/octet-stream";
}
// 강의노트로 받을 수 있는 파일인가 — 파일 선택창의 accept=".html,.htm,.pdf,image/*"와 같은 기준.
// 드래그로는 accept가 안 먹으므로 손으로 한 번 더 걸러야 한다.
// 확장자가 없거나 낯설어도 mime이 맞으면 받는다(캡처 이미지 등).
function isNoteFile(file) {
  const mime = file.type || guessMime(file.name);
  if (mime.startsWith("image/") || mime === "application/pdf" || mime === "text/html") return true;
  const ext = (file.name.split(".").pop() || "").toLowerCase();
  return ["html", "htm", "pdf", "png", "jpg", "jpeg", "gif", "webp", "heic", "heif"].includes(ext);
}
// 범용: 파일을 base64 조각으로 문서+parts에 저장
async function saveFileToDoc(docRef, file) {
  if (file.size > PROGRESS_MAX_BYTES) throw new Error("파일이 너무 커요 (최대 4.5MB)");
  const b64 = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(",")[1]);
    r.onerror = () => rej(new Error("파일을 읽지 못했어요"));
    r.readAsDataURL(file);
  });
  const oldParts = await docRef.collection("parts").get();
  for (const d of oldParts.docs) await d.ref.delete();
  const chunks = [];
  for (let i = 0; i < b64.length; i += PROGRESS_CHUNK) chunks.push(b64.slice(i, i + PROGRESS_CHUNK));
  for (let i = 0; i < chunks.length; i++) await docRef.collection("parts").doc(String(i)).set({ data: chunks[i] });
  await docRef.set({ name: file.name, mime: file.type || guessMime(file.name), size: file.size, chunks: chunks.length, time: Date.now() });
}
async function loadFileB64FromDoc(docRef, meta) {
  const out = [];
  for (let i = 0; i < meta.chunks; i++) {
    const d = await docRef.collection("parts").doc(String(i)).get();
    out.push(d.exists ? d.data().data : "");
  }
  return out.join("");
}
async function deleteFileDoc(docRef) {
  const oldParts = await docRef.collection("parts").get();
  for (const d of oldParts.docs) await d.ref.delete();
  await docRef.delete();
}
const saveProgressFile = (cid, key, file) => saveFileToDoc(progressDoc(cid, key), file);
const loadProgressFileB64 = (cid, key, meta) => loadFileB64FromDoc(progressDoc(cid, key), meta);
const deleteProgressFile = (cid, key) => deleteFileDoc(progressDoc(cid, key));

function b64ToBlob(b64, mime) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

// 한 학생의 월간 보고서 데이터 집계
async function buildReportData(cls, st, ym) {
  // 1) 출석: 해당 월 수업일
  const allDays = await listDays(cls.id);
  const monthDays = allDays.filter((d) => d.startsWith(ym)).sort();
  const myDays = monthDays.filter((d) => attendsOn(cls, st, d));
  let present = 0;
  const absentDates = [];
  for (const d of myDays) {
    const doc = await attCol(cls.id, d).doc(st.id).get();
    if (doc.exists) present++; else absentDates.push(d);
  }
  // 보강 정보
  const mkSnap = await makeupCol(cls.id).get();
  const mk = {};
  mkSnap.forEach((d) => { const v = d.data(); if (v.sid === st.id && (v.date || "").startsWith(ym)) mk[v.date] = v; });
  const videoDone = absentDates.filter((d) => mk[d] && mk[d].videoDone).length;
  const planned = absentDates.filter((d) => mk[d] && mk[d].planned).length;

  // 2) 과제 진도 (현재 누적 + 지난달 스냅샷 대비 증가분)
  const hwDoc = await hwCol(cls.id).doc(st.id).get();
  const hwNow = hwDoc.exists ? (hwDoc.data().books || {}) : {};
  const prev = await getReport(cls.id, st.id, prevYM(ym));
  const prevSnap = (prev && prev.hwSnapshot) || null;
  const books = getStudentBooks(cls, st).map((b) => {
    const done = (hwNow[b.name] || []).length;
    const before = prevSnap && prevSnap[b.name] != null ? prevSnap[b.name] : null;
    return { name: b.name, total: b.total, done, gained: before != null ? done - before : null,
             pct: b.total > 0 ? Math.round(done / b.total * 100) : 0 };
  });
  const hwSnapshot = {};
  books.forEach((b) => { hwSnapshot[b.name] = b.done; });

  // 3) 상담 (해당 월)
  const cs = await consultCol().where("cid", "==", cls.id).get();
  const consults = [];
  cs.forEach((d) => {
    const v = d.data();
    if (v.sid === st.id && (v.date || "").startsWith(ym)) consults.push(v);
  });
  consults.sort((a, b) => (a.date || "").localeCompare(b.date || ""));

  // 4) 수업별 코멘트
  const notes = await getMonthNotes(cls.id, st.id, ym);

  return {
    notes, sessionDates: myDays,
    sessions: myDays.length, present, absent: myDays.length - present,
    videoDone, planned, rate: myDays.length > 0 ? Math.round(present / myDays.length * 100) : null,
    books, hwSnapshot, consults, hasPrev: !!prevSnap,
  };
}

function daysSince(dateStr) {

// 전 반 상담을 훑어 ① 표시된 위험신호 ② 상담 공백(오래됨) 집계
async function computeRiskData() {
  // 반별로 나눠 부른다. 상담 전체를 한 번에 긁으면 보안 규칙이 거부한다 —
  // 규칙이 문서의 cid를 보고 판단하는데, 조건 없는 쿼리는 "안전하다"를 증명할 수 없어서다.
  // 겸사겸사 담당하지 않는 반의 상담은 애초에 가져오지 않게 된다.
  const targets = activeClasses();
  const snaps = await Promise.all(targets.map((c) => consultCol().where("cid", "==", c.id).get().catch(() => null)));
  const all = [];
  snaps.forEach((s) => { if (s) s.forEach((d) => all.push({ id: d.id, ...d.data() })); });

  const byStudent = {};
  all.forEach((c) => {
    const key = c.cid + ":" + c.sid;
    (byStudent[key] = byStudent[key] || []).push(c);
  });

  const flagged = [];
  const gaps = [];

  // 종강한 반은 위험신호에서 뺀다 — 이제 손쓸 수 있는 학생이 아니다
  activeClasses().forEach((cls) => {
    (cls.roster || []).filter((r) => !r.teacher && !isEnded(r)).forEach((st) => {
      const key = cls.id + ":" + st.id;
      const arr = (byStudent[key] || []).sort(
        (a, b) => (b.date || "").localeCompare(a.date || "") || (b.time || 0) - (a.time || 0)
      );
      const pendingFollow = arr.filter((c) => c.needFollow && !c.followDone);

      // ① 위험 표시: 가장 최근 상담 기준 (최근 상담이 "없음"이면 해제된 것)
      const latest = arr[0];
      if (latest && (latest.risk || 0) > 0) {
        flagged.push({
          cid: cls.id, cname: cls.name, sid: st.id, sname: st.name,
          risk: latest.risk, cat: latest.cat, withWho: latest.withWho,
          date: latest.date, content: latest.content, teacher: latest.teacher,
          ageDays: daysSince(latest.date),
          pendingFollow: pendingFollow.length,
          pendingNotes: pendingFollow.map((c) => c.followNote || c.content).slice(0, 3),
          total: arr.length,
        });
      }

      // ② 상담 공백: 마지막 상담일로부터 경과일 (기록 없으면 null)
      gaps.push({
        cid: cls.id, cname: cls.name, sid: st.id, sname: st.name,
        lastDate: latest ? latest.date : null,
        gapDays: latest ? daysSince(latest.date) : null,
        total: arr.length,
        hasRisk: latest ? (latest.risk || 0) > 0 : false,
      });
    });
  });

  flagged.sort((a, b) => b.risk - a.risk || (b.date || "").localeCompare(a.date || ""));
  // 기록 없는 학생 먼저, 그다음 오래된 순
  gaps.sort((a, b) => {
    if (a.gapDays === null && b.gapDays === null) return 0;
    if (a.gapDays === null) return -1;
    if (b.gapDays === null) return 1;
    return b.gapDays - a.gapDays;
  });
  return { flagged, gaps };
}

// ----- 합반(질문 공유) -----
// 합반 요일이면 질문을 "대표 반"(두 id 중 사전순 첫째) 한 곳에 모은다.
function questionCid(cls, date) {
  const m = cls && cls.merge;
  if (!m || !m.partnerId || !(m.days || []).includes(new Date(date + "T00:00:00").getDay())) return cls.id;
  return [cls.id, m.partnerId].sort()[0];
}
const isMergedDay = (cls, date) => questionCid(cls, date) !== cls.id || (cls.merge && (cls.merge.days || []).includes(new Date(date + "T00:00:00").getDay()));
async function setMerge(cidA, cidB, days) {
  await classesCol().doc(cidA).update({ merge: { partnerId: cidB, days } });
  await classesCol().doc(cidB).update({ merge: { partnerId: cidA, days } });
  await loadClasses();
}
async function clearMerge(cidA, cidB) {
  const del = firebase.firestore.FieldValue.delete();
  await classesCol().doc(cidA).update({ merge: del });
  if (cidB) await classesCol().doc(cidB).update({ merge: del });
  await loadClasses();
}
// 종강 처리 / 취소. endDate를 비우면 되살아난다. (전역은 set* 이름을 피한다 — useState 세터와 충돌)
// 종강하면 합반은 함께 푼다. 안 그러면 종강한 반 학생이 상대 반 출석 화면에 계속 끌려온다
// (mergePartner는 findClass로 반을 찾을 뿐 종강 여부를 안 본다). 되살릴 땐 다시 합반하면 된다.
// 반환값: 합반을 풀었으면 상대 반 이름, 아니면 "".
async function saveClassEnd(cid, endDate) {
  const cls = findClass(cid);
  const partnerId = endDate && cls && cls.merge ? cls.merge.partnerId : "";
  const partnerName = partnerId ? ((findClass(partnerId) || {}).name || "") : "";
  await classesCol().doc(cid).update({ endDate: endDate || "" });
  if (partnerId) await clearMerge(cid, partnerId); else await loadClasses();
  return partnerName;
}
async function deleteClass(cid) {
  await classesCol().doc(cid).delete();
  // 모든 선생님의 담당 목록에서 제거
  const ts = await listTeachers();
  for (const t of ts) {
    if ((t.classIds || []).includes(cid)) {
      await updateTeacher(t.tid, { classIds: t.classIds.filter((x) => x !== cid) });
    }
  }
  await loadClasses();
}

function HwGrid({ total, set, qset, bookName, onCellDown, onCellClick }) {
  const interactive = !!onCellClick;
  const cells = [];
  for (let n = 1; n <= total; n++) {
    const isDone = set.has(n);
    const cls = "cm-cell" + (isDone ? " done" : "") + (interactive ? " clickable" : "") + (qset && qset.has(n) ? " q" : "");
    cells.push(
      interactive ? (
        <button key={n} className={cls} data-n={n} data-book={bookName}
          onPointerDown={(e) => onCellDown(n, e)} onClick={() => onCellClick(n)}>{n}</button>
      ) : (<span key={n} className={cls}>{n}</span>)
    );
  }
  return <div className="cm-grid">{cells}</div>;
}

function BookHwCard({ book, initial, qNumbers, onClearQuestion, onChange }) {
  const setRef = useRef(new Set(initial));
  const [, setTick] = useState(0);
  const rerender = () => setTick((t) => t + 1);
  const paintVal = useRef(null);
  const suppressClick = useRef(false);
  const [painting, setPainting] = useState(false);
  const [from, setFrom] = useState("");
  const [to, setTo] = useState("");
  const set = setRef.current;
  const qset = new Set(qNumbers || []);
  const commit = () => onChange(Array.from(setRef.current).sort((a, b) => a - b));

  function applyPaint(n) { if (paintVal.current) setRef.current.add(n); else setRef.current.delete(n); rerender(); }
  function toggleSingle(n) { if (setRef.current.has(n)) setRef.current.delete(n); else setRef.current.add(n); rerender(); commit(); }
  function startMousePaint(n) {
    paintVal.current = !setRef.current.has(n);
    applyPaint(n);
    const move = (ev) => {
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      if (el && el.getAttribute && el.getAttribute("data-book") === book.name) { const dn = el.getAttribute("data-n"); if (dn) applyPaint(parseInt(dn, 10)); }
    };
    const up = () => {
      window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up);
      paintVal.current = null; suppressClick.current = true;
      setTimeout(() => { suppressClick.current = false; }, 50); commit();
    };
    window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
  }
  function startTouchLongPress(n, x, y) {
    const longTimer = setTimeout(() => {
      window.removeEventListener("pointermove", cancelMove); window.removeEventListener("pointerup", earlyUp); enterTouchPaint(n);
    }, 420);
    const cancelMove = (ev) => {
      if (Math.abs(ev.clientX - x) > 8 || Math.abs(ev.clientY - y) > 8) {
        clearTimeout(longTimer); window.removeEventListener("pointermove", cancelMove); window.removeEventListener("pointerup", earlyUp);
      }
    };
    const earlyUp = () => { clearTimeout(longTimer); window.removeEventListener("pointermove", cancelMove); };
    window.addEventListener("pointermove", cancelMove); window.addEventListener("pointerup", earlyUp, { once: true });
  }
  function enterTouchPaint(n) {
    setPainting(true); paintVal.current = !setRef.current.has(n); applyPaint(n); suppressClick.current = true;
    if (navigator.vibrate) navigator.vibrate(15);
    const touchMove = (ev) => {
      ev.preventDefault(); const t = ev.touches[0]; if (!t) return;
      const el = document.elementFromPoint(t.clientX, t.clientY);
      if (el && el.getAttribute && el.getAttribute("data-book") === book.name) { const dn = el.getAttribute("data-n"); if (dn) applyPaint(parseInt(dn, 10)); }
    };
    const end = () => {
      window.removeEventListener("touchmove", touchMove); window.removeEventListener("touchend", end);
      paintVal.current = null; setPainting(false); commit(); setTimeout(() => { suppressClick.current = false; }, 80);
    };
    window.addEventListener("touchmove", touchMove, { passive: false }); window.addEventListener("touchend", end, { once: true });
  }
  function onCellDown(n, e) {
    if (e.pointerType === "touch") { startTouchLongPress(n, e.clientX, e.clientY); }
    else { e.preventDefault(); startMousePaint(n); }
  }
  function onCellClick(n) { if (suppressClick.current) { suppressClick.current = false; return; } toggleSingle(n); }
  function addRange() {
    const a = parseInt(from, 10), z = parseInt(to, 10);
    if (isNaN(a) || isNaN(z)) return;
    for (let n = Math.min(a, z); n <= Math.max(a, z); n++) setRef.current.add(n);
    setFrom(""); setTo(""); rerender(); commit();
  }

  return (
    <div className="cm-card">
      <div className="cm-book-head">
        <h3 className="cm-h3" style={{ margin: 0 }}>{book.name}{painting && <span className="cm-paintbadge">● 칠하기 모드</span>}</h3>
        <span className="cm-book-count">{set.size} / {book.total}<span className="cm-book-pct"> ({book.total > 0 ? Math.round(set.size / book.total * 100) : 0}%)</span></span>
      </div>
      <div className="cm-rangebar">
        <input className="cm-input" placeholder="시작" inputMode="numeric" value={from} onChange={(e) => setFrom(e.target.value.replace(/\D/g, ""))} />
        <span className="cm-tilde">~</span>
        <input className="cm-input" placeholder="끝" inputMode="numeric" value={to} onChange={(e) => setTo(e.target.value.replace(/\D/g, ""))} />
        <button className="cm-btn cm-btn-ghost cm-rangebtn" onClick={addRange}>한번에 완료</button>
      </div>
      {qNumbers && qNumbers.length > 0 && onClearQuestion && (
        <div className="cm-qchips">
          <span className="cm-qchips-label">질문한 번호</span>
          {qNumbers.slice().sort((a, b) => a - b).map((n) => (
            <button key={n} className="cm-qchip" onClick={() => onClearQuestion(n)}>{n} ✕</button>
          ))}
        </div>
      )}
      <HwGrid total={book.total} set={set} qset={qset} bookName={book.name} onCellDown={onCellDown} onCellClick={onCellClick} />
    </div>
  );
}

  const norm = (s) => (s || "").replace(/\s+/g, "");

  async function login() {
    if (busy) return;
    const nm = norm(name);
    if (!nm) { setErr("이름을 입력해주세요"); return; }
    if (pin.length !== 4) { setErr("PIN 4자리를 입력해주세요"); return; }
    setBusy(true); setErr("");
    // 이름·PIN·종강 여부 판단을 전부 서버가 한다. 여기서는 결과만 받는다.
    try {
      const r = await authApi({ action: "login", kind: "student", name: nm, pin });
      await signInWithToken(r.token);
      setPinKept(pin);   // 비밀번호 변경 때 "지금 PIN"으로 다시 쓴다
      MUST_CHANGE_PIN = !!r.mustChangePin;
      const mine = CLASSES
        .map((c) => ({ cls: c, member: (c.roster || []).find((x) => norm(x.name) === nm) }))
        .filter((x) => x.member && !isClassEnded(x.cls));
      setBusy(false);
      if (mine.length === 0) { setErr("반 정보를 불러오지 못했어요. 잠시 후 다시 시도해주세요."); return; }
      setMatches(mine);
      if (mine.length === 1) setCls(mine[0].cls);
    } catch (e) {
      setBusy(false);
      setErr(e.message);
    }
  }
  function fullLogout() { setMatches(null); setCls(null); setPin(""); setErr(""); }

  // ---- 로그인 전 ----
  if (!matches) {
    return (

        <label className="cm-label">PIN</label>
        <input className="cm-input" type="password" inputMode="numeric" maxLength={4} placeholder="4자리"
          value={pin} onChange={(e) => setPin(e.target.value.replace(/\D/g, ""))} onKeyDown={(e) => e.key === "Enter" && login()} />
        {err && <div className="cm-err">{err}</div>}
        <button className="cm-btn cm-btn-primary" disabled={busy} onClick={login}>{busy ? "확인 중..." : "입장"}</button>
      </div>
    );
  }

  // ---- 내 반 선택 (여러 반에 속한 경우만) ----
  if (!cls) {
    return (
      <div ref={gatePickRef} className="cm-stack cm-slide-in" style={{willChange: "transform"}}><div className="cm-card">
        <div className="cm-admin-top" style={{marginBottom: 12}}>
          <h3 className="cm-h3" style={{margin: 0}}>{matches[0].member.name}님의 수업</h3>
          <button className="cm-link" onClick={fullLogout}>로그아웃</button>
        </div>
        <div className="cm-daylist">
          {matches.map((m) => (
            <button key={m.cls.id} className="cm-day" onClick={() => setCls(m.cls)}>
              <div className="cm-day-left"><span className="cm-day-date">{m.cls.name}</span>
                {m.member.teacher && <span className="cm-day-sub">선생님</span>}</div>
              <span className="cm-day-arrow">›</span>
            </button>
          ))}
        </div>
      </div></div>
    );
  }

  const me = matches.find((m) => m.cls.id === cls.id).member;
  return <StudentHome cls={cls} me={me}
    onLogout={matches.length > 1 ? () => setCls(null) : fullLogout} />;
}

function MathText({ text }) {
  // $...$, $$...$$, \\(...\\), \\[...\\] 안의 LaTeX를 KaTeX로 렌더
  const html = React.useMemo(() => {
    if (!text) return "";
    const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    if (typeof katex === "undefined") return esc(text);
    // 토큰 분리: 디스플레이($$, \[\]) 와 인라인($, \(\))
    const re = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\$([^\$\n]+?)\$|\\\(([\s\S]+?)\\\)/g;
    let out = ""; let last = 0; let m;
    while ((m = re.exec(text)) !== null) {
      out += esc(text.slice(last, m.index));
      const display = m[1] !== undefined || m[2] !== undefined;
      const expr = m[1] || m[2] || m[3] || m[4] || "";
      try {
        out += katex.renderToString(expr, { displayMode: display, throwOnError: false });
      } catch (e) {
        out += esc(m[0]);
      }
      last = m.index + m[0].length;
    }
    out += esc(text.slice(last));
    return out;
  }, [text]);
  return <span dangerouslySetInnerHTML={{ __html: html }} />;
}

function ConsultForm({ cls, meName, editing, onDone, onCancel }) {

  const [sid, setSid] = useState(editing ? editing.sid : (students[0] ? students[0].id : ""));

  const [followNote, setFollowNote] = useState(editing ? (editing.followNote || "") : "");

  }

function fmtLogTime(t) {
  const d = new Date(t);
  const today = new Date();
  const sameDay = d.toDateString() === today.toDateString();
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  if (sameDay) return hh + ":" + mm;
  return (d.getMonth() + 1) + "/" + d.getDate() + " " + hh + ":" + mm;
}

function AIChat({ cls, me }) {
  const [messages, setMessages] = useState([]); // {role, text, img?:{data,mime}}
  const [input, setInput] = useState("");
  const [img, setImg] = useState(null); // {data(b64), mime, preview}
  const [busy, setBusy] = useState(false);
  const fileRef = React.useRef(null);
  const scrollRef = React.useRef(null);
  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages, busy]);

  async function pickImg(e) {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    if (f.size > 4 * 1024 * 1024) { alert("이미지가 너무 커요 (최대 4MB)"); return; }
    const b64 = await new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result.split(",")[1]); r.readAsDataURL(f); });
    setImg({ data: b64, mime: f.type || "image/jpeg", preview: "data:" + (f.type || "image/jpeg") + ";base64," + b64 });
  }

  async function send() {
    if (busy || (!input.trim() && !img)) return;
    const myMsg = { role: "user", text: input.trim(), img };
    const next = [...messages, myMsg];
    setMessages(next); setInput(""); setImg(null); setBusy(true);
    try {
      const apiMsgs = next.map((m) => {
        if (m.img) {
          const parts = [{ type: "image", source: { type: "base64", media_type: m.img.mime, data: m.img.data } }];
          parts.push({ type: "text", text: m.text || "이 문제 푸는 거 도와줘" });
          return { role: m.role, content: parts };
        }
        return { role: m.role, content: m.text };
      });
      const res = await fetch("/api/hint", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages: apiMsgs }) });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || "오류");
      setMessages([...next, { role: "assistant", text: data.text }]);
      if (!me.teacher) {
        addAiLog(cls.id, { sid: me.id, name: me.name, q: myMsg.text || "", a: data.text || "", img: !!myMsg.img, time: Date.now() }).catch(() => {});
      }
    } catch (e) {
      setMessages([...next, { role: "assistant", text: "⚠ " + e.message }]);
    }
    setBusy(false);
  }

  return (
    <div className="cm-card">
      <h3 className="cm-h3">AI 힌트 <span className="cm-h-hint">(답은 안 알려주고 힌트만 줘요)</span></h3>
      {!me.teacher && <div className="cm-hint" style={{marginBottom: 8}}>질문 내역은 선생님이 볼 수 있어요.</div>}
      <div ref={scrollRef} className="cm-ai-scroll">
        {messages.length === 0 && <div className="cm-empty">막히는 문제를 물어보거나, 문제 사진을 올려보세요.<br/>답을 바로 알려주진 않고 힌트로 도와줄게요.</div>}
        {messages.map((m, i) => (
          <div key={i} className={"cm-ai-msg " + (m.role === "user" ? "me" : "ai")}>
            {m.img && <img src={m.img.preview} className="cm-ai-img" />}
            {m.text && <div className="cm-ai-bubble">{m.role === "assistant" ? <MathText text={m.text} /> : m.text}</div>}
          </div>
        ))}
        {busy && <div className="cm-ai-msg ai"><div className="cm-ai-bubble cm-ai-typing">생각 중…</div></div>}
      </div>
      {img && <div className="cm-ai-preview"><img src={img.preview} /><button className="cm-link" onClick={() => setImg(null)}>✕ 사진 빼기</button></div>}
      <div className="cm-ai-input">
        <input ref={fileRef} type="file" accept="image/*" style={{display: "none"}} onChange={pickImg} />
        <button className="cm-ai-imgbtn" disabled={busy} onClick={() => fileRef.current.click()}>📷</button>
        <input className="cm-input" style={{margin: 0}} placeholder="질문을 입력하세요" value={input}
          onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()} />
        <button className="cm-ai-send" disabled={busy} onClick={send}>전송</button>
      </div>
    </div>
  );
}

        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 6, alignItems: "flex-end" }}>

        <div className="cm-card" style={{background: "#f6e7df", borderColor: "#e6cbb9"}}>

            <b>초기 비밀번호를 그대로 쓰고 있어요.</b><br/>
            이름만 알면 누구나 들어올 수 있어요. 나만 아는 번호로 바꿔주세요.
