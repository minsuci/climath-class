        <div className="cm-daybar-date">{cls.name}{!canEdit && <span className="cm-day-sub">열람 전용</span>}</div>
      </div>

      {activeView === "notice" && (<>
      {/* 전체 공지 */}
      <div className="cm-card">
        <h3 className="cm-h3">전체 공지</h3>
        {hasActive && (
          <div className="cm-notice-preview"><span className="cm-notice-dot">●</span> 현재 공지: {notice.text}</div>
        )}
        {!canEdit && !hasActive && <div className="cm-empty">공지가 없어요</div>}
        {canEdit && (<>
        <textarea className="cm-input cm-notice-ta" rows={3}
          placeholder="학생들이 앱을 열면 보이는 공지를 입력하세요"
          value={noticeText} onChange={(e) => setNoticeText(e.target.value)} />
        <div style={{ display: "flex", gap: 10, marginTop: 12 }}>
          <button className="cm-btn cm-btn-primary" style={{ margin: 0 }}
            onClick={() => noticeText.trim() && postNotice(cls.id, noticeText.trim())}>공지 올리기</button>
          {hasActive && (
            <button className="cm-btn cm-btn-ghost" style={{ margin: 0 }}
              onClick={() => { clearNotice(cls.id); setNoticeText(""); }}>공지 지우기</button>
          )}
        </div>
        </>)}
      </div>

      {/* 개인 공지 */}
      {canEdit && (
      <div className="cm-card">
        <h3 className="cm-h3">개인 공지</h3>
        <label className="cm-label">학생 선택</label>
        <select className="cm-input" value={dmStudent} onChange={(e) => {
          const sid = e.target.value;
          setDmStudent(sid);
          const existing = activeDms[sid];
          setDmText((existing && existing.active && existing.text) ? existing.text : "");
        }}>
          <option value="">-- 학생을 선택하세요 --</option>
          {students.map((r) => (
            <option key={r.id} value={r.id}>
              {r.name}{activeDms[r.id]?.active && activeDms[r.id]?.text ? " 📩" : ""}
            </option>
          ))}
        </select>
        {dmStudent && (
          <>
            <label className="cm-label">메시지</label>
            <textarea className="cm-input cm-notice-ta" rows={3}
              placeholder="해당 학생에게만 보이는 메시지를 입력하세요"
              value={dmText} onChange={(e) => setDmText(e.target.value)} />
            <div style={{ display: "flex", gap: 10, marginTop: 12 }}>
              <button className="cm-btn cm-btn-primary" style={{ margin: 0 }}
                onClick={() => dmText.trim() && postDm(cls.id, dmStudent, dmText.trim())}>보내기</button>
              {activeDms[dmStudent]?.active && activeDms[dmStudent]?.text && (
                <button className="cm-btn cm-btn-ghost" style={{ margin: 0 }}
                  onClick={() => { clearDm(cls.id, dmStudent); setDmText(""); }}>지우기</button>
              )}
            </div>
          </>
        )}
        {Object.entries(activeDms).filter(([, v]) => v.active && v.text).length > 0 && (
          <div style={{ marginTop: 16, borderTop: "1px dashed var(--line)", paddingTop: 12 }}>
            <div className="cm-mini-h">현재 보내진 개인 공지</div>
            {Object.entries(activeDms).filter(([, v]) => v.active && v.text).map(([sid, v]) => {
              const st = students.find((r) => r.id === sid);
              return st ? (
                <div key={sid} className="cm-sent-item">
                  <span><b>{st.name}</b> · {v.text.length > 24 ? v.text.slice(0, 24) + "…" : v.text}</span>
                  <button className="cm-link" onClick={() => { clearDm(cls.id, sid); if (dmStudent === sid) setDmText(""); }}>지우기</button>
                </div>
              ) : null;
            })}
          </div>
        )}
      </div>
      )}
      </>)}

      {activeView === "days" && (
        <div className="cm-card">
          <h3 className="cm-h3">날짜 선택</h3>
          {!days ? (<div className="cm-empty">불러오는 중…</div>) : (
            <div className="cm-daylist">
              {days.map((d) => (
                <button key={d} className={"cm-day" + (d === todayStr ? " today" : "")} onClick={() => setSelected(d)}>
                  <div className="cm-day-left"><span className="cm-day-date">{fmtDate(d)}</span>{d === todayStr && <span className="cm-day-badge">오늘</span>}</div>
                  <span className="cm-day-arrow">›</span>
                </button>
              ))}
            </div>
          )}
        </div>
      )}

      {activeView === "book" && (
        <div className="cm-card">
          <h3 className="cm-h3">월간 출석부</h3>
          <AttendanceBook cls={cls} canEdit={canEdit} />
        </div>
      )}

      {activeView === "live" && isIndividual(cls) && (
        <div className="cm-card">
          <h3 className="cm-h3">수업 로그 <span className="cm-h-hint">(누구와 몇 분을 했는지)</span></h3>
          <LessonLogger cls={cls} canEdit={canEdit} meName={meName} />
        </div>
      )}

      {activeView === "progress" && (
        <div className="cm-card">
          <h3 className="cm-h3">진도계획표 {isIndividual(cls) && <span className="cm-h-hint">(학생별 게시)</span>}</h3>
          <ProgressManager cls={cls} canEdit={canEdit} />
        </div>
      )}

      {activeView === "notes" && (
        <div className="cm-card">
          <h3 className="cm-h3">강의노트 <span className="cm-h-hint">(단원별 손필기)</span></h3>
          <NotesManager cls={cls} canEdit={canEdit} />
        </div>
      )}

      {activeView === "ailog" && (
        <div className="cm-card">
          <h3 className="cm-h3">AI 힌트 질문 내역 <span className="cm-h-hint">(학생이 AI에게 물어본 것)</span></h3>
          <AILogView cls={cls} />
        </div>
      )}

      {activeView === "consult" && (
        <div className="cm-card">
          <h3 className="cm-h3">상담 기록 <span className="cm-h-hint">(학생 · 학부모)</span></h3>
          <ConsultView cls={cls} canEdit={canEdit} meName={meName} />
        </div>
      )}

      {activeView === "textbooks" && (<>
        {isOwner && (
          <div className="cm-card">
            <h3 className="cm-h3">반 정보 <span className="cm-h-hint">(관리자 전용)</span></h3>
            <ClassMetaEditor cls={cls} onSaved={() => bumpVer((v) => v + 1)} onDeleted={onBack} />
          </div>
        )}
        {isOwner && !isIndividual(cls) && (
          <div className="cm-card">
            <h3 className="cm-h3">합반 설정 <span className="cm-h-hint">(질문 공유 · 관리자 전용)</span></h3>
            <MergeManager cls={cls} onSaved={() => bumpVer((v) => v + 1)} />
          </div>
        )}
        <div className="cm-card">
          <h3 className="cm-h3">학생 명단</h3>
          <RosterManager cls={cls} canEdit={canEdit} onChanged={() => bumpVer((v) => v + 1)} />
        </div>
        {isIndividual(cls) ? (
          <div className="cm-card">
            <h3 className="cm-h3">학생별 설정 <span className="cm-h-hint">(등원요일 · 교재)</span></h3>
            <StudentConfig key={"sc" + rosterVer} cls={cls} canEdit={canEdit} />
          </div>
        ) : (
          <div className="cm-card">
            <h3 className="cm-h3">교재 설정</h3>
            <BookManager cls={cls} canEdit={canEdit} />
          </div>
        )}
      </>)}
    </div>
    </>
  );
}

// ===== 월간 출석부 =====
function AttendanceBook({ cls, canEdit }) {
  const students = cls.roster.filter((r) => !r.teacher);
  const [days, setDays] = React.useState([]);
  const [attData, setAttData] = React.useState({});   // { date: { sid: true } }
  const [scoreData, setScoreData] = React.useState({}); // { date: { sid: score } }
  const [hwData, setHwData] = React.useState({});     // { sid: { bookName: count } }
  const [loading, setLoading] = React.useState(true);

  // 현재 월 (YYYY-MM)
  const nowYM = todayStr.slice(0, 7);
  const [month, setMonth] = React.useState(nowYM);
  const [makeups, setMakeups] = React.useState({});
  React.useEffect(() => listenMakeups(cls.id, setMakeups), [cls.id]);

  // 최근 12개월 옵션
  const monthOptions = [];
  for (let i = 0; i < 12; i++) {
    const d = new Date();
    d.setMonth(d.getMonth() - i);
    const ym = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    monthOptions.push(ym);
  }
  function shiftMonth(delta) {
    const [y, m] = month.split("-").map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    setMonth(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"));
  }
  const monthLabel = (ym) => {
    const [y, m] = ym.split("-");
    return Number(m) + "월" + (ym.slice(0, 4) !== nowYM.slice(0, 4) ? " (" + y + ")" : "");
  };
  const canNext = month < nowYM;
  const MonthNav = ({ extra }) => (
    <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>
      <button className="cm-ab-tab" style={{ padding: "5px 11px" }} onClick={() => shiftMonth(-1)}>‹</button>
      <select className="cm-ab-month-sel" style={{ marginBottom: 0, fontWeight: 600 }} value={month} onChange={(e) => setMonth(e.target.value)}>
        {monthOptions.map((m) => <option key={m} value={m}>{monthLabel(m)}</option>)}
      </select>
      <button className="cm-ab-tab" style={{ padding: "5px 11px", opacity: canNext ? 1 : .35 }} disabled={!canNext} onClick={() => shiftMonth(1)}>›</button>
      {month !== nowYM && <button className="cm-link" onClick={() => setMonth(nowYM)}>이번 달</button>}
      {extra}
      <span style={{ fontSize: 11, color: "#8a7f72", width: "100%", marginTop: 2 }}>
        칸을 누르면 <b>O</b>출석 → <b style={{color:"#c2703f"}}>예</b>결석예정 → <b style={{color:"#2b5f8a"}}>영</b>동영상보강 → <b>/</b>미출석 순으로 바뀌어요
      </span>
    </div>
  );

  useEffect(() => {
    setLoading(true);
    // 해당 월의 days 목록 불러오기
    listDays(cls.id).then((allDays) => {
      const classDays = isIndividual(cls) ? [] : (cls.classDays || []);
      const filtered = allDays.filter((d) => {
        if (!d.startsWith(month)) return false;
        if (classDays.length === 0) return true;
        const dow = new Date(d + "T00:00:00").getDay(); // 0=일~6=토
        return classDays.includes(dow);
      }).sort();
      setDays(filtered);

      if (filtered.length === 0) { setLoading(false); return; }

      const attMap = {};
      const scoreMap = {};
      let pending = filtered.length * 2;
      const done = () => { if (--pending === 0) setLoading(false); };

      filtered.forEach((date) => {
        attMap[date] = {};
        scoreMap[date] = {};
        // 출석
        attCol(cls.id, date).get().then((s) => {
          s.forEach((d) => { attMap[date][d.id] = true; });
          setAttData({ ...attMap });
          done();
        }).catch(done);
        // 점수 (가장 최근 제출)
        scoresCol(cls.id, date).orderBy("time").get().then((s) => {
          s.forEach((d) => {
            const data = d.data();
            scoreMap[date][data.sid] = data.score;
          });
          setScoreData({ ...scoreMap });
          done();
        }).catch(done);
      });

      // 과제 (전체, 날짜 무관)
      hwCol(cls.id).get().then((s) => {
        const hw = {};
        s.forEach((d) => {
          const books = d.data().books || {};
          hw[d.id] = {};
          getBooks(cls).forEach((b) => {
            hw[d.id][b.name] = (books[b.name] || []).length;
          });
        });
        setHwData(hw);
      });
    });
  }, [cls.id, month]);

  // 출결 토글
  // 셀 상태 순환: 출석(O) → 결석예정(예) → 동영상완료(영) → 미출석(/)
  async function cycleCell(date, student) {
    const present = attData[date] && attData[date][student.id];
    const mk = makeups[student.id + "_" + date] || {};
    if (present) {
      await attCol(cls.id, date).doc(student.id).delete();
      setAttData((p) => { const n = { ...p, [date]: { ...(p[date] || {}) } }; delete n[date][student.id]; return n; });
      await setMakeup(cls.id, student.id, student.name, date, { planned: true, videoDone: false });
    } else if (mk.planned && !mk.videoDone) {
      await setMakeup(cls.id, student.id, student.name, date, { planned: true, videoDone: true });
    } else if (mk.videoDone) {
      await clearMakeup(cls.id, student.id, date);
    } else {
      await attCol(cls.id, date).doc(student.id).set({ name: student.name, time: Date.now() });
      touchDay(cls.id, date);
      setAttData((p) => ({ ...p, [date]: { ...(p[date] || {}), [student.id]: true } }));
    }
  }
  function cellView(date, student) {
    const present = attData[date] && attData[date][student.id];
    const mk = makeups[student.id + "_" + date] || {};
    if (present) return { t: "O", cls: "cm-ab-att-o", title: "출석" };
    if (mk.videoDone) return { t: "영", cls: "cm-ab-att-v", title: "동영상 보강 완료" };
    if (mk.planned) return { t: "예", cls: "cm-ab-att-p", title: "결석 예정" };
    return { t: "/", cls: "cm-ab-att-x", title: "미출석" };
  }

  async function toggleAttendance(date, student) {
    const present = attData[date] && attData[date][student.id];
    if (present) {
      await attCol(cls.id, date).doc(student.id).delete();
    } else {
      await attCol(cls.id, date).doc(student.id).set({ name: student.name, time: Date.now() });
      touchDay(cls.id, date);
    }
    setAttData((prev) => {
      const next = { ...prev, [date]: { ...(prev[date] || {}) } };
      if (present) delete next[date][student.id];
      else next[date][student.id] = true;
      return next;
    });
  }

  // 날짜 포맷 M/D
  const shortDate = (d) => { const p = d.split("-"); return parseInt(p[1]) + "/" + parseInt(p[2]); };

  if (loading) return <div><MonthNav /><div className="cm-empty">불러오는 중…</div></div>;
  if (days.length === 0) return <div><MonthNav /><div className="cm-empty">이 달에 수업 기록이 없어요</div></div>;

  // ---- 개별진도반: 학생별 자기 요일만 표시 ----
  if (isIndividual(cls)) {
    const dowOf = (d) => new Date(d + "T00:00:00").getDay();
    return (
      <div>
        <MonthNav />
        <div className="cm-ab-wrap" data-no-swipe>
          <table className="cm-ab-table">
            <thead>
              <tr>
                <th className="cm-ab-name">이름</th>
                <th style={{textAlign: "left"}}>등원일 (출결 탭하여 변경)</th>
                <th style={{ minWidth: 60 }}>과제</th>
              </tr>
            </thead>
            <tbody>
              {students.map((st) => {
                const myDays = days.filter((d) => (st.days || []).includes(dowOf(d)) && isActiveOn(st, d));
                const hw = hwData[st.id] || {};
                const myBooks = getStudentBooks(cls, st);
                const myTotal = myBooks.reduce((s, b) => s + b.total, 0);
                const myDone = myBooks.reduce((s, b) => s + (hw[b.name] || 0), 0);
                const hwPct = myTotal > 0 ? Math.round(myDone / myTotal * 100) : 0;
                const attCount = myDays.filter((d) => (attData[d] && attData[d][st.id]) || (makeups[st.id + "_" + d] || {}).videoDone).length;
                return (
                  <tr key={st.id}>
                    <td className="cm-ab-name" style={isEnded(st) ? {opacity: .55} : undefined}>{st.name}<br/><span style={{fontSize:10,color:"#8a7f72"}}>{isEnded(st) ? "수강 종료" : ((st.days || []).map((d) => DAY_NAMES[d]).join("·") || "요일 미설정")}</span></td>
                    <td style={{textAlign: "left"}}>
                      {myDays.length === 0 ? <span style={{color: "#bbb", fontSize: 12}}>이 달 기록 없음</span> : (
                        <div style={{display: "flex", gap: 5, flexWrap: "wrap"}}>
                          {myDays.map((d) => {
                            const cv = cellView(d, st);
                            const score = scoreData[d] && scoreData[d][st.id];
                            return (
                              <span key={d} onClick={() => canEdit && cycleCell(d, st)} title={cv.title}
                                className={cv.cls}
                                style={{display: "inline-flex", flexDirection: "column", alignItems: "center", padding: "3px 7px", borderRadius: 7, cursor: canEdit ? "pointer" : "default", border: "1px solid var(--line)"}}>
                                <span style={{fontSize: 10, color: "#8a7f72"}}>{shortDate(d)}</span>
                                <span>{cv.t}</span>
                                {score != null && <span style={{fontSize: 9, color: "#8a7f72"}}>{score}점</span>}
                              </span>
                            );
                          })}
                        </div>
                      )}
                    </td>
                    <td className="cm-ab-hw">{hwPct}%<br/><span style={{fontSize:9,color:"#bbb"}}>{attCount}/{myDays.length}</span></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    );
  }

  // 교재별 과제 완성률 (전체 합산)
  const totalHwPages = getBooks(cls).reduce((s, b) => s + b.total, 0);

  return (
    <div>
      <MonthNav extra={<span style={{ fontSize: 12, color: "#8a7f72" }}>총 {days.length}회차</span>} />
      <div className="cm-ab-wrap" data-no-swipe>
        <table className="cm-ab-table">
          <thead>
            <tr>
              <th className="cm-ab-name">이름</th>
              {days.map((d) => (
                <th key={d} colSpan={3} style={{ minWidth: 72 }}>{shortDate(d)}</th>
              ))}
              <th style={{ minWidth: 60 }}>과제</th>
            </tr>
            <tr>
              <th className="cm-ab-name"></th>
              {days.map((d) => (
                <React.Fragment key={d}>
                  <th style={{ fontSize: 10, color: "#8a7f72" }}>출결</th>
                  <th style={{ fontSize: 10, color: "#8a7f72" }}>과제</th>
                  <th style={{ fontSize: 10, color: "#8a7f72" }}>점수</th>
                </React.Fragment>
              ))}
              <th style={{ fontSize: 10, color: "#8a7f72" }}>완성률</th>
            </tr>
          </thead>
          <tbody>
            {students.map((st) => {
              const hw = hwData[st.id] || {};
              const totalDone = getBooks(cls).reduce((s, b) => s + (hw[b.name] || 0), 0);
              const hwPct = totalHwPages > 0 ? Math.round(totalDone / totalHwPages * 100) : 0;
              const attCount = days.filter((d) => (attData[d] && attData[d][st.id]) || (makeups[st.id + "_" + d] || {}).videoDone).length;
              return (
                <tr key={st.id}>
                  <td className="cm-ab-name">{st.name}</td>
                  {days.map((d) => {
                    const present = attData[d] && attData[d][st.id];
                    const score = scoreData[d] && scoreData[d][st.id];
                    return (
                      <React.Fragment key={d}>
                        {(() => { const cv = cellView(d, st); return (
                        <td className={cv.cls} title={cv.title} onClick={() => canEdit && cycleCell(d, st)} style={canEdit ? undefined : {cursor: "default"}}>{cv.t}</td>
                      ); })()}
                        <td></td>
                        <td className="cm-ab-score">{score != null ? score : ""}</td>
                      </React.Fragment>
                    );
                  })}
                  <td className="cm-ab-hw">{hwPct}%<br/><span style={{fontSize:9,color:"#bbb"}}>{attCount}/{days.length}</span></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

const RESOLVED_PAGE_SIZE = 5;

function QuestionQueue({ questions, clsId, date, canEdit, books, merged }) {
  const BOOK_TABS = ["전체", ...(books || []).map((b) => b.name)];
  const [activeBook, setActiveBook] = React.useState("전체");
  const [resolvedPage, setResolvedPage] = React.useState(0);

  const sortByNum = (arr) => arr.slice().sort((a, b) => {
    const na = parseFloat(a.num) || 0, nb = parseFloat(b.num) || 0;
    return na !== nb ? na - nb : a.time - b.time;
  });

  const filtered = activeBook === "전체" ? questions : questions.filter((q) => q.book === activeBook);
  const pending = sortByNum(filtered.filter((q) => !q.resolved));
  // 해결완료: 최신순 (time 내림차순)
  const resolved = filtered.filter((q) => q.resolved).slice().sort((a, b) => b.time - a.time);
  const resolvedTotal = resolved.length;
  const resolvedPages = Math.ceil(resolvedTotal / RESOLVED_PAGE_SIZE);
  const resolvedShown = resolved.slice(resolvedPage * RESOLVED_PAGE_SIZE, (resolvedPage + 1) * RESOLVED_PAGE_SIZE);

  const renderQ = (q) => (
    <div key={q.qid} className={"cm-q" + (q.resolved ? " done" : "")}>
      <div className="cm-q-main">
        <div className="cm-q-top"><span className="cm-q-name">{q.name}{merged && q.fromClass && <span className="cm-day-sub" style={{marginLeft: 6, fontSize: 10}}>{q.fromClass}</span>}</span><span className="cm-q-time">{hhmm(q.time)}</span></div>
        <div className="cm-q-body">{q.book} <b>{q.num}</b>번{q.memo && <span className="cm-q-memo"> · {q.memo}</span>}</div>
      </div>
      {q.resolved
        ? <span className="cm-q-resolved">✓ 해결완료</span>
        : canEdit ? <button className="cm-btn cm-btn-ghost" onClick={() => resolveQuestion(clsId, date, q.qid)}>해결</button> : null}
    </div>
  );

  if (questions.length === 0) return <div className="cm-empty">들어온 질문이 없어요</div>;

  return (
    <div>
      <div className="cm-q-tabs">
        {BOOK_TABS.map((t) => (
          <button key={t} className={"cm-q-tab" + (activeBook === t ? " on" : "")}
            onClick={() => { setActiveBook(t); setResolvedPage(0); }}>{t}</button>
        ))}
      </div>
      {pending.length === 0 && <div className="cm-empty">대기 중인 질문이 없어요</div>}
      {pending.map(renderQ)}
      {resolvedTotal > 0 && (
        <details className="cm-resolved-box" style={{marginTop: 12}}>
          <summary className="cm-resolved-summary">해결완료 {resolvedTotal}건</summary>
          {resolvedShown.map(renderQ)}
          {resolvedPages > 1 && (
            <div className="cm-q-pages">
              <button className="cm-q-page-btn" disabled={resolvedPage === 0} onClick={() => setResolvedPage((p) => p - 1)}>◀</button>
              <span>{resolvedPage + 1} / {resolvedPages}</span>
              <button className="cm-q-page-btn" disabled={resolvedPage >= resolvedPages - 1} onClick={() => setResolvedPage((p) => p + 1)}>▶</button>
            </div>
          )}
        </details>
      )}
    </div>
  );
}

/* ==================== 수업 로그 (개별진도반) ====================
   개진반은 한 교실에서 학생마다 다른 단원을 한다. 녹화본을 학생별로 가르려면
   "몇 분부터 몇 분까지가 누구 것인지"가 필요한데, 그건 수업이 끝나면 사라진다.
   여기서 그 자리에 적는다. 마이크는 그걸 대신 눌러주는 게 아니라 제안만 한다.
   ── 이유: 자동자막은 이름을 자주 틀린다(지오→지옥, 승훈→성훈·승우).
      틀린 자동 전환은 나중에 영상을 다 잘라놓고 나서야 발견된다.       */

const CL_PALETTE = ["#27406e", "#c2703f", "#3f7d5e", "#7c3aed", "#be123c", "#0e7490"];
const CL_KIND = {
  lesson: { label: "강의", keep: true },
  qa:     { label: "질문응대", keep: false },
  brk:    { label: "쉬는시간", keep: false },
  mic:    { label: "마이크꺼짐", keep: false },
  etc:    { label: "기타", keep: false },
};
// 내 수업 계량 지표 — 볼트 [[내 수업 분석]]의 "확인은 많고 요구는 없다" 두 축
// 전역(/g) 플래그를 쓰지 않는다. 발화 하나에 여러 패턴이 걸려도 한 번으로 센다
// ("왜 그런지 말해봐"는 요구 하나지 둘이 아니다). 부풀리느니 모자라게 세는 쪽이 낫다 —
// 본인은 늘 "물어봤다"고 느낀다는 게 원래 문제였다.
const CL_CLOSED = /알겠(어|지|죠|나|니)|알았(어|지|죠)|맞(죠|지|나요)|이해(했|됐|되)|됐(죠|지)|그렇(죠|지)|오케이|알지\?/;
const CL_OPEN = /왜\s*(그런|이렇|저렇|그렇)|말해\s*(봐|볼)|설명해\s*(봐|볼)|어디(서|가)?\s*(막|헷)|어떻게\s*(하면|되|풀)|어떤\s*(생각|방법)|뭐라고\s*생각|써\s*(봐|보세)|풀어\s*(봐|볼)|해\s*볼래/;
// 발화 단위로 센다. entries = [{t,text}]
function clCountUtt(entries, re) { return (entries || []).filter((e) => re.test(e.text || "")).length; }

function clHms(sec) {
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const p = (n) => String(n).padStart(2, "0");
  return h > 0 ? h + ":" + p(m) + ":" + p(s) : p(m) + ":" + p(s);
}
function clMins(sec) { return Math.round(sec / 60) + "분"; }

// ---- 한글 자모 분해: 자동자막이 틀린 이름을 잡아내려면 글자 단위로는 부족하다 ----
const CL_CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ".split("");
const CL_JUNG = "ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ".split("");
const CL_JONG = ["", "ㄱ", "ㄲ", "ㄳ", "ㄴ", "ㄵ", "ㄶ", "ㄷ", "ㄹ", "ㄺ", "ㄻ", "ㄼ", "ㄽ", "ㄾ", "ㄿ", "ㅀ", "ㅁ", "ㅂ", "ㅄ", "ㅅ", "ㅆ", "ㅇ", "ㅈ", "ㅊ", "ㅋ", "ㅌ", "ㅍ", "ㅎ"];
function clJamo(str) {
  let out = "";
  for (const ch of String(str || "")) {
    const c = ch.charCodeAt(0) - 0xac00;
    if (c >= 0 && c <= 11171) {
      out += CL_CHO[Math.floor(c / 588)] + CL_JUNG[Math.floor((c % 588) / 28)] + CL_JONG[c % 28];
    } else out += ch;
  }
  return out;
}
function clEdit(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}
function clSim(a, b) {
  const x = clJamo(a), y = clJamo(b);
  const L = Math.max(x.length, y.length);
  return L ? 1 - clEdit(x, y) / L : 0;
}

/* 들린 말에서 학생 이름을 찾는다.
   people = [{ sid, name, aliases:[], units:[] }]
   이름은 자모 유사도로, 단원은 그냥 포함 여부로 본다.
   단원 쪽이 훨씬 믿을 만하다 — 수학 용어는 자동자막이 잘 받아쓴다. */
function clDetect(text, people) {
  const flat = String(text || "").replace(/\s+/g, "");
  let best = null;
  for (const p of people) {
    let score = 0, why = "";
    const cands = [p.name, ...(p.aliases || [])].filter(Boolean);
    for (const cand of cands) {
      const c = cand.replace(/\s+/g, "");
      if (!c) continue;
      const w = c.length;
      for (let i = 0; i + w - 1 <= flat.length; i++) {
        for (const len of [w, w + 1]) {          // "지오"가 "지오야"로 붙어 나오는 경우
          const piece = flat.slice(i, i + len);
          if (piece.length < 2) continue;
          const s = clSim(c, piece);
          if (s > score) { score = s; why = piece; }
        }
      }
    }
    let nameHit = score >= 0.72 ? score : 0;
    let unitHit = 0, unitWhy = "";
    for (const u of (p.units || [])) {
      const uu = String(u).replace(/\s+/g, "");
      if (uu.length >= 2 && flat.includes(uu)) { unitHit = 1; unitWhy = u; break; }
    }
    const total = Math.max(nameHit, unitHit ? 0.9 : 0);
    if (total > 0 && (!best || total > best.score)) {
      best = { sid: p.sid, name: p.name, score: total, why: unitHit ? unitWhy : why, kind: unitHit ? "단원" : "이름" };
    }
  }
  return best;
}

function clSegments(marks, startedAt, endAt, shift) {
  const end = endAt != null ? endAt : Date.now();
  const sh = shift || 0;
  return (marks || []).map((mk, i) => {
    const nx = i + 1 < marks.length ? marks[i + 1].t : end;
    return {
      sid: mk.sid || null, name: mk.name || "", kind: mk.kind, unit: mk.unit || "",
      start: (mk.t - startedAt) / 1000 + sh, end: (nx - startedAt) / 1000 + sh,
    };
  });
}
function clSafeName(t) { return String(t).replace(/[\\/:*?"<>|]/g, "").replace(/\s+/g, " ").trim(); }

// 학생별로 남길 조각을 모은다. 붙어 있는 것은 합치고, 20초 미만은 오탭으로 본다.
// subjOf(sid) → 과목명. 파일명을 "날짜 이름 과목 단원"으로 맞추기 위한 것
function clGroup(segments, date, subjOf) {
  const by = {};
  (segments || []).forEach((g) => {
    if (!g.sid || !CL_KIND[g.kind] || !CL_KIND[g.kind].keep) return;
    if (g.end - g.start < 20) return;
    (by[g.sid] = by[g.sid] || []).push({ start: g.start, end: g.end, unit: g.unit || "", name: g.name });
  });
  return Object.keys(by).map((sid) => {
    const raw = by[sid].sort((a, b) => a.start - b.start), parts = [];
    raw.forEach((p) => {
      const last = parts[parts.length - 1];
      if (last && p.start - last.end < 2) { last.end = p.end; if (p.unit && !last.unit) last.unit = p.unit; }
      else parts.push({ ...p });
    });
    const units = [];
    parts.forEach((p) => { if (p.unit && units.indexOf(p.unit) < 0) units.push(p.unit); });
    const total = parts.reduce((a, p) => a + (p.end - p.start), 0);
    const nm = raw[0].name || "학생";
    const subj = subjOf ? subjOf(sid) : "";
    return { sid, name: nm, subject: subj, units, parts, total,
      filename: clSafeName([date, nm, subj, units.join("+")].filter(Boolean).join(" ")) + ".mp4" };
  }).sort((a, b) => b.total - a.total);
}

function clFfmpeg(groups, src) {
  if (!groups.length) return "(남길 구간이 없습니다)";
  const s = src || "원본.mp4", L = [];
  L.push("# 조각을 TS로 뜬 뒤 이어붙인다 (fps·타임베이스가 섞여도 버틴다)");
  L.push("# 시각은 초 단위 정수 — 00:60:30 표기는 ffmpeg가 거부한다");
  groups.forEach((g, gi) => {
    L.push("");
    L.push("# ── " + g.name + " ── " + g.filename + "  (" + clHms(g.total) + ")");
    g.parts.forEach((p, i) => {
      L.push('ffmpeg -y -ss ' + Math.round(p.start) + ' -to ' + Math.round(p.end) + ' -i "' + s + '"' +
        ' -c copy -bsf:v h264_mp4toannexb -f mpegts p' + gi + '_' + i + '.ts   # ' + clHms(p.start) + '–' + clHms(p.end));
    });
    L.push('ffmpeg -y -i "concat:' + g.parts.map((_, i) => 'p' + gi + '_' + i + '.ts').join("|") +
      '" -c copy -bsf:a aac_adtstoasc -movflags +faststart "' + g.filename + '"');
  });
  L.push("");
  L.push("# 붙인 뒤 이음매 직후 프레임을 꼭 확인할 것. split_by_log.py 를 쓰면 자동으로 한다.");
  return L.join("\n");
}

function clDownload(name, text) {
  const b = new Blob(["﻿" + text], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ---- 마이크 ----
   Web Speech API는 조용하면 알아서 끊긴다. 두 시간을 버티려면 onend에서 되살려야 한다.
   Chrome 전용이고 데스크톱에서는 음성이 구글 서버를 거친다.                */
function useLessonMic(on, cbRef) {
  const liveRef = useRef(on);
  liveRef.current = on;
  useEffect(() => {
    if (!on) return;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return;
    let dead = false;
    let rec;
    try { rec = new SR(); } catch (e) { return; }
    rec.lang = "ko-KR"; rec.continuous = true; rec.interimResults = true;
    rec.onresult = (e) => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i], t = (r[0] && r[0].transcript || "").trim();
        if (!t) continue;
        if (r.isFinal) cbRef.current.final(t); else cbRef.current.interim(t);
      }
    };
    rec.onend = () => { if (!dead && liveRef.current) { try { rec.start(); } catch (e) {} } };
    rec.onerror = (e) => { if (e.error === "not-allowed" || e.error === "service-not-allowed") cbRef.current.denied(); };
    try { rec.start(); } catch (e) {}
    return () => { dead = true; try { rec.abort(); } catch (e) {} };
  }, [on]);
}

function LessonLogger({ cls, canEdit, meName }) {
  const [log, setLog] = useState(null);          // 진행 중 { startedAt, marks, shift }
  const [saved, setSaved] = useState(null);      // 오늘 저장본
  const [hist, setHist] = useState([]);
  const [cfg, setCfg] = useState({ aliases: {}, units: {} });
  const [micOn, setMicOn] = useState(false);
  const [micErr, setMicErr] = useState("");
  const [heard, setHeard] = useState("");
  const [trans, setTrans] = useState([]);
  const [sug, setSug] = useState(null);
  const [autoSw, setAutoSw] = useState(false);
  const [srcPath, setSrcPath] = useState("");
  const [, tick] = useState(0);

  const date = todayStr;
  const people = (cls.roster || []).filter((r) => !r.teacher && isActiveOn(r, date));
  const colorOf = (sid) => CL_PALETTE[Math.max(0, people.findIndex((p) => p.id === sid)) % CL_PALETTE.length];
  const nameOf = (sid) => { const p = people.find((x) => x.id === sid); return p ? p.name : "학생"; };

  useEffect(() => {
    let alive = true;
    getLessonLog(cls.id, date).then((d) => { if (alive) { setSaved(d); if (d && d.marks && !d.endedAt) setLog({ startedAt: d.startedAt, marks: d.marks, shift: d.shift || 0 }); } });
    listLessonLogs(cls.id).then((a) => alive && setHist(a));
    classDoc(cls.id).collection("config").doc("lessonLog").get()
      .then((d) => { if (alive && d.exists) setCfg({ aliases: {}, units: {}, ...d.data() }); });
    return () => { alive = false; };
  }, [cls.id]);

  useEffect(() => { if (!log) return; const h = setInterval(() => tick((n) => n + 1), 1000); return () => clearInterval(h); }, [!!log]);

  const detectPeople = people.map((p) => ({
    sid: p.id, name: p.name,
    aliases: cfg.aliases[p.id] || [],
    units: (cfg.units[p.id] || []).concat(p.books || []),
  }));

  const cur = log && log.marks.length ? log.marks[log.marks.length - 1] : null;

  const cbRef = useRef({});
  cbRef.current = {
    interim: (t) => setHeard(t),
    denied: () => { setMicOn(false); setMicErr("마이크 권한이 거부됐습니다. 주소창 자물쇠 → 마이크 허용."); },
    final: (t) => {
      setHeard("");
      if (!log) return;
      const at = (Date.now() - log.startedAt) / 1000;
      setTrans((L) => [...L, { t: Math.round(at), text: t }]);
      const hit = clDetect(t, detectPeople);
      if (!hit) return;
      if (cur && cur.sid === hit.sid && cur.kind === "lesson") return;   // 이미 그 학생
      if (autoSw) clMark(hit.sid, "lesson");
      else setSug({ ...hit, text: t, at: Date.now() });
    },
  };
  useLessonMic(micOn && !!log, cbRef);

  useEffect(() => { if (!sug) return; const h = setTimeout(() => setSug(null), 25000); return () => clearTimeout(h); }, [sug]);

  function persist(next, extra) {
    if (!next) return;
    saveLessonLog(cls.id, date, {
      startedAt: next.startedAt, shift: next.shift || 0, marks: next.marks,
      teacher: meName, transcript: trans.slice(-400), ...(extra || {}),
    }).catch(() => {});
  }

  function clStart() {
    const next = { startedAt: Date.now(), marks: [], shift: 0 };
    setLog(next); setSaved(null); setTrans([]); persist(next, { endedAt: null, segments: [] });
  }
  // 상태 갱신 함수 안에서 Firestore를 부르지 않는다 — 업데이터는 두 번 호출될 수 있다
  function clMark(sid, kind) {
    setSug(null);
    if (!log) return;
    const last = log.marks[log.marks.length - 1];
    if (last && last.sid === sid && last.kind === kind) return;
    const unit = sid ? (cfg.units[sid] || [])[0] || "" : "";
    const next = { ...log, marks: [...log.marks, { t: Date.now(), sid, name: sid ? nameOf(sid) : "", kind, unit }] };
    setLog(next); persist(next);
  }
  function clUndo() {
    if (!log || !log.marks.length) return;
    const next = { ...log, marks: log.marks.slice(0, -1) };
    setLog(next); persist(next);
  }
  function clSetUnit(sid) {
    const list = cfg.units[sid] || [];
    const msg = nameOf(sid) + " — 지금 하는 단원" + (list.length ? "\n\n" + list.map((u, i) => (i + 1) + ". " + u).join("\n") + "\n\n번호를 넣거나 새로 적으세요." : "");
    const v = prompt(msg, list[0] || "");
    if (v === null) return;
    let unit = v.trim();
    const n = parseInt(unit, 10);
    if (String(n) === unit && n >= 1 && n <= list.length) unit = list[n - 1];
    if (!unit) return;
    const nextUnits = { ...cfg.units, [sid]: [unit, ...list.filter((u) => u !== unit)].slice(0, 8) };
    setCfg((c) => ({ ...c, units: nextUnits }));
    classDoc(cls.id).collection("config").doc("lessonLog").set({ units: nextUnits }, { merge: true }).catch(() => {});
    if (!log || !log.marks.length) return;
    const last = log.marks[log.marks.length - 1];
    if (!last || last.sid !== sid) return;
    const next = { ...log, marks: [...log.marks.slice(0, -1), { ...last, unit }] };
    setLog(next); persist(next);
  }
  /* 자동자막은 이름을 자주 틀린다. 유사도만으로는 한계가 있어서
     (승훈→승우 0.67은 태경→세경 0.60과 너무 가깝다. 문턱을 내리면 오탐이 산다)
     실제로 틀리게 들리는 말을 직접 등록해 둔다. */
  function clSetAlias(sid) {
    const list = cfg.aliases[sid] || [];
    const v = prompt(
      nameOf(sid) + " — 자동자막이 이 학생을 뭐라고 잘못 받아쓰나요?\n쉼표로 구분해 적으세요. 예: 승우, 성훈",
      list.join(", ")
    );
    if (v === null) return;
    const arr = v.split(",").map((x) => x.trim()).filter(Boolean).slice(0, 10);
    const next = { ...cfg.aliases, [sid]: arr };
    setCfg((c) => ({ ...c, aliases: next }));
    classDoc(cls.id).collection("config").doc("lessonLog").set({ aliases: next }, { merge: true }).catch(() => {});
  }

  async function clEnd() {
    if (!log) return;
    if (!log.marks.length) { if (!confirm("기록된 구간이 없습니다. 그냥 버릴까요?")) return; setLog(null); setMicOn(false); return; }
    const segs = clSegments(log.marks, log.startedAt, Date.now(), log.shift || 0);
    const doc = { startedAt: log.startedAt, endedAt: Date.now(), shift: log.shift || 0, marks: log.marks, segments: segs, transcript: trans.slice(-400), teacher: meName, date };
    await saveLessonLog(cls.id, date, doc);
    setSaved(doc); setLog(null); setMicOn(false);
    listLessonLogs(cls.id).then(setHist);
  }

  // ---- 집계 ----
  const segs = log ? clSegments(log.marks, log.startedAt, null, log.shift || 0) : (saved && saved.segments) || [];
  const tot = {}, qat = {};
  segs.forEach((g) => {
    if (!g.sid) return;
    const d = g.end - g.start;
    if (CL_KIND[g.kind] && CL_KIND[g.kind].keep) tot[g.sid] = (tot[g.sid] || 0) + d;
    else if (g.kind === "qa") qat[g.sid] = (qat[g.sid] || 0) + d;
  });
  const maxT = Math.max(1, ...Object.values(tot));
  const elapsed = log ? (Date.now() - log.startedAt) / 1000 : 0;
  const nClosed = clCountUtt(trans, CL_CLOSED);
  const nOpen = clCountUtt(trans, CL_OPEN);
  const perH = (n) => (elapsed > 120 ? (n / (elapsed / 3600)).toFixed(1) : "–");

  const subjOf = (sid) => { const p = people.find((x) => x.id === sid); return p ? (p.books || []).join("+") : ""; };
  const groups = clGroup(segs, date, subjOf);
  const hasSR = !!(window.SpeechRecognition || window.webkitSpeechRecognition);

  if (!canEdit) return <div className="cm-empty">담당 선생님만 기록할 수 있어요</div>;

  return (
    <div>
      {/* ── 진행 중이 아닐 때 ── */}
      {!log && (
        <div style={{ textAlign: "center", padding: "18px 6px" }}>
          {saved && saved.endedAt
            ? <div className="cm-hint" style={{ marginBottom: 14 }}>오늘({date}) 수업은 기록이 끝났어요. 아래에서 내보낼 수 있어요.</div>
            : <div className="cm-hint" style={{ marginBottom: 14 }}>녹화를 먼저 켜고, 켜지면 아래를 누르세요.<br />누른 순간이 <b>영상 00:00</b>이 됩니다.</div>}
          <button className="cm-btn cm-btn-primary" style={{ maxWidth: 280, margin: "0 auto" }} onClick={clStart}>
            {saved && saved.endedAt ? "다시 기록 시작" : "수업 시작"}
          </button>
        </div>
      )}

      {/* ── 진행 중 ── */}
      {log && (<>
        <div className={cur ? "cl-now" : "cl-now idle"}
          style={cur ? { background: cur.sid ? colorOf(cur.sid) : "#7c8294" } : null}>
          <div className="cl-who">{cur ? (cur.sid ? nameOf(cur.sid) : CL_KIND[cur.kind].label) : "누구부터 시작하나요?"}</div>
          <div className="cl-sub">
            {cur ? (cur.sid ? CL_KIND[cur.kind].label + (cur.unit ? " · " + cur.unit : "") : "이 구간은 잘라냅니다")
                 : "아래에서 학생을 누르면 기록이 시작됩니다"}
          </div>
          {cur && <div className="cl-clk">{clHms((Date.now() - cur.t) / 1000)}</div>}
        </div>

        {/* 마이크 */}
        <div className="cl-mic">
          <span className={"cl-dot" + (micOn ? " live" : "")} />
          <button className="cm-link" style={{ padding: 0 }} onClick={() => { setMicErr(""); setMicOn((v) => !v); }} disabled={!hasSR}>
            {micOn ? "마이크 끄기" : "마이크 켜기"}
          </button>
          <label style={{ fontSize: 12, color: "var(--muted)", display: "flex", alignItems: "center", gap: 4, marginLeft: "auto" }}>
            <input type="checkbox" checked={autoSw} onChange={(e) => setAutoSw(e.target.checked)} /> 자동 전환
          </label>
          {!hasSR && <div className="cl-heard">이 브라우저는 음성 인식을 지원하지 않아요 (크롬에서 열어주세요)</div>}
          {micErr && <div className="cl-heard" style={{ color: "#d6453f" }}>{micErr}</div>}
          {micOn && !micErr && <div className="cl-heard">{heard || "듣는 중…"}</div>}
          {micOn && (
            <div style={{ flex: "1 1 100%", display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap", borderTop: "1px solid var(--line)", paddingTop: 7, marginTop: 1 }}>
              <span style={{ fontSize: 11, color: "var(--muted)" }}>이름 보정</span>
              {people.map((p) => (
                <button key={p.id} className="cl-pen" style={{ position: "static" }} onClick={() => clSetAlias(p.id)}>
                  {p.name}{(cfg.aliases[p.id] || []).length ? " ·" + (cfg.aliases[p.id] || []).length : ""}
                </button>
              ))}
            </div>
          )}
        </div>

        {/* 제안 */}
        {sug && (
          <div className="cl-sug">
            <div><b>{sug.name}</b>{sug.kind === "단원" ? " 단원이 들렸어요" : " 이름이 들렸어요"} — 바꿀까요?</div>
            <div className="cl-quote">“{sug.text}”</div>
            <div style={{ display: "flex", gap: 8 }}>
              <button className="cm-btn cm-btn-primary" style={{ margin: 0, padding: "8px 14px" }} onClick={() => clMark(sug.sid, "lesson")}>{sug.name}(으)로 바꾸기</button>
              <button className="cm-btn cm-btn-ghost" style={{ margin: 0, padding: "8px 14px" }} onClick={() => setSug(null)}>무시</button>
            </div>
          </div>
        )}

        {/* 학생 카드 */}
        <div className="cl-grid">
          {people.map((p) => {
            const on = cur && cur.sid === p.id;
            const t = tot[p.id] || 0, q = qat[p.id] || 0;
            return (
              <div key={p.id} className={"cl-card" + (on ? " on" : "")} style={{ "--c": colorOf(p.id) }}>
                <button className="cl-main" onClick={() => clMark(p.id, "lesson")}>
                  <div className="cl-nm">{p.name}</div>
                  <div className="cl-un">{(cfg.units[p.id] || [])[0] || (p.books || []).join(", ") || "단원 미정"}</div>
                  <div className="cl-tm">강의 {clHms(t)}{q ? "  질문 " + clHms(q) : ""}</div>
                </button>
                <button className="cl-qa" onClick={() => clMark(p.id, "qa")}>질문</button>
                <button className="cl-pen" onClick={() => clSetUnit(p.id)}>단원</button>
                <div className="cl-bar"><i style={{ width: Math.round((t / maxT) * 100) + "%" }} /></div>
              </div>
            );
          })}
        </div>

        <div className="cl-other">
          {["brk", "mic", "etc"].map((k) => (
            <button key={k} className={cur && !cur.sid && cur.kind === k ? "on" : ""} onClick={() => clMark(null, k)}>{CL_KIND[k].label}</button>
          ))}
        </div>

        {/* 내 수업 계량 — 폐쇄형이 줄어든 자리를 개방형이 채우는지 그 자리에서 본다.
            micOn이 아니라 받아쓴 게 있는지로 건다. 마이크는 조용하면 저 혼자 끊긴다 */}
        {trans.length > 0 && (
          <div className="cl-meter">
            <div><div className="cl-v">{perH(nClosed)}</div><div className="cl-l">확인 /시간</div></div>
            <div><div className="cl-v">{perH(nOpen)}</div><div className="cl-l">요구 /시간</div></div>
            <div><div className="cl-v">{nOpen ? (nClosed / nOpen).toFixed(1) : "–"}</div><div className="cl-l">확인 : 요구</div></div>
          </div>
        )}
        {trans.length > 0 && (
          <div className="cm-hint" style={{ marginTop: 6, textAlign: "center" }}>
            낱말로 세는 대략치입니다. 판서만 하는 구간은 안 잡혀요 · 받아쓴 발화 {trans.length}개
          </div>
        )}

        <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 14 }}>
          <button className="cm-btn cm-btn-ghost" style={{ margin: 0, padding: "9px 14px" }} disabled={!log.marks.length} onClick={clUndo}>↶ 전환 취소</button>
          <span className="cm-hint" style={{ marginLeft: "auto" }}>경과 {clHms(elapsed)} · {log.marks.length}구간</span>
        </div>
        <button className="cm-btn cm-btn-ghost" style={{ marginTop: 10, color: "#d6453f", borderColor: "#d6453f" }} onClick={clEnd}>수업 종료</button>
      </>)}

      {/* ── 구간 목록 ── */}
      {segs.length > 0 && (
        <div style={{ marginTop: 16 }}>
          <h4 className="cm-h3" style={{ fontSize: 14 }}>{log ? "오늘 기록" : date + " 기록"}</h4>
          <table className="cl-tbl"><tbody>
            {segs.slice().reverse().map((g, i) => (
              <tr key={i}>
                <td style={{ width: 66, color: "var(--muted)" }} className="n">{clHms(g.start)}</td>
                <td><b style={{ color: g.sid ? colorOf(g.sid) : "var(--muted)" }}>{g.sid ? nameOf(g.sid) : "—"}</b>{" "}
                  <span className={"cl-tag" + (CL_KIND[g.kind].keep ? " keep" : "")}>{CL_KIND[g.kind].label}</span>
                  {g.unit ? <span className="cm-day-sub"> {g.unit}</span> : null}</td>
                <td className="n">{clHms(g.end - g.start)}</td>
              </tr>
            ))}
          </tbody></table>
        </div>
      )}

      {/* 남길 구간은 있는데 전부 20초 미만이면 조용히 사라진다. 왜 없는지는 말해줘야 한다 */}
      {!log && groups.length === 0 && segs.some((g) => g.sid && CL_KIND[g.kind] && CL_KIND[g.kind].keep) && (
        <div className="cm-hint" style={{ marginTop: 16 }}>
          강의 구간이 전부 20초보다 짧아서 자를 영상이 없어요. 눌러보신 기록이라면 정상입니다 —
          실제 수업에서는 <b>영상 자르기</b>가 여기에 나타납니다.
        </div>
      )}

      {/* ── 내보내기 ── */}
      {!log && groups.length > 0 && (
        <div style={{ marginTop: 18 }}>
          <h4 className="cm-h3" style={{ fontSize: 14 }}>영상 자르기</h4>
          <label className="cm-label">원본 영상 경로 또는 유튜브 ID</label>
          <input className="cm-input" value={srcPath} onChange={(e) => setSrcPath(e.target.value)} placeholder="8FRYFOc1850" />
          {groups.map((g) => (
            <div key={g.sid} className="cm-notice-preview" style={{ borderLeftColor: colorOf(g.sid) }}>
              <b>{g.filename}</b><br />{g.parts.length}조각 · {clHms(g.total)}
            </div>
          ))}
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 8 }}>
            <button className="cm-btn cm-btn-primary" style={{ margin: 0, padding: "9px 14px" }}
              onClick={() => clDownload("컷리스트-" + date + ".json", JSON.stringify({
                date, source: srcPath, shift: 0,
                outputs: groups.map((g) => ({ student: g.name, subject: g.subject, units: g.units, filename: g.filename, parts: g.parts.map((p) => ({ start: Math.round(p.start), end: Math.round(p.end), unit: p.unit })) })),
                segments: segs.map((g) => ({ student: g.sid ? nameOf(g.sid) : null, kind: g.kind, keep: !!CL_KIND[g.kind].keep, unit: g.unit, start: Math.round(g.start), end: Math.round(g.end) })),
                transcript: (saved && saved.transcript) || trans,
              }, null, 2))}>컷 리스트 (.json)</button>
            <button className="cm-btn cm-btn-ghost" style={{ margin: 0, padding: "9px 14px" }}
              onClick={() => { const t = clFfmpeg(groups, srcPath); if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert("복사했습니다"), () => alert(t)); else alert(t); }}>ffmpeg 명령 복사</button>
          </div>
          <div className="cm-hint" style={{ marginTop: 8 }}>컷 리스트를 <code>split_by_log.py</code> 와 같은 폴더에 두고 실행하면 학생별 파일이 나옵니다.</div>
        </div>
      )}

      {/* ── 지난 기록 ── */}
      {!log && hist.length > 0 && (
        <div style={{ marginTop: 20 }}>
          <h4 className="cm-h3" style={{ fontSize: 14 }}>학생별 누적</h4>
          <table className="cl-tbl"><tbody>
            {people.map((p) => {
              let L = 0, Q = 0, days = 0;
              hist.forEach((h) => {
                let any = false;
                (h.segments || []).forEach((g) => {
                  if (g.sid !== p.id) return;
                  const d = g.end - g.start;
                  if (CL_KIND[g.kind] && CL_KIND[g.kind].keep) { L += d; any = true; }
                  else if (g.kind === "qa") { Q += d; any = true; }
                });
                if (any) days++;
              });
              return (
                <tr key={p.id}>
                  <td><b style={{ color: colorOf(p.id) }}>{p.name}</b></td>
                  <td className="n" style={{ color: "var(--muted)" }}>{days}회</td>
                  <td className="n">강의 {clMins(L)}{Q ? " · 질문 " + clMins(Q) : ""}</td>
                </tr>
              );
            })}
          </tbody></table>
        </div>
      )}
    </div>
  );
}

function AdminDay({ cls, date, canEdit, side, meName, onBack }) {
  const [attendance, setAttendance] = useState({});
  const [questions, setQuestions] = useState([]);
  const [hwDone, setHwDone] = useState({});
  const [scores, setScores] = useState([]);
  const [questioned, setQuestioned] = useState({});
  const [detail, setDetail] = useState(null);
  const [mkMap, setMkMap] = useState({}); // "반id:학생id" → makeup

  const dow = new Date(date + "T00:00:00").getDay();
  // 합반: 해당 요일이면 짝 반의 출석·과제·점수도 함께 (저장은 각 반, 화면만 병합)
  const mergePartner = (cls.merge && cls.merge.partnerId && (cls.merge.days || []).includes(dow)) ? findClass(cls.merge.partnerId) : null;
  const mergeKey = mergePartner ? mergePartner.id : "";

  useEffect(() => {
    const cids = mergePartner ? [cls.id, mergePartner.id] : [cls.id];
    const attStore = {}, hwStore = {}, qdStore = {}, scStore = {};
    const flat = (store) => { const o = {}; cids.forEach((c) => Object.entries(store[c] || {}).forEach(([sid, v]) => (o[c + ":" + sid] = v))); return o; };
    const unsubs = [];
    cids.forEach((cid) => {
      unsubs.push(attCol(cid, date).onSnapshot((s) => { attStore[cid] = {}; s.forEach((d) => (attStore[cid][d.id] = d.data())); setAttendance(flat(attStore)); }));
      unsubs.push(listenMakeups(cid, (m) => {
        setMkMap((prev) => {
          const next = { ...prev };
          Object.keys(next).forEach((k) => { if (k.startsWith(cid + ":")) delete next[k]; });
          Object.values(m).forEach((v) => { if (v.date === date) next[cid + ":" + v.sid] = v; });
          return next;
        });
      }));
      unsubs.push(hwCol(cid).onSnapshot((s) => { hwStore[cid] = {}; s.forEach((d) => (hwStore[cid][d.id] = d.data().books || {})); setHwDone(flat(hwStore)); }));
      unsubs.push(questionedCol(cid).onSnapshot((s) => { qdStore[cid] = {}; s.forEach((d) => (qdStore[cid][d.id] = d.data().books || {})); setQuestioned(flat(qdStore)); }));
      unsubs.push(scoresCol(cid, date).orderBy("time").onSnapshot((s) => {
        scStore[cid] = []; s.forEach((d) => scStore[cid].push({ id: cid + ":" + d.id, _cid: cid, ...d.data() }));
        const all = []; cids.forEach((c) => all.push(...(scStore[c] || []))); all.sort((a, b) => a.time - b.time); setScores(all);
      }));
    });
    // 질문은 합반 대표 반 한 곳
    unsubs.push(qCol(questionCid(cls, date), date).orderBy("time").onSnapshot((s) => { const arr = []; s.forEach((d) => arr.push({ qid: d.id, ...d.data() })); setQuestions(arr); }));
    return () => unsubs.forEach((u) => u && u());
  }, [cls.id, date, mergeKey]);

  const withKey = (r, cid) => ({ ...r, _cid: cid, _key: cid + ":" + r.id });
  let roster = cls.roster.filter((r) => !r.teacher && attendsOn(cls, r, date)).map((r) => withKey(r, cls.id));
  if (mergePartner) roster = roster.concat(mergePartner.roster.filter((r) => !r.teacher && attendsOn(mergePartner, r, date)).map((r) => withKey(r, mergePartner.id)));
  const presentIds = Object.keys(attendance);
  const plannedCount = roster.filter((r) => !attendance[r._key] && (mkMap[r._cid + ":" + r.id] || {}).planned).length;
  const waiting = questions.filter((q) => !q.resolved);
  const hwStudents = roster.filter((r) => hwDone[r._key] && getStudentBooks(findClass(r._cid) || cls, r).some((b) => (hwDone[r._key][b.name] || []).length > 0));

  const dayRef = useSwipeBack(onBack);

  if (detail) return <StudentDetail cls={findClass(detail._cid) || cls} student={detail} hwDone={{ [detail.id]: hwDone[detail._key] || {} }} questioned={{ [detail.id]: questioned[detail._key] || {} }} canEdit={canEdit} date={date} meName={meName} onBack={() => setDetail(null)} />;

  return (
    <>
    {side}
    <div ref={dayRef} className="cm-stack cm-slide-in" style={{willChange: "transform"}}>
      <div className="cm-daybar">
        <button className="cm-back" onClick={onBack}>‹ 날짜 선택</button>
        <div className="cm-daybar-date">{cls.name} · {fmtDate(date)}{date === todayStr && <span className="cm-live">● LIVE</span>}{!canEdit && <span className="cm-day-sub">열람 전용</span>}</div>
      </div>

      <div className="cm-card cm-admin-top">
        <div className="cm-stat"><div className="cm-stat-num">{presentIds.length}<span>/{roster.length - plannedCount}</span></div><div className="cm-stat-lab">출석{plannedCount > 0 && <span style={{color: "#c2703f"}}> · 결석예정 {plannedCount}</span>}</div></div>
        <div className="cm-stat"><div className="cm-stat-num cm-clay">{waiting.length}</div><div className="cm-stat-lab">대기 질문</div></div>
      </div>

      <div className="cm-card">
        <h3 className="cm-h3">질문 대기열</h3>
        <QuestionQueue questions={questions} clsId={questionCid(cls, date)} date={date} canEdit={canEdit} books={getClassAllBooks(cls)} merged={questionCid(cls, date) !== cls.id} />
      </div>

      <div className="cm-card">
        <div style={{display: "flex", alignItems: "center", gap: 8, marginBottom: 4, flexWrap: "wrap"}}>
          <h3 className="cm-h3" style={{margin: 0}}>출석 현황 <span className="cm-h-hint">(체크로 출석 · 이름 누르면 상세)</span></h3>
          {canEdit && roster.length > 0 && (
            <button className="cm-link" style={{marginLeft: "auto"}} onClick={async () => {
              const missing = roster.filter((r) => !attendance[r._key]);
              if (missing.length === 0) { if (confirm("모두 출석 상태예요. 전체 출석을 취소할까요?")) { for (const r of roster) await markAttendance(r._cid, date, r, false); } return; }
              if (!confirm("미출석 " + missing.length + "명을 모두 출석 처리할까요?")) return;
              for (const r of missing) await markAttendance(r._cid, date, r, true);
            }}>{roster.every((r) => attendance[r._key]) ? "전체 취소" : "전체 출석"}</button>
          )}
        </div>
        <div className="cm-roster">
          {roster.map((r) => {
            const a = attendance[r._key];
            const mk = mkMap[r._cid + ":" + r.id] || {};
            const planned = mk.planned && !a;
            const vdone = mk.videoDone;
            const boxColor = a ? "var(--green)" : vdone ? "#2b5f8a" : planned ? "#c2703f" : "var(--line)";
            return (
              <div key={r._key} className={"cm-rost " + (a ? "in" : "")} style={{display: "flex", alignItems: "center", gap: 10, cursor: "default", opacity: planned && !vdone ? .8 : 1}}>
                <span onClick={(e) => { e.stopPropagation(); if (canEdit) markAttendance(r._cid, date, r, !a); }}
                  title={canEdit ? "탭하여 출석 처리" : ""}
                  style={{width: 26, height: 26, flex: "none", borderRadius: 8, border: "1.5px solid " + boxColor,
                    background: a ? "var(--green)" : vdone ? "#e3edf5" : planned ? "#f6e7df" : "#fff",
                    color: a ? "#fff" : vdone ? "#2b5f8a" : "#c2703f", display: "flex", alignItems: "center", justifyContent: "center",
                    fontSize: a ? 15 : 12, fontWeight: 700, cursor: canEdit ? "pointer" : "default"}}>{a ? "✓" : vdone ? "영" : planned ? "예" : ""}</span>
                <span style={{flex: 1, minWidth: 0, cursor: "pointer"}} onClick={() => setDetail(r)}>
                  <span className="cm-rost-name" style={{display: "block"}}>{r.name}</span>
                  <span className="cm-rost-sub">
                    {mergePartner && r._cid !== cls.id ? mergePartner.name + " · " : ""}
                    {a ? hhmm(a.time) : vdone ? "동영상 보강" : planned ? ("결석 예정" + (mk.memo ? " · " + mk.memo : "")) : "미출석"}
                  </span>
                </span>
                <span className="cm-rost-t" style={{cursor: "pointer", color: "#b3a89a"}} onClick={() => setDetail(r)}>›</span>
              </div>
            );
          })}
        </div>
      </div>

      <div className="cm-card">
        <h3 className="cm-h3">과제 현황 <span className="cm-h-hint">(누적)</span></h3>
        {hwStudents.length === 0 ? (<div className="cm-empty">등록된 과제가 없어요</div>) : (
          hwStudents.map((r) => (
            <div key={r._key} className="cm-hw-row">
              <button className="cm-hw-name cm-hw-name-btn" onClick={() => setDetail(r)}>{r.name}</button>
              <div className="cm-hw-items">
                {getStudentBooks(findClass(r._cid) || cls, r).filter((b) => (hwDone[r._key][b.name] || []).length > 0).map((b) => (<span key={b.name} className="cm-chip">{b.name} {hwDone[r._key][b.name].length}문제</span>))}
              </div>
            </div>
          ))
        )}
      </div>

      <div className="cm-card">
        <h3 className="cm-h3">테스트 점수</h3>
        {scores.length === 0 ? (<div className="cm-empty">제출된 점수가 없어요</div>) : (
          scores.slice().reverse().map((s) => (
            <div key={s.id} className="cm-score-row">
              <span className="cm-score-name">{s.name}{mergePartner && s._cid && s._cid !== cls.id && <span className="cm-day-sub" style={{marginLeft: 5, fontSize: 10}}>{mergePartner.name}</span>}</span>
              <span className="cm-score-detail">{s.label ? s.label + " · " : ""}{s.correct}/{s.total}</span>
              <span className="cm-score-num">{s.score}점</span>
            </div>
          ))
        )}
      </div>

    </div>
    </>
  );
}

function DailyNoteCard({ cid, student, date, canEdit, meName }) {
  const [note, setNote] = useState(undefined);
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const [saved, setSaved] = useState(false);
  useEffect(() => listenDailyNote(cid, student.id, date, (n) => {
    setNote(n); setText(n ? n.text : ""); setSaved(false);
  }), [cid, student.id, date]);

  async function save() {
    if (busy) return;
    setBusy(true);
    try { await saveDailyNote(cid, student.id, student.name, date, text, meName); setSaved(true); }
    catch (e) { alert("저장 실패: " + e.message); }
    setBusy(false);
  }
  const dirty = note ? text.trim() !== note.text : !!text.trim();

  return (
    <div className="cm-card">
      <div className="cm-book-head">
        <h3 className="cm-h3" style={{margin: 0}}>오늘 수업 코멘트 <span className="cm-h-hint">({fmtDate(date)})</span></h3>
        {saved && !dirty && <span style={{fontSize: 12, color: "var(--green)"}}>저장됨 ✓</span>}
      </div>
      {canEdit ? (<>
        <textarea className="cm-input cm-notice-ta" rows={3}
          placeholder="예: 이차함수 최대·최소 파트 이해도 좋음. 계산 실수 줄이는 연습 필요."
          value={text} onChange={(e) => { setText(e.target.value); setSaved(false); }} />
        <div style={{display: "flex", gap: 10, alignItems: "center"}}>
          <button className="cm-btn cm-btn-primary" style={{margin: 0}} disabled={busy || !dirty} onClick={save}>
            {busy ? "저장 중..." : "저장"}
          </button>
          <span style={{fontSize: 11, color: "var(--muted)"}}>한 달치가 모여 학습관리 보고서에 실려요</span>
        </div>
      </>) : (
        note ? <div style={{fontSize: 14, lineHeight: 1.6, whiteSpace: "pre-wrap"}}>{note.text}</div>
             : <div className="cm-empty">작성된 코멘트가 없어요</div>
      )}
    </div>
  );
}

function StudentDetail({ cls, student, hwDone, questioned, canEdit, date, meName, onBack }) {
  const mine = hwDone[student.id] || {};
  const qmine = (questioned && questioned[student.id]) || {};
  const detailDivRef = useSwipeBack(onBack);
  const [editHw, setEditHw] = useState(false);
  const targetCid = student._cid || cls.id;
  return (
    <div ref={detailDivRef} className="cm-stack cm-slide-in" style={{willChange: "transform"}}>
      <div className="cm-daybar">
        <button className="cm-back" onClick={onBack}>‹ 현황으로</button>
        <div className="cm-daybar-date">{student.name} · 누적 진도</div>
        {canEdit && <button className="cm-link" style={{marginLeft: "auto"}} onClick={() => setEditHw(!editHw)}>{editHw ? "완료" : "과제 체크"}</button>}
      </div>
      {date && <DailyNoteCard cid={targetCid} student={student} date={date} canEdit={canEdit} meName={meName} />}

      {editHw && <div className="cm-hint">번호를 눌러 체크하거나, 길게 눌러 드래그하면 여러 개를 한 번에 칠할 수 있어요. 학생이 직접 체크한 것과 똑같이 기록돼요.</div>}
      {getStudentBooks(cls, student).map((b) => {
        const qnums = qmine[b.name] || [];
        if (editHw) {
          return (
            <BookHwCard key={"e" + b.name} book={b} initial={mine[b.name] || []} qNumbers={qnums}
              onClearQuestion={(n) => removeQuestioned(targetCid, student.id, b.name, n)}
              onChange={(arr) => saveHwBookFor(targetCid, student.id, student.name, b.name, arr)} />
          );
        }
        return (
          <div className="cm-card" key={b.name}>
            <div className="cm-book-head">
              <h3 className="cm-h3" style={{ margin: 0 }}>{b.name}</h3>
              <span className="cm-book-count">{(mine[b.name] || []).length} / {b.total}<span className="cm-book-pct"> ({b.total > 0 ? Math.round((mine[b.name] || []).length / b.total * 100) : 0}%)</span></span>
            </div>
            {qnums.length > 0 && (
              <div className="cm-qchips">
                <span className="cm-qchips-label">질문한 번호</span>
                {qnums.slice().sort((x, y) => x - y).map((n) => (
                  <button key={n} className="cm-qchip" onClick={() => removeQuestioned(targetCid, student.id, b.name, n)}>{n} ✕</button>
                ))}
              </div>
            )}
            <HwGrid total={b.total} set={new Set(mine[b.name] || [])} qset={new Set(qnums)} />
          </div>
        );
      })}
    </div>
  );
}

// ===== 앱 루트 =====
function App() {
  const params = new URLSearchParams(window.location.search);
  const isAdmin = params.get("admin") === "1";
  const urlClass = findClass(params.get("class"));
  const [gateCls, setGateCls] = useState(null);
  const [sideOpen, setSideOpen] = useState(false);
  const [hasSide, setHasSide] = useState(0);

  let sub, main;
  if (isAdmin) { sub = "수업 관리"; main = <AdminView />; }
  else if (urlClass) { sub = urlClass.name + " · " + todayStr; main = <StudentView cls={urlClass} onBack={null} />; }
  else { sub = gateCls ? gateCls.name + " · " + todayStr : "로그인"; main = <StudentGate onClsChange={setGateCls} />; }

  return (
    <SideCtx.Provider value={{ open: sideOpen, setOpen: setSideOpen, setHasSide }}>
      <header className="cm-header">
        {hasSide > 0 && <button className="cm-hamb" onClick={() => setSideOpen(true)}>☰</button>}
        <div className="cm-brand" style={{flex: 1}}><span className="cm-logo">CLIMATH</span><span className="cm-sub">{sub}</span></div>
      </header>
      <div className="cm-shell"><main className="cm-main">{main}</main></div>
    </SideCtx.Provider>
  );
}

// ===== 익명 로그인 후 앱 시작 =====
const rootEl = document.getElementById("root");
let rendered = false;
function renderApp() { if (rendered) return; rendered = true; ReactDOM.createRoot(rootEl).render(<App />); }
function loadAndRender() { loadClasses().then(renderApp).catch((e) => { console.error("반 목록 로드 실패", e); renderApp(); }); }
try {
  firebase.auth().signInAnonymously().catch(() => {});
  firebase.auth().onAuthStateChanged((u) => { if (u) loadAndRender(); });
} catch (e) { /* auth 미설정 */ }
setTimeout(loadAndRender, 4000);

</script>

<script>
  // 우리 앱 코드를 직접 Babel로 변환해서 전역 실행 (자동 변환/외부 스크립트 간섭 회피)
  (function () {
    function runApp() {
      try {
        var src = document.getElementById("__appSource").textContent;
        var out = Babel.transform(src, { presets: ["react"], sourceType: "script" }).code;
        var s = document.createElement("script");
        s.textContent = out;
        document.body.appendChild(s);
      } catch (e) {
        document.getElementById("root").innerHTML =
          '<div style="padding:40px;text-align:center;color:#c2703f;font-family:sans-serif">앱 로딩 오류<br><br>' + (e && e.message ? e.message : e) + '</div>';
        console.error("앱 변환/실행 오류:", e);
      }
    }
    if (typeof Babel !== "undefined") runApp();
    else {
      var wait = setInterval(function () {
        if (typeof Babel !== "undefined") { clearInterval(wait); runApp(); }
      }, 50);
      setTimeout(function () { clearInterval(wait); }, 10000);
    }
  })();
</script>
