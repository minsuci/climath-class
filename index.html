        <div className="cm-hint" style={{marginBottom: 10}}>
          학교·학년마다 <b>내신 기간</b>과 <b>수학시험 날짜</b>를 한 번만 적어두는 곳이에요.
          적어두면 <b>내신 참여표</b>에서 학생들 것을 한 번에 채울 수 있어요.
          직보는 수학시험 전날로 알아서 잡히고, 복귀는 비워두면 학생별로 정하면 됩니다.
        </div>

        <div style={{display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", marginBottom: 10}}>
          {!editTerm && <span className="cm-chip" style={{background: term ? "#e6f0e9" : "#f0ece5", color: term ? "#3f7d5e" : "#7c6f5f"}}>
            {term ? "회차 · " + term : "아직 회차를 안 열었어요"}
          </span>}
          {!editTerm && <button className="cm-link" onClick={() => setEditTerm(true)}>{term ? "회차 바꾸기" : "회차 열기"}</button>}
          {editTerm && (<>
            <input className="cm-input" style={{margin: 0, maxWidth: 220}} placeholder="예: 2026 2학기 중간"
              value={draft} onChange={(e) => setDraft(e.target.value)} />
            <button className="cm-btn cm-btn-ghost" style={{margin: 0, width: "auto", padding: "9px 14px"}}
              onClick={async () => { await saveExamTerm(draft.trim()); setEditTerm(false); }}>저장</button>
            <button className="cm-link" onClick={() => { setDraft(term); setEditTerm(false); }}>취소</button>
          </>)}
        </div>

        {!term ? (
          <div className="cm-hint">회차를 열어야 일정을 적을 수 있어요. 일정은 회차마다 따로 저장돼요.</div>
        ) : (<>
          {msg && <div className={msg.includes("✓") ? "cm-done" : "cm-err"} style={{marginBottom: 8}}>{msg}</div>}

          <div style={{fontSize: 12, color: "var(--muted)", marginBottom: 6}}>
            {list.length}개 줄 · <b style={{color: "var(--navy)"}}>{done.length}개 적음</b> ·
            이 일정으로 채울 수 있는 학생 <b style={{color: "var(--navy)"}}>{coveredN}명</b>
            {noSchool > 0 && <span style={{color: "#c2703f"}}> · 학교·학년이 비어서 {noSchool}명은 못 채워요 (학생 명단에서 채워주세요)</span>}
          </div>

          <datalist id="cm-sched-schools">
            {schoolOpts.map((x) => <option key={x} value={x} />)}
          </datalist>
          <div className="cm-ab-wrap" data-no-swipe>
            <table className="cm-ab-table cm-sched">
              <thead>
                <tr>
                  <th className="cm-ab-name" style={{width: 110}}>학교</th>
                  <th style={{width: 56}}>학년</th>
                  <th style={{width: 50}}>학생</th>
                  <th style={{width: 126}}>내신 시작</th>
                  <th style={{width: 126}}>내신 끝</th>
                  <th style={{width: 126}}>수학시험</th>
                  <th style={{width: 66}}>직보</th>
                  <th style={{width: 126}}>복귀 <span style={{fontWeight: 400, color: "#8a7f72"}}>(선택)</span></th>
                  <th style={{width: 56}}></th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                {list.length === 0 && (
                  <tr><td colSpan={10} style={{color: "var(--muted)", padding: 14}}>
                    학생 명단에 학교·학년을 넣으면 여기 줄이 생겨요. 아래에서 직접 더할 수도 있어요.
                  </td></tr>
                )}
                {list.map((r) => (
                  <SchoolTermRow key={r.school + "|" + r.grade} term={term} row={r}
                    cur={all[schedKey(term, r.school, r.grade)] || null} onMsg={setMsg} />
                ))}
                <tr>
                  <td className="cm-ab-name" style={{padding: 3}}>
                    <input className="cm-sheet-in" list="cm-sched-schools" placeholder="+ 학교" value={addS}
                      onChange={(e) => setAddS(e.target.value)}
                      onKeyDown={(e) => { if (e.key === "Enter") addRow(); }} />
                  </td>
                  <td style={{padding: 3}}>
                    <select className="cm-sheet-in" value={addG} onChange={(e) => setAddG(e.target.value)}>
                      {GRADES.map((g) => <option key={g} value={g}>{g}</option>)}
                    </select>
                  </td>
                  <td colSpan={8} style={{textAlign: "left", padding: "3px 6px"}}>
                    {addS.trim()
                      ? <button className="cm-link" onClick={addRow}>{matchSchool(addS, schoolOpts)} {addG} 줄 만들기</button>
                      : <span style={{fontSize: 12, color: "#b6ab9b"}}>학생이 아직 없는 학교도 미리 적어둘 수 있어요</span>}
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </>)}
      </div>
    </div>
  );
}

// 학교 일정 한 줄. 날짜를 고치면 바로 저장한다.
function SchoolTermRow({ term, row, cur, onMsg }) {
  const [busy, setBusy] = useState(false);
  const [ok, setOk] = useState(false);
  const v = cur || {};
  async function patch(data) {
    if (busy) return;
    setBusy(true);
    try {
      await saveSchoolTerm(term, row.school, row.grade, data);
      setOk(true); setTimeout(() => setOk(false), 1200);
    } catch (e) { onMsg("저장 실패: " + friendlyErr(e)); }
    setBusy(false);
  }
  async function clear() {
    if (!confirm(row.school + " " + row.grade + " 일정을 지울까요?" + "\n" +
      "이미 채워둔 학생들 참여표는 그대로 남아요.")) return;
    setBusy(true);
    try { await deleteSchoolTerm(term, row.school, row.grade); }
    catch (e) { onMsg("지우지 못했어요: " + friendlyErr(e)); }
    setBusy(false);
  }
  const bad = v.start && v.end && v.end < v.start;
  const mathOut = v.math && v.start && v.end && (v.math < v.start || v.math > v.end);
  const cell = { padding: 3, background: ok ? "#e6f0e9" : undefined, transition: "background .4s" };
  const dateIn = (k) => (
    <span className="cm-datewrap">
      <input type="date" className="cm-sheet-in" value={v[k] || ""} disabled={busy}
        onChange={(e) => patch({ [k]: e.target.value })} />
      {v[k] && <button className="cm-x" title="날짜 지우기" disabled={busy}
        onClick={() => patch({ [k]: "" })}>×</button>}
    </span>
  );
  return (
    <tr>
      <td className="cm-ab-name" style={cell}>{row.school}</td>
      <td style={cell}>{row.grade}</td>
      <td style={{ ...cell, color: row.n ? "var(--navy)" : "#b6ab9b" }}>{row.n}명</td>
      <td style={cell}>{dateIn("start")}</td>
      <td style={{ ...cell, background: bad ? "#fae3e2" : cell.background }}>{dateIn("end")}</td>
      <td style={{ ...cell, background: mathOut ? "#f6e7df" : cell.background }}>{dateIn("math")}</td>
      <td style={{ ...cell, fontSize: 11, color: "#c2703f" }}>{v.math ? shortDate(dayBefore(v.math)) : "-"}</td>
      <td style={cell}>{dateIn("back")}</td>
      <td style={cell}>
        {cur && <button className="cm-link" style={{color: "#d6453f", padding: 0}} disabled={busy} onClick={clear}>지우기</button>}
      </td>
      <td style={{ ...cell, textAlign: "left", fontSize: 11, color: "#a8562c", whiteSpace: "normal" }}>
        {bad ? "끝이 시작보다 빨라요" : (mathOut ? "수학시험이 내신 기간 밖이에요" : "")}
      </td>
    </tr>
  );
}

function ExamBoard({ onBack }) {
  const [term, setTerm] = useState(null);
  const [byClass, setByClass] = useState({});   // { cid: { sid: 제출 } }
  const [grade, setGrade] = useState("고1");
  const [editTerm, setEditTerm] = useState(false);
  const [draft, setDraft] = useState("");
  const [fixing, setFixing] = useState("");
  const [shared, setShared] = useState([]);
  const [entry, setEntry] = useState(null);   // 대신 입력 중인 {cid, st, cur}
  const [sched, setSched] = useState({});     // 학교 일정 (appConfig/schoolTerms)
  const [people, setPeople] = useState([]);   // 학생 명단 (students) — 이름·학교·학년의 원본
  const [filling, setFilling] = useState(false);
  const [fillMsg, setFillMsg] = useState("");
  const backRef = useSwipeBack(onBack);
  // 참여표는 PC로 본다. 560px 컬럼에 가두면 달력이 못 들어간다 (안내문과 같은 처리)
  useEffect(() => {
    const el = document.querySelector(".cm-shell");
    if (!el) return;
    el.classList.add("cm-shell-wide");
    return () => el.classList.remove("cm-shell-wide");
  }, []);
  const classes = activeClasses();
  useEffect(() => listenSchools(setShared), []);
  useEffect(() => listenSchoolTerms(setSched), []);
  useEffect(() => listenStudents(setPeople, () => setPeople([])), []);

  useEffect(() => listenExamTerm((t) => { setTerm(t); setDraft(t); }), []);
  useEffect(() => {
    if (!term) return;
    const unsubs = classes.map((c) => listenExams(c.id, term, (m) => setByClass((p) => ({ ...p, [c.id]: m }))));
    return () => unsubs.forEach((u) => u && u());
  }, [term, classes.map((c) => c.id).join(",")]);

  // 이름·학교·학년은 **학생 명단이 원본**이다. 반 명단(roster)에도 같은 값이 적혀 있지만
  // 그건 학생 화면용 사본이라 이어지지 않은 사람에게는 없거나 낡아 있다.
  // 여기서 사람 문서로 한 번 풀어서 보지 않으면, 학생 명단에서 고친 것이 이 화면에 안 닿는다.
  const personOf = (pid) => (pid && people.find((x) => x.pid === pid)) || null;
  function whoOf(st, v) {
    const w = personOf(st.pid);
    return {
      name: (w && w.name) || st.name || (v && v.name) || "",
      school: (w && w.school) || (v && v.school) || st.school || "",
      grade: (w && w.grade) || (v && v.grade) || st.grade || "",
      linked: !!w,
    };
  }

  // 반을 가로질러 모은다
  const got = [];
  const missing = [];
  classes.forEach((c) => {
    const m = byClass[c.id] || {};
    (c.roster || []).filter((r) => !r.teacher && !isEnded(r)).forEach((st) => {
      if (m[st.id]) got.push({ cls: c, st, v: m[st.id], w: whoOf(st, m[st.id]) });
      else missing.push({ cls: c, st, w: whoOf(st, null) });
    });
  });
  const inGrade = got.filter((x) => (x.v.grade || "") === grade);
  // 안 낸 학생도 학년 탭을 따라간다. 전부 한 덩어리로 늘어놓으면 서른 명이 벽이 되고,
  // 학생 명단에서 학년을 채워도 화면이 안 변해 "고쳐도 반영이 안 된다"로 보인다.
  const missGrade = missing.filter((x) => x.w.grade === grade);
  const missNoGrade = missing.filter((x) => !x.w.grade);

  // 명단에서 안 잡히는 제출 — 그냥 두면 낸 사람은 냈다고 생각하는데 화면엔 없다.
  // 선생님 항목(teacher:true), 수강 종료, 명단에서 빠진 학생, id가 어긋난 경우가 여기 걸린다.
  const orphans = [];
  classes.forEach((c) => {
    const m = byClass[c.id] || {};
    const live = {};
    (c.roster || []).filter((r) => !r.teacher && !isEnded(r)).forEach((r) => { live[r.id] = 1; });
    Object.keys(m).forEach((sid) => {
      if (live[sid]) return;
      const who = (c.roster || []).find((r) => r.id === sid);
      orphans.push({ cls: c, sid: sid, v: m[sid],
        why: !who ? "명단에 없음" : (who.teacher ? "선생님 항목" : "수강 종료") });
    });
  });

  // 제출에는 있는데 기본·공용 목록 어디에도 없는 학교 (학생이 기타로 넣은 것)
  const known = {};
  KNOWN_SCHOOLS.concat(shared).forEach((n) => { known[n] = 1; });
  const newSchools = Array.from(new Set(got.map((x) => x.v.school).filter((n) => n && !known[n])));
  const schoolOpts = Array.from(new Set(KNOWN_SCHOOLS.concat(shared).concat(got.map((x) => x.v.school).filter(Boolean))))
    .sort((a, b) => a.localeCompare(b, "ko"));

  // 같은 학교·같은 학년인데 일정이 다른 것 (반이 달라도 잡는다 — 오히려 이쪽이 더 흔하다)
  const groups = {};
  got.forEach((x) => {
    if (!x.v.school || !x.v.grade || !x.v.start) return;
    const k = x.v.school + "|" + x.v.grade;
    (groups[k] = groups[k] || []).push(x);
  });
  const conflicts = [];
  Object.keys(groups).forEach((k) => {
    const g = groups[k];
    if (g.length < 2) return;
    const variants = {};
    g.forEach((x) => { (variants[examSig(x.v)] = variants[examSig(x.v)] || []).push(x); });
    const keys = Object.keys(variants);
    if (keys.length > 1) conflicts.push({ key: k, school: g[0].v.school, grade: g[0].v.grade, variants, keys });
  });

  // ----- 학교 일정으로 채우기 -----
  // 학교·학년은 (1) 이미 낸 값 (2) 반 명단에 적힌 값(학생 명단에서 정한 것) 순으로 본다.
  function schedOf(w) {
    if (!w.school || !w.grade) return null;
    return findSchoolTerm(sched, term, w.school, w.grade);
  }
  // 안 낸 학생 중 학교 일정이 있는 사람 = 바로 채울 수 있는 사람
  const fillable = missing.map((x) => ({ ...x, s: schedOf(x.w) })).filter((x) => x.s);
  // 이미 낸 사람 중 학교 일정과 다른 사람. 자동으로 덮지 않는다 —
  // 분반마다 진짜 다를 수도 있고, 학생이 맞게 낸 걸 지워버리면 되돌릴 방법이 없다.
  // 학교·학년이 학생 명단과 어긋난 것도 여기 걸린다 (명단이 원본이므로 그쪽으로 맞춘다).
  const offSched = got.map((x) => ({ ...x, s: schedOf(x.w) }))
    .filter((x) => x.s && (examSig(x.v) !== examSig(x.s)
      || x.v.school !== x.s.school || x.v.grade !== x.s.grade));

  function schedFields(w, sc, keep) {
    return {
      name: w.name, school: sc.school, grade: sc.grade,
      start: sc.start, end: sc.end, math: sc.math || "",
      // 직보를 손으로 고쳐둔 사람은 그대로 둔다 (전날이 아니면 일부러 바꾼 것)
      prep: (keep && keep.prep && keep.prep !== dayBefore(keep.math)) ? keep.prep
            : (sc.math ? dayBefore(sc.math) : ""),
      // 복귀는 선생님이 학생별로 정한다. 이미 정해둔 게 있으면 안 건드린다.
      back: (keep && keep.back) || sc.back || "",
      note: (keep && keep.note) || "",
      byTeacher: true, fromSchedule: true,
    };
  }
  async function fillFromSchedule() {
    if (!fillable.length || filling) return;
    if (!confirm("학교 일정으로 " + fillable.length + "명을 채웁니다." + "\n" +
      "이미 낸 학생은 건드리지 않아요. 계속할까요?")) return;
    setFilling(true); setFillMsg("");
    let n = 0;
    try {
      for (const x of fillable) { await saveExam(x.cls.id, term, x.st.id, schedFields(x.w, x.s, null)); n++; }
      setFillMsg(n + "명 채웠어요 ✓");
    } catch (e) { setFillMsg("채우다 멈췄어요 (" + n + "명까지): " + friendlyErr(e)); }
    setFilling(false);
  }
  async function syncToSchedule() {
    if (!offSched.length || filling) return;
    if (!confirm("학교 일정과 다르게 낸 " + offSched.length + "명을 학교 일정에 맞춥니다." + "\n" +
      "직보를 따로 고쳐둔 것과 복귀 날짜는 그대로 둡니다. 계속할까요?")) return;
    setFilling(true); setFillMsg("");
    let n = 0;
    try {
      for (const x of offSched) { await saveExam(x.cls.id, term, x.st.id, schedFields(x.w, x.s, x.v)); n++; }
      setFillMsg(n + "명 맞췄어요 ✓");
    } catch (e) { setFillMsg("맞추다 멈췄어요 (" + n + "명까지): " + friendlyErr(e)); }
    setFilling(false);
  }

  // 잘못 들어간 제출 지우기. 참여표에서 사라지고 "안 낸 학생"으로 돌아간다.
  async function removeExam(cls, sid, who) {
    if (filling) return;
    if (!confirm(who + " 제출을 지울까요?" + "\n\n" +
      "이번 회차(" + term + ") 참여표에서만 사라져요. 출결·과제·점수 기록은 그대로 남고,\n" +
      "학생이 다시 내거나 선생님이 다시 넣을 수 있어요.")) return;
    setFilling(true); setFillMsg("");
    try { await deleteExam(cls.id, term, sid); setFillMsg(who + " 제출을 지웠어요 ✓"); }
    catch (e) { setFillMsg("지우지 못했어요: " + friendlyErr(e)); }
    setFilling(false);
  }

  async function applyVariant(c, sigKey) {
    const src = c.variants[sigKey][0].v;
    const label = shortDate(src.start) + "~" + shortDate(src.end) + (src.math ? " · 수학 " + shortDate(src.math) : "");
    if (!confirm(c.school + " " + c.grade + " 학생들을 모두 이 일정으로 맞출까요?" + "\n" + label)) return;
    setFixing(c.key);
    try {
      for (const kk of c.keys) {
        if (kk === sigKey) continue;
        for (const x of c.variants[kk]) {
          const keptPrep = x.v.prep && x.v.prep !== dayBefore(x.v.math);
          await saveExam(x.cls.id, term, x.st.id, {
            name: x.v.name, school: x.v.school, grade: x.v.grade,
            start: src.start, end: src.end, math: src.math,
            prep: keptPrep ? x.v.prep : dayBefore(src.math),
            back: x.v.back || "", note: x.v.note || "",
          });
        }
      }
    } catch (e) { alert("맞추지 못했어요: " + e.message); }
    setFixing("");
  }

  // 날짜 띠 = **시험이 있는 달 1일 ~ 가장 늦은 복귀일**.
  // 시험 전 상황도 봐야 해서 1일부터 열고, 복귀까지 봐야 끝이 난다.
  // 복귀가 다음 달로 넘어가면 띠도 같이 넘어간다.
  const startsAll = [];
  const endsAll = [];
  inGrade.forEach((x) => {
    if (x.v.start) startsAll.push(x.v.start);
    if (x.v.back) endsAll.push(x.v.back);
    else if (x.v.end) endsAll.push(x.v.end);
  });
  startsAll.sort(); endsAll.sort();
  const examMonth = startsAll.length ? startsAll[0].slice(0, 7) : "";   // 회차 달 = 등원 회차를 세는 달
  const strip = [];
  if (startsAll.length) {
    const from = examMonth + "-01";
    const to = endsAll.length ? endsAll[endsAll.length - 1] : startsAll[startsAll.length - 1];
    const d = new Date(from + "T00:00:00");
    while (ymd(d) <= to && strip.length < 120) { strip.push(ymd(new Date(d))); d.setDate(d.getDate() + 1); }
  }

  // 등원 회차는 **그 달 전체**로 센다. 띠는 복귀일에서 끝나지만 그 뒤에도
  // 그 달 수업일이 남아 있으면 수강료에는 들어가야 한다.
  const monthDays = [];
  if (examMonth) {
    const yy = Number(examMonth.slice(0, 4)), mm = Number(examMonth.slice(5, 7));
    const last = new Date(yy, mm, 0).getDate();
    for (let i = 1; i <= last; i++) monthDays.push(ymd(new Date(yy, mm - 1, i)));
  }

  // 그 달의 등원 회차 — 수강료 산정에 쓴다.
  //   수업일 = 반 요일(개진반은 학생 요일) ∩ 그 달 ∩ 학생 수강기간   (attendsOn)
  //   빠지는 날 = 그 수업일 중 내신기간에 걸치는 날
  //   등원 = 수업일 − 빠지는 날
  // 직보·복귀는 따로 더하지 않는다. 대개 원래 수업일에 잡히고, 아니면 추가 보강이라
  // 회차 계산과 성격이 다르다. 필요하면 규칙을 바꾸면 된다.
  // attendsOn은 일반반이면 요일을 안 본다 — 호출부가 cls.classDays로 따로 거르는 함수다.
  // 그대로 쓰면 그 달 전체가 수업일로 잡혀 등원이 31회로 나온다.
  function isClassDay(cls, st, d, v) {
    if (!isActiveOn(st, d)) return false;
    const dow = new Date(d + "T00:00:00").getDay();
    // 제출에 요일이 적혀 있으면 그걸 쓴다 — 선생님이 달력에서 고른 값이고,
    // 나중에 반 요일이 바뀌어도 그때 센 회차가 그대로 재현된다.
    const days = (v && v.days && v.days.length) ? v.days
               : (isIndividual(cls) ? (st.days || []) : (cls.classDays || []));
    return days.indexOf(dow) >= 0;
  }
  // 안 오는 구간은 내신기간(start~end)이 아니라 **직보 다음날 ~ 복귀 전날**이다.
  // 직보가 마지막 수업이고 그 다음 오는 날이 복귀이므로, 시험이 끝난 뒤라도
  // 복귀 전이면 안 온다. 내신기간으로 재면 그 사이 수업일을 잘못 센다.
  // 둘 중 없는 값은 내신기간으로 대신한다.
  // 안 오는 구간 = 직보 다음날 ~ 복귀 전날 (없으면 내신기간으로 대신)
  function outRange(v) {
    return {
      s: (v && v.prep) ? dayAfter(v.prep) : ((v && v.start) || ""),
      e: (v && v.back) ? dayBefore(v.back) : ((v && v.end) || ""),
    };
  }
  const isOutOn = (v, d) => { const r = outRange(v); return !!(r.s && r.e && d >= r.s && d <= r.e); };

  function attendCount(cls, st, v) {
    const isOut = (d) => isOutOn(v, d);
    const come = {};              // 실제로 오는 날의 집합 (중복으로 안 세려고 집합으로 둔다)
    let total = 0, skip = 0;
    monthDays.forEach((d) => {
      if (!isClassDay(cls, st, d, v)) return;
      total++;
      if (isOut(d)) { skip++; return; }
      come[d] = 1;
    });
    // 직보와 복귀는 오는 날이다. 수업 요일이 아니어도 센다 — 수강료에 들어간다.
    // 그 달 안에 있을 때만 (다음 달로 넘어간 복귀는 그 달 회차가 아니다)
    let extra = 0;
    [(v && v.prep) || "", (v && v.back) || ""].forEach((d) => {
      if (!d || d.slice(0, 7) !== examMonth || come[d]) return;
      come[d] = 1; extra++;
    });
    return { total: total, skip: skip, extra: extra, come: Object.keys(come).length };
  }
  const markOf = (v, d) => {
    if (v.math && d === v.math) return EXAM_MARKS.math;
    if (v.prep && d === v.prep) return EXAM_MARKS.prep;
    if (v.back && d === v.back) return EXAM_MARKS.back;
    if (v.start && v.end && d >= v.start && d <= v.end) return EXAM_MARKS.exam;
    return null;
  };

  if (term === null) return <div className="cm-card"><div className="cm-empty">불러오는 중…</div></div>;
  return (
    <div ref={backRef} className="cm-stack cm-slide-in" style={{willChange: "transform"}}>
      <div className="cm-card">
        <div className="cm-admin-top" style={{marginBottom: 10}}>
          <h2 className="cm-h2" style={{margin: 0}}>내신 참여표</h2>
          <button className="cm-link cm-home-back" onClick={onBack}>← 돌아가기</button>
        </div>

        <div style={{display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", marginBottom: 10}}>
          {!editTerm && <span className="cm-chip" style={{background: term ? "#e6f0e9" : "#f0ece5", color: term ? "#3f7d5e" : "#7c6f5f"}}>
            {term ? "접수 중 · " + term : "아직 안 열었어요"}
          </span>}
          {!editTerm && <button className="cm-link" onClick={() => setEditTerm(true)}>{term ? "회차 바꾸기" : "회차 열기"}</button>}
          {editTerm && (<>
            <input className="cm-input" style={{margin: 0, maxWidth: 220}} placeholder="예: 2026 2학기 중간"
              value={draft} onChange={(e) => setDraft(e.target.value)} />
            <button className="cm-btn cm-btn-ghost" style={{margin: 0, width: "auto", padding: "9px 14px"}}
              onClick={async () => { await saveExamTerm(draft.trim()); setEditTerm(false); }}>저장</button>
            <button className="cm-link" onClick={() => { setDraft(term); setEditTerm(false); }}>취소</button>
          </>)}
        </div>
        {!term && <div className="cm-hint">회차를 열면 학생 화면에 <b>내신</b> 탭이 생겨요. 담당 반 전체가 여기 모입니다.</div>}

        {term && (fillable.length > 0 || offSched.length > 0 || fillMsg) && (
          <div style={{background: "#eef1f6", border: "1px solid #d8e0ea", borderRadius: 12,
               padding: "12px 14px", marginBottom: 12}}>
            <div style={{fontSize: 13, color: "var(--navy)", fontWeight: 700, marginBottom: 6}}>학교 일정으로 채우기</div>
            <div style={{fontSize: 12, color: "var(--muted)", lineHeight: 1.6, marginBottom: 8}}>
              <b>학교 일정</b>에 적어둔 내신 기간·수학시험 날짜로 학생 것을 만들어줘요.
              학교·학년은 학생 명단에 정해둔 값을 씁니다.
            </div>
            <div style={{display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center"}}>
              {fillable.length > 0 && (
                <button className="cm-btn cm-btn-primary" disabled={filling}
                  style={{margin: 0, width: "auto", padding: "9px 14px", fontSize: 13}}
                  onClick={fillFromSchedule}>
                  {filling ? "채우는 중…" : "안 낸 학생 " + fillable.length + "명 채우기"}
                </button>
              )}
              {offSched.length > 0 && (
                <button className="cm-btn cm-btn-ghost" disabled={filling}
                  style={{margin: 0, width: "auto", padding: "9px 14px", fontSize: 13}}
                  onClick={syncToSchedule}>
                  학교 일정과 다른 {offSched.length}명 맞추기
                </button>
              )}
              {fillMsg && <span style={{fontSize: 13, color: fillMsg.includes("✓") ? "#3f7d5e" : "#a5322d"}}>{fillMsg}</span>}
            </div>
            {offSched.length > 0 && (
              <div style={{fontSize: 11, color: "#8a7f72", marginTop: 8, lineHeight: 1.6}}>
                다른 학생: {offSched.slice(0, 12).map((x) => x.st.name + "(" + (x.v.school || "") + ")").join(" · ")}
                {offSched.length > 12 ? " 외 " + (offSched.length - 12) + "명" : ""}
              </div>
            )}
          </div>
        )}

        {/* 학생이 "기타"로 직접 넣은 학교를 공용 목록에 올린다.
            올려두면 다음부터 다른 학생도 고를 수 있어서 표기가 갈라지지 않는다. */}
        {newSchools.length > 0 && (
          <div style={{background: "#eef1f6", border: "1px solid #d8e0ea", borderRadius: 12, padding: "11px 13px", marginBottom: 12}}>
            <div style={{fontSize: 13, color: "var(--navy)", fontWeight: 700, marginBottom: 6}}>
              목록에 없는 학교 {newSchools.length}개
            </div>
            <div style={{fontSize: 12, color: "var(--muted)", marginBottom: 8, lineHeight: 1.5}}>
              학생이 직접 넣은 이름이에요. 목록에 올리면 다음부터 다른 학생도 고를 수 있어요.
            </div>
            <div style={{display: "flex", gap: 6, flexWrap: "wrap"}}>
              {newSchools.map((n) => (
                <button key={n} className="cm-ab-tab" onClick={() => addSchoolToList(n)}>{n} + 목록에 추가</button>
              ))}
            </div>
          </div>
        )}

        {term && (<>
          {conflicts.length > 0 && (
            <div style={{background: "#fae3e2", border: "1px solid #eec9c7", borderRadius: 12, padding: "12px 14px", marginBottom: 12}}>
              <div style={{color: "#a5322d", fontWeight: 700, fontSize: 14, marginBottom: 6}}>
                같은 학교인데 일정이 다르게 들어왔어요 · {conflicts.length}건
              </div>
              <div style={{fontSize: 12, color: "#a5322d", marginBottom: 10, lineHeight: 1.5}}>
                분반마다 진짜 다를 수도 있어요. 맞는 쪽을 눌러 나머지를 맞추거나, 그대로 두셔도 됩니다.
              </div>
              {conflicts.map((c) => (
                <div key={c.key} style={{borderTop: "1px solid #eec9c7", paddingTop: 8, marginTop: 8}}>
                  <div style={{fontWeight: 700, fontSize: 13, marginBottom: 4}}>{c.school} · {c.grade}</div>
                  {c.keys.map((kk) => {
                    const v = c.variants[kk][0].v;
                    const who = c.variants[kk].map((x) => x.st.name + "(" + x.cls.name + ")").join(" · ");
                    return (
                      <div key={kk} style={{display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", padding: "3px 0"}}>
                        <span style={{fontSize: 13}}>
                          <b>{shortDate(v.start)}~{shortDate(v.end)}</b>
                          {v.math ? <span style={{color: "#8a7f72"}}> · 수학 {shortDate(v.math)}</span> : null}
                          <span style={{color: "#8a7f72"}}> — {who}</span>
                        </span>
                        <button className="cm-link" disabled={fixing === c.key}
                          onClick={() => applyVariant(c, kk)}>이걸로 맞추기</button>
                      </div>
                    );
                  })}
                </div>
              ))}
            </div>
          )}

          {entry && (
            <ExamEntry key={entry.cls.id + entry.st.id} cls={entry.cls} term={term} st={entry.st}
              cur={entry.cur} schoolOpts={schoolOpts} onDone={() => setEntry(null)} />
          )}

          <div style={{display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10, marginTop: 10}}>
            {GRADES.map((g) => {
              const n = got.filter((x) => (x.v.grade || "") === g).length;
              const mn = missing.filter((x) => x.w.grade === g).length;
              return (
                <button key={g} className={"cm-ab-tab" + (grade === g ? " on" : "")} onClick={() => setGrade(g)}>
                  {g} {n}{mn ? <span style={{color: "#c2703f"}}> · 안 냄 {mn}</span> : null}
                </button>
              );
            })}
          </div>

          {strip.length > 0 && (
            <div style={{fontSize: 12, color: "var(--muted)", marginBottom: 6}}>
              {Number(examMonth.slice(5))}월 1일 ~ {fmtDate(strip[strip.length - 1])} (마지막 복귀일까지)
              · <b>등원 회차는 {Number(examMonth.slice(5))}월 전체</b> 기준이에요
            </div>
          )}
          {strip.length > 0 ? (
            <div className="cm-ab-wrap" data-no-swipe>
              <table className="cm-ab-table">
                <thead>
                  <tr>
                    <th className="cm-ab-name">이름</th>
                    {strip.map((d) => {
                      const day = Number(d.slice(8));
                      // 1일에는 몇 월인지 같이 적는다 — 달을 바꿔가며 보면 헷갈린다
                      return <th key={d} style={{minWidth: day === 1 ? 30 : 22, padding: "3px 2px"}}>
                        {day === 1 ? Number(d.slice(5, 7)) + "/1" : day}
                      </th>;
                    })}
                    <th rowSpan={2} style={{minWidth: 54}}>{examMonth ? Number(examMonth.slice(5)) + "월" : ""}<br/>등원</th>
                  </tr>
                  <tr>
                    <th className="cm-ab-name"></th>
                    {strip.map((d) => {
                      const w = new Date(d + "T00:00:00").getDay();
                      return <th key={d} style={{fontSize: 9, padding: "2px", color: w === 0 ? "#d6453f" : (w === 6 ? "#2b5f8a" : "#8a7f72")}}>{DAY_NAMES[w]}</th>;
                    })}
                  </tr>
                </thead>
                <tbody>
                  {inGrade.map(({ cls, st, v, w }) => {
                    const cnt = attendCount(cls, st, v);
                    return (
                    <tr key={cls.id + st.id}>
                      <td className="cm-ab-name">{w.name}<br/><span style={{fontSize: 10, color: "#8a7f72"}}>{v.school} · {cls.name}</span></td>
                      {strip.map((d) => {
                        const m = markOf(v, d);
                        const classDay = isClassDay(cls, st, d, v);
                        const resting = classDay && isOutOn(v, d);   // 수업일인데 안 오는 날
                        const st2 = m ? { background: m.bg, color: m.fg, fontWeight: 700, padding: "3px 2px" }
                                      : { padding: "3px 2px",
                                          background: resting ? "#f0ece5" : (classDay ? "#f4f6f9" : undefined),
                                          color: resting ? "#b6ab9b" : undefined };
                        return <td key={d} style={st2}>{m ? m.t : (resting ? "–" : (classDay ? "·" : ""))}</td>;
                      })}
                      <td style={{fontWeight: 700, color: "var(--navy)", minWidth: 54}}>
                        {cnt.come}회
                        <br/><span style={{fontSize: 9, fontWeight: 400, color: "#8a7f72"}}>
                          {cnt.total}−{cnt.skip}{cnt.extra ? "+" + cnt.extra : ""}
                        </span>
                      </td>
                    </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          ) : <div className="cm-empty">{grade}에서 아직 낸 학생이 없어요</div>}

          <div style={{display: "flex", gap: 8, flexWrap: "wrap", margin: "8px 0 14px", alignItems: "center"}}>
            <span className="cm-chip" style={{background: "#f4f6f9", color: "#5a6b82"}}>· 수업일</span>
            <span className="cm-chip" style={{background: "#f0ece5", color: "#b6ab9b"}}>– 안 오는 날</span>
            <span style={{fontSize: 11, color: "var(--muted)"}}>등원 = 그 달 수업일 − (직보 다음 ~ 복귀 전) + 직보·복귀</span>
            {Object.keys(EXAM_MARKS).map((k) => (
              <span key={k} className="cm-chip" style={{background: EXAM_MARKS[k].bg, color: EXAM_MARKS[k].fg}}>
                {EXAM_MARKS[k].t} {EXAM_MARKS[k].label}
              </span>
            ))}
          </div>

          {inGrade.length > 0 && (
            <div className="cm-ab-wrap" data-no-swipe>
              <table className="cm-ab-table">
                <thead><tr>
                  <th className="cm-ab-name">이름</th><th>반</th><th>학교</th><th>내신기간</th><th>수학시험</th><th>직보</th>
                  <th style={{minWidth: 118}}>복귀 <span style={{fontWeight: 400, color: "#8a7f72"}}>(선생님이 정함)</span></th><th>비고</th>
                </tr></thead>
                <tbody>
                  {inGrade.map(({ cls, st, v, w }) => (
                    <tr key={cls.id + st.id}>
                      <td className="cm-ab-name">{w.name}
                        <br/><button className="cm-link" style={{padding: 0, fontSize: 11}}
                          onClick={() => setEntry({ cls, st, cur: v })}>고치기</button>
                        <span style={{fontSize: 11, color: "#ded5c7"}}> · </span>
                        <button className="cm-link" style={{padding: 0, fontSize: 11, color: "#d6453f"}}
                          disabled={filling} onClick={() => removeExam(cls, st.id, w.name)}>지우기</button>
                        {v.byTeacher && <span style={{fontSize: 10, color: "#8a7f72"}}> · 대신 입력</span>}
                      </td>
                      <td>{cls.name}</td>
                      <td style={w.school && v.school !== w.school ? {background: "#f6e7df", color: "#a8562c"} : undefined}
                        title={w.school && v.school !== w.school ? "학생 명단에는 " + w.school : undefined}>
                        {v.school}{w.school && v.school !== w.school ? " ⚠" : ""}
                      </td>
                      <td>{v.start && v.end ? shortDate(v.start) + "~" + shortDate(v.end) : "-"}</td>
                      <td>{v.math ? shortDate(v.math) : "-"}</td>
                      <td>{v.prep ? shortDate(v.prep) : "-"}</td>
                      <td style={{padding: "2px 3px"}}>
                        <span className="cm-datewrap">
                          <input type="date" value={v.back || ""} style={{fontSize: 11, border: "1px solid var(--line)", borderRadius: 6, padding: "3px 4px", fontFamily: "inherit"}}
                            onChange={(e) => saveExam(cls.id, term, st.id, { back: e.target.value }).catch((err) => alert("저장 실패: " + err.message))} />
                          {v.back && <button className="cm-x" title="복귀 날짜 지우기"
                            onClick={() => saveExam(cls.id, term, st.id, { back: "" }).catch((err) => alert("지우지 못했어요: " + err.message))}>×</button>}
                        </span>
                      </td>
                      <td style={{textAlign: "left", whiteSpace: "normal", maxWidth: 160}}>{v.note || ""}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {orphans.length > 0 && (
            <div style={{marginTop: 14, background: "#f0ece5", border: "1px solid #ded5c7", borderRadius: 12, padding: "11px 13px"}}>
              <div style={{fontSize: 13, fontWeight: 700, color: "#7c6f5f", marginBottom: 6}}>
                명단에 안 잡히는 제출 {orphans.length}건
              </div>
              <div style={{fontSize: 12, color: "#7c6f5f", lineHeight: 1.6}}>
                냈는데 위 표에는 안 나오는 것들이에요. 명단을 손보면 바로 올라옵니다.
                잘못 들어간 것이면 지우세요.
                {orphans.map((o, i) => (
                  <div key={i} style={{marginTop: 4}}>
                    · <b>{o.v.name || "(이름 없음)"}</b> {o.v.grade || ""} {o.v.school || ""}
                    {o.v.start ? " · " + shortDate(o.v.start) + "~" + shortDate(o.v.end || o.v.start) : ""}
                    <span style={{opacity: .8}}> — {o.cls.name} / {o.why}</span>
                    {" "}<button className="cm-link" style={{padding: 0, fontSize: 11, color: "#d6453f"}}
                      disabled={filling}
                      onClick={() => removeExam(o.cls, o.sid, o.v.name || "이름 없는 제출")}>지우기</button>
                  </div>
                ))}
              </div>
            </div>
          )}

          <div style={{marginTop: 14, background: missing.length ? "#f6e7df" : "#e6f0e9",
               border: "1px solid " + (missing.length ? "#e6cbb9" : "#cfe0d5"), borderRadius: 12, padding: "12px 14px"}}>
            <div style={{fontSize: 14, color: missing.length ? "#a8562c" : "#3f7d5e", lineHeight: 1.6}}>
              {missing.length ? (<>
                <b>{grade} 아직 안 낸 학생 {missGrade.length}명</b>
                <span style={{fontSize: 12, opacity: .8}}> (전체 {missing.length}명 · 이름을 누르면 대신 넣을 수 있어요)</span>
                {missGrade.length > 0 && <MissingChips list={missGrade} onPick={setEntry} />}
                {missNoGrade.length > 0 && (<>
                  <div style={{fontSize: 13, fontWeight: 700, marginTop: 12}}>
                    학년을 모르는 학생 {missNoGrade.length}명
                    <span style={{fontSize: 12, fontWeight: 400, opacity: .8}}> — 학생 명단에서 학년을 넣으면 위 학년별로 들어가요</span>
                  </div>
                  <MissingChips list={missNoGrade} onPick={setEntry} />
                </>)}
              </>) : <b>담당 반 전원 제출 완료 ✓</b>}
            </div>
          </div>
        </>)}
      </div>
    </div>
  );
}

// 안 낸 학생 칩. 반별로 묶어서 보여준다 — 서른 개를 한 줄로 늘어놓으면 벽이 된다.

function MissingChips({ list, onPick }) {
  const byCls = [];
  list.forEach((x) => {
    let g = byCls.find((y) => y.cls.id === x.cls.id);
    if (!g) { g = { cls: x.cls, items: [] }; byCls.push(g); }
    g.items.push(x);
  });
  return (
    <div style={{marginTop: 6}}>
      {byCls.map((g) => (
        <div key={g.cls.id} style={{marginBottom: 6}}>
          <div style={{fontSize: 11, opacity: .75, marginBottom: 3}}>{g.cls.name} · {g.items.length}명</div>
          <div style={{display: "flex", gap: 6, flexWrap: "wrap"}}>
            {g.items.map((x) => (
              <button key={x.cls.id + x.st.id} className="cm-ab-tab"
                title={x.w.linked ? [x.w.school, x.w.grade].filter(Boolean).join(" · ") : "학생 명단에 없어요"}
                onClick={() => onPick({ cls: x.cls, st: x.st, cur: null })}>
                {x.w.name}
                {x.w.linked
                  ? (x.w.school ? <span style={{opacity: .6}}> · {x.w.school}</span> : null)
                  : <span style={{color: "#a5322d"}}> · 명단 없음</span>}
              </button>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

// ----- 점수 추이 그래프 -----
// 외부 차트 라이브러리를 쓰지 않는다. CDN을 하나 더 늘리면 그게 죽을 때 앱이 같이 죽는다
// (버전 고정 원칙과 같은 이유). 점 몇 개짜리 꺾은선은 SVG로 충분하다.
function ScoreChart({ rows, classAvg, showClass }) {
  const [pick, setPick] = useState(null);
  const H = 175, W = 320;                    // viewBox 기준. 화면에는 폭 100%로 늘린다
  const PAD = { l: 26, r: 8, t: 10, b: 22 };
  if (!rows.length) return null;
  const n = rows.length;
  const x = (i) => PAD.l + (n === 1 ? (W - PAD.l - PAD.r) / 2 : (i * (W - PAD.l - PAD.r)) / (n - 1));
  const y = (v) => PAD.t + (100 - Math.max(0, Math.min(100, v))) * (H - PAD.t - PAD.b) / 100;
  const path = (get) => rows.map((r, i) => {
    const v = get(r);
    return v == null ? null : (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1);
  }).filter(Boolean).join(" ");
  const mineLine = path((r) => r.score);
  const clsLine = showClass ? path((r) => (classAvg[r.date] == null ? null : classAvg[r.date])) : "";
  const avg = Math.round(rows.reduce((a, r) => a + r.score, 0) / n);
  const sel = pick == null ? null : rows[pick];
  return (
    <div>
      <svg viewBox={"0 0 " + W + " " + H} style={{width: "100%", height: "auto", display: "block", touchAction: "manipulation"}}>
        {[0, 50, 100].map((g) => (
          <g key={g}>
            <line x1={PAD.l} x2={W - PAD.r} y1={y(g)} y2={y(g)} stroke="#e7e0d2" strokeWidth="1" />
            <text x={PAD.l - 4} y={y(g) + 3} textAnchor="end" fontSize="7" fill="#8a7f72">{g}</text>
          </g>
        ))}
        <line x1={PAD.l} x2={W - PAD.r} y1={y(avg)} y2={y(avg)} stroke="var(--navy)" strokeWidth="1" strokeDasharray="3 3" opacity=".45" />
        {clsLine && <path d={clsLine} fill="none" stroke="#c2703f" strokeWidth="1.4" strokeDasharray="4 3" opacity=".85" strokeLinejoin="round" />}
        <path d={mineLine} fill="none" stroke="var(--navy)" strokeWidth="1.8" strokeLinejoin="round" strokeLinecap="round" />
        {rows.map((r, i) => (
          <circle key={i} cx={x(i)} cy={y(r.score)} r={pick === i ? 4.5 : 3}
            fill={pick === i ? "#c2703f" : "var(--navy)"} stroke="#fff" strokeWidth="1.2"
            style={{cursor: "pointer"}} onClick={() => setPick(pick === i ? null : i)} />
        ))}
        {rows.map((r, i) => (n <= 8 || i === 0 || i === n - 1 || i === pick) && (
          <text key={"t" + i} x={x(i)} y={H - 6} textAnchor="middle" fontSize="7" fill="#8a7f72">{shortDate(r.date)}</text>
        ))}
      </svg>
      <div style={{fontSize: 11, color: "var(--muted)", display: "flex", gap: 12, flexWrap: "wrap", marginTop: 2}}>
        <span><b style={{color: "var(--navy)"}}>—</b> 내 점수</span>
        <span><b style={{color: "var(--navy)", opacity: .5}}>┄</b> 내 평균 {avg}점</span>
        {clsLine && <span><b style={{color: "#c2703f"}}>┄</b> 반 평균</span>}
      </div>
      <div style={{fontSize: 12, color: "var(--muted)", marginTop: 4, minHeight: 18}}>
        {sel
          ? <span><b style={{color: "var(--ink)"}}>{sel.score}점</b> · {sel.correct}/{sel.total} · {fmtDate(sel.date)}
              {sel.label ? " · " + sel.label : ""}
              {showClass && classAvg[sel.date] != null ? " · 반 평균 " + classAvg[sel.date] + "점" : ""}
            </span>
          : <span>점을 누르면 그 회차를 자세히 보여줘요</span>}
      </div>
    </div>
  );
}

// 기간 고르기
const SCORE_RANGES = [
  { key: "3m", label: "3개월", months: 3 },
  { key: "6m", label: "6개월", months: 6 },
  { key: "1y", label: "1년", months: 12 },
  { key: "all", label: "전체", months: 0 },
];
function rangeFrom(months) {
  if (!months) return "";
  const d = new Date(todayStr + "T00:00:00");
  d.setMonth(d.getMonth() - months);
  d.setDate(1);            // 29~31일이면 넘치므로 1일 기준 (recentMonths와 같은 이유)
  return ymd(d);
}

// 한 사람의 점수 추이
function ScoreTrend({ cls, sid }) {
  const [rangeKey, setRangeKey] = useState("6m");
  const [from, setFrom] = useState("");
  const [to, setTo] = useState("");
  const [custom, setCustom] = useState(false);
  const [data, setData] = useState(null);
  const [showClass, setShowClass] = useState(true);

  const f = custom ? from : rangeFrom((SCORE_RANGES.find((r) => r.key === rangeKey) || {}).months);
  const t = custom ? to : "";

  useEffect(() => {
    let alive = true;
    setData(null);
    loadScoreHistory(cls.id, f, t).then((r) => { if (alive) setData(r); })
      .catch(() => { if (alive) setData({ rows: [], days: 0, truncated: false }); });
    return () => { alive = false; };
  }, [cls.id, sid, f, t]);

  const picker = (
    <div style={{marginBottom: 12}}>
      <div style={{display: "flex", gap: 6, flexWrap: "wrap"}}>
        {SCORE_RANGES.map((r) => (
          <button key={r.key} className={"cm-ab-tab" + (!custom && rangeKey === r.key ? " on" : "")}
            onClick={() => { setCustom(false); setRangeKey(r.key); }}>{r.label}</button>
        ))}
        <button className={"cm-ab-tab" + (custom ? " on" : "")} onClick={() => setCustom(true)}>직접 고르기</button>
      </div>
      {custom && (
        <div style={{display: "flex", gap: 8, alignItems: "center", marginTop: 8, flexWrap: "wrap"}}>
          <input className="cm-input" style={{margin: 0, flex: 1, minWidth: 130}} type="date"
            value={from} max={to || todayStr} onChange={(e) => setFrom(e.target.value)} />
          <span style={{color: "var(--muted)"}}>~</span>
          <input className="cm-input" style={{margin: 0, flex: 1, minWidth: 130}} type="date"
            value={to} min={from} max={todayStr} onChange={(e) => setTo(e.target.value)} />
          {(from || to) && <button className="cm-link" onClick={() => { setFrom(""); setTo(""); }}>지우기</button>}
        </div>
      )}
    </div>
  );

  if (data === null) return <div>{picker}<div className="cm-empty">불러오는 중…</div></div>;

  const all = data.rows;
  const rows = sid ? all.filter((r) => r.sid === sid) : [];
  // 날짜별 반 평균 (그 날 제출한 사람들의 평균)
  const byDate = {};
  all.forEach((r) => { (byDate[r.date] = byDate[r.date] || []).push(r.score); });
  const classAvg = {};
  Object.keys(byDate).forEach((d) => {
    classAvg[d] = Math.round(byDate[d].reduce((a, b) => a + b, 0) / byDate[d].length);
  });
  const others = all.filter((r) => r.sid !== sid).length;

  if (!rows.length) {
    return <div>{picker}<div className="cm-empty">이 기간에 제출한 점수가 없어요</div></div>;
  }
  const best = rows.reduce((a, r) => (r.score > a.score ? r : a), rows[0]);
  const last = rows[rows.length - 1];
  const prev = rows.length > 1 ? rows[rows.length - 2] : null;
  const diff = prev ? last.score - prev.score : null;
  const myAvg = Math.round(rows.reduce((a, r) => a + r.score, 0) / rows.length);
  const clsKeys = Object.keys(classAvg);
  const clsAvgAll = clsKeys.length ? Math.round(clsKeys.reduce((a, d) => a + classAvg[d], 0) / clsKeys.length) : null;

  return (
    <div>
      {picker}
      {others > 0 && (
        <label style={{display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: "var(--muted)", marginBottom: 8}}>
          <input type="checkbox" checked={showClass} onChange={(e) => setShowClass(e.target.checked)} />
          반 평균 같이 보기
        </label>
      )}
      <ScoreChart rows={rows} classAvg={classAvg} showClass={showClass && others > 0} />
      <div style={{display: "flex", gap: 8, flexWrap: "wrap", marginTop: 10}}>
        <span className="cm-chip" style={{background: "#eef1f6", color: "var(--navy)"}}>{rows.length}회 · 내 평균 {myAvg}점</span>
        <span className="cm-chip" style={{background: "#eef1f6", color: "var(--navy)"}}>최근 {last.score}점</span>
        {diff !== null && (
          <span className="cm-chip" style={{background: diff >= 0 ? "#e6f0e9" : "#fae3e2", color: diff >= 0 ? "#3f7d5e" : "#d6453f"}}>
            지난번보다 {diff >= 0 ? "+" : ""}{diff}점
          </span>
        )}
        <span className="cm-chip" style={{background: "#f6e7df", color: "#c2703f"}}>최고 {best.score}점</span>
        {others > 0 && clsAvgAll != null && (
          <span className="cm-chip" style={{background: "#f6e7df", color: "#c2703f"}}>반 평균 {clsAvgAll}점</span>
        )}
      </div>
      {data.truncated && (
        <div className="cm-hint" style={{marginTop: 8}}>
          기간이 길어 최근 {SCORE_MAX_DAYS}번의 수업만 불러왔어요. 기간을 좁히면 전부 나와요.
        </div>
      )}
    </div>
  );
}

function ScoreForm({ cls, me }) {
  const [correct, setCorrect] = useState("");
  const [total, setTotal] = useState("");
  const [label, setLabel] = useState("");
  const [mine, setMine] = useState([]);

  useEffect(() => {
    const unsub = scoresCol(cls.id, todayStr).where("sid", "==", me.id).onSnapshot((s) => {
      const arr = []; s.forEach((d) => arr.push({ id: d.id, ...d.data() })); arr.sort((a, b) => a.time - b.time); setMine(arr);
    });
    return () => unsub();
  }, [cls.id, me.id]);

  const c = parseInt(correct, 10), t = parseInt(total, 10);
  const valid = !isNaN(c) && !isNaN(t) && t > 0 && c >= 0 && c <= t;
  const score = valid ? Math.round((c / t) * 100) : null;
  const over = correct !== "" && total !== "" && !isNaN(c) && !isNaN(t) && (c > t || t === 0);

  async function submit() {
    if (!valid) return;
    await addScore(cls.id, todayStr, { sid: me.id, name: me.name, correct: c, total: t, score, label: label.trim(), time: Date.now() });
    setCorrect(""); setTotal(""); setLabel("");
  }

  return (
    <div className="cm-card">
      <h3 className="cm-h3">테스트 점수</h3>
      <label className="cm-label">시험 이름 (선택)</label>
      <input className="cm-input" placeholder="예: 6월 단원평가" value={label} onChange={(e) => setLabel(e.target.value)} />
      <label className="cm-label">맞은 개수 / 전체 문항 수</label>
      <div className="cm-rangebar">
        <input className="cm-input" inputMode="numeric" placeholder="맞은 개수" value={correct} onChange={(e) => setCorrect(e.target.value.replace(/\D/g, ""))} />
        <span className="cm-tilde">/</span>
        <input className="cm-input" inputMode="numeric" placeholder="전체" value={total} onChange={(e) => setTotal(e.target.value.replace(/\D/g, ""))} />
      </div>
      {score !== null && <div className="cm-scorebig">환산 점수 <b>{score}점</b><span>/ 100점</span></div>}
      {over && <div className="cm-err">맞은 개수는 전체 문항 수보다 클 수 없어요.</div>}
      <button className="cm-btn cm-btn-primary" onClick={submit}>제출하기</button>
      {mine.length > 0 && (
        <div className="cm-sentlist">
          <div className="cm-mini-h">내가 제출한 점수</div>
          {mine.slice().reverse().map((s) => (
            <div key={s.id} className="cm-sent-item">
              <span>{s.label ? s.label + " · " : ""}{s.correct}/{s.total}</span>
              <span className="cm-tag-ok">{s.score}점</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// 학생의 다가올 수업 날짜 계산 (요일 기반, weeks주 앞까지)
function upcomingSessions(cls, st, weeks) {
  const out = [];
  const dows = isIndividual(cls) ? (st.days || []) : (cls.classDays || []);
  if (dows.length === 0) return out;
  const start = new Date(todayStr + "T00:00:00");
  const end = new Date(start); end.setDate(end.getDate() + (weeks || 8) * 7);
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    if (!dows.includes(d.getDay())) continue;
    const ds = ymd(d);
    if (!isActiveOn(st, ds)) continue;
    out.push(ds);
  }
  return out;
}

function ReportNoteEdit({ note, cid, onChanged }) {
  const [editing, setEditing] = useState(false);
  const [text, setText] = useState(note.text);
  const [busy, setBusy] = useState(false);
  useEffect(() => { setText(note.text); }, [note.text]);

  async function save() {
    if (busy) return;
    setBusy(true);
    try {
      await saveDailyNote(cid, note.sid, note.sname, note.date, text, note.teacher);
      setEditing(false);
      onChanged && onChanged(note.date, text.trim());
    } catch (e) { alert("저장 실패: " + e.message); }
    setBusy(false);
  }
  async function remove() {
    if (!confirm(note.date + " 수업 기록을 삭제할까요?")) return;
    setBusy(true);
    try { await saveDailyNote(cid, note.sid, note.sname, note.date, "", note.teacher); onChanged && onChanged(note.date, ""); }
    catch (e) { alert("삭제 실패: " + e.message); }
    setBusy(false);
  }

  if (!editing) {
    return note.text
      ? <div style={{cursor: "pointer"}} onClick={() => setEditing(true)}>{note.text}</div>
      : <div className="rp-noprint" style={{cursor: "pointer", color: "#b3a89a", fontSize: 12.5}} onClick={() => setEditing(true)}>+ 기록 추가</div>;
  }
  return (
    <div className="rp-noprint">
      <textarea className="cm-input" style={{margin: "2px 0 6px", fontSize: 13, minHeight: 62, resize: "vertical"}}
        value={text} onChange={(e) => setText(e.target.value)} autoFocus />
      <div style={{display: "flex", gap: 8, alignItems: "center"}}>
        <button className="cm-btn cm-btn-primary" style={{margin: 0, padding: "6px 14px", fontSize: 13}} disabled={busy} onClick={save}>저장</button>
        <button className="cm-btn cm-btn-ghost" style={{margin: 0, padding: "6px 14px", fontSize: 13}} onClick={() => { setText(note.text); setEditing(false); }}>취소</button>
        {note.text && <button className="cm-link" style={{color: "#d6453f", marginLeft: "auto"}} disabled={busy} onClick={remove}>삭제</button>}
      </div>
    </div>
  );
}
