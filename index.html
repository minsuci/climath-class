<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>CLIMATH 수업</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Noto+Sans+KR:wght@400;500;700&display=swap');

*{box-sizing:border-box;}
html,body{margin:0; padding:0;}
#root{
  --navy:#15233f; --navy2:#27406e; --cream:#f4efe6; --paper:#fffdf8;
  --clay:#c2703f; --ink:#1c2333; --muted:#7c8294; --green:#3f7d5e; --line:#e7e0d2;
  font-family:'Noto Sans KR',system-ui,sans-serif;
  background:
    radial-gradient(1200px 400px at 80% -10%, rgba(39,64,110,.10), transparent),
    var(--cream);
  min-height:100vh; color:var(--ink);
}
.cm-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 22px; border-bottom:1px solid var(--line);
  background:var(--navy); color:#fff; position:sticky; top:0; z-index:5;
}
.cm-brand{display:flex; flex-direction:column; gap:2px;}
.cm-logo{font-family:'Fraunces',serif; font-weight:600; letter-spacing:.14em; font-size:20px;}
.cm-sub{font-size:11px; color:#aab6d0; letter-spacing:.02em;}
.cm-toggle{display:flex; background:rgba(255,255,255,.10); border-radius:999px; padding:3px;}
.cm-toggle button{border:0; background:transparent; color:#c4cde0; font-size:13px; font-weight:500; padding:7px 16px; border-radius:999px; cursor:pointer; font-family:inherit;}
.cm-toggle button.on{background:#fff; color:var(--navy);}

.cm-main{max-width:560px; margin:0 auto; padding:22px 16px 40px;}

/* ===== 사이드바 ===== */
.cm-hamb{display:none; border:0; background:rgba(255,255,255,.10); color:#fff; width:38px; height:38px; border-radius:10px; font-size:19px; cursor:pointer; align-items:center; justify-content:center; flex:none; margin-right:12px;}
.cm-shell{display:block;}
.cm-shell > .cm-main{display:flex; align-items:flex-start; gap:0; max-width:900px; margin:0 auto; padding:0 16px 40px;}
.cm-shell > .cm-main > .cm-side ~ *{flex:1; min-width:0; max-width:560px; padding-top:22px;}
.cm-shell > .cm-main > .cm-stack{flex:1; min-width:0; max-width:560px; padding-top:22px;}
.cm-shell > .cm-main > *:not(.cm-side):not(.cm-backdrop){flex:1; min-width:0; padding-top:22px;}
.cm-side{
  flex:none; width:190px; padding:22px 12px 40px; margin-right:6px;
  position:sticky; top:69px; align-self:flex-start; max-height:calc(100vh - 69px); overflow-y:auto;
}
.cm-side-title{font-size:11px; color:var(--muted); font-weight:600; letter-spacing:.04em; padding:0 12px 8px;}
.cm-side-btn{
  display:flex; align-items:center; gap:9px; width:100%; border:0; background:transparent;
  padding:11px 12px; border-radius:10px; font-size:14px; font-weight:500; color:var(--ink);
  cursor:pointer; font-family:inherit; text-align:left; margin-bottom:2px; line-height:1.3;
}
.cm-side-btn:hover{background:rgba(21,35,63,.05);}
.cm-side-btn.on{background:var(--navy); color:#fff; font-weight:600;}
.cm-side-btn:disabled{opacity:.38; cursor:not-allowed;}
.cm-side-btn:disabled:hover{background:transparent;}
.cm-side-ico{font-size:15px; width:19px; text-align:center; flex:none;}
.cm-side-sep{height:1px; background:var(--line); margin:9px 12px;}
.cm-backdrop{display:none;}
/* PC에선 사이드바가 항상 보이므로 최상위 화면의 돌아가기 버튼 숨김 */
@media (min-width: 861px){ .cm-home-back{display:none;} }

/* ===== 학습관리 보고서 (A4 인쇄) ===== */
.rp-sheet{background:#fff; color:#1c2333; padding:26px 28px; border-radius:14px; border:1px solid var(--line); font-size:13px; line-height:1.6;}
.rp-head{display:flex; align-items:flex-end; justify-content:space-between; border-bottom:2px solid var(--navy); padding-bottom:12px; margin-bottom:18px;}
.rp-logo{font-family:'Fraunces',serif; font-size:19px; font-weight:600; letter-spacing:.13em; color:var(--navy);}
.rp-title{font-size:12px; color:#6b7280; margin-top:3px;}
.rp-who{text-align:right;}
.rp-who b{font-size:17px;}
.rp-sec{margin:18px 0 0;}
.rp-sec-h{font-family:'Fraunces',serif; font-size:14px; color:var(--navy); font-weight:600; border-left:3px solid var(--clay); padding-left:8px; margin-bottom:9px;}
.rp-stats{display:flex; gap:10px;}
.rp-stat{flex:1; background:#f7f4ee; border-radius:10px; padding:11px 8px; text-align:center;}
.rp-stat b{display:block; font-size:20px; font-family:'Fraunces',serif; color:var(--navy);}
.rp-stat span{font-size:11px; color:#6b7280;}
.rp-table{width:100%; border-collapse:collapse; font-size:12.5px;}
.rp-table th{background:#f7f4ee; padding:7px 9px; text-align:left; font-weight:600; color:#4b5563; border-bottom:1px solid #e5ded2;}
.rp-table td{padding:7px 9px; border-bottom:1px solid #f0ece5;}
.rp-note{background:#f7f4ee; border-radius:10px; padding:12px 14px; white-space:pre-wrap; min-height:56px;}
.rp-consult{padding:9px 0; border-bottom:1px solid #f0ece5;}
.rp-consult:last-child{border-bottom:0;}
.rp-foot{margin-top:22px; padding-top:11px; border-top:1px solid #e5ded2; font-size:11px; color:#9ca3af; display:flex; justify-content:space-between;}

@media print{
  @page{size:A4; margin:14mm;}
  body{background:#fff;}
  .cm-header, .cm-side, .cm-backdrop, .cm-hamb, .rp-noprint{display:none !important;}
  .cm-shell > .cm-main{display:block; max-width:none; padding:0;}
  .cm-main > *{max-width:none !important; padding-top:0 !important;}
  .rp-sheet{border:0; border-radius:0; padding:0; font-size:12px;}
  .rp-sheet + .rp-sheet{page-break-before:always;}
}

@media (max-width: 860px){
  .cm-hamb{display:flex;}
  .cm-shell > .cm-main{display:block; max-width:560px; padding:22px 16px 40px;}
  .cm-shell > .cm-main > *{padding-top:0 !important; max-width:none !important;}
  .cm-side{
    position:fixed; top:0; left:0; bottom:0; width:250px; max-height:none; z-index:40;
    background:var(--paper); box-shadow:2px 0 22px rgba(21,35,63,.18);
    padding:20px 12px 40px; transform:translateX(-102%); transition:transform .22s cubic-bezier(.25,.8,.25,1);
  }
  .cm-side.open{transform:translateX(0);}
  .cm-backdrop.show{display:block; position:fixed; inset:0; background:rgba(21,35,63,.42); z-index:39;}
  .cm-side-close{display:flex !important;}
}
.cm-side-close{display:none; align-items:center; gap:8px; width:100%; border:0; background:transparent; color:var(--muted); font-size:13px; padding:6px 12px 14px; cursor:pointer; font-family:inherit;}
.cm-stack{display:flex; flex-direction:column; gap:14px;}

.cm-card{background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:20px; box-shadow:0 1px 0 rgba(21,35,63,.03), 0 8px 24px -16px rgba(21,35,63,.25);}
.cm-h2{font-family:'Fraunces',serif; font-size:22px; margin:0 0 14px; color:var(--navy);}
.cm-h3{font-family:'Fraunces',serif; font-size:17px; margin:0 0 14px; color:var(--navy);}
.cm-h-hint{font-family:'Noto Sans KR',sans-serif; font-size:12px; font-weight:400; color:var(--muted);}
.cm-label{display:block; font-size:12px; color:var(--muted); margin:12px 0 5px; font-weight:500;}
.cm-input{width:100%; border:1px solid var(--line); background:#fff; border-radius:10px; padding:12px 13px; font-size:15px; font-family:inherit; color:var(--ink); outline:none; transition:border-color .15s;}
.cm-input:focus{border-color:var(--navy2);}
.cm-tilde{color:var(--muted);}

.cm-btn{width:100%; border:0; border-radius:11px; padding:13px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; margin-top:16px; transition:transform .08s, filter .15s;}
.cm-btn:active{transform:translateY(1px);}
.cm-btn-primary{background:var(--navy); color:#fff;}
.cm-btn-primary:hover{filter:brightness(1.12);}
.cm-big{padding:18px; font-size:17px;}
.cm-btn-ghost{width:auto; margin:0; background:transparent; color:var(--clay); border:1px solid var(--clay); padding:8px 16px; font-size:13px; border-radius:9px;}
.cm-btn-ghost:hover{background:var(--clay); color:#fff;}
.cm-link{background:none; border:0; color:var(--muted); font-size:13px; cursor:pointer; font-family:inherit; text-decoration:underline; text-underline-offset:3px;}
.cm-err{color:var(--clay); font-size:13px; margin-top:10px;}

.cm-welcome{display:flex; align-items:center; justify-content:space-between;}
.cm-welcome-name{font-family:'Fraunces',serif; font-size:20px; color:var(--navy);}
.cm-welcome-sub{font-size:13px; color:var(--muted); margin-top:3px;}

.cm-tabs{display:flex; gap:6px; background:#ece4d4; padding:5px; border-radius:12px;}
.cm-tabs button{flex:1; border:0; background:transparent; padding:10px 4px; border-radius:9px; font-size:14px; font-weight:500; color:var(--muted); cursor:pointer; font-family:inherit;}
.cm-tabs button.on{background:#fff; color:var(--navy); box-shadow:0 1px 4px rgba(21,35,63,.10);}
.cm-tabs button:disabled{opacity:.4; cursor:not-allowed;}

.cm-done{color:var(--green); font-weight:700; font-size:16px; text-align:center; padding:14px;}
.cm-sentlist{margin-top:18px; border-top:1px dashed var(--line); padding-top:14px;}
.cm-mini-h{font-size:12px; color:var(--muted); margin-bottom:8px; font-weight:500;}
.cm-sent-item{display:flex; justify-content:space-between; align-items:center; padding:8px 0; font-size:14px;}
.cm-tag-ok{font-size:12px; color:var(--green); font-weight:700;}
.cm-tag-wait{font-size:12px; color:var(--clay); font-weight:700;}

.cm-hint{font-size:13px; color:var(--muted); line-height:1.5;}
.cm-hint b{color:var(--clay);}

.cm-book-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px;}
.cm-book-count{font-family:'Fraunces',serif; font-size:15px; color:var(--green); font-weight:600;}
.cm-book-pct{font-size:13px; color:var(--ink2); font-weight:500; font-family:inherit;}
.cm-paintbadge{margin-left:10px; font-family:'Noto Sans KR',sans-serif; font-size:11px; font-weight:700; color:#fff; background:var(--green); padding:3px 10px; border-radius:999px; vertical-align:middle;}
.cm-rangebar{display:flex; align-items:center; gap:8px; margin-bottom:16px;}
.cm-rangebar .cm-input{padding:9px 11px; font-size:14px;}
.cm-rangebtn{white-space:nowrap;}
.cm-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(34px,1fr)); gap:5px; user-select:none; -webkit-user-select:none;}
.cm-cell{display:flex; align-items:center; justify-content:center; padding:7px 0; font-size:11px; border-radius:7px; background:#f0eadd; color:var(--muted); border:1px solid var(--line);}
button.cm-cell{cursor:pointer; font-family:inherit;}
.cm-cell.clickable:hover{border-color:var(--green); color:var(--green);}
.cm-cell.done{background:#dcefe3; color:var(--green); font-weight:700; border-color:#9fcfb4;}
.cm-cell.done.clickable:hover{border-color:var(--clay); color:var(--clay);}
.cm-cell.q{color:#d6453f; font-weight:700;}

.cm-daylist{display:flex; flex-direction:column; gap:8px;}
.cm-day{display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left; cursor:pointer; font-family:inherit; background:#fff; border:1px solid var(--line); border-radius:12px; padding:15px 16px; transition:border-color .15s, transform .08s;}
.cm-day:hover{border-color:var(--navy2);}
.cm-day:active{transform:translateY(1px);}
.cm-day.today{border-color:var(--navy); background:#f7f9fc;}
.cm-day-left{display:flex; align-items:center; gap:8px;}
.cm-day-date{font-weight:700; color:var(--navy); font-size:15px;}
.cm-day-badge{background:var(--navy); color:#fff; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px;}
.cm-day-sub{font-size:11px; color:var(--muted); background:#f0ece5; padding:2px 8px; border-radius:999px; margin-left:6px;}
.cm-ai-scroll{height:62vh; min-height:340px; overflow-y:auto; padding:10px 2px; display:flex; flex-direction:column; gap:10px;}
.cm-ai-msg{display:flex; flex-direction:column; max-width:88%;}
.cm-ai-msg.me{align-self:flex-end; align-items:flex-end;}
.cm-ai-msg.ai{align-self:flex-start; align-items:flex-start;}
.cm-ai-bubble{padding:10px 13px; border-radius:14px; font-size:14px; line-height:1.5; white-space:pre-wrap; word-break:break-word;}
.cm-ai-msg.me .cm-ai-bubble{background:var(--navy); color:#fff; border-bottom-right-radius:4px;}
.cm-ai-msg.ai .cm-ai-bubble{background:#f0ece5; color:var(--ink); border-bottom-left-radius:4px;}
.cm-ai-typing{color:var(--muted); font-style:italic;}
.cm-ai-img{max-width:180px; border-radius:10px; margin-bottom:4px;}
.cm-ai-preview{display:flex; align-items:center; gap:10px; margin:8px 0;}
.cm-ai-preview img{max-width:60px; max-height:60px; border-radius:8px; border:1px solid var(--line);}
.cm-ai-input{display:flex; gap:8px; align-items:center; margin-top:12px;}
.cm-ai-input .cm-input{flex:1 1 0%; min-width:0; height:48px; font-size:15px;}
.cm-ai-imgbtn{flex:0 0 48px; width:48px; height:48px; border:1px solid var(--line); border-radius:10px; background:#fff; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;}
.cm-ai-send{flex:0 0 auto; padding:0 18px; height:48px; border:none; border-radius:10px; background:var(--navy); color:#fff; font-size:15px; font-weight:600; cursor:pointer; white-space:nowrap;}
.cm-ai-send:disabled{opacity:.5;}
.cm-day-arrow{font-size:20px; color:var(--navy2); line-height:1;}

.cm-daybar{display:flex; align-items:center; justify-content:space-between; padding:8px 2px; position:sticky; top:0; z-index:100; background:var(--bg); margin:-4px -4px 4px -4px;}
.cm-back{background:none; border:0; color:var(--navy2); font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; padding:4px 0;}
@keyframes slideInRight{from{transform:translateX(60%);opacity:0;}to{transform:translateX(0);opacity:1;}}
.cm-slide-in{animation:slideInRight 0.2s cubic-bezier(.25,.8,.25,1) both;}
.cm-daybar-date{font-family:'Fraunces',serif; font-size:16px; color:var(--navy); display:flex; align-items:center; gap:8px;}
.cm-live{font-family:'Noto Sans KR',sans-serif; font-size:11px; color:var(--clay); font-weight:700; letter-spacing:.05em;}

.cm-admin-top{display:flex; align-items:center; gap:24px;}
.cm-stat{text-align:left;}
.cm-stat-num{font-family:'Fraunces',serif; font-size:30px; color:var(--navy); line-height:1;}
.cm-stat-num span{font-size:16px; color:var(--muted);}
.cm-clay{color:var(--clay)!important;}
.cm-stat-lab{font-size:12px; color:var(--muted); margin-top:4px;}
.cm-admin-top .cm-link{margin-left:auto;}

.cm-empty{color:var(--muted); font-size:14px; text-align:center; padding:14px;}
.cm-q{display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--line);}
.cm-q:last-child{border-bottom:0;}
.cm-q-main{flex:1; min-width:0;}
.cm-q-top{display:flex; justify-content:space-between; align-items:baseline;}
.cm-q-name{font-weight:700; color:var(--navy);}
.cm-q-time{font-size:12px; color:var(--muted);}
.cm-q-body{font-size:15px; margin-top:3px;}
.cm-q-body b{color:var(--clay);}
.cm-q-memo{color:var(--muted); font-size:13px;}
.cm-q.done{opacity:.5;}
.cm-resolved-box { border: 1px solid #e8e0d4; border-radius: 10px; overflow: hidden; }
.cm-resolved-summary { cursor: pointer; padding: 10px 14px; font-size: 13px; color: #8a7f72; font-weight: 600; list-style: none; background: #f7f4f0; user-select: none; }
.cm-resolved-summary::-webkit-details-marker { display: none; }
.cm-resolved-summary::before { content: "▶ "; font-size: 11px; }
details[open] .cm-resolved-summary::before { content: "▼ "; }
.cm-resolved-box .cm-q { margin: 0; border-radius: 0; border-top: 1px solid #ede8e0; }
.cm-q-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.cm-q-tab { padding: 4px 10px; border-radius: 20px; border: 1px solid #d4c9b8; background: #fff; font-size: 12px; color: #8a7f72; cursor: pointer; }
.cm-q-tab.on { background: #2c3e5c; color: #fff; border-color: #2c3e5c; }
.cm-q-pages { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 10px; font-size: 13px; color: #8a7f72; }
.cm-q-page-btn { background: none; border: 1px solid #d4c9b8; border-radius: 6px; padding: 2px 8px; cursor: pointer; font-size: 13px; color: #5a5248; }
.cm-q-page-btn:disabled { opacity: 0.3; cursor: default; }
/* 출석부 */
.cm-ab-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -16px; padding: 0 16px 8px; }
.cm-ab-table { border-collapse: collapse; font-size: 11px; min-width: 100%; }
.cm-ab-table th, .cm-ab-table td { border: 1px solid #e8e0d4; padding: 4px 6px; white-space: nowrap; text-align: center; }
.cm-ab-table th { background: #f7f4f0; font-weight: 700; color: #5a5248; position: sticky; top: 0; }
.cm-ab-name { position: sticky; left: 0; background: #f7f4f0; font-weight: 700; color: #2c3e5c; text-align: left !important; z-index: 2; min-width: 60px; }
.cm-ab-table th.cm-ab-name { z-index: 3; }
.cm-ab-att-o { color: #2ecc71; font-weight: 700; cursor: pointer; user-select: none; }
.cm-ab-att-x { color: #e74c3c; cursor: pointer; user-select: none; }
.cm-ab-att-o:active, .cm-ab-att-x:active { opacity: 0.5; }
.cm-ab-score { color: #c0392b; font-weight: 600; font-size: 10px; }
.cm-ab-hw { color: #8a7f72; font-size: 10px; }
.cm-ab-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.cm-ab-tab { padding: 4px 12px; border-radius: 20px; border: 1px solid #d4c9b8; background: #fff; font-size: 12px; color: #8a7f72; cursor: pointer; font-family: inherit; }
.cm-ab-tab.on { background: #2c3e5c; color: #fff; border-color: #2c3e5c; }
.cm-ab-att-p{background:#f6e7df; color:#c2703f; font-weight:700; cursor:pointer;}
.cm-ab-att-v{background:#e3edf5; color:#2b5f8a; font-weight:700; cursor:pointer;}
.cm-ab-month-sel { font-size: 13px; border: 1px solid #d4c9b8; border-radius: 8px; padding: 4px 8px; font-family: inherit; color: #2c3e5c; background: #fff; margin-bottom: 12px; }
.cm-q-resolved{font-size:13px; color:var(--green); font-weight:700; white-space:nowrap;}

.cm-roster{display:grid; grid-template-columns:1fr 1fr; gap:8px; align-items:stretch;}
.cm-rost{display:flex; justify-content:space-between; align-items:center; padding:10px 11px; border-radius:10px; background:#f3ede0; font-size:14px; color:var(--muted); border:1px solid transparent; width:100%; cursor:pointer; font-family:inherit; text-align:left; transition:border-color .15s, transform .08s; min-height:52px; overflow:hidden;}
.cm-rost:hover{border-color:var(--navy2);}
.cm-rost:active{transform:translateY(1px);}
.cm-rost.in{background:#e7f0ea; color:var(--navy); font-weight:500;}
.cm-rost-name{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
.cm-rost-t{font-size:11px; white-space:nowrap; flex:none;}
.cm-rost-sub{display:block; font-size:10px; font-weight:500; color:#9a8f80; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

.cm-hw-row{display:flex; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); align-items:flex-start;}
.cm-hw-row:last-child{border-bottom:0;}
.cm-hw-name{font-weight:700; color:var(--navy); min-width:60px; font-size:14px; padding-top:3px;}
.cm-hw-name-btn{background:none; border:0; cursor:pointer; font-family:inherit; text-align:left; text-decoration:underline; text-underline-offset:3px;}
.cm-hw-items{display:flex; flex-wrap:wrap; gap:6px;}
.cm-chip{background:#eef2f8; color:var(--navy2); font-size:12px; padding:4px 10px; border-radius:999px;}
.cm-scorebig{text-align:center; color:var(--muted); font-size:14px; margin-top:16px;}
.cm-scorebig b{font-family:'Fraunces',serif; font-size:30px; color:var(--navy); margin:0 5px;}
.cm-scorebig span{font-size:12px;}
.cm-score-row{display:flex; align-items:baseline; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
.cm-score-row:last-child{border-bottom:0;}
.cm-score-name{font-weight:700; color:var(--navy); min-width:58px;}
.cm-score-detail{flex:1; font-size:13px; color:var(--muted);}
.cm-score-num{font-family:'Fraunces',serif; font-size:18px; color:var(--green); font-weight:600;}
.cm-qchips{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:14px;}
.cm-qchips-label{font-size:12px; color:#d6453f; font-weight:700; margin-right:4px;}
.cm-qchip{background:#fbe9e7; color:#d6453f; border:1px solid #f0c4bf; border-radius:999px; padding:4px 10px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit;}
.cm-qchip:hover{background:#d6453f; color:#fff; border-color:#d6453f;}

.cm-status{text-align:center; padding:60px 20px; color:var(--muted); font-size:14px;}

.cm-notice-overlay{
  position:fixed; inset:0; background:rgba(21,35,63,.88);
  z-index:100; display:flex; align-items:center; justify-content:center; padding:24px;
}
.cm-notice-box{
  background:#fff; border-radius:22px; padding:30px 28px;
  max-width:440px; width:100%; text-align:center; box-shadow:0 24px 64px rgba(21,35,63,.5);
}
.cm-notice-label{font-family:'Fraunces',serif; font-size:20px; color:var(--navy); margin-bottom:16px;}
.cm-notice-text{font-size:15px; color:var(--ink); line-height:1.75; white-space:pre-wrap; margin-bottom:22px;}
.cm-notice-box.dm{border-top:4px solid var(--clay);}

.cm-notice-preview{background:#f0f4ff; border-left:3px solid var(--navy2); border-radius:0 9px 9px 0; padding:10px 14px; font-size:13px; color:var(--navy); margin-bottom:14px; line-height:1.5;}
.cm-notice-dot{color:var(--clay); margin-right:4px;}
.cm-notice-ta{resize:vertical; min-height:80px; line-height:1.55;}

/* ===== 수업 로그 (개별진도반) ===== */
.cl-now{border-radius:14px; padding:16px; color:#fff; margin-bottom:12px;}
.cl-now .cl-who{font-size:24px; font-weight:800; letter-spacing:-.02em; line-height:1.2;}
.cl-now .cl-sub{opacity:.85; font-size:13px; margin-top:3px;}
.cl-now .cl-clk{font-size:40px; font-weight:800; letter-spacing:-.03em; margin-top:6px; font-variant-numeric:tabular-nums;}
.cl-now.idle{background:var(--cream); color:var(--ink); border:1px dashed var(--line);}

.cl-grid{display:grid; gap:10px; grid-template-columns:1fr;}
@media(min-width:560px){.cl-grid{grid-template-columns:1fr 1fr;}}
.cl-card{position:relative; border-radius:12px; border:2px solid var(--line); background:var(--paper); overflow:hidden;}
.cl-card .cl-main{display:block; width:100%; text-align:left; padding:13px 92px 13px 13px; background:none; border:none; cursor:pointer; font:inherit; color:inherit;}
.cl-card .cl-nm{font-size:19px; font-weight:800; letter-spacing:-.02em;}
.cl-card .cl-un{font-size:12px; color:var(--muted); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cl-card .cl-tm{font-size:12px; color:var(--muted); margin-top:6px; font-variant-numeric:tabular-nums;}
.cl-card .cl-qa{position:absolute; top:9px; right:9px; padding:6px 10px; border-radius:999px; border:1px solid var(--line); font-size:11px; font-weight:700; color:var(--muted); background:var(--cream); cursor:pointer;}
.cl-card .cl-pen{position:absolute; bottom:9px; right:9px; padding:5px 9px; border-radius:8px; font-size:11px; color:var(--muted); border:1px solid var(--line); background:var(--cream); cursor:pointer;}
.cl-card.on{border-color:var(--c);}
.cl-card.on .cl-nm{color:var(--c);}
.cl-bar{height:4px; background:var(--line);}
.cl-bar>i{display:block; height:100%; background:var(--c);}

.cl-other{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px;}
.cl-other button{border:1px solid var(--line); border-radius:10px; padding:11px 4px; font-size:12px; font-weight:600; color:var(--muted); background:var(--paper); cursor:pointer;}
.cl-other button.on{border-color:var(--muted); color:var(--ink); background:var(--cream);}

.cl-mic{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px 12px; border-radius:10px; background:var(--cream); border:1px solid var(--line); margin-bottom:12px;}
.cl-dot{width:9px; height:9px; border-radius:50%; background:var(--muted); flex:none;}
.cl-dot.live{background:#d6453f; animation:clpulse 1.4s infinite;}
@keyframes clpulse{0%,100%{opacity:1}50%{opacity:.25}}
.cl-heard{font-size:12px; color:var(--muted); flex:1 1 100%; min-height:17px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

.cl-sug{border-radius:12px; padding:12px 14px; margin-bottom:12px; background:#fff6ec; border:1px solid var(--clay);}
.cl-sug b{color:var(--clay);}
.cl-sug .cl-quote{font-size:12px; color:var(--muted); margin:5px 0 9px; line-height:1.5;}

.cl-meter{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:10px;}
.cl-meter div{background:var(--cream); border-radius:10px; padding:9px 10px; text-align:center;}
.cl-meter .cl-v{font-size:19px; font-weight:800; color:var(--navy); font-variant-numeric:tabular-nums;}
.cl-meter .cl-l{font-size:11px; color:var(--muted); margin-top:1px;}

.cl-tbl{width:100%; border-collapse:collapse; font-size:13px;}
.cl-tbl td{padding:6px 5px; border-bottom:1px solid var(--line); vertical-align:top;}
.cl-tbl td.n{text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums;}
.cl-tag{display:inline-block; padding:1px 6px; border-radius:999px; font-size:10px; font-weight:700; border:1px solid var(--line); color:var(--muted);}
.cl-tag.keep{color:var(--green); border-color:var(--green);}
.cl-pre{background:var(--cream); border:1px solid var(--line); border-radius:9px; padding:9px; overflow:auto; font-size:11px; font-family:ui-monospace,Consolas,monospace; white-space:pre; margin:0;}
</style>

<script type="text/plain" id="__appSource">

const { useState, useEffect, useRef } = React;
const db = window.db;

// ---- 초기 시딩용 반 데이터 (최초 1회만 Firestore에 복사됨. 이후 앱에서 관리) ----
const SEED_CLASSES = [
  { id: "s-mongeum", name: "고1S 월금반", classDays: [1, 5], roster: [
    { id: "s1", name: "김서진" }, { id: "s2", name: "임서윤" }, { id: "s3", name: "김태윤" },
    { id: "s4", name: "박성준" }, { id: "s5", name: "양성은" }, { id: "s6", name: "안성빈" },
    { id: "t1", name: "한민수", defaultPin: "2030", teacher: true },
  ]},
  { id: "s-hwamok", name: "고1S 화목반", classDays: [2, 4], roster: [
    { id: "s1", name: "박범의" }, { id: "s2", name: "민우영" }, { id: "s3", name: "윤지섭" }, { id: "s4", name: "안현준" },
    { id: "t1", name: "한민수", defaultPin: "2030", teacher: true },
  ]},
  { id: "jasago", name: "고1자사고반", classDays: [6], roster: [
    { id: "s1", name: "마서준" }, { id: "s2", name: "김하준" }, { id: "s3", name: "김중원" },
    { id: "s4", name: "진현겸" }, { id: "s5", name: "공하빈" },
    { id: "t1", name: "한민수", defaultPin: "2030", teacher: true },
  ]},
];
let CLASSES = []; // Firestore에서 로드됨
const findClass = (id) => CLASSES.find((c) => c.id === id);

const DEFAULT_BOOKS = [
  { name: "수평교 + 최고난도", total: 404 },
  { name: "기출백서", total: 302 },
  { name: "BASECAMP공수1-2", total: 455 },
];
const getBooks = (cls) => (cls && cls.books) || [];
const isIndividual = (cls) => cls && cls.type === "individual";
// ----- 수강 기간: 시작일/마지막 등원일 -----
// endDate가 지나면 자동으로 명단에서 빠짐 (기록은 그대로 남음)
function isActiveOn(st, date) {
  if (!st) return false;
  const d = date || todayStr;
  if (st.startDate && d < st.startDate) return false;
  if (st.endDate && d > st.endDate) return false;
  return true;
}
const isEnded = (st) => !!(st && st.endDate && todayStr > st.endDate);
// 기간 연장: 기준일(없거나 이미 지났으면 오늘)에서 n개월 뒤
function addMonths(baseStr, n) {
  const base = (baseStr && baseStr >= todayStr) ? baseStr : todayStr;
  const d = new Date(base + "T00:00:00");
  const day = d.getDate();
  d.setMonth(d.getMonth() + n);
  if (d.getDate() < day) d.setDate(0); // 말일 보정 (1/31 +1개월 → 2/28)
  return ymd(d);
}
// 그 날짜에 수업 대상인 학생인가 (요일 + 기간)
function attendsOn(cls, st, date) {
  if (!isActiveOn(st, date)) return false;
  if (!isIndividual(cls)) return true;
  return (st.days || []).includes(new Date(date + "T00:00:00").getDay());
}
const getStudentBooks = (cls, st) => isIndividual(cls) ? ((st && st.books) || []) : getBooks(cls);
function getClassAllBooks(cls) {
  if (!isIndividual(cls)) return getBooks(cls);
  const seen = {}; const out = [];
  (cls.roster || []).forEach((r) => {
    if (r.teacher) return;
    (r.books || []).forEach((b) => { if (!seen[b.name]) { seen[b.name] = 1; out.push(b); } });
  });
  return out;
}
const DEFAULT_PIN = "1234";
const ADMIN_PIN = "2030";

function ymd(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
const todayStr = ymd(new Date());
const WD = ["일", "월", "화", "수", "목", "금", "토"];
function fmtDate(d) {
  const dt = new Date(d + "T00:00:00");
  return d.split("-").join(".") + " (" + WD[dt.getDay()] + ")";
}
const hhmm = (ts) => new Date(ts).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });

// ===== Firestore (반별로 분리: classes/{cid}/days/{date}/...) =====
const classDoc = (cid) => db.collection("classes").doc(cid);
const daysCol = (cid) => classDoc(cid).collection("days");
const dayDoc = (cid, date) => daysCol(cid).doc(date);
const touchDay = (cid, date) => dayDoc(cid, date).set({ updated: Date.now() }, { merge: true });
const attCol = (cid, date) => dayDoc(cid, date).collection("attendance");
const qCol = (cid, date) => dayDoc(cid, date).collection("questions");
const hwCol = (cid) => classDoc(cid).collection("homework");
async function checkIn(cid, date, me) {
  await attCol(cid, date).doc(me.id).set({ name: me.name, time: Date.now() });
  touchDay(cid, date);
}
async function addQuestion(cid, date, q) { await qCol(cid, date).add(q); touchDay(cid, date); }
async function resolveQuestion(cid, date, qid) { await qCol(cid, date).doc(qid).update({ resolved: true }); }
async function getMyHw(cid, sid) {
  const d = await hwCol(cid).doc(sid).get();
  return d.exists ? (d.data().books || {}) : {};
}
// ----- 결석 예정 / 동영상 보강 (makeups 컬렉션) -----
// 문서 id = "{sid}_{date}" → 미래 날짜도 미리 기록 가능
const makeupCol = (cid) => classDoc(cid).collection("makeups");
const makeupId = (sid, date) => sid + "_" + date;
async function setMakeup(cid, sid, sname, date, patch) {
  await makeupCol(cid).doc(makeupId(sid, date)).set(
    { sid, sname, date, ...patch, updated: Date.now() }, { merge: true });
}
async function clearMakeup(cid, sid, date) {
  await makeupCol(cid).doc(makeupId(sid, date)).delete();
}
function listenMakeups(cid, cb) {
  return makeupCol(cid).onSnapshot((s) => {
    const m = {};
    s.forEach((d) => { const v = d.data(); m[v.sid + "_" + v.date] = v; });
    cb(m);
  }, () => cb({}));
}

async function markAttendance(cid, date, student, on) {
  if (on) await attCol(cid, date).doc(student.id).set({ name: student.name, time: Date.now(), byTeacher: true });
  else await attCol(cid, date).doc(student.id).delete();
  touchDay(cid, date);
}
async function saveHwBookFor(cid, sid, sname, bookName, arr) {
  await hwCol(cid).doc(sid).set({ name: sname, books: { [bookName]: arr } }, { merge: true });
}
async function saveHwBook(cid, me, bookName, arr) {
  await hwCol(cid).doc(me.id).set({ name: me.name, books: { [bookName]: arr } }, { merge: true });
  touchDay(cid, todayStr);
}
const FV = firebase.firestore.FieldValue;
const questionedCol = (cid) => classDoc(cid).collection("questioned");
async function addQuestioned(cid, sid, name, bookName, n) {
  await questionedCol(cid).doc(sid).set({ name, books: { [bookName]: FV.arrayUnion(n) } }, { merge: true });
}
async function removeQuestioned(cid, sid, bookName, n) {
  await questionedCol(cid).doc(sid).set({ books: { [bookName]: FV.arrayRemove(n) } }, { merge: true });
}
function listenQuestioned(cid, sid, cb) {
  return questionedCol(cid).doc(sid).onSnapshot((d) => cb(d.exists ? (d.data().books || {}) : {}));
}
const noticeDoc = (cid) => classDoc(cid).collection("config").doc("notice");
async function postNotice(cid, text) {
  await noticeDoc(cid).set({ text, time: Date.now(), active: true });
}
async function clearNotice(cid) {
  await noticeDoc(cid).set({ active: false, text: "" }, { merge: true });
}
function listenNotice(cid, cb) {
  return noticeDoc(cid).onSnapshot((d) => cb(d.exists ? d.data() : null));
}
const dmCol = (cid) => classDoc(cid).collection("dms");
const dmDoc = (cid, sid) => dmCol(cid).doc(sid);
async function postDm(cid, sid, text) {
  await dmDoc(cid, sid).set({ text, time: Date.now(), active: true });
}
async function clearDm(cid, sid) {
  await dmDoc(cid, sid).set({ active: false, text: "" }, { merge: true });
}
function listenDm(cid, sid, cb) {
  return dmDoc(cid, sid).onSnapshot((d) => cb(d.exists ? d.data() : null));
}
const scoresCol = (cid, date) => dayDoc(cid, date).collection("scores");
async function addScore(cid, date, s) { await scoresCol(cid, date).add(s); touchDay(cid, date); }
async function listDays(cid) {
  const s = await daysCol(cid).get();
  const arr = [];
  s.forEach((d) => arr.push(d.id));
  if (!arr.includes(todayStr)) arr.push(todayStr);
  return arr.sort().reverse();
}
// ----- 수업 로그 (개별진도반: 누구와 몇 분을 했는지) -----
// classes/{cid}/lessonLogs/{date}
//   { date, startedAt, endedAt, shift, teacher, segments:[{sid,name,kind,unit,start,end}], transcript:[{t,text}] }
const lessonLogCol = (cid) => classDoc(cid).collection("lessonLogs");
async function saveLessonLog(cid, date, data) {
  await lessonLogCol(cid).doc(date).set({ ...data, date, time: Date.now() }, { merge: true });
}
async function getLessonLog(cid, date) {
  const d = await lessonLogCol(cid).doc(date).get();
  return d.exists ? d.data() : null;
}
async function listLessonLogs(cid) {
  const s = await lessonLogCol(cid).orderBy("date", "desc").limit(60).get();
  return s.docs.map((d) => d.data());
}
async function removeLessonLog(cid, date) { await lessonLogCol(cid).doc(date).delete(); }

const studentsCol = (cid) => classDoc(cid).collection("students");
async function getStudentPin(cid, sid) {
  try { const d = await studentsCol(cid).doc(sid).get(); return d.exists ? (d.data().pin || null) : null; }
  catch (e) { return null; }
}
async function saveStudentPin(cid, sid, p) { await studentsCol(cid).doc(sid).set({ pin: p }, { merge: true }); }

// ----- 사람(이름) 단위 통합 PIN: 이름이 같으면 같은 사람, 모든 반에 하나의 PIN -----
const normName = (s) => (s || "").replace(/\s+/g, "");
const personPinDoc = (name) => db.collection("userPins").doc(normName(name));
async function getPersonPin(name) {
  try { const d = await personPinDoc(name).get(); return d.exists ? d.data().pin : null; }
  catch (e) { return null; }
}
async function savePersonPin(name, pin) { await personPinDoc(name).set({ pin, time: Date.now() }); }

// 이름으로 로그인 검증: 통합 PIN → (없으면) 반별 개별 PIN → 기본 PIN 순서로 확인.
// 반별 개별 PIN으로 성공하면 통합 PIN으로 자동 이전(마이그레이션).
async function verifyPersonPin(name, pin, candidates) {
  const gpin = await getPersonPin(name);
  if (gpin) return pin === gpin;
  // 반별 커스텀 PIN 확인 (있는 것만)
  for (const x of candidates) {
    let custom = null;
    try { custom = await getStudentPin(x.cls.id, x.member.id); } catch (e) {}
    if (custom && pin === custom) {
      try { await savePersonPin(name, pin); } catch (e) {} // 통합 PIN으로 이전
      return true;
    }
  }
  // 기본 PIN (초기비번은 통합 저장 안 함 - 나중에 바꾼 비번이 기준이 되도록)
  for (const x of candidates) {
    const def = x.member.defaultPin || DEFAULT_PIN;
    if (pin === def) return true;
  }
  return false;
}

// ----- 선생님 계정 -----
const teachersCol = () => db.collection("teachers");
async function listTeachers() {
  const s = await teachersCol().orderBy("time").get();
  const arr = []; s.forEach((d) => arr.push({ tid: d.id, ...d.data() }));
  return arr;
}
async function addTeacher(name, pin, classIds, role, status) {
  await teachersCol().add({ name, pin, classIds, role: role || "teacher", status: status || "active", time: Date.now() });
}
const isPending = (t) => t.status === "pending";
async function updateTeacher(tid, patch) { await teachersCol().doc(tid).update(patch); }
async function deleteTeacher(tid) { await teachersCol().doc(tid).delete(); }

// ----- 반 관리 -----
const classesCol = () => db.collection("classes");
async function loadClasses() {
  let s = await classesCol().orderBy("time").get();
  if (s.empty) {
    let t = Date.now();
    for (const c of SEED_CLASSES) {
      await classesCol().doc(c.id).set({ name: c.name, classDays: c.classDays, roster: c.roster, books: DEFAULT_BOOKS, time: t++ });
    }
    s = await classesCol().orderBy("time").get();
  }
  const arr = []; s.forEach((d) => arr.push({ id: d.id, ...d.data() }));
  // 표시 순서: order 필드 우선 (없으면 생성순)
  arr.sort((a, b) => {
    const ao = a.order, bo = b.order;
    if (ao != null && bo != null) return ao - bo;
    if (ao != null) return -1;
    if (bo != null) return 1;
    return (a.time || 0) - (b.time || 0);
  });
  // 마이그레이션: books 필드가 없는 기존 반에 채워넣기
  for (const c of arr) {
    if (c.books === undefined) {
      const isSeed = SEED_CLASSES.some((sc) => sc.id === c.id);
      c.books = isSeed ? DEFAULT_BOOKS : [];
      await classesCol().doc(c.id).update({ books: c.books });
    }
  }
  CLASSES = arr;
  return arr;
}
async function createClass(name, classDays, roster, books, type) {
  const ref = await classesCol().add({ name, classDays, roster, books: books || [], type: type || "regular", time: Date.now() });
  await loadClasses();
  return ref.id;
}
async function saveClassRoster(cid, roster) {
  await classesCol().doc(cid).update({ roster });
  await loadClasses();
}
// ----- 진도계획표 (파일 게시: HTML/PDF/이미지를 base64 조각으로 Firestore에 저장) -----
const progressDoc = (cid, key) => classDoc(cid).collection("progress").doc(key || "class");
const PROGRESS_MAX_BYTES = 4.5 * 1024 * 1024;
const PROGRESS_CHUNK = 700000;
function guessMime(name) {
  const ext = (name.split(".").pop() || "").toLowerCase();
  if (ext === "html" || ext === "htm") return "text/html";
  if (ext === "pdf") return "application/pdf";
  if (["png", "jpg", "jpeg", "gif", "webp"].includes(ext)) return "image/" + (ext === "jpg" ? "jpeg" : ext);
  return "application/octet-stream";
}
// 범용: 파일을 base64 조각으로 문서+parts에 저장
async function saveFileToDoc(docRef, file) {
  if (file.size > PROGRESS_MAX_BYTES) throw new Error("파일이 너무 커요 (최대 4.5MB)");
  const b64 = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(",")[1]);
    r.onerror = () => rej(new Error("파일을 읽지 못했어요"));
    r.readAsDataURL(file);
  });
  const oldParts = await docRef.collection("parts").get();
  for (const d of oldParts.docs) await d.ref.delete();
  const chunks = [];
  for (let i = 0; i < b64.length; i += PROGRESS_CHUNK) chunks.push(b64.slice(i, i + PROGRESS_CHUNK));
  for (let i = 0; i < chunks.length; i++) await docRef.collection("parts").doc(String(i)).set({ data: chunks[i] });
  await docRef.set({ name: file.name, mime: file.type || guessMime(file.name), size: file.size, chunks: chunks.length, time: Date.now() });
}
async function loadFileB64FromDoc(docRef, meta) {
  const out = [];
  for (let i = 0; i < meta.chunks; i++) {
    const d = await docRef.collection("parts").doc(String(i)).get();
    out.push(d.exists ? d.data().data : "");
  }
  return out.join("");
}
async function deleteFileDoc(docRef) {
  const oldParts = await docRef.collection("parts").get();
  for (const d of oldParts.docs) await d.ref.delete();
  await docRef.delete();
}
const saveProgressFile = (cid, key, file) => saveFileToDoc(progressDoc(cid, key), file);
const loadProgressFileB64 = (cid, key, meta) => loadFileB64FromDoc(progressDoc(cid, key), meta);
const deleteProgressFile = (cid, key) => deleteFileDoc(progressDoc(cid, key));

function b64ToBlob(b64, mime) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

// 이전 달 스냅샷 (진도 증가분 계산용)
function prevYM(ym) {
  const [y, m] = ym.split("-").map(Number);
  const d = new Date(y, m - 2, 1);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
}

// 한 학생의 월간 보고서 데이터 집계
async function buildReportData(cls, st, ym) {
  // 1) 출석: 해당 월 수업일
  const allDays = await listDays(cls.id);
  const monthDays = allDays.filter((d) => d.startsWith(ym)).sort();
  const myDays = monthDays.filter((d) => attendsOn(cls, st, d));
  let present = 0;
  const absentDates = [];
  for (const d of myDays) {
    const doc = await attCol(cls.id, d).doc(st.id).get();
    if (doc.exists) present++; else absentDates.push(d);
  }
  // 보강 정보
  const mkSnap = await makeupCol(cls.id).get();
  const mk = {};
  mkSnap.forEach((d) => { const v = d.data(); if (v.sid === st.id && (v.date || "").startsWith(ym)) mk[v.date] = v; });
  const videoDone = absentDates.filter((d) => mk[d] && mk[d].videoDone).length;
  const planned = absentDates.filter((d) => mk[d] && mk[d].planned).length;

  // 2) 과제 진도 (현재 누적 + 지난달 스냅샷 대비 증가분)
  const hwDoc = await hwCol(cls.id).doc(st.id).get();
  const hwNow = hwDoc.exists ? (hwDoc.data().books || {}) : {};
  const prev = await getReport(cls.id, st.id, prevYM(ym));
  const prevSnap = (prev && prev.hwSnapshot) || null;
  const books = getStudentBooks(cls, st).map((b) => {
    const done = (hwNow[b.name] || []).length;
    const before = prevSnap && prevSnap[b.name] != null ? prevSnap[b.name] : null;
    return { name: b.name, total: b.total, done, gained: before != null ? done - before : null,
             pct: b.total > 0 ? Math.round(done / b.total * 100) : 0 };
  });
  const hwSnapshot = {};
  books.forEach((b) => { hwSnapshot[b.name] = b.done; });

  // 3) 상담 (해당 월)
  const cs = await consultCol().where("cid", "==", cls.id).get();
  const consults = [];
  cs.forEach((d) => {
    const v = d.data();
    if (v.sid === st.id && (v.date || "").startsWith(ym)) consults.push(v);
  });
  consults.sort((a, b) => (a.date || "").localeCompare(b.date || ""));

  // 4) 수업별 코멘트
  const notes = await getMonthNotes(cls.id, st.id, ym);

  return {
    notes, sessionDates: myDays,
    sessions: myDays.length, present, absent: myDays.length - present,
    videoDone, planned, rate: myDays.length > 0 ? Math.round(present / myDays.length * 100) : null,
    books, hwSnapshot, consults, hasPrev: !!prevSnap,
  };
}

// 날짜(YYYY-MM-DD) → 오늘까지 경과일
function daysSince(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr + "T00:00:00");
  if (isNaN(d)) return null;
  const t = new Date(todayStr + "T00:00:00");
  return Math.round((t - d) / 86400000);
}

// 전 반 상담을 훑어 ① 표시된 위험신호 ② 상담 공백(오래됨) 집계
async function computeRiskData() {
  const s = await consultCol().get();
  const all = [];
  s.forEach((d) => all.push({ id: d.id, ...d.data() }));

  const byStudent = {};
  all.forEach((c) => {
    const key = c.cid + ":" + c.sid;
    (byStudent[key] = byStudent[key] || []).push(c);
  });

  const flagged = [];
  const gaps = [];

  CLASSES.forEach((cls) => {
    (cls.roster || []).filter((r) => !r.teacher && !isEnded(r)).forEach((st) => {
      const key = cls.id + ":" + st.id;
      const arr = (byStudent[key] || []).sort(
        (a, b) => (b.date || "").localeCompare(a.date || "") || (b.time || 0) - (a.time || 0)
      );
      const pendingFollow = arr.filter((c) => c.needFollow && !c.followDone);

      // ① 위험 표시: 가장 최근 상담 기준 (최근 상담이 "없음"이면 해제된 것)
      const latest = arr[0];
      if (latest && (latest.risk || 0) > 0) {
        flagged.push({
          cid: cls.id, cname: cls.name, sid: st.id, sname: st.name,
          risk: latest.risk, cat: latest.cat, withWho: latest.withWho,
          date: latest.date, content: latest.content, teacher: latest.teacher,
          ageDays: daysSince(latest.date),
          pendingFollow: pendingFollow.length,
          pendingNotes: pendingFollow.map((c) => c.followNote || c.content).slice(0, 3),
          total: arr.length,
        });
      }

      // ② 상담 공백: 마지막 상담일로부터 경과일 (기록 없으면 null)
      gaps.push({
        cid: cls.id, cname: cls.name, sid: st.id, sname: st.name,
        lastDate: latest ? latest.date : null,
        gapDays: latest ? daysSince(latest.date) : null,
        total: arr.length,
        hasRisk: latest ? (latest.risk || 0) > 0 : false,
      });
    });
  });

  flagged.sort((a, b) => b.risk - a.risk || (b.date || "").localeCompare(a.date || ""));
  // 기록 없는 학생 먼저, 그다음 오래된 순
  gaps.sort((a, b) => {
    if (a.gapDays === null && b.gapDays === null) return 0;
    if (a.gapDays === null) return -1;
    if (b.gapDays === null) return 1;
    return b.gapDays - a.gapDays;
  });
  return { flagged, gaps };
}

  if (!m || !m.partnerId || !(m.days || []).includes(new Date(date + "T00:00:00").getDay())) return cls.id;
  return [cls.id, m.partnerId].sort()[0];
}

function HwGrid({ total, set, qset, bookName, onCellDown, onCellClick }) {
  const interactive = !!onCellClick;
  const cells = [];
  for (let n = 1; n <= total; n++) {
    const isDone = set.has(n);
    const cls = "cm-cell" + (isDone ? " done" : "") + (interactive ? " clickable" : "") + (qset && qset.has(n) ? " q" : "");
    cells.push(
      interactive ? (
        <button key={n} className={cls} data-n={n} data-book={bookName}
          onPointerDown={(e) => onCellDown(n, e)} onClick={() => onCellClick(n)}>{n}</button>
      ) : (<span key={n} className={cls}>{n}</span>)
    );
  }
  return <div className="cm-grid">{cells}</div>;
}

function BookHwCard({ book, initial, qNumbers, onClearQuestion, onChange }) {
  const setRef = useRef(new Set(initial));
  const [, setTick] = useState(0);
  const rerender = () => setTick((t) => t + 1);
  const paintVal = useRef(null);
  const suppressClick = useRef(false);
  const [painting, setPainting] = useState(false);
  const [from, setFrom] = useState("");
  const [to, setTo] = useState("");
  const set = setRef.current;
  const qset = new Set(qNumbers || []);
  const commit = () => onChange(Array.from(setRef.current).sort((a, b) => a - b));

  function applyPaint(n) { if (paintVal.current) setRef.current.add(n); else setRef.current.delete(n); rerender(); }
  function toggleSingle(n) { if (setRef.current.has(n)) setRef.current.delete(n); else setRef.current.add(n); rerender(); commit(); }
  function startMousePaint(n) {
    paintVal.current = !setRef.current.has(n);
    applyPaint(n);
    const move = (ev) => {
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      if (el && el.getAttribute && el.getAttribute("data-book") === book.name) { const dn = el.getAttribute("data-n"); if (dn) applyPaint(parseInt(dn, 10)); }
    };
    const up = () => {
      window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up);
      paintVal.current = null; suppressClick.current = true;
      setTimeout(() => { suppressClick.current = false; }, 50); commit();
    };
    window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
  }
  function startTouchLongPress(n, x, y) {
    const longTimer = setTimeout(() => {
      window.removeEventListener("pointermove", cancelMove); window.removeEventListener("pointerup", earlyUp); enterTouchPaint(n);
    }, 420);
    const cancelMove = (ev) => {
      if (Math.abs(ev.clientX - x) > 8 || Math.abs(ev.clientY - y) > 8) {
        clearTimeout(longTimer); window.removeEventListener("pointermove", cancelMove); window.removeEventListener("pointerup", earlyUp);
      }
    };
    const earlyUp = () => { clearTimeout(longTimer); window.removeEventListener("pointermove", cancelMove); };
    window.addEventListener("pointermove", cancelMove); window.addEventListener("pointerup", earlyUp, { once: true });
  }
  function enterTouchPaint(n) {
    setPainting(true); paintVal.current = !setRef.current.has(n); applyPaint(n); suppressClick.current = true;
    if (navigator.vibrate) navigator.vibrate(15);
    const touchMove = (ev) => {
      ev.preventDefault(); const t = ev.touches[0]; if (!t) return;
      const el = document.elementFromPoint(t.clientX, t.clientY);
      if (el && el.getAttribute && el.getAttribute("data-book") === book.name) { const dn = el.getAttribute("data-n"); if (dn) applyPaint(parseInt(dn, 10)); }
    };
    const end = () => {
      window.removeEventListener("touchmove", touchMove); window.removeEventListener("touchend", end);
      paintVal.current = null; setPainting(false); commit(); setTimeout(() => { suppressClick.current = false; }, 80);
    };
    window.addEventListener("touchmove", touchMove, { passive: false }); window.addEventListener("touchend", end, { once: true });
  }
  function onCellDown(n, e) {
    if (e.pointerType === "touch") { startTouchLongPress(n, e.clientX, e.clientY); }
    else { e.preventDefault(); startMousePaint(n); }
  }
  function onCellClick(n) { if (suppressClick.current) { suppressClick.current = false; return; } toggleSingle(n); }
  function addRange() {
    const a = parseInt(from, 10), z = parseInt(to, 10);
    if (isNaN(a) || isNaN(z)) return;
    for (let n = Math.min(a, z); n <= Math.max(a, z); n++) setRef.current.add(n);
    setFrom(""); setTo(""); rerender(); commit();
  }

  return (
    <div className="cm-card">
      <div className="cm-book-head">
        <h3 className="cm-h3" style={{ margin: 0 }}>{book.name}{painting && <span className="cm-paintbadge">● 칠하기 모드</span>}</h3>
        <span className="cm-book-count">{set.size} / {book.total}<span className="cm-book-pct"> ({book.total > 0 ? Math.round(set.size / book.total * 100) : 0}%)</span></span>
      </div>
      <div className="cm-rangebar">
        <input className="cm-input" placeholder="시작" inputMode="numeric" value={from} onChange={(e) => setFrom(e.target.value.replace(/\D/g, ""))} />
        <span className="cm-tilde">~</span>
        <input className="cm-input" placeholder="끝" inputMode="numeric" value={to} onChange={(e) => setTo(e.target.value.replace(/\D/g, ""))} />
        <button className="cm-btn cm-btn-ghost cm-rangebtn" onClick={addRange}>한번에 완료</button>
      </div>
      {qNumbers && qNumbers.length > 0 && onClearQuestion && (
        <div className="cm-qchips">
          <span className="cm-qchips-label">질문한 번호</span>
          {qNumbers.slice().sort((a, b) => a - b).map((n) => (
            <button key={n} className="cm-qchip" onClick={() => onClearQuestion(n)}>{n} ✕</button>
          ))}
        </div>
      )}
      <HwGrid total={book.total} set={set} qset={qset} bookName={book.name} onCellDown={onCellDown} onCellClick={onCellClick} />
    </div>
  );
}

const SideCtx = React.createContext({ open: false, setOpen: () => {}, setHasSide: () => {} });

function Sidebar({ items, active, onSelect, title }) {
  const { open, setOpen, setHasSide } = React.useContext(SideCtx);
  // 화면 전환 시 새 Sidebar 마운트 → 옛 Sidebar 정리 순서라, 카운터로 관리
  useEffect(() => { setHasSide((n) => n + 1); return () => setHasSide((n) => n - 1); }, []);
  function pick(key) { onSelect(key); setOpen(false); }
  return (<>
    <div className={"cm-backdrop" + (open ? " show" : "")} onClick={() => setOpen(false)} />
    <nav className={"cm-side" + (open ? " open" : "")}>
      <button className="cm-side-close" onClick={() => setOpen(false)}>✕ 닫기</button>
      {title && <div className="cm-side-title">{title}</div>}
      {items.map((it, i) => it.sep
        ? <div key={"s" + i} className="cm-side-sep" />
        : it.group
        ? <div key={"g" + i} className="cm-side-title" style={{paddingTop: 4}}>{it.group}</div>
        : (
          <button key={it.key} disabled={it.disabled}
            className={"cm-side-btn" + (active === it.key ? " on" : "")}
            onClick={() => !it.disabled && pick(it.key)}>
            <span className="cm-side-ico">{it.ico}</span>
            <span style={{flex: 1}}>{it.label}</span>
            {it.badge > 0 && <span className="cm-chip" style={{background: "#f6e7df", color: "#c2703f", fontSize: 11}}>{it.badge}</span>}
          </button>
        ))}
    </nav>
  </>);
}

  const [busy, setBusy] = useState(false);
  const norm = (s) => (s || "").replace(/\s+/g, "");
  useEffect(() => { onClsChange && onClsChange(cls); }, [cls]);

  async function login() {
    if (busy) return;
    const nm = norm(name);
    if (!nm) { setErr("이름을 입력해주세요"); return; }
    if (pin.length !== 4) { setErr("PIN 4자리를 입력해주세요"); return; }
    setBusy(true); setErr("");
    // 이름이 있는 모든 반 = 같은 사람의 반들
    const candidates = CLASSES
      .map((c) => ({ cls: c, member: (c.roster || []).find((r) => norm(r.name) === nm) }))
      .filter((x) => x.member);
    if (candidates.length === 0) {
      setBusy(false);
      setErr("명단에 없는 이름이에요. 띄어쓰기 없이 정확히 입력했는지 확인해주세요.");
      return;
    }
    const okPin = await verifyPersonPin(nm, pin, candidates);
    setBusy(false);
    if (!okPin) { setErr("PIN이 올바르지 않아요."); return; }
    setMatches(candidates);
    if (candidates.length === 1) setCls(candidates[0].cls);
  }
  function fullLogout() { setMatches(null); setCls(null); setPin(""); setErr(""); }
  const gatePickRef = useSwipeBack(fullLogout);

  // ---- 로그인 전 ----
  if (!matches) {
    return (
      <div className="cm-card">
        <h2 className="cm-h2">로그인</h2>
        <label className="cm-label">이름</label>
        <input className="cm-input" placeholder="본인 이름을 입력" value={name}
          onChange={(e) => setName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && login()} />
        <label className="cm-label">PIN</label>
        <input className="cm-input" type="password" inputMode="numeric" maxLength={4} placeholder="4자리"
          value={pin} onChange={(e) => setPin(e.target.value.replace(/\D/g, ""))} onKeyDown={(e) => e.key === "Enter" && login()} />
        {err && <div className="cm-err">{err}</div>}
        <button className="cm-btn cm-btn-primary" disabled={busy} onClick={login}>{busy ? "확인 중..." : "입장"}</button>
      </div>
    );
  }

  // ---- 내 반 선택 (여러 반에 속한 경우만) ----
  if (!cls) {
    return (
      <div ref={gatePickRef} className="cm-stack cm-slide-in" style={{willChange: "transform"}}><div className="cm-card">
        <div className="cm-admin-top" style={{marginBottom: 12}}>
          <h3 className="cm-h3" style={{margin: 0}}>{matches[0].member.name}님의 수업</h3>
          <button className="cm-link" onClick={fullLogout}>로그아웃</button>
        </div>
        <div className="cm-daylist">
          {matches.map((m) => (
            <button key={m.cls.id} className="cm-day" onClick={() => setCls(m.cls)}>
              <div className="cm-day-left"><span className="cm-day-date">{m.cls.name}</span>
                {m.member.teacher && <span className="cm-day-sub">선생님</span>}</div>
              <span className="cm-day-arrow">›</span>
            </button>
          ))}
        </div>
      </div></div>
    );
  }

  const me = matches.find((m) => m.cls.id === cls.id).member;
  return <StudentHome cls={cls} me={me}
    onLogout={matches.length > 1 ? () => setCls(null) : fullLogout} />;
}

function MathText({ text }) {
  // $...$, $$...$$, \\(...\\), \\[...\\] 안의 LaTeX를 KaTeX로 렌더
  const html = React.useMemo(() => {
    if (!text) return "";
    const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    if (typeof katex === "undefined") return esc(text);
    // 토큰 분리: 디스플레이($$, \[\]) 와 인라인($, \(\))
    const re = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\$([^\$\n]+?)\$|\\\(([\s\S]+?)\\\)/g;
    let out = ""; let last = 0; let m;
    while ((m = re.exec(text)) !== null) {
      out += esc(text.slice(last, m.index));
      const display = m[1] !== undefined || m[2] !== undefined;
      const expr = m[1] || m[2] || m[3] || m[4] || "";
      try {
        out += katex.renderToString(expr, { displayMode: display, throwOnError: false });
      } catch (e) {
        out += esc(m[0]);
      }
      last = m.index + m[0].length;
    }
    out += esc(text.slice(last));
    return out;
  }, [text]);
  return <span dangerouslySetInnerHTML={{ __html: html }} />;
}

function ConsultForm({ cls, meName, editing, onDone, onCancel }) {
  const students = cls.roster.filter((r) => !r.teacher);
  const [sid, setSid] = useState(editing ? editing.sid : (students[0] ? students[0].id : ""));
  const [withWho, setWithWho] = useState(editing ? editing.withWho : "student");
  const [cat, setCat] = useState(editing ? editing.cat : "learning");
  const [date, setDate] = useState(editing ? editing.date : todayStr);
  const [content, setContent] = useState(editing ? editing.content : "");
  const [needFollow, setNeedFollow] = useState(editing ? !!editing.needFollow : false);
  const [followNote, setFollowNote] = useState(editing ? (editing.followNote || "") : "");
  const [risk, setRisk] = useState(editing ? (editing.risk || 0) : 0);
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);

  async function submit() {
    if (busy) return;
    if (!sid) { setMsg("학생을 선택해주세요"); return; }
    if (!content.trim()) { setMsg("상담 내용을 입력해주세요"); return; }
    const st = students.find((s) => s.id === sid);
    setBusy(true); setMsg("");
    try {
      const rec = {
        cid: cls.id, cname: cls.name, sid, sname: st ? st.name : "",
        withWho, cat, date, content: content.trim(), risk,
        needFollow, followNote: needFollow ? followNote.trim() : "",
        teacher: meName || "",
      };
      if (editing) {
        await updateConsult(editing.id, { ...rec, followDone: needFollow ? !!editing.followDone : false });
      } else {
        await addConsult({ ...rec, followDone: false });
      }
      onDone();
    } catch (e) { setMsg("저장 실패: " + e.message); setBusy(false); }
  }

  return (
    <div style={{borderTop: "1px solid var(--line)", paddingTop: 14, marginTop: 6}}>
      <h4 className="cm-h3" style={{fontSize: 15, margin: "0 0 10px"}}>{editing ? "상담 기록 수정" : "새 상담 기록"}</h4>
      <label className="cm-label">학생</label>
      <select className="cm-input" value={sid} onChange={(e) => setSid(e.target.value)}>
        {students.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
      </select>
      <label className="cm-label">상담 대상</label>
      <div style={{display: "flex", gap: 6, marginBottom: 4}}>
        {CONSULT_WITH.map((w) => (
          <button key={w.key} className={"cm-ab-tab" + (withWho === w.key ? " on" : "")} onClick={() => setWithWho(w.key)}>{w.label}</button>
        ))}
      </div>
      <label className="cm-label">분류</label>
      <div style={{display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 4}}>
        {CONSULT_CATS.map((c) => (
          <button key={c.key} className={"cm-ab-tab" + (cat === c.key ? " on" : "")} onClick={() => setCat(c.key)}>{c.label}</button>
        ))}
      </div>
      <label className="cm-label">상담 날짜</label>
      <input className="cm-input" type="date" value={date} onChange={(e) => setDate(e.target.value)} />
      <label className="cm-label">상담 내용</label>
      <textarea className="cm-input cm-notice-ta" rows={5} placeholder="상담 내용을 입력하세요"
        value={content} onChange={(e) => setContent(e.target.value)} />
      <label className="cm-label">위험 신호</label>
      <div style={{display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 4}}>
        {RISK_LEVELS.map((r) => (
          <button key={r.v} className={"cm-ab-tab" + (risk === r.v ? " on" : "")} onClick={() => setRisk(r.v)}>{r.label}</button>
        ))}
      </div>
      <div className="cm-hint" style={{marginBottom: 4}}>표시하면 <b>위험신호 대시보드</b>에 올라와요. 나아지면 다음 상담에서 "없음"으로 기록하면 내려가요.</div>
      <div style={{display: "flex", alignItems: "center", gap: 8, margin: "10px 0 4px", cursor: "pointer"}} onClick={() => setNeedFollow(!needFollow)}>
        <span style={{width: 20, height: 20, borderRadius: 6, border: "1px solid var(--line)", background: needFollow ? "var(--clay)" : "#fff", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, flex: "none"}}>{needFollow ? "✓" : ""}</span>
        <span style={{fontSize: 14, fontWeight: 600}}>후속 조치가 필요해요</span>
      </div>

        <textarea className="cm-input cm-notice-ta" rows={2} placeholder="어떤 조치가 필요한가요? (예: 다음 주 학부모 재통화, 보충 수업 배정)"
          value={followNote} onChange={(e) => setFollowNote(e.target.value)} />
      )}
      {msg && <div className="cm-err">{msg}</div>}
      <div style={{display: "flex", gap: 10}}>
        <button className="cm-btn cm-btn-primary" style={{margin: 0}} disabled={busy} onClick={submit}>{busy ? "저장 중..." : "저장"}</button>
        <button className="cm-btn cm-btn-ghost" style={{margin: 0}} onClick={onCancel}>취소</button>
      </div>
    </div>
  );
}

function fmtLogTime(t) {
  const d = new Date(t);
  const today = new Date();
  const sameDay = d.toDateString() === today.toDateString();
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  if (sameDay) return hh + ":" + mm;
  return (d.getMonth() + 1) + "/" + d.getDate() + " " + hh + ":" + mm;
}

  const fileRef = React.useRef(null);
  const scrollRef = React.useRef(null);
  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages, busy]);

  async function pickImg(e) {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    if (f.size > 4 * 1024 * 1024) { alert("이미지가 너무 커요 (최대 4MB)"); return; }
    const b64 = await new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result.split(",")[1]); r.readAsDataURL(f); });
    setImg({ data: b64, mime: f.type || "image/jpeg", preview: "data:" + (f.type || "image/jpeg") + ";base64," + b64 });
  }

  async function send() {
    if (busy || (!input.trim() && !img)) return;
    const myMsg = { role: "user", text: input.trim(), img };
    const next = [...messages, myMsg];
    setMessages(next); setInput(""); setImg(null); setBusy(true);
    try {
      const apiMsgs = next.map((m) => {
        if (m.img) {
          const parts = [{ type: "image", source: { type: "base64", media_type: m.img.mime, data: m.img.data } }];
          parts.push({ type: "text", text: m.text || "이 문제 푸는 거 도와줘" });
          return { role: m.role, content: parts };
        }
        return { role: m.role, content: m.text };
      });
      const res = await fetch("/api/hint", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages: apiMsgs }) });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || "오류");
      setMessages([...next, { role: "assistant", text: data.text }]);
      if (!me.teacher) {
        addAiLog(cls.id, { sid: me.id, name: me.name, q: myMsg.text || "", a: data.text || "", img: !!myMsg.img, time: Date.now() }).catch(() => {});
      }
    } catch (e) {
      setMessages([...next, { role: "assistant", text: "⚠ " + e.message }]);
    }
    setBusy(false);
  }

  return (
    <div className="cm-card">
      <h3 className="cm-h3">AI 힌트 <span className="cm-h-hint">(답은 안 알려주고 힌트만 줘요)</span></h3>
      {!me.teacher && <div className="cm-hint" style={{marginBottom: 8}}>질문 내역은 선생님이 볼 수 있어요.</div>}
      <div ref={scrollRef} className="cm-ai-scroll">
        {messages.length === 0 && <div className="cm-empty">막히는 문제를 물어보거나, 문제 사진을 올려보세요.<br/>답을 바로 알려주진 않고 힌트로 도와줄게요.</div>}
        {messages.map((m, i) => (
          <div key={i} className={"cm-ai-msg " + (m.role === "user" ? "me" : "ai")}>
            {m.img && <img src={m.img.preview} className="cm-ai-img" />}
            {m.text && <div className="cm-ai-bubble">{m.role === "assistant" ? <MathText text={m.text} /> : m.text}</div>}
          </div>
        ))}
        {busy && <div className="cm-ai-msg ai"><div className="cm-ai-bubble cm-ai-typing">생각 중…</div></div>}
      </div>
      {img && <div className="cm-ai-preview"><img src={img.preview} /><button className="cm-link" onClick={() => setImg(null)}>✕ 사진 빼기</button></div>}
      <div className="cm-ai-input">
        <input ref={fileRef} type="file" accept="image/*" style={{display: "none"}} onChange={pickImg} />
        <button className="cm-ai-imgbtn" disabled={busy} onClick={() => fileRef.current.click()}>📷</button>
        <input className="cm-input" style={{margin: 0}} placeholder="질문을 입력하세요" value={input}
          onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()} />
        <button className="cm-ai-send" disabled={busy} onClick={send}>전송</button>
      </div>
    </div>
  );
}

function StudentHome({ cls, me, onLogout }) {
  const [tab, setTab] = useState(me.teacher ? "q" : "att");
  const [att, setAtt] = useState(null);
  const [showPin, setShowPin] = useState(false);
  const [notice, setNotice] = useState(null);
  const [noticeDismissed, setNoticeDismissed] = useState(false);
  const [dmNotice, setDmNotice] = useState(null);
  const [dmDismissed, setDmDismissed] = useState(false);

  useEffect(() => {
    if (me.teacher) return;
    const unsub = attCol(cls.id, todayStr).doc(me.id).onSnapshot((d) => setAtt(d.exists ? d.data() : null));
    return () => unsub();
  }, [cls.id, me.id]);

  useEffect(() => {
    const unsub = listenNotice(cls.id, (n) => setNotice(n));
    return () => unsub();
  }, [cls.id]);

  useEffect(() => {
    const unsub = listenDm(cls.id, me.id, (n) => setDmNotice(n));
    return () => unsub();
  }, [cls.id, me.id]);

  useEffect(() => {
    if (!notice || !notice.active || !notice.time) { setNoticeDismissed(false); return; }
    try { setNoticeDismissed(!!localStorage.getItem("climath_n_" + cls.id + "_" + notice.time)); } catch (e) {}
  }, [notice, cls.id]);

  useEffect(() => {
    if (!dmNotice || !dmNotice.active || !dmNotice.time) { setDmDismissed(false); return; }
    try { setDmDismissed(!!localStorage.getItem("climath_dm_" + cls.id + "_" + me.id + "_" + dmNotice.time)); } catch (e) {}
  }, [dmNotice, cls.id, me.id]);

  function dismissNotice() {
    if (!notice) return;
    try { localStorage.setItem("climath_n_" + cls.id + "_" + notice.time, "1"); } catch (e) {}
    setNoticeDismissed(true);
  }
  function dismissDm() {
    if (!dmNotice) return;
    try { localStorage.setItem("climath_dm_" + cls.id + "_" + me.id + "_" + dmNotice.time, "1"); } catch (e) {}
    setDmDismissed(true);
  }

  const noGateTabs = ["prog", "notes", "ai"]; // 출석 없이도 볼 수 있는 탭
  const activeTab = me.teacher ? tab : (att || noGateTabs.includes(tab) ? tab : "att");

  const showClassBanner = !!(notice && notice.active && notice.text && !noticeDismissed) && !showDmBanner;

        { key: "q", ico: "?", label: "질문", disabled: !me.teacher && !att },
        { key: "hw", ico: "▤", label: "과제", disabled: !me.teacher && !att },
        { key: "score", ico: "◈", label: "점수", disabled: !me.teacher && !att },
        { sep: true },
        { key: "prog", ico: "▦", label: "진도계획표" },
        { key: "notes", ico: "✎", label: "강의노트" },
        { key: "ai", ico: "✦", label: "AI 힌트" },
      ]} />
    <div className="cm-stack">
      {showBanner && (
        <div className="cm-notice-overlay" onClick={dismissBanner}>
          <div className={"cm-notice-box" + (showDmBanner ? " dm" : "")} onClick={(e) => e.stopPropagation()}>
            <div className="cm-notice-label">{bannerLabel}</div>
            <div className="cm-notice-text">{bannerText}</div>
            <button className="cm-btn cm-btn-primary" style={{ marginTop: 0 }} onClick={dismissBanner}>확인</button>
          </div>
        </div>
      )}
      <div className="cm-card cm-welcome">
        <div>
          <div className="cm-welcome-name">{me.name} 님</div>
          <div className="cm-welcome-sub">{me.teacher ? "선생님 모드" : att ? "출석 완료 · " + hhmm(att.time) : "아직 출석 전이에요"}</div>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 6, alignItems: "flex-end" }}>
          <button className="cm-link" onClick={() => setShowPin((v) => !v)}>비밀번호 변경</button>

      {activeTab === "att" && (
        <div className="cm-card">

function ChangePin({ cls, me, onDone }) {
  const [p1, setP1] = useState("");

    if (p1.length !== 4) { setMsg("PIN은 4자리로 입력해줘"); return; }

function QuestionForm({ cls, me }) {
  const books = getStudentBooks(cls, me);
  const [book, setBook] = useState(books.length ? books[0].name : "");
  const [num, setNum] = useState("");
  const [memo, setMemo] = useState("");
  const [sent, setSent] = useState([]);
  useEffect(() => {
    const qcid = questionCid(cls, todayStr);
    const unsub = qCol(qcid, todayStr).where("sid", "==", me.id).onSnapshot((s) => {
      const arr = []; s.forEach((d) => arr.push({ qid: d.id, ...d.data() })); arr.sort((a, b) => a.time - b.time); setSent(arr);
    });
    return () => unsub();
  }, [cls.id, me.id]);
  async function submit() {
    if (!num.trim()) return;
    const nums = num.trim().split(/[^0-9\-()]+/).map((s) => s.trim()).filter((s) => s.length > 0);
    const now = Date.now();
    const qcid = questionCid(cls, todayStr);
    await Promise.all(nums.map((n, i) =>
      addQuestion(qcid, todayStr, { sid: me.id, name: me.name, book, num: n, memo: memo.trim(), time: now + i, resolved: false, fromCid: cls.id, fromClass: cls.name })
    ));
    const parsedNums = nums.map((n) => parseInt(n, 10)).filter((n) => !isNaN(n));
    if (parsedNums.length > 0) {
      await Promise.all(parsedNums.map((n) => addQuestioned(cls.id, me.id, me.name, book, n)));
    }
    setNum(""); setMemo("");
  }
  return (
    <div className="cm-card">
      <h3 className="cm-h3">질문하기</h3>
      <label className="cm-label">교재</label>
      <select className="cm-input" value={book} onChange={(e) => setBook(e.target.value)}>{books.map((b) => <option key={b.name}>{b.name}</option>)}</select>
      <label className="cm-label">문항 번호</label>
      <input className="cm-input" placeholder="예: 124  또는  124-(2)" value={num} onChange={(e) => setNum(e.target.value)} />
      <label className="cm-label">메모 (선택)</label>
      <input className="cm-input" placeholder="예: 적분 구간을 모르겠어요" value={memo} onChange={(e) => setMemo(e.target.value)} />
      <button className="cm-btn cm-btn-primary" onClick={submit}>선생님께 보내기</button>
      {sent.length > 0 && (
        <div className="cm-sentlist">
          <div className="cm-mini-h">내가 보낸 질문</div>
          {sent.slice().reverse().map((q) => (
            <div key={q.qid} className="cm-sent-item">
              <span>{q.book} <b>{q.num}</b>번</span>
              <span className={q.resolved ? "cm-tag-ok" : "cm-tag-wait"}>{q.resolved ? "해결됨" : "대기중"}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ScoreForm({ cls, me }) {
  const [correct, setCorrect] = useState("");
  const [total, setTotal] = useState("");
  const [label, setLabel] = useState("");
  const [mine, setMine] = useState([]);

  useEffect(() => {
    const unsub = scoresCol(cls.id, todayStr).where("sid", "==", me.id).onSnapshot((s) => {
      const arr = []; s.forEach((d) => arr.push({ id: d.id, ...d.data() })); arr.sort((a, b) => a.time - b.time); setMine(arr);
    });
    return () => unsub();
  }, [cls.id, me.id]);

  const c = parseInt(correct, 10), t = parseInt(total, 10);
  const valid = !isNaN(c) && !isNaN(t) && t > 0 && c >= 0 && c <= t;
  const score = valid ? Math.round((c / t) * 100) : null;
  const over = correct !== "" && total !== "" && !isNaN(c) && !isNaN(t) && (c > t || t === 0);

  async function submit() {
    if (!valid) return;
    await addScore(cls.id, todayStr, { sid: me.id, name: me.name, correct: c, total: t, score, label: label.trim(), time: Date.now() });
    setCorrect(""); setTotal(""); setLabel("");
  }

  return (
    <div className="cm-card">
      <h3 className="cm-h3">테스트 점수</h3>
      <label className="cm-label">시험 이름 (선택)</label>
      <input className="cm-input" placeholder="예: 6월 단원평가" value={label} onChange={(e) => setLabel(e.target.value)} />
      <label className="cm-label">맞은 개수 / 전체 문항 수</label>
      <div className="cm-rangebar">
        <input className="cm-input" inputMode="numeric" placeholder="맞은 개수" value={correct} onChange={(e) => setCorrect(e.target.value.replace(/\D/g, ""))} />
        <span className="cm-tilde">/</span>
        <input className="cm-input" inputMode="numeric" placeholder="전체" value={total} onChange={(e) => setTotal(e.target.value.replace(/\D/g, ""))} />
      </div>
      {score !== null && <div className="cm-scorebig">환산 점수 <b>{score}점</b><span>/ 100점</span></div>}
      {over && <div className="cm-err">맞은 개수는 전체 문항 수보다 클 수 없어요.</div>}
      <button className="cm-btn cm-btn-primary" onClick={submit}>제출하기</button>
      {mine.length > 0 && (
        <div className="cm-sentlist">
          <div className="cm-mini-h">내가 제출한 점수</div>
          {mine.slice().reverse().map((s) => (
            <div key={s.id} className="cm-sent-item">
              <span>{s.label ? s.label + " · " : ""}{s.correct}/{s.total}</span>
              <span className="cm-tag-ok">{s.score}점</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ===== 선생님 화면 =====
// 학생의 다가올 수업 날짜 계산 (요일 기반, weeks주 앞까지)
function upcomingSessions(cls, st, weeks) {
  const out = [];
  const dows = isIndividual(cls) ? (st.days || []) : (cls.classDays || []);
  if (dows.length === 0) return out;
  const start = new Date(todayStr + "T00:00:00");
  const end = new Date(start); end.setDate(end.getDate() + (weeks || 8) * 7);
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    if (!dows.includes(d.getDay())) continue;
    const ds = ymd(d);
    if (!isActiveOn(st, ds)) continue;
    out.push(ds);
  }
  return out;
}

function ReportNoteEdit({ note, cid, onChanged }) {
  const [editing, setEditing] = useState(false);
  const [text, setText] = useState(note.text);
  const [busy, setBusy] = useState(false);
  useEffect(() => { setText(note.text); }, [note.text]);

  async function save() {
    if (busy) return;
    setBusy(true);
    try {
      await saveDailyNote(cid, note.sid, note.sname, note.date, text, note.teacher);
      setEditing(false);
      onChanged && onChanged(note.date, text.trim());
    } catch (e) { alert("저장 실패: " + e.message); }
    setBusy(false);
  }
  async function remove() {
    if (!confirm(note.date + " 수업 기록을 삭제할까요?")) return;
    setBusy(true);
    try { await saveDailyNote(cid, note.sid, note.sname, note.date, "", note.teacher); onChanged && onChanged(note.date, ""); }
    catch (e) { alert("삭제 실패: " + e.message); }
    setBusy(false);
  }

  if (!editing) {
    return note.text
      ? <div style={{cursor: "pointer"}} onClick={() => setEditing(true)}>{note.text}</div>
      : <div className="rp-noprint" style={{cursor: "pointer", color: "#b3a89a", fontSize: 12.5}} onClick={() => setEditing(true)}>+ 기록 추가</div>;
  }
  return (
    <div className="rp-noprint">
      <textarea className="cm-input" style={{margin: "2px 0 6px", fontSize: 13, minHeight: 62, resize: "vertical"}}
        value={text} onChange={(e) => setText(e.target.value)} autoFocus />
      <div style={{display: "flex", gap: 8, alignItems: "center"}}>
        <button className="cm-btn cm-btn-primary" style={{margin: 0, padding: "6px 14px", fontSize: 13}} disabled={busy} onClick={save}>저장</button>
        <button className="cm-btn cm-btn-ghost" style={{margin: 0, padding: "6px 14px", fontSize: 13}} onClick={() => { setText(note.text); setEditing(false); }}>취소</button>
        {note.text && <button className="cm-link" style={{color: "#d6453f", marginLeft: "auto"}} disabled={busy} onClick={remove}>삭제</button>}
      </div>
    </div>
  );
}
