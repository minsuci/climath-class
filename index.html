function RosterManager({ cls, canEdit, onChanged, onOpenDirectory }) {
  // 여기는 누를 때마다 바로 저장하므로 편집 중인 초안이 없다.
  // 대신 **밖에서 명단이 바뀌면 반드시 따라가야** 한다 — 개별진도반은 교재가
  // 이 명단 안에 들어있어서, 옛 사본으로 저장하면 학생별 설정에서 방금 저장한
  // 교재가 통째로 날아간다.
  const [roster, , , settleRoster] = useEditable(cls.roster || [], cls.id);
  const [busy, setBusy] = useState(false);
  // 학생 정보(학교·학년·담임)는 **학생 명단이 원본**이다. 여기서는 그걸 비춰 보여주고,
  // 이 반에 넣고 빼고 순서를 정하는 것만 한다. 반 안에서 따로 이름을 만들면
  // 학생 명단에 없는 사람이 생겨 두 화면이 어긋난다 — 그래서 새로 만들 때도
  // 학생 명단에 먼저 만들고(saveStudent) 이 반에 붙인다(assignToClass).
  const [people, setPeople] = useState(null);
  const [picking, setPicking] = useState(false);
  const [q, setQ] = useState("");
  useEffect(() => listenStudents(setPeople, () => setPeople([])), []);
  const personOf = (pid) => (pid && (people || []).find((x) => x.pid === pid)) || null;
  const students = roster.filter((r) => !r.teacher);
  const teachers = roster.filter((r) => r.teacher);
  const unlinkedN = students.filter((st) => !personOf(st.pid)).length;
  async function commit(newRoster) {
    setBusy(true);
    try { await saveClassRoster(cls.id, newRoster); cls.roster = newRoster; settleRoster(newRoster); if (onChanged) onChanged(); }
    catch (e) { alert("저장 실패: " + e.message); }
    setBusy(false);
  }
  // 학생 명단에 있는 사람을 이 반에 넣는다
  async function addExisting(person) {
    setBusy(true);
    try {
      await assignToClass(cls.id, person);
      settleRoster(cls.roster || []);
      setPicking(false); setQ("");
      if (onChanged) onChanged();
    } catch (e) { alert("넣지 못했어요: " + friendlyErr(e)); }
    setBusy(false);
  }
  // 아예 새 학생: 학생 명단에 먼저 만들고 이 반에 붙인다
  async function createAndAdd() {
    const name = prompt("새 학생 이름" + "\n" + "학생 명단에도 함께 만들어져요.");
    if (!name || !name.trim()) return;
    setBusy(true);
    try {
      const pid = await saveStudent(null, { name: name.trim(), school: "", grade: "", homeroom: "" });
      await assignToClass(cls.id, { pid: pid, name: name.trim(), school: "", grade: "" });
      settleRoster(cls.roster || []);
      setPicking(false); setQ("");
      if (onChanged) onChanged();
    } catch (e) { alert("만들지 못했어요: " + friendlyErr(e)); }
    setBusy(false);
  }
  // 이름은 학생 명단이 원본이다. 이어져 있으면 거기를 고치고 모든 반에 흘려보낸다.
  async function renameStudent(st) {
    const who = personOf(st.pid);
    const name = prompt(who ? "이름 수정 (학생 명단과 다른 반에도 함께 반영돼요)" : "이름 수정", st.name);
    if (!name || !name.trim() || name.trim() === st.name) return;
    if (!who) { await commit(roster.map((r) => (r.id === st.id ? { ...r, name: name.trim() } : r))); return; }
    setBusy(true);
    try {
      await saveStudent(who.pid, { name: name.trim() });
      await syncStudentToRosters({ pid: who.pid, name: name.trim(), school: who.school, grade: who.grade });
      settleRoster(cls.roster || []);
      if (onChanged) onChanged();
    } catch (e) { alert("바꾸지 못했어요: " + friendlyErr(e)); }
    setBusy(false);
  }
  // 반대로, 학생으로 들어가 있는 선생님을 선생님 항목으로. 이게 없어서 출석부·내신
  // 참여표에 선생님 이름이 "아직 안 낸 학생"으로 계속 떴다.
  async function toTeacher(st) {
    if (!confirm(st.name + " 님을 선생님 항목으로 바꿀까요?" + "\n\n" +
      "출석부 · 과제 · 점수 · 보고서 · 내신 참여표의 학생 목록에서 빠져요.\n" +
      "지금까지 쌓인 기록은 지워지지 않습니다.")) return;
    await commit(roster.map((r) => (r.id === st.id ? { ...r, teacher: true } : r)));
  }
  // 선생님 항목을 보통 학생으로. teacher 키를 지우면 모든 학생 목록에 들어온다.
  async function toStudent(t) {
    if (!confirm(t.name + " 님을 이 반의 학생으로 바꿀까요?" + "\n\n" +
      "출석부 · 과제 · 점수 · 학습관리 보고서 · 내신 참여표에 학생으로 나타납니다.")) return;
    await commit(roster.map((r) => {
      if (r.id !== t.id) return r;
      const n = { ...r };
      delete n.teacher;
      return n;
    }));
  }
  async function removeStudent(st) {
    if (!confirm(st.name + " 학생을 명단에서 뺄까요?\n\n출석·과제·질문 기록은 삭제되지 않고 남지만, 명단·출석부에서 사라져요.")) return;
    await commit(roster.filter((r) => r.id !== st.id));
  }
  function move(idx, dir) {
    const ni = idx + dir;
    if (ni < 0 || ni >= students.length) return;
    const arr = [...students];
    const tmp = arr[idx]; arr[idx] = arr[ni]; arr[ni] = tmp;
    commit([...arr, ...teachers]);
  }
  const notInClass = (people || []).filter((x) => !students.some((st) => st.pid === x.pid));
  const picked = q.trim()
    ? notInClass.filter((x) => String(x.name || "").replace(/\s+/g, "").includes(q.trim().replace(/\s+/g, ""))
        || String(x.school || "").includes(q.trim()))
    : notInClass;

  return (
    <div>
      <div className="cm-hint" style={{marginBottom: 10}}>
        학교 · 학년 · 담임은 <b>학생 명단</b>에서 정해요. 여기서는 <b>이 반에 넣고 빼고 순서만</b> 정합니다.
        {onOpenDirectory && (<>
          {" "}<button className="cm-link" style={{padding: 0}} onClick={onOpenDirectory}>학생 명단에서 이 반 보기 →</button>
        </>)}
      </div>
      {unlinkedN > 0 && (
        <div style={{background: "#f6e7df", border: "1px solid #e6cbb9", borderRadius: 10,
             padding: "9px 11px", marginBottom: 10, fontSize: 12, color: "#a8562c", lineHeight: 1.55}}>
          <b>학생 명단에 없는 사람 {unlinkedN}명</b> — 이 반에만 있어서 학교·학년·내신 참여표가 안 따라와요.
          {onOpenDirectory && (<>
            {" "}<button className="cm-link" style={{padding: 0, color: "#a8562c", fontWeight: 700}}
              onClick={onOpenDirectory}>학생 명단에서 잇기 →</button>
          </>)}
        </div>
      )}
      {students.length === 0 && <div className="cm-empty">학생이 없어요</div>}
      {students.map((st, i) => {
        const who = personOf(st.pid);
        return (
        <div key={st.id} style={{display: "flex", alignItems: "center", gap: 8, padding: "9px 0", borderBottom: "1px solid var(--line)"}}>
          <span style={{color: "var(--muted)", fontSize: 13, width: 22}}>{i + 1}</span>
          <span>
            <strong style={isEnded(st) ? {color: "var(--muted)"} : undefined}>{who ? who.name : st.name}</strong>
            <br/>
            <span style={{fontSize: 11, color: who ? "#8a7f72" : "#c2703f"}}>
              {who ? ([who.school, who.grade].filter(Boolean).join(" · ") || "학교·학년 미입력")
                   : "학생 명단에 없음"}
            </span>
          </span>
          {isEnded(st) && <span className="cm-chip" style={{background: "#f0ece5", color: "#7c6f5f"}}>수강 종료 {st.endDate}</span>}
          {canEdit && (<span style={{marginLeft: "auto", display: "flex", gap: 2, alignItems: "center"}}>
            <button className="cm-link" disabled={busy || i === 0} onClick={() => move(i, -1)} style={{padding: "0 4px"}}>▲</button>
            <button className="cm-link" disabled={busy || i === students.length - 1} onClick={() => move(i, 1)} style={{padding: "0 4px"}}>▼</button>
            <button className="cm-link" disabled={busy} onClick={() => renameStudent(st)}>이름</button>
            <button className="cm-link" disabled={busy} onClick={() => toTeacher(st)}>선생님</button>
            <button className="cm-link" disabled={busy} style={{color: "#d6453f"}} onClick={() => removeStudent(st)}>빼기</button>
          </span>)}
        </div>
        );
      })}
      {canEdit && !picking && (
        <button className="cm-link" style={{marginTop: 10}} disabled={busy || people === null}
          onClick={() => setPicking(true)}>+ 학생 넣기</button>
      )}
      {canEdit && picking && (
        <div style={{marginTop: 10, background: "#f7f4f0", border: "1px solid #e8e0d4", borderRadius: 10, padding: "10px 12px"}}>
          <div style={{display: "flex", gap: 8, alignItems: "center", marginBottom: 8}}>
            <input className="cm-input" style={{margin: 0, flex: 1}} placeholder="학생 명단에서 찾기 (이름 · 학교)"
              value={q} onChange={(e) => setQ(e.target.value)} />
            <button className="cm-link" onClick={() => { setPicking(false); setQ(""); }}>닫기</button>
          </div>
          {picked.length === 0
            ? <div style={{fontSize: 12, color: "var(--muted)", marginBottom: 8}}>
                {notInClass.length ? "찾는 학생이 없어요" : "학생 명단에 넣을 수 있는 사람이 없어요"}
              </div>
            : <div style={{display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8, maxHeight: 190, overflowY: "auto"}}>
                {picked.slice(0, 80).map((x) => (
                  <button key={x.pid} className="cm-ab-tab" disabled={busy} onClick={() => addExisting(x)}>
                    {x.name}{x.school ? <span style={{opacity: .65}}> · {x.school}</span> : null}
                  </button>
                ))}
              </div>}
          <button className="cm-link" disabled={busy} onClick={createAndAdd}>+ 명단에 없는 새 학생 만들기</button>
        </div>
      )}

      {/* 명단의 선생님 항목. 지금까지 화면에 아예 안 보여서, 왜 어떤 사람이
          출석부·내신 참여표 등에서 통째로 빠지는지 알 길이 없었다. */}
      {teachers.length > 0 && (
        <div style={{marginTop: 14, paddingTop: 12, borderTop: "1px dashed var(--line)"}}>
          <div className="cm-hint" style={{marginBottom: 8}}>
            <b>명단의 선생님 항목</b> — 출석부 · 과제 · 점수 · 보고서 · 내신 참여표 등
            <b> 학생 목록에서 전부 빠져 있어요.</b> 학생처럼 쓰시려면 바꾸면 됩니다.
          </div>
          {teachers.map((t) => (
            <div key={t.id} style={{display: "flex", alignItems: "center", gap: 8, padding: "7px 0"}}>
              <strong>{t.name}</strong>
              <span className="cm-chip" style={{background: "#eef1f6", color: "var(--navy)"}}>선생님 항목</span>
              {canEdit && (
                <span style={{marginLeft: "auto"}}>
                  <button className="cm-link" disabled={busy} onClick={() => toStudent(t)}>학생으로 바꾸기</button>
                </span>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function StudentConfig({ cls, canEdit, onChanged }) {
  // 저장된 명단을 편집하되 밖에서 바뀌면 따라간다 (고치던 중이면 그대로 둔다).
  // 처음 한 번만 읽으면, 반이 바뀌거나 다른 데서 저장이 일어났을 때
  // 옛 명단을 들고 있다가 그걸로 통째로 덮어쓴다.
  const [roster, setRoster, dirty, settleRoster] = useEditable(cls.roster || [], cls.id);
  const [open, setOpen] = useState(null);
  const [msg, setMsg] = useState({});
  const [busy, setBusy] = useState(false);
  const [statusFilter, setStatusFilter] = useState("active"); // active | ended | all
  const allStudents = roster.filter((r) => !r.teacher);
  const students = allStudents.filter((r) =>
    statusFilter === "all" ? true : statusFilter === "ended" ? isEnded(r) : !isEnded(r)
  );
  const endedCount = allStudents.filter(isEnded).length;
  function patch(sid, p) { setRoster((rs) => rs.map((r) => (r.id === sid ? { ...r, ...p } : r))); }
  function toggleDay(st, d) {
    const days = (st.days || []).includes(d) ? st.days.filter((x) => x !== d) : [...(st.days || []), d].sort();
    patch(st.id, { days });
  }
  async function saveOne(st) {
    if (busy) return;
    if ((st.days || []).length === 0) { setMsg({ [st.id]: "등원 요일을 1개 이상 선택해주세요" }); return; }
    const v = validateBooks(st.books || []);
    if (v.err) { setMsg({ [st.id]: v.err }); return; }
    setBusy(true); setMsg({});
    try {
      // 내 초안 전체로 덮지 않는다. **지금 저장된 명단** 위에 이 학생의 변경만 얹는다 —
      // 그래야 그 사이 다른 데서(명단 편집 등) 바뀐 내용이 날아가지 않는다.
      const base = (cls.roster || []).length ? cls.roster : roster;
      const newRoster = base.map((r) => (r.id === st.id ? { ...r, days: st.days, books: v.books, startDate: st.startDate || "", endDate: st.endDate || "" } : r));
      await saveClassRoster(cls.id, newRoster);
      cls.roster = newRoster;
      settleRoster(newRoster.map((r) => ({ ...r, days: [...(r.days || [])], books: (r.books || []).map((b) => ({ ...b })) })));
      setMsg({ [st.id]: "저장됐어요 ✓" });
      if (onChanged) onChanged();
    } catch (e) { setMsg({ [st.id]: "저장 실패: " + e.message }); }
    setBusy(false);
  }
  return (
    <div>
      {students.map((st) => (
        <div key={st.id} style={{borderBottom: "1px solid var(--line)", padding: "10px 0"}}>
          <div style={{display: "flex", alignItems: "center", gap: 8, cursor: "pointer"}} onClick={() => setOpen(open === st.id ? null : st.id)}>
            <strong>{st.name}</strong>
            <span style={{color: "var(--muted)", fontSize: 13}}>
              {(st.days || []).length ? st.days.map((d) => DAY_NAMES[d]).join("·") : "요일 미설정"}
              {" · 교재 " + ((st.books || []).length) + "권"}
            </span>
            {isEnded(st) && <span className="cm-chip" style={{background: "#f0ece5", color: "#7c6f5f"}}>수강 종료</span>}
            {!isEnded(st) && st.endDate && <span className="cm-chip" style={{background: "#f6e7df", color: "#c2703f"}}>~{st.endDate}</span>}
            <span style={{marginLeft: "auto"}}>{open === st.id ? "▾" : "▸"}</span>
          </div>
          {open === st.id && (
            <div style={{marginTop: 10}}>
              <label className="cm-label">등원 요일</label>
              <div style={{display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10}}>
                {DAY_NAMES.map((d, i) => (
                  <button key={i} disabled={!canEdit} className={"cm-ab-tab" + ((st.days || []).includes(i) ? " on" : "")} onClick={() => canEdit && toggleDay(st, i)}>{d}</button>
                ))}
              </div>
              <label className="cm-label">수강 기간 <span className="cm-h-hint">(마지막 등원일이 지나면 명단에서 자동으로 빠져요)</span></label>
              <div style={{display: "flex", gap: 8, alignItems: "center", marginBottom: 4, flexWrap: "wrap"}}>
                <input className="cm-input" style={{margin: 0, flex: 1, minWidth: 130}} type="date" disabled={!canEdit}
                  value={st.startDate || ""} onChange={(e) => patch(st.id, { startDate: e.target.value })} />
                <span style={{color: "var(--muted)"}}>~</span>
                <input className="cm-input" style={{margin: 0, flex: 1, minWidth: 130}} type="date" disabled={!canEdit}
                  value={st.endDate || ""} onChange={(e) => patch(st.id, { endDate: e.target.value })} />
                {canEdit && (st.startDate || st.endDate) && (
                  <button className="cm-link" onClick={() => patch(st.id, { startDate: "", endDate: "" })}>지우기</button>
                )}
              </div>
              {canEdit && (
                <div style={{display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 4, alignItems: "center"}}>
                  <span style={{fontSize: 12, color: "var(--muted)"}}>빠른 연장</span>
                  {[1, 2, 3, 6].map((n) => (
                    <button key={n} className="cm-ab-tab" onClick={() => patch(st.id, { endDate: addMonths(st.endDate, n) })}>+{n}개월</button>
                  ))}
                  <button className="cm-ab-tab" onClick={() => patch(st.id, { endDate: "" })}>기한 없음</button>
                </div>
              )}
              <div className="cm-hint" style={{marginBottom: 10}}>비워두면 기간 제한 없이 계속 다녀요.{isEnded(st) && " 이 학생은 수강이 끝나 현재 명단에서 빠져 있어요."}</div>
              <label className="cm-label">교재</label>
              {canEdit
                ? <BookEditor books={st.books || []} onChange={(b) => patch(st.id, { books: b })} />
                : ((st.books || []).length === 0 ? <div className="cm-empty">교재 없음</div> : (st.books || []).map((b) => <div key={b.name} style={{padding: "4px 0"}}>{b.name} <span style={{color: "var(--muted)"}}>({b.total}문항)</span></div>))}
              {msg[st.id] && <div className={msg[st.id].includes("✓") ? "cm-done" : "cm-err"}>{msg[st.id]}</div>}
              {canEdit && <button className="cm-btn cm-btn-primary" disabled={busy} onClick={() => saveOne(roster.find((r) => r.id === st.id))}>{busy ? "저장 중..." : "저장"}</button>}
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

function MergeManager({ cls, onSaved }) {
  const others = activeClasses().filter((c) => c.id !== cls.id);
  const cur = cls.merge || null;
  const [partnerId, setPartnerId] = useState(cur ? cur.partnerId : (others[0] ? others[0].id : ""));
  const [days, setDays] = useState(cur ? [...(cur.days || [])] : []);
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);
  function toggleDay(d) { setDays((s) => s.includes(d) ? s.filter((x) => x !== d) : [...s, d].sort()); }
  const partnerName = (id) => { const c = CLASSES.find((x) => x.id === id); return c ? c.name : id; };
  async function save() {
    if (busy) return;
    if (!partnerId) { setMsg("합반할 반을 선택해주세요"); return; }
    if (days.length === 0) { setMsg("합반 요일을 1개 이상 선택해주세요"); return; }
    setBusy(true); setMsg("");
    try { await setMerge(cls.id, partnerId, days); setMsg("저장됐어요 ✓"); onSaved && onSaved(); }
    catch (e) { setMsg("저장 실패: " + e.message); }
    setBusy(false);
  }
  async function clear() {
    if (!confirm("합반 설정을 해제할까요?")) return;
    setBusy(true);
    try { await clearMerge(cls.id, cur.partnerId); setDays([]); setMsg("해제됐어요"); onSaved && onSaved(); }
    catch (e) { setMsg("해제 실패: " + e.message); }
    setBusy(false);
  }
  if (others.length === 0) return <div className="cm-empty">합반할 다른 반이 없어요</div>;
  return (
    <div>
      <div className="cm-hint" style={{marginBottom: 12}}>선택한 요일에는 두 반이 <b>한 화면에서 함께 관리</b>돼요. 질문 대기열이 합쳐지고, 출석·과제·점수도 두 반 학생이 같이 표시돼요. (각 학생 기록은 자기 반에 저장돼서 월간 출석부는 그대로예요)</div>
      {cur && <div className="cm-done" style={{marginBottom: 10}}>현재 <b>{partnerName(cur.partnerId)}</b>와 {(cur.days || []).map((d) => DAY_NAMES[d]).join("·")}요일 합반 중</div>}
      <label className="cm-label">합반할 반</label>
      <select className="cm-input" value={partnerId} onChange={(e) => setPartnerId(e.target.value)}>
        {others.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
      </select>
      <label className="cm-label">합반 요일</label>
      <div style={{display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 4}}>
        {DAY_NAMES.map((d, i) => (
          <button key={i} className={"cm-ab-tab" + (days.includes(i) ? " on" : "")} onClick={() => toggleDay(i)}>{d}</button>
        ))}
      </div>
      {msg && <div className={msg.includes("✓") || msg.includes("해제됐") ? "cm-done" : "cm-err"}>{msg}</div>}
      <div style={{display: "flex", gap: 10}}>
        <button className="cm-btn cm-btn-primary" style={{margin: 0}} disabled={busy} onClick={save}>{busy ? "저장 중..." : "합반 저장"}</button>
        {cur && <button className="cm-btn cm-btn-ghost" style={{margin: 0}} disabled={busy} onClick={clear}>해제</button>}
      </div>
    </div>
  );
}

function ClassMetaEditor({ cls, onSaved, onDeleted }) {
  const [name, setName] = useState(cls.name);
  const [days, setDays] = useState([...(cls.classDays || [])]);
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);
  const [endDate, setEndDate] = useState(cls.endDate || "");
  const [endMsg, setEndMsg] = useState("");
  function toggleDay(d) { setDays((s) => s.includes(d) ? s.filter((x) => x !== d) : [...s, d].sort()); }
  async function applyEnd(v) {
    if (busy) return;
    setBusy(true); setEndMsg("");
    try {
      const unmerged = await saveClassEnd(cls.id, v);
      cls.endDate = v; setEndDate(v);
      if (unmerged) cls.merge = null;
      setEndMsg((v ? (v < todayStr ? "종강 처리됐어요 ✓" : v + "에 종강돼요 ✓") : "종강이 취소됐어요 ✓")
        + (unmerged ? " (" + unmerged + "과의 합반은 해제했어요)" : ""));
      onSaved();
    } catch (e) { setEndMsg("저장 실패: " + e.message); }
    setBusy(false);
  }
  async function save() {
    if (busy) return;
    const nm = name.trim();
    if (!nm) { setMsg("반 이름을 입력해주세요"); return; }
    if (CLASSES.some((c) => c.id !== cls.id && c.name === nm)) { setMsg("이미 있는 반 이름입니다"); return; }
    if (!isIndividual(cls) && days.length === 0) { setMsg("수업 요일을 1개 이상 선택해주세요"); return; }
    setBusy(true); setMsg("");
    try {
      await saveClassMeta(cls.id, nm, days);
      cls.name = nm; cls.classDays = days;
      setMsg("저장됐어요 ✓");
      onSaved();
    } catch (e) { setMsg("저장 실패: " + e.message); }
    setBusy(false);
  }
  return (
    <div>
      <label className="cm-label">반 이름</label>
      <input className="cm-input" value={name} onChange={(e) => setName(e.target.value)} />
      {!isIndividual(cls) && (<>
      <label className="cm-label">수업 요일</label>
      <div style={{display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 4}}>
        {DAY_NAMES.map((d, i) => (
          <button key={i} className={"cm-ab-tab" + (days.includes(i) ? " on" : "")} onClick={() => toggleDay(i)}>{d}</button>
        ))}
      </div>
      <div className="cm-hint" style={{margin: "8px 0"}}>요일을 바꾸면 <b>월간 출석부의 날짜 칸</b>이 새 요일 기준으로 표시돼요. 지난 기록은 그대로 남아요.</div>
      </>)}
      {isIndividual(cls) && <div className="cm-hint" style={{margin: "8px 0"}}>개별진도반의 등원요일·교재는 아래 <b>학생별 설정</b>에서 관리해요.</div>}
      {msg && <div className={msg.includes("✓") ? "cm-done" : "cm-err"}>{msg}</div>}
      <button className="cm-btn cm-btn-primary" disabled={busy} onClick={save}>{busy ? "저장 중..." : "저장"}</button>

      {/* ---- 종강 ---- 학생 수강종료(endDate)와 같은 문법. 기록은 하나도 지워지지 않는다 ---- */}
      <div style={{borderTop: "1px solid var(--line)", marginTop: 18, paddingTop: 14}}>
        <label className="cm-label" style={{marginTop: 0}}>종강</label>
        {isClassEnded(cls) ? (
          <div className="cm-hint" style={{marginBottom: 8}}>
            <b>{cls.endDate} 종강한 반이에요.</b> 내 수업 목록의 “종강한 반”에 접혀 있고,
            위험신호·보강 관리·학생 로그인에서 빠져 있어요. 출석·과제·상담·보고서는 그대로 남아 있습니다.
          </div>
        ) : (
          <div className="cm-hint" style={{marginBottom: 8}}>
            마지막 수업 날짜를 넣으면 그 다음 날부터 목록에서 접히고 집계에서 빠져요.
            <b>기록은 하나도 지워지지 않고</b>, 날짜를 지우면 그대로 되살아납니다.
            {cls.merge && cls.merge.partnerId && <> 합반 중인 반이라 <b>합반은 함께 해제</b>돼요.</>}
          </div>
        )}
        <div style={{display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", marginBottom: 8}}>
          <input className="cm-input" style={{margin: 0, maxWidth: 190}} type="date"
            value={endDate} onChange={(e) => setEndDate(e.target.value)} />
          <button className="cm-btn cm-btn-ghost" style={{margin: 0}} disabled={busy || endDate === (cls.endDate || "")}
            onClick={() => applyEnd(endDate)}>{busy ? "저장 중..." : "적용"}</button>
        </div>
        <div style={{display: "flex", gap: 6, flexWrap: "wrap"}}>
          <button className="cm-ab-tab" disabled={busy} onClick={() => applyEnd(todayStr)}>지금 종강 (오늘이 마지막)</button>
          {cls.endDate && <button className="cm-ab-tab" disabled={busy} onClick={() => applyEnd("")}>종강 취소</button>}
        </div>
        {endMsg && <div className={endMsg.includes("✓") ? "cm-done" : "cm-err"}>{endMsg}</div>}
      </div>

      <div style={{borderTop: "1px solid var(--line)", marginTop: 18, paddingTop: 14}}>
        <div className="cm-hint" style={{marginBottom: 8}}>
          수업이 끝난 반이라면 <b>삭제 말고 위의 종강</b>을 쓰세요. 삭제는 잘못 만든 반을 치울 때만 씁니다 —
          출석·과제·수업기록·강의노트를 <b>앱에서 다시 볼 수 없게</b> 됩니다.
        </div>
        <button className="cm-link" style={{color: "#d6453f"}} disabled={busy} onClick={async () => {
          const typed = prompt('정말 삭제하려면 반 이름("' + cls.name + '")을 똑같이 입력하세요.\n출석·과제·질문 기록이 화면에서 사라지며 되돌리기 어렵습니다.\n\n수업이 끝난 것뿐이라면 취소하고 "종강"을 쓰세요.');
          if (typed === null) return;
          if (typed.trim() !== cls.name) { alert("이름이 일치하지 않아 취소했어요."); return; }
          setBusy(true);
          try { await deleteClass(cls.id); onDeleted(); }
          catch (e) { alert("삭제 실패: " + e.message); setBusy(false); }
        }}>반 삭제</button>
      </div>
    </div>
  );
}

function ClassCreate({ me, onDone, onCancel }) {
  const [name, setName] = useState("");
  const [type, setType] = useState("regular");
  const [days, setDays] = useState([]);
  const [studentText, setStudentText] = useState("");
  const [books, setBooks] = useState([]);
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);
  function toggleDay(d) { setDays((s) => s.includes(d) ? s.filter((x) => x !== d) : [...s, d].sort()); }
  async function submit() {
    if (busy) return;
    const nm = name.trim();
    if (!nm) { setMsg("반 이름을 입력해주세요"); return; }
    if (CLASSES.some((c) => c.name === nm)) { setMsg("이미 있는 반 이름입니다"); return; }
    if (type === "regular" && days.length === 0) { setMsg("수업 요일을 1개 이상 선택해주세요"); return; }
    const names = studentText.split(/[\n,]+/).map((s) => s.trim()).filter(Boolean);
    if (names.length === 0) { setMsg("학생을 1명 이상 입력해주세요"); return; }
    let cleanBooks = [];
    if (books.length > 0) {
      const v = validateBooks(books);
      if (v.err) { setMsg(v.err); return; }
      cleanBooks = v.books;
    }
    const roster = names.map((n, i) => ({ id: "s" + (i + 1), name: n }));
    // 선생님 PIN을 명단에 넣지 않는다 - 반 문서는 학생도 읽는다
    roster.push({ id: "t1", name: me.name, teacher: true });
    setBusy(true);
    try {
      const newId = await createClass(nm, type === "individual" ? [] : days, roster, type === "individual" ? [] : cleanBooks, type);
      onDone(newId);
    } catch (e) { setMsg("생성 실패: " + e.message); setBusy(false); }
  }
  const ccBackRef = useSwipeBack(onCancel);
  return (
    <div ref={ccBackRef} className="cm-card cm-slide-in" style={{willChange: "transform"}}>
      <h2 className="cm-h2">새 반 만들기</h2>
      <label className="cm-label">반 이름</label>
      <input className="cm-input" placeholder="예: 고2 정규반" value={name} onChange={(e) => setName(e.target.value)} />
      <label className="cm-label">반 유형</label>
      <div style={{display: "flex", gap: 6, marginBottom: 4}}>
        <button className={"cm-ab-tab" + (type === "regular" ? " on" : "")} onClick={() => setType("regular")}>일반반</button>
        <button className={"cm-ab-tab" + (type === "individual" ? " on" : "")} onClick={() => setType("individual")}>개별진도반</button>
      </div>
      {type === "individual" && <div className="cm-hint" style={{margin: "6px 0"}}>개별진도반은 학생마다 등원요일·교재가 달라요. 반을 만든 뒤 <b>설정 탭 → 학생별 설정</b>에서 채워주세요.</div>}
      {type === "regular" && (<>
      <label className="cm-label">수업 요일</label>
      <div style={{display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 4}}>
        {DAY_NAMES.map((d, i) => (
          <button key={i} className={"cm-ab-tab" + (days.includes(i) ? " on" : "")} onClick={() => toggleDay(i)}>{d}</button>
        ))}
      </div>
      </>)}
      <label className="cm-label">학생 명단 (한 줄에 한 명, 또는 쉼표로 구분)</label>
      <textarea className="cm-input cm-notice-ta" rows={5} placeholder={"김서진\n임서윤\n김태윤"}
        value={studentText} onChange={(e) => setStudentText(e.target.value)} />
      {type === "regular" && (<>
      <label className="cm-label">교재 (나중에 설정 탭에서 추가/수정할 수도 있어요)</label>
      <BookEditor books={books} onChange={setBooks} />
      </>)}
      {msg && <div className="cm-err">{msg}</div>}
      <button className="cm-btn cm-btn-primary" disabled={busy} onClick={submit}>{busy ? "만드는 중..." : "반 만들기"}</button>
      <button className="cm-link" onClick={onCancel}>← 돌아가기</button>
    </div>
  );
}

// 선생님이 자기 PIN을 바꾼다. 관리자 화면의 PIN 초기화는 "다른" 선생님용이라
// 본인 것을 바꿀 길이 없었다. 검사와 저장은 서버(/api/auth)가 한다.
// 초기 비번(1234)을 그대로 쓰는 학생 현황. 목록 자체가 "이 이름들은 1234로 들어간다"는
// 지도라서 서버가 ID 토큰으로 선생님인지 확인한 뒤에만 준다.
function TeacherPinChange({ me, onBack }) {
  const [cur, setCur] = useState("");
  const [p1, setP1] = useState("");
  const [p2, setP2] = useState("");
  const [msg, setMsg] = useState("");
  const [ok, setOk] = useState(false);
  const [busy, setBusy] = useState(false);
  const backRef = useSwipeBack(onBack);
  const only4 = (v) => v.replace(/\D/g, "").slice(0, 4);
  async function save() {
    if (busy) return;
    if (cur.length !== 4) { setOk(false); setMsg("지금 쓰는 PIN을 입력해주세요"); return; }
    if (p1.length !== 4) { setOk(false); setMsg("새 PIN은 숫자 4자리입니다"); return; }
    if (p1 !== p2) { setOk(false); setMsg("두 번 입력한 새 PIN이 다릅니다"); return; }
    setBusy(true);
    try {
      await authApi({ action: "changeTeacherPin", tid: me.tid, oldPin: cur, newPin: p1 });
      setOk(true); setMsg("PIN이 바뀌었어요. 다음 로그인부터 새 PIN을 쓰세요.");
      setCur(""); setP1(""); setP2("");
    } catch (e) { setOk(false); setMsg(e.message); }
    setBusy(false);
  }
  return (

function TeacherRegister({ onDone, onCancel }) {
  const [name, setName] = useState("");
  const [p1, setP1] = useState("");
  const [p2, setP2] = useState("");
  const [sel, setSel] = useState([]);
  const [msg, setMsg] = useState("");
  function toggleCls(id) { setSel((s) => s.includes(id) ? s.filter((x) => x !== id) : [...s, id]); }
  async function submit() {
    if (!name.trim()) { setMsg("이름을 입력해주세요"); return; }
    if (p1.length !== 4) { setMsg("PIN은 숫자 4자리입니다"); return; }
    if (p1 !== p2) { setMsg("두 번 입력한 PIN이 다릅니다"); return; }
    // 로그인 전이라 Firestore에 직접 못 쓴다(규칙이 막는다). 서버가 대신 만든다.
    // 담당 반은 여기서 못 고른다 - 승인하면서 관리자가 정한다.
    try { await authApi({ action: "register", name: name.trim(), pin: p1 }); onDone(); }
    catch (e) { setMsg(e.message); }

  const trBackRef = useSwipeBack(onCancel);
  return (
    <div ref={trBackRef} className="cm-card cm-slide-in" style={{willChange: "transform"}}>

      <label className="cm-label">이름</label>
      <input className="cm-input" value={name} onChange={(e) => setName(e.target.value)} />
      <label className="cm-label">PIN (숫자 4자리)</label>
      <input className="cm-input" type="password" inputMode="numeric" maxLength={4} value={p1} onChange={(e) => setP1(e.target.value.replace(/\D/g, ""))} />
      <label className="cm-label">PIN 다시 입력</label>
      <input className="cm-input" type="password" inputMode="numeric" maxLength={4} value={p2} onChange={(e) => setP2(e.target.value.replace(/\D/g, ""))} />

        {activeClasses().map((c) => (
          <button key={c.id} className="cm-day" onClick={() => toggleCls(c.id)}>
            <div className="cm-day-left"><span className="cm-day-date">{c.name}</span></div>

function TeacherManage({ me, teachers, onRefresh, onBack }) {
  const [resetTid, setResetTid] = useState(null);
  const [newPin, setNewPin] = useState("");
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState("");
  // 로그인 화면이 쓰는 목록(/api/auth teachers)에는 **담당 반이 없다** — 로그인 전에
  // 부르는 것이라 이름·역할만 준다. 그걸 그대로 쓰면 담당 반이 항상 빈 것으로 보여
  // 눌러도 표시가 안 바뀌고(눌리지 않는 것처럼 보인다), 저장할 때 다른 반 담당까지 지운다.
  // 여기서는 문서를 직접 읽는다 (규칙상 관리자만 전체를 읽을 수 있다).
  const [full, setFull] = useState(null);
  async function reload() {
    try { setFull(await listTeachers()); setMsg(""); }
    catch (e) { setFull([]); setMsg("선생님 목록을 읽지 못했어요: " + friendlyErr(e)); }
  }
  useEffect(() => { reload(); }, []);
  // 문서를 아직 못 읽었으면 이름만이라도 보여준다
  const rows = full || teachers;
  const byTid = {};
  (full || []).forEach((t) => { byTid[t.tid] = t; });

  async function toggleCls(t, cid) {
    if (busy) return;
    const has = (t.classIds || []).includes(cid);
    setBusy(t.tid + cid); setMsg("");
    try {
      // 배열을 통째로 다시 쓰지 않는다. 화면이 들고 있던 옛 사본으로 저장하면
      // 그 사이 다른 곳에서 바뀐 담당이 날아간다 (반 삭제·순서 편집이 같은 배열을 건드린다).
      await updateTeacher(t.tid, { classIds: has
        ? firebase.firestore.FieldValue.arrayRemove(cid)
        : firebase.firestore.FieldValue.arrayUnion(cid) });
      await reload();
      onRefresh();
    } catch (e) { setMsg("담당 반을 바꾸지 못했어요: " + friendlyErr(e)); }
    setBusy("");
  }
  async function doResetPin(t) {
    if (newPin.length !== 4) return;
    setMsg("");
    try {
      await updateTeacher(t.tid, { pin: newPin });
      setResetTid(null); setNewPin("");
      await reload(); onRefresh();
    } catch (e) { setMsg("PIN을 바꾸지 못했어요: " + friendlyErr(e)); }
  }
  async function doDelete(t) {
    if (!confirm(t.name + " 선생님 계정을 삭제할까요?")) return;
    setMsg("");
    try { await deleteTeacher(t.tid); await reload(); onRefresh(); }
    catch (e) { setMsg("삭제하지 못했어요: " + friendlyErr(e)); }
  }
  async function act(fn, what) {
    setMsg("");
    try { await fn(); await reload(); onRefresh(); }
    catch (e) { setMsg(what + "하지 못했어요: " + friendlyErr(e)); }

    <div ref={tmBackRef} className="cm-stack cm-slide-in" style={{willChange: "transform"}}>

        <h2 className="cm-h2">선생님 관리</h2>
        {msg && <div className="cm-err" style={{marginBottom: 8}}>{msg}</div>}
        {full === null && <div className="cm-hint" style={{marginBottom: 8}}>담당 반을 읽는 중…</div>}
        {rows.map((t0) => {
          const t = byTid[t0.tid] || t0;
          return (
          <div key={t.tid} style={{borderBottom: "1px solid #e8e0d4", padding: "12px 0"}}>
            <div style={{display: "flex", alignItems: "center", gap: 8}}>
              <strong>{t.name}</strong>
              {t.role === "owner" && <span className="cm-day-sub">관리자</span>}
              {isPending(t) && <span className="cm-day-sub" style={{color: "#d6453f"}}>승인 대기</span>}
              <span style={{marginLeft: "auto"}}>
                {isPending(t) ? (<>
                  <button className="cm-link" style={{color: "var(--green)", fontWeight: 700}}
                    onClick={() => act(() => updateTeacher(t.tid, { status: "active" }), "승인")}>승인</button>
                  <button className="cm-link" style={{color: "#d6453f"}}
                    onClick={() => { if (confirm(t.name + " 선생님의 등록 요청을 거절(삭제)할까요?")) act(() => deleteTeacher(t.tid), "거절"); }}>거절</button>
                </>) : (<>
                  {t.tid !== me.tid && t.role !== "owner" && <button className="cm-link" onClick={() => doDelete(t)}>삭제</button>}
                  <button className="cm-link" onClick={() => { setResetTid(resetTid === t.tid ? null : t.tid); setNewPin(""); }}>PIN 변경</button>
                </>)}
              </span>
            </div>
            {resetTid === t.tid && (
              <div style={{display: "flex", gap: 8, marginTop: 8}}>
                <input className="cm-input" style={{margin: 0}} type="password" inputMode="numeric" maxLength={4} placeholder="새 PIN 4자리"
                  value={newPin} onChange={(e) => setNewPin(e.target.value.replace(/\D/g, ""))} />
                <button className="cm-btn cm-btn-ghost" onClick={() => doResetPin(t)}>저장</button>
              </div>
            )}
            {t.role !== "owner" && (
              <div style={{display: "flex", gap: 6, flexWrap: "wrap", marginTop: 8, alignItems: "center"}}>
                {/* 종강한 반은 숨기되, 이미 담당으로 걸려 있으면 뺄 수 있도록 남겨둔다 */}
                {CLASSES.filter((c) => !isClassEnded(c) || (t.classIds || []).includes(c.id)).map((c) => {
                  const on = (t.classIds || []).includes(c.id);
                  return <button key={c.id} className={"cm-ab-tab" + (on ? " on" : "")}
                    disabled={full === null || busy === t.tid + c.id}

                })}
                <span style={{fontSize: 11, color: "var(--muted)"}}>
                  {(t.classIds || []).length ? "담당 " + t.classIds.length + "개" : "담당 없음"}
                </span>
              </div>
            )}
          </div>
          );
        })}
      </div>
      <button className="cm-link cm-home-back" onClick={onBack}>← 돌아가기</button>
    </div>
  );
}

// 터치 기기(아이폰·아이패드)에는 이 앱으로 파일을 끌어올 방법이 없다.
// 안내 문구를 거기까지 띄우면 될 리 없는 걸 하라고 하는 셈이라 마우스가 있을 때만 말한다.
const canDragDrop = typeof window !== "undefined" && window.matchMedia
  ? window.matchMedia("(hover: hover) and (pointer: fine)").matches : false;

// ----- 저장된 값을 편집하되, 밖에서 바뀌면 따라가기 -----
// `useState(props에서 읽은 값)`은 **처음 뜰 때 한 번만** 읽는다. 그 뒤로 저장된 값이
// 바뀌어도 편집기는 옛 값을 들고 있고, 그 상태로 저장을 누르면 **옛 값이 덮어쓴다.**
//
// 그래서: 대상이 바뀌면 무조건 다시 읽고, 같은 대상인데 저장된 값이 달라졌으면
// **내가 고치던 중이 아닐 때만** 따라간다 (입력 중에 값이 튀면 안 된다).
function useEditable(value, key) {
  const [draft, setDraft] = useState(value);
  const [dirty, setDirty] = useState(false);
  const sig = JSON.stringify(value);
  const keyRef = React.useRef(key);
  const sigRef = React.useRef(sig);
  const dirtyRef = React.useRef(false);
  dirtyRef.current = dirty;
  useEffect(() => {
    if (keyRef.current !== key) {          // 다른 반·다른 학생으로 옮겨감
      keyRef.current = key; sigRef.current = sig;
      setDraft(value); setDirty(false); return;
    }
    if (sig !== sigRef.current) {          // 저장된 값이 밖에서 바뀜
      sigRef.current = sig;
      if (!dirtyRef.current) setDraft(value);
    }
  }, [key, sig]);
  const edit = (v) => { setDirty(true); setDraft(v); };
  // 저장 성공 후: 이 값을 기준으로 삼고 편집중 표시를 끈다
  const settle = (v) => { sigRef.current = JSON.stringify(v); setDraft(v); setDirty(false); };
  return [draft, edit, dirty, settle];
}

// ----- 드래그해서 파일 올리기 -----
// { over, handlers } 를 돌려준다. handlers를 감쌀 요소에 그대로 펼쳐 넣으면 된다.
//
// dragenter/dragleave는 자식 위로 지나갈 때마다 쌍으로 또 난다. 그래서 카운터로 센다
// (사이드바 hasSide를 카운터로 바꾼 것과 같은 이유 — 불리언으로 두면 자식 하나 지날 때마다 꺼진다).
// dragover에서 preventDefault를 안 하면 drop 자체가 안 나고 브라우저가 파일을 열어버린다.
function useFileDrop(onFiles, enabled) {
  const [over, setOver] = useState(false);
  const depth = React.useRef(0);
  // 파일을 끌 때만 반응한다. 글자 선택을 끌고 다녀도 켜지면 안 된다
  const hasFiles = (e) => Array.from((e.dataTransfer && e.dataTransfer.types) || []).includes("Files");
  if (!enabled) return { over: false, handlers: {} };
  return {
    over,
    handlers: {
      onDragEnter: (e) => { if (!hasFiles(e)) return; e.preventDefault(); depth.current++; setOver(true); },
      onDragOver: (e) => { if (!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = "copy"; },
      onDragLeave: (e) => { if (!hasFiles(e)) return; depth.current = Math.max(0, depth.current - 1); if (depth.current === 0) setOver(false); },
      onDrop: (e) => {
        if (!hasFiles(e)) return;
        e.preventDefault(); depth.current = 0; setOver(false);
        const list = Array.from(e.dataTransfer.files || []);
        if (list.length) onFiles(list);
      },
    },
  };
}

// 드롭존 밖에 떨어뜨렸을 때 브라우저가 그 파일로 이동해 버리는 것을 막는다.
// 앱이 통째로 사라지고 쓰던 화면을 잃는다 — 실수 한 번의 대가가 너무 크다.
function useBlockStrayDrop() {
  useEffect(() => {
    const stop = (e) => {
      if (!Array.from((e.dataTransfer && e.dataTransfer.types) || []).includes("Files")) return;
      e.preventDefault();
      if (e.type === "drop" && e.dataTransfer) e.dataTransfer.dropEffect = "none";
    };
    window.addEventListener("dragover", stop);
    window.addEventListener("drop", stop);
    return () => { window.removeEventListener("dragover", stop); window.removeEventListener("drop", stop); };
  }, []);
}

function useSwipeBack(onBack) {
  const onBackRef = React.useRef(onBack);
  onBackRef.current = onBack;
  const cleanupRef = React.useRef(null);
  return React.useCallback((el) => {
    if (cleanupRef.current) { cleanupRef.current(); cleanupRef.current = null; }
    if (!el) return;
    // DOM 노드가 재사용되는 경우(같은 컴포넌트 내 화면 전환) 이전 스와이프 잔재 제거
    el.style.transition = "none";
    el.style.transform = "";
    let start = null;
    let active = false;
    function onStart(e) {
      if (e.target.closest && e.target.closest("[data-no-swipe]")) { start = null; return; }
      start = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      active = false;
      el.style.animation = "none";
      el.style.transition = "none";
    }
    function onMove(e) {
      if (!start) return;
      const dx = e.touches[0].clientX - start.x;
      const dy = e.touches[0].clientY - start.y;
      if (!active) {
        if (dx > 10 && Math.abs(dx) > Math.abs(dy)) { active = true; }
        else if (Math.abs(dy) > 10 || dx < -10) { start = null; return; }
        else return;
      }
      e.preventDefault();
      el.style.transform = "translateX(" + Math.max(0, dx) + "px)";
    }
    function onEnd(e) {
      if (!start) return;
      const dx = e.changedTouches[0].clientX - start.x;
      start = null;
      el.style.transition = "transform 0.22s cubic-bezier(.25,.8,.25,1)";
      if (active && dx > 80) {
        el.style.transform = "translateX(" + window.innerWidth + "px)";
        setTimeout(() => {
          onBackRef.current();
          // 같은 노드가 다음 화면에 재사용될 수 있으므로 즉시 원복
          el.style.transition = "none";
          el.style.transform = "";
          active = false;
        }, 230);
      } else {
        el.style.transform = "";
        active = false;
      }
    }
    el.style.touchAction = "pan-y";
    el.addEventListener("touchstart", onStart, { passive: true });
    el.addEventListener("touchmove", onMove, { passive: false });
    el.addEventListener("touchend", onEnd, { passive: true });
    el.addEventListener("touchcancel", onEnd, { passive: true });
    cleanupRef.current = () => {
      el.removeEventListener("touchstart", onStart);
      el.removeEventListener("touchmove", onMove);
      el.removeEventListener("touchend", onEnd);
      el.removeEventListener("touchcancel", onEnd);
    };
  }, []);
}

          placeholder="학생들이 앱을 열면 보이는 공지를 입력하세요"
          value={noticeText} onChange={(e) => setNoticeText(e.target.value)} />
        <div style={{ display: "flex", gap: 10, marginTop: 12 }}>
          <button className="cm-btn cm-btn-primary" style={{ margin: 0 }}
            onClick={() => noticeText.trim() && postNotice(cls.id, noticeText.trim())}>공지 올리기</button>
          {hasActive && (
            <button className="cm-btn cm-btn-ghost" style={{ margin: 0 }}
              onClick={() => { clearNotice(cls.id); setNoticeText(""); }}>공지 지우기</button>
          )}
        </div>
        </>)}
      </div>

      {/* 개인 공지 */}
      {canEdit && (
      <div className="cm-card">
        <h3 className="cm-h3">개인 공지</h3>
        <label className="cm-label">학생 선택</label>
        <select className="cm-input" value={dmStudent} onChange={(e) => {
          const sid = e.target.value;
          setDmStudent(sid);
          const existing = activeDms[sid];
