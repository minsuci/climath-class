          ) : (
            <>
              <button className="cm-btn cm-btn-primary cm-big" onClick={() => checkIn(cls.id, todayStr, me)}>출석하기</button>
              <div className="cm-hint" style={{ marginTop: 14, textAlign: "center" }}>출석체크를 해야 질문 · 과제를 쓸 수 있어요.</div>
            </>
          )}
        </div>
      )}
      {activeTab === "q" && <QuestionForm cls={cls} me={me} />}
      {activeTab === "hw" && <StudentHomework cls={cls} me={me} />}
      {activeTab === "score" && (<>
        <ScoreForm cls={cls} me={me} />
        <div className="cm-card">
          <h3 className="cm-h3">점수 추이 <span className="cm-h-hint">(그동안 본 테스트)</span></h3>
          <ScoreTrend cls={cls} sid={me.id} />
        </div>
      </>)}
      {activeTab === "prog" && <StudentProgressView cls={cls} me={me} />}
      {activeTab === "flyer" && <FlyerView cls={cls} />}
      {activeTab === "exam" && <ExamForm cls={cls} me={me} />}
      {activeTab === "notes" && (
        <div className="cm-card">
          <h3 className="cm-h3">강의노트</h3>
          <NotesManager cls={cls} canEdit={false} />
        </div>
      )}
      {activeTab === "ai" && <AIChat cls={cls} me={me} />}
    </div>
  </>);
}

function ChangePin({ cls, me, onDone }) {
  const [p1, setP1] = useState("");
  const [p2, setP2] = useState("");
  const [cur, setCur] = useState("");
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);
  const needCur = !SESSION_PIN;   // 새로고침 뒤라 세션에 없으면 직접 받는다
  async function save() {
    if (busy) return;
    if (needCur && cur.length !== 4) { setMsg("지금 쓰는 PIN을 입력해줘"); return; }
    if (p1.length !== 4) { setMsg("PIN은 4자리로 입력해줘"); return; }
    if (p1 !== p2) { setMsg("두 번 입력한 PIN이 달라"); return; }
    setBusy(true);
    try {
      await authApi({ action: "changePin", name: me.name, oldPin: needCur ? cur : SESSION_PIN, newPin: p1 });
      setPinKept(p1);
      setMsg("비밀번호가 변경됐어요"); setTimeout(onDone, 800);
    } catch (e) { setMsg(e.message); }
    setBusy(false);
  }
  return (
    <div className="cm-card">
      <h3 className="cm-h3">비밀번호 변경</h3>
      {needCur && (<>
        <label className="cm-label">지금 쓰는 PIN</label>
        <input className="cm-input" type="password" inputMode="numeric" maxLength={4} value={cur}
          onChange={(e) => setCur(e.target.value.replace(/\D/g, ""))} />
      </>)}
      <label className="cm-label">새 PIN (숫자 4자리)</label>
      <input className="cm-input" type="password" inputMode="numeric" maxLength={4} value={p1} onChange={(e) => setP1(e.target.value.replace(/\D/g, ""))} />
      <label className="cm-label">새 PIN 다시 입력</label>
      <input className="cm-input" type="password" inputMode="numeric" maxLength={4} value={p2} onChange={(e) => setP2(e.target.value.replace(/\D/g, ""))} />
      {msg && <div className="cm-err">{msg}</div>}
      <button className="cm-btn cm-btn-primary" onClick={save}>저장</button>
      <button className="cm-link" style={{ marginTop: 12, display: "block", textAlign: "center", width: "100%" }} onClick={onDone}>취소</button>
    </div>
  );
}

function QuestionForm({ cls, me }) {
  const books = getStudentBooks(cls, me);
  const [book, setBook] = useState(books.length ? books[0].name : "");
  const [num, setNum] = useState("");
  const [memo, setMemo] = useState("");
  const [sent, setSent] = useState([]);
  useEffect(() => {
    const qcid = questionCid(cls, todayStr);
    const unsub = qCol(qcid, todayStr).where("sid", "==", me.id).onSnapshot((s) => {
      const arr = []; s.forEach((d) => arr.push({ qid: d.id, ...d.data() })); arr.sort((a, b) => a.time - b.time); setSent(arr);
    });
    return () => unsub();
  }, [cls.id, me.id]);
  async function submit() {
    if (!num.trim()) return;
    const nums = num.trim().split(/[^0-9\-()]+/).map((s) => s.trim()).filter((s) => s.length > 0);
    const now = Date.now();
    const qcid = questionCid(cls, todayStr);
    await Promise.all(nums.map((n, i) =>
      addQuestion(qcid, todayStr, { sid: me.id, name: me.name, book, num: n, memo: memo.trim(), time: now + i, resolved: false, fromCid: cls.id, fromClass: cls.name })
    ));
    const parsedNums = nums.map((n) => parseInt(n, 10)).filter((n) => !isNaN(n));
    if (parsedNums.length > 0) {
      await Promise.all(parsedNums.map((n) => addQuestioned(cls.id, me.id, me.name, book, n)));
    }
    setNum(""); setMemo("");
  }
  return (
    <div className="cm-card">
      <h3 className="cm-h3">질문하기</h3>
      <label className="cm-label">교재</label>
      <select className="cm-input" value={book} onChange={(e) => setBook(e.target.value)}>{books.map((b) => <option key={b.name}>{b.name}</option>)}</select>
      <label className="cm-label">문항 번호</label>
      <input className="cm-input" placeholder="예: 124  또는  124-(2)" value={num} onChange={(e) => setNum(e.target.value)} />
      <label className="cm-label">메모 (선택)</label>
      <input className="cm-input" placeholder="예: 적분 구간을 모르겠어요" value={memo} onChange={(e) => setMemo(e.target.value)} />
      <button className="cm-btn cm-btn-primary" onClick={submit}>선생님께 보내기</button>
      {sent.length > 0 && (
        <div className="cm-sentlist">
          <div className="cm-mini-h">내가 보낸 질문</div>
          {sent.slice().reverse().map((q) => (
            <div key={q.qid} className="cm-sent-item">
              <span>{q.book} <b>{q.num}</b>번</span>
              <span className={q.resolved ? "cm-tag-ok" : "cm-tag-wait"}>{q.resolved ? "해결됨" : "대기중"}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function StudentHomework({ cls, me }) {
  const [done, setDone] = useState(null);
  const [qbooks, setQbooks] = useState({});
  useEffect(() => { getMyHw(cls.id, me.id).then((d) => setDone(d)); }, [cls.id, me.id]);
  useEffect(() => {
    const unsub = listenQuestioned(cls.id, me.id, (books) => setQbooks(books));
    return () => unsub();
  }, [cls.id, me.id]);

  function persistBook(bookName, arr) {
    setDone((prev) => ({ ...(prev || {}), [bookName]: arr }));
    saveHwBook(cls.id, me, bookName, arr);
  }
  if (!done) return <div className="cm-card cm-empty">불러오는 중…</div>;
  return (
    <>
      <div className="cm-card cm-hint">
        완료한 번호를 <b>누르거나, 마우스로 드래그</b>해서 칠하세요. 터치 화면에서는 칸을 <b>꾹 눌러 칠하기 모드</b>로 들어간 뒤 손가락을 끌면 됩니다. 표시한 번호는 <b>날마다 지워지지 않고 계속 누적</b>돼요. <b style={{ color: "#d6453f" }}>질문한 번호는 빨간 글씨</b>로 누적 표시되고, 빨간 번호 칩을 눌러 지울 수 있어요.
      </div>
      {getStudentBooks(cls, me).map((b) => (
        <BookHwCard key={b.name} book={b} initial={done[b.name] || []}
          qNumbers={qbooks[b.name]} onClearQuestion={(n) => removeQuestioned(cls.id, me.id, b.name, n)}
          onChange={(arr) => persistBook(b.name, arr)} />
      ))}
    </>
  );
}

// ----- 내신: 학생 입력 -----
function ExamForm({ cls, me }) {
  const [term, setTerm] = useState(null);
  const [mine, setMine] = useState(undefined);
  const [f, setF] = useState({ school: "", grade: "", start: "", end: "", math: "", prep: "", back: "", note: "" });
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);
  const [q, setQ] = useState("");
  const [seen, setSeen] = useState([]);   // 이 반에서 이미 쓴 학교들
  const [peers, setPeers] = useState([]); // 이번 회차에 낸 다른 학생들
  const [shared, setShared] = useState([]); // 선생님이 더해둔 학원 공용 목록
  const [etc, setEtc] = useState(false);    // 기타 = 직접 입력
  const [etcName, setEtcName] = useState("");
  const [sched, setSched] = useState({});   // 선생님이 적어둔 학교 일정
  const autoRef = useRef("");               // 어느 학교로 자동으로 채웠는지

  useEffect(() => listenExamTerm(setTerm), []);
  useEffect(() => {
    if (!term) return;
    return listenExams(cls.id, term, (m) => {
      const v = m[me.id];
      setMine(v || null);
      if (v) setF({ school: v.school || "", grade: v.grade || "", start: v.start || "", end: v.end || "",
                    math: v.math || "", prep: v.prep || "", back: v.back || "", note: v.note || "" });
    });
  }, [cls.id, term, me.id]);

  // 반 명단에 적힌 학교·학년을 먼저 쓴다 (선생님이 학생 명단에서 정해둔 값)
  useEffect(() => {
    if (mine) return;
    const r = (cls.roster || []).find((x) => x.id === me.id);
    if (r && (r.school || r.grade)) {
      setF((p) => (p.school || p.grade ? p : { ...p, school: r.school || "", grade: r.grade || "" }));
    }
  }, [mine, cls.id, me.id]);

  // 없으면 지난 회차 것을 그대로 쓴다 (매번 다시 치게 하지 않는다)
  useEffect(() => {
    if (mine || !term) return;
    examCol(cls.id).where("sid", "==", me.id).get().then((s) => {
      let latest = null;
      s.forEach((d) => { const v = d.data(); if (!latest || (v.updated || 0) > (latest.updated || 0)) latest = v; });
      if (latest) setF((p) => (p.school || p.grade ? p : { ...p, school: latest.school || "", grade: latest.grade || "" }));
    }).catch(() => {});
  }, [mine, term, cls.id, me.id]);

  useEffect(() => {
    if (!term) return;
    return listenExams(cls.id, term, (m) => {
      const arr = Object.keys(m).map((k) => m[k]);
      setPeers(arr.filter((v) => v.sid !== me.id));
    });
  }, [cls.id, term, me.id]);
  useEffect(() => {
    examCol(cls.id).get().then((s2) => {
      const set2 = {};
      s2.forEach((d) => { const v = d.data(); if (v.school) set2[v.school] = 1; });
      setSeen(Object.keys(set2));
    }).catch(() => {});
  }, [cls.id]);

  useEffect(() => listenSchools(setShared), []);
  useEffect(() => listenSchoolTerms(setSched), []);

  // 선생님이 학교 일정을 적어뒀으면 그걸로 채워준다. 학생이 달력을 뒤질 일이 없어지고,
  // 같은 학교인데 값이 갈리는 일도 애초에 안 생긴다. 이미 낸 사람은 안 건드린다.
  // 다르면 학생이 고쳐서 내면 된다 — 분반마다 진짜 다를 수 있다.
  const mySched = (term && f.school && f.grade) ? findSchoolTerm(sched, term, f.school, f.grade) : null;
  useEffect(() => {
    if (mine || !mySched) return;
    const k = f.school + "|" + f.grade;
    if (autoRef.current === k) return;   // 같은 학교로 두 번 덮지 않는다 (고쳐놓은 걸 되돌리게 된다)
    autoRef.current = k;
    setF((prev) => ({ ...prev, start: mySched.start, end: mySched.end, math: mySched.math || "",
      prep: (prev.prep && prev.prep !== dayBefore(prev.math)) ? prev.prep
            : (mySched.math ? dayBefore(mySched.math) : "") }));
  }, [mine, f.school, f.grade, mySched ? examSig(mySched) : ""]);

  const schoolOpts = Array.from(new Set(KNOWN_SCHOOLS.concat(shared).concat(seen)))
    .sort((a, b) => a.localeCompare(b, "ko"));
  // 같은 학교·같은 학년 친구가 이미 낸 일정 (있으면 그대로 쓰게 해준다)
  const sameSchool = (f.school && f.grade)
    ? peers.find((v) => v.school === f.school && v.grade === f.grade && v.start && v.end) || null
    : null;

  function set(k, v) {
    setF((p) => {
      const n = { ...p, [k]: v };
      // 수학시험일을 넣으면 직보를 전날로 채워준다 (직접 고친 적 없을 때만)
      if (k === "math" && (!p.prep || p.prep === dayBefore(p.math))) n.prep = dayBefore(v);
      return n;
    });
  }
  async function submit() {
    if (busy) return;
    if (!f.school.trim()) { setMsg("학교를 입력해주세요"); return; }
    if (!f.grade) { setMsg("학년을 골라주세요"); return; }
    if (!f.start || !f.end) { setMsg("내신 기간을 넣어주세요"); return; }
    if (f.end < f.start) { setMsg("종료일이 시작일보다 빠를 수 없어요"); return; }
    setBusy(true); setMsg("");
    try {
      await saveExam(cls.id, term, me.id, { name: me.name, school: f.school.trim(), grade: f.grade,
        start: f.start, end: f.end, math: f.math, prep: f.prep, note: f.note.trim() });
      setMsg("냈어요 ✓ 선생님이 바로 볼 수 있어요");
    } catch (e) { setMsg("저장 실패: " + e.message); }
    setBusy(false);
  }

  if (term === null) return <div className="cm-card"><div className="cm-empty">불러오는 중…</div></div>;
  if (!term) return (
    <div className="cm-card">
      <h3 className="cm-h3">내신 참여</h3>
      <div className="cm-empty">아직 접수 기간이 아니에요. 선생님이 열면 여기에 나와요.</div>
    </div>
  );
  return (
    <div className="cm-card">
      <h3 className="cm-h3">내신 참여 <span className="cm-h-hint">({term})</span></h3>
      {mySched && !mine && (
        <div className="cm-done" style={{marginBottom: 8}}>
          {f.school} {f.grade} 일정을 선생님이 올려둬서 미리 채워놨어 · {shortDate(mySched.start)}~{shortDate(mySched.end)}
          {mySched.math ? " · 수학 " + shortDate(mySched.math) : ""}
          <br/><span style={{fontSize: 12, opacity: .85}}>네 반이랑 다르면 고쳐서 내면 돼.</span>
        </div>
      )}
      <div className="cm-hint" style={{marginBottom: 6}}>
        내신 기간이 언제인지 알려줘. 정해진 게 바뀌면 다시 내면 돼.
        <br/><b>복귀 날짜는 선생님이 정해서 알려줄 거야.</b>
      </div>
      {mine && <div className="cm-done" style={{marginBottom: 8}}>이미 냈어요 · 고치면 바로 반영돼요</div>}

      <label className="cm-label">학교</label>
      {f.school ? (
        <div style={{display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap"}}>
          <span className="cm-chip" style={{background: "#eef1f6", color: "var(--navy)", fontSize: 14}}>{f.school}</span>
          <button className="cm-link" onClick={() => { set("school", ""); setQ(""); }}>바꾸기</button>
        </div>
      ) : (<>
        <input className="cm-input" placeholder="학교 이름 일부를 쳐봐 (예: 중동)"
          value={q} onChange={(e) => setQ(e.target.value)} />
        <div style={{display: "flex", gap: 6, flexWrap: "wrap", marginTop: 6}}>
          {schoolOpts.filter((x) => !q.trim() || x.includes(q.trim())).slice(0, 14).map((x) => (
            <button key={x} className="cm-ab-tab" onClick={() => { setEtc(false); set("school", x); }}>{x}</button>
          ))}
          <button className={"cm-ab-tab" + (etc ? " on" : "")}
            onClick={() => { setEtc(true); setEtcName(q.trim()); }}>기타 (직접 입력)</button>
        </div>
        {etc && (
          <div style={{display: "flex", gap: 8, alignItems: "center", marginTop: 8, flexWrap: "wrap"}}>
            <input className="cm-input" style={{margin: 0, flex: 1, minWidth: 150}} autoFocus
              placeholder="학교 이름을 적어줘 (예: 세화고)"
              value={etcName} onChange={(e) => setEtcName(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter" && etcName.trim()) { set("school", etcName.trim()); setEtc(false); } }} />
            <button className="cm-btn cm-btn-ghost" style={{margin: 0, width: "auto", padding: "9px 14px"}}
              disabled={!etcName.trim()} onClick={() => { set("school", etcName.trim()); setEtc(false); }}>이 학교로</button>
            <button className="cm-link" onClick={() => setEtc(false)}>취소</button>
          </div>
        )}
      </>)}
      {sameSchool && (
        <div className="cm-hint" style={{marginTop: 8, background: "#eef1f6", padding: "9px 11px", borderRadius: 10}}>
          같은 학교({f.school} {f.grade}) 친구가 낸 일정이 있어.{" "}
          <b>{shortDate(sameSchool.start)}~{shortDate(sameSchool.end)}</b>
          {sameSchool.math ? <> · 수학 <b>{shortDate(sameSchool.math)}</b></> : null}
          <br/>
          <button className="cm-link" style={{padding: 0}} onClick={() => setF((pr) => ({
            ...pr, start: sameSchool.start || "", end: sameSchool.end || "",
            math: sameSchool.math || "", prep: dayBefore(sameSchool.math) }))}>이대로 불러오기</button>
          {" "}— 다르면 그냥 직접 넣으면 돼.
        </div>
      )}
      <label className="cm-label">학년</label>
      <div style={{display: "flex", gap: 6, flexWrap: "wrap"}}>
        {GRADES.map((g) => (
          <button key={g} className={"cm-ab-tab" + (f.grade === g ? " on" : "")} onClick={() => set("grade", g)}>{g}</button>
        ))}
      </div>

      <label className="cm-label">내신 기간</label>
      <div style={{display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap"}}>
        <input className="cm-input" style={{margin: 0, flex: 1, minWidth: 130}} type="date" value={f.start} onChange={(e) => set("start", e.target.value)} />
        <span style={{color: "var(--muted)"}}>~</span>
        <input className="cm-input" style={{margin: 0, flex: 1, minWidth: 130}} type="date" value={f.end} min={f.start} onChange={(e) => set("end", e.target.value)} />
      </div>

      <label className="cm-label">수학 시험 날짜</label>
      <input className="cm-input" type="date" value={f.math} onChange={(e) => set("math", e.target.value)} />
      <label className="cm-label">직보 <span className="cm-h-hint">(수학시험 전날 · 자동으로 채워져요)</span></label>
      <input className="cm-input" type="date" value={f.prep} onChange={(e) => set("prep", e.target.value)} />
      <label className="cm-label">비고 (선택)</label>
      <input className="cm-input" placeholder="예: 수행평가로 목요일 결석" value={f.note} onChange={(e) => set("note", e.target.value)} />

      {mine && mine.back && (
        <div className="cm-hint" style={{marginTop: 10, background: "#e3edf5", color: "#2b5f8a", padding: "9px 11px", borderRadius: 10}}>
          선생님이 정한 <b>복귀 날짜는 {fmtDate(mine.back)}</b>이야. 그날 보자.
        </div>
      )}
      {msg && <div className={msg.includes("✓") ? "cm-done" : "cm-err"}>{msg}</div>}
      <button className="cm-btn cm-btn-primary" disabled={busy} onClick={submit}>{busy ? "내는 중..." : (mine ? "고쳐서 다시 내기" : "제출하기")}</button>
    </div>
  );
}

// ----- 학생 명단 (전역) -----
// 반이 아니라 "사람"을 관리하는 곳. 학교·학년·담임을 여기서 한 번만 정하면
// 그 학생이 속한 모든 반과 내신 참여표가 같이 따라간다.
function StudentDirectory({ me, onBack, initialCls }) {
  const [people, setPeople] = useState(null);
  const [teachers, setTeachers] = useState([]);
  const [q, setQ] = useState("");
  // 반 설정에서 "학생 명단에서 이 반 보기"로 들어오면 그 반이 켜진 채로 뜬다
  const [clsFilter, setClsFilter] = useState(initialCls || "all");  // "all" | 반id | "none"(배정 없음)
  const [gradeF, setGradeF] = useState("all");   // "all" | 학년 | "none"(학년 없음)
  const [open, setOpen] = useState(null);      // 편집 중인 pid ("new"면 새로 추가)
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");
  const [ver, bumpVer] = useState(0);   // 반 배정이 바뀌면 CLASSES를 다시 읽어 그린다
  const [openUnlinked, setOpenUnlinked] = useState(false);
  const [newName, setNewName] = useState("");
  const [sort, setSort] = useState(null);      // {key, dir} — null이면 원래 순서
  const [shared, setShared] = useState([]);
  useEffect(() => listenSchools(setShared), []);  // 미연결 목록은 접어둔다 (수십 건이라 화면을 다 먹는다)
  const backRef = useSwipeBack(onBack);

  const [loadErr, setLoadErr] = useState("");
  useEffect(() => listenStudents((arr) => { setPeople(arr); setLoadErr(""); },
                                 (e) => setLoadErr(friendlyErr(e))), []);
  useEffect(() => { listTeachers().then(setTeachers).catch(() => setTeachers([])); }, []);
  useEffect(() => {
    const el = document.querySelector(".cm-shell");
    if (!el) return;
    el.classList.add("cm-shell-wide");
    return () => el.classList.remove("cm-shell-wide");
  }, []);

  const norm = (x) => String(x || "").replace(/\s+/g, "");
  // 아직 사람 문서에 안 이어진 명단 항목들 (반에만 있는 학생)
  const unlinked = [];
  activeClasses().forEach((c) => {
    (c.roster || []).filter((r) => !r.teacher && !isEnded(r) && !r.pid).forEach((r) => {
      unlinked.push({ cls: c, r: r });
    });
  });
  const byName = {};
  unlinked.forEach((u) => { (byName[norm(u.r.name)] = byName[norm(u.r.name)] || []).push(u); });

  async function autoLink() {
    if (!people) return;
    const map = {};
    people.forEach((p) => { (map[norm(p.name)] = map[norm(p.name)] || []).push(p); });
    // 이름이 하나뿐일 때만 잇는다. 동명이인은 사람이 골라야 한다
    const plan = [];
    Object.keys(byName).forEach((n) => {
      const cand = map[n] || [];
      if (cand.length === 1) byName[n].forEach((u) => plan.push({ u: u, p: cand[0] }));
    });
    if (!plan.length) { setMsg("자동으로 이을 수 있는 게 없어요 (이름이 겹치면 직접 골라야 해요)"); return; }
    if (!confirm("이름이 같은 명단 항목 " + plan.length + "건을 학생 정보에 잇습니다." + "\n" +
      "이름이 겹치는 학생은 건너뜁니다. 계속할까요?")) return;
    setBusy(true); setMsg("");
    try {
      for (const x of plan) await linkRosterToStudent(x.u.cls.id, x.u.r.id, x.p);
      setMsg(plan.length + "건 연결했어요 ✓");
    } catch (e) { setMsg("연결 실패: " + friendlyErr(e)); }
    setBusy(false);
  }

  // 명단에만 있는 학생을 사람 문서로 한번에 만들기
  async function createFromRoster(u) {
    setBusy(true);
    try {
      const pid = await saveStudent(null, { name: u.r.name, school: u.r.school || "", grade: u.r.grade || "", homeroom: "" });
      await linkRosterToStudent(u.cls.id, u.r.id, { pid: pid, school: u.r.school || "", grade: u.r.grade || "" });
      setMsg(u.r.name + " 추가했어요 ✓");
    } catch (e) { setMsg("실패: " + friendlyErr(e)); }
    setBusy(false);
  }

  if (people === null) return <div className="cm-card"><div className="cm-empty">불러오는 중…</div></div>;
  const tName = (tid) => { const t = teachers.find((x) => x.tid === tid); return t ? t.name : ""; };
  // curated = 우리가 아는 학교(기본 목록 + 선생님이 올린 것). "목록에 없어요" 판정은 이것만 본다.
  // schoolOpts = 거기에 이미 쓰이는 학교까지 더한 것. 고르는 목록과 이름 맞추기에 쓴다.
  // 판정까지 schoolOpts로 하면 오타를 저장하는 순간 그 오타가 "아는 학교"가 돼 표시가 사라진다.
  const curated = Array.from(new Set(KNOWN_SCHOOLS.concat(shared)));
  const schoolOpts = Array.from(new Set(curated
    .concat(people.map((x) => x.school).filter(Boolean)))).sort((a, b) => a.localeCompare(b, "ko"));

  async function addNew() {
    const nm = newName.trim();
    if (!nm || busy) return;
    setBusy(true); setMsg("");
    try { await saveStudent(null, { name: nm, school: "", grade: "", homeroom: "" }); setNewName(""); }
    catch (e) { setMsg("추가 실패: " + friendlyErr(e)); }
    setBusy(false);
  }

  // 반별 보기 — 어느 반에 몇 명인지 세고, 고른 반의 명단 순서대로 보여준다
  const inCls = (p, cid) => (CLASSES.find((c) => c.id === cid) || { roster: [] }).roster
    .some((r) => r.pid === p.pid);
  const countIn = (cid) => people.filter((p) => inCls(p, cid)).length;
  const noneCount = people.filter((p) => classesOfPerson(p.pid).length === 0).length;

  let shown = people;
  if (clsFilter === "none") shown = people.filter((p) => classesOfPerson(p.pid).length === 0);
  else if (clsFilter !== "all") {
    const c = CLASSES.find((x) => x.id === clsFilter);
    const order = {};
    ((c && c.roster) || []).forEach((r, i) => { if (r.pid) order[r.pid] = i; });
    shown = people.filter((p) => order[p.pid] != null).sort((a, b) => order[a.pid] - order[b.pid]);
  }
  // 학년으로 한 번 더 거른다. 고1이 대부분이라 학년을 못 고르면 목록이 늘 한 덩어리다.
  const gradeCount = (g) => people.filter((x) => (g === "none" ? !x.grade : x.grade === g)).length;
  if (gradeF === "none") shown = shown.filter((x) => !x.grade);
  else if (gradeF !== "all") shown = shown.filter((x) => x.grade === gradeF);
  if (q.trim()) shown = shown.filter((p) => norm(p.name).includes(norm(q)) || String(p.school || "").includes(q.trim()));

  // 열 머리를 누르면 오름차순 → 내림차순 → 원래 순서로 돈다.
  // 빈 칸은 방향과 상관없이 늘 맨 아래 — 안 채운 학생을 찾으려고 정렬하는 게 아니니까.
  // 학년은 글자 순(고1<고2<고3<중3)이 아니라 학년 순으로 센다.
  if (sort) {
    const gi = (g) => { const i = GRADES.indexOf(g); return i < 0 ? 99 : i; };
    const keyOf = (p) => {
      if (sort.key === "name") return p.name || "";
      if (sort.key === "school") return p.school || "";
      if (sort.key === "grade") return p.grade ? String(100 + gi(p.grade)) : "";
      if (sort.key === "homeroom") return tName(p.homeroom);
      return classesOfPerson(p.pid).map((x) => x.cls.name).join(" · ");
    };
    const byName = (a, b) => String(a.name || "").localeCompare(String(b.name || ""), "ko");
    shown = shown.slice().sort((a, b) => {
      const x = keyOf(a), y = keyOf(b);
      if (!x && !y) return byName(a, b);
      if (!x) return 1;
      if (!y) return -1;
      const c = x.localeCompare(y, "ko");
      return (sort.dir === "desc" ? -c : c) || byName(a, b);
    });
  }
  // 학년을 안 골랐을 때는 학년별로 묶어서 보여준다. 정렬은 묶음 안에서 그대로 걸린다.
  const groups = [];
  if (gradeF === "all") {
    GRADES.concat(["__none"]).forEach((g) => {
      const rows = shown.filter((x) => (g === "__none" ? !x.grade : x.grade === g));
      if (rows.length) groups.push({ key: g, label: g === "__none" ? "학년 없음" : g, rows: rows });
    });
  } else {
    groups.push({ key: "one", label: "", rows: shown });
  }

  // 학년 없는 학생을 한 번에 넣는다. 새 학년이 올라올 때마다 한 명씩 고르면 끝이 없다.
  async function bulkGrade(g) {
    const list = shown.filter((x) => !x.grade);
    if (!list.length || busy) return;
    if (!confirm("지금 보이는 학년 없는 학생 " + list.length + "명을 " + g + "로 넣습니다." + "\n" +
      "이미 학년이 있는 학생은 건드리지 않아요. 계속할까요?")) return;
    setBusy(true); setMsg("");
    let n = 0;
    try {
      for (const x of list) {
        await saveStudent(x.pid, { grade: g });
        await syncStudentToRosters({ pid: x.pid, name: x.name, school: x.school, grade: g });
        n++;
      }
      setMsg(n + "명을 " + g + "로 넣었어요 ✓");
    } catch (e) { setMsg("넣다 멈췄어요 (" + n + "명까지): " + friendlyErr(e)); }
    setBusy(false);
  }

  const sortTh = (key, label, w) => {
    const on = sort && sort.key === key;
    return (
      <th className={"cm-sort" + (key === "name" ? " cm-ab-name" : "")} style={{width: w}}
        onClick={() => setSort((v) => (!v || v.key !== key)
          ? { key: key, dir: "asc" }
          : (v.dir === "asc" ? { key: key, dir: "desc" } : null))}>
        {label} <span className={"cm-sheet-ar" + (on ? "" : " off")}>{on ? (sort.dir === "asc" ? "▲" : "▼") : "↕"}</span>
      </th>
    );
  };

  return (
    <div ref={backRef} className="cm-stack cm-slide-in" style={{willChange: "transform"}}>
      <div className="cm-card">
        <div className="cm-admin-top" style={{marginBottom: 10}}>
          <h2 className="cm-h2" style={{margin: 0}}>학생 명단</h2>
          <button className="cm-link cm-home-back" onClick={onBack}>← 돌아가기</button>
        </div>
        <div className="cm-hint" style={{marginBottom: 10}}>
          반이 아니라 <b>사람</b>을 관리하는 곳이에요. 학교·학년·담임을 여기서 정하면
          그 학생이 속한 모든 반과 내신 참여표가 같이 따라가요.
        </div>

        <div style={{display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", marginBottom: 10}}>
          <input className="cm-input" style={{margin: 0, flex: 1, minWidth: 160}} placeholder="이름 · 학교로 찾기"
            value={q} onChange={(e) => setQ(e.target.value)} />

        </div>
        {/* 학년이 먼저다. 반은 그 아래에서 다시 좁힌다. */}
        <div style={{display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8, alignItems: "center"}}>
          <span style={{fontSize: 11, color: "var(--muted)", marginRight: 2}}>학년</span>
          <button className={"cm-ab-tab" + (gradeF === "all" ? " on" : "")}
            onClick={() => setGradeF("all")}>전체 {people.length}</button>
          {/* 아직 학생이 없는 학년도 띄워둔다 — 새 학년을 받을 자리가 보여야 한다 */}
          {GRADES.map((g) => (
            <button key={g} className={"cm-ab-tab" + (gradeF === g ? " on" : "")}
              onClick={() => setGradeF(g)}>{g} {gradeCount(g)}</button>
          ))}
          {gradeCount("none") > 0 && (
            <button className={"cm-ab-tab" + (gradeF === "none" ? " on" : "")}
              onClick={() => setGradeF("none")}
              style={gradeF === "none" ? undefined : { background: "#f6e7df", color: "#c2703f", borderColor: "#e6cbb9" }}>
              학년 없음 {gradeCount("none")}
            </button>
          )}
        </div>
        <div style={{display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10, alignItems: "center"}}>
          <span style={{fontSize: 11, color: "var(--muted)", marginRight: 2}}>반</span>
          <button className={"cm-ab-tab" + (clsFilter === "all" ? " on" : "")}
            onClick={() => setClsFilter("all")}>전체 {people.length}</button>
          {activeClasses().map((c) => (
            <button key={c.id} className={"cm-ab-tab" + (clsFilter === c.id ? " on" : "")}
              onClick={() => setClsFilter(c.id)}>{c.name} {countIn(c.id)}</button>
          ))}
          {noneCount > 0 && (
            <button className={"cm-ab-tab" + (clsFilter === "none" ? " on" : "")}
              onClick={() => setClsFilter("none")}
              style={clsFilter === "none" ? undefined : { background: "#f6e7df", color: "#c2703f", borderColor: "#e6cbb9" }}>
              배정 없음 {noneCount}
            </button>
          )}
        </div>
        {loadErr && (
          <div style={{background: "#fae3e2", border: "1px solid #eec9c7", borderRadius: 12,
               padding: "12px 14px", marginBottom: 12, color: "#a5322d", fontSize: 13, lineHeight: 1.6}}>
            <b>학생 명단을 읽지 못했어요.</b><br/>{loadErr}
          </div>
        )}
        {msg && <div className={msg.includes("✓") ? "cm-done" : "cm-err"} style={{marginBottom: 8}}>{msg}</div>}

        {/* 아직 안 이어진 명단 항목 */}
        {unlinked.length > 0 && (
          <div style={{background: "#f6e7df", border: "1px solid #e6cbb9", borderRadius: 12, padding: "12px 14px", marginBottom: 12}}>
            <div style={{display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap"}}>
              <button className="cm-link" style={{color: "#a8562c", textDecoration: "none", padding: 0, fontWeight: 700, fontSize: 14}}
                onClick={() => setOpenUnlinked((v) => !v)}>
                {openUnlinked ? "▾" : "▸"} 학생 정보가 없는 명단 항목 {unlinked.length}건
              </button>
              <button className="cm-btn cm-btn-ghost" style={{margin: 0, marginLeft: "auto", width: "auto", padding: "7px 12px", fontSize: 13}}
                disabled={busy} onClick={autoLink}>이름이 같은 것끼리 잇기</button>
            </div>
            {openUnlinked && (<>
              <div style={{fontSize: 12, color: "#a8562c", lineHeight: 1.55, margin: "8px 0"}}>
                반에는 있는데 아직 사람 정보가 없어요. 이어주면 학교·학년·담임을 한 번만 넣으면 됩니다.
                <b> 이름이 겹치는 학생은 자동으로 잇지 않아요</b> — 다른 사람일 수 있으니까요.
                아래 이름을 누르면 하나씩 만들어져요.
              </div>
              {activeClasses().map((c) => {
                const mine = unlinked.filter((u) => u.cls.id === c.id);
                if (!mine.length) return null;
                return (
                  <div key={c.id} style={{marginTop: 8}}>
                    <div style={{fontSize: 12, color: "#a8562c", fontWeight: 700, marginBottom: 4}}>{c.name} · {mine.length}명</div>
                    <div style={{display: "flex", gap: 6, flexWrap: "wrap"}}>
                      {mine.map((u) => (
                        <button key={u.cls.id + u.r.id} className="cm-ab-tab" disabled={busy}
                          onClick={() => createFromRoster(u)}>{u.r.name} +</button>
                      ))}
                    </div>
                  </div>
                );
              })}
            </>)}
          </div>
        )}

        {gradeF === "none" && shown.length > 0 && (
          <div style={{background: "#f6e7df", border: "1px solid #e6cbb9", borderRadius: 10,
               padding: "9px 11px", marginBottom: 10, display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center"}}>
            <span style={{fontSize: 12, color: "#a8562c"}}>
              지금 보이는 <b>{shown.length}명</b>을 한 학년으로 넣기 →
            </span>
            {GRADES.map((g) => (
              <button key={g} className="cm-ab-tab" disabled={busy} onClick={() => bulkGrade(g)}>{g}</button>
            ))}
          </div>
        )}

        <div style={{fontSize: 12, color: "var(--muted)", marginBottom: 6}}>
          {gradeF === "all" ? "" : (gradeF === "none" ? "학년 없음 · " : gradeF + " · ")}
          {clsFilter === "all" ? "전체" : (clsFilter === "none" ? "배정된 반이 없는 학생" : (findClass(clsFilter) || {}).name)}
          {" · "}{shown.length}명
          {clsFilter !== "all" && clsFilter !== "none" && " (명단 순서)"}
          {" · "}<span style={{color: "#8a7f72"}}>칸을 바로 고치면 저장돼요</span>
        </div>

        {/* 학교 칸은 치면서 고른다. 목록에 있는 학교는 밑에 떠서 고르면 되고,
            대충 쳐도 matchSchool()이 아는 이름으로 맞춰준다. */}
        <datalist id="cm-school-list">
          {schoolOpts.map((x) => <option key={x} value={x} />)}
        </datalist>
        <div className="cm-ab-wrap" data-no-swipe>
          <table className="cm-ab-table cm-sheet">
            <thead>
              <tr>
                {sortTh("name", "이름", 88)}
                {sortTh("school", "학교", 132)}
                {sortTh("grade", "학년", 62)}
                {sortTh("homeroom", "담임", 92)}
                {sortTh("cls", "반", 240)}
                <th style={{width: 52}}></th>
                {/* 남는 자리를 먹는 빈 열 — 없으면 반 칸이 화면 끝까지 늘어난다 */}
                <th></th>
              </tr>
            </thead>
            <tbody>
              {shown.length === 0 && (
                <tr><td colSpan={7} style={{color: "var(--muted)", padding: "14px"}}>아직 없어요</td></tr>
              )}
              {groups.map((g) => (
                <React.Fragment key={g.key}>
                  {g.label && (
                    <tr><td className="cm-sheet-grp" colSpan={7}>{g.label} · {g.rows.length}명</td></tr>
                  )}
                  {g.rows.map((p) => (
                    <StudentRow key={p.pid} person={p} teachers={teachers} schoolOpts={schoolOpts} curated={curated}
                      expanded={open === p.pid} onToggle={() => setOpen(open === p.pid ? null : p.pid)}
                      onChanged={() => bumpVer((v) => v + 1)}
                      onMsg={setMsg} />
                  ))}
                </React.Fragment>
              ))}
              {/* 새 줄 — 이름만 치면 만들어진다 */}
              <tr>
                <td className="cm-ab-name" style={{padding: 3}}>
                  <input className="cm-sheet-in" placeholder="+ 새 학생" value={newName}
                    onChange={(e) => setNewName(e.target.value)}
                    onKeyDown={(e) => { if (e.key === "Enter") addNew(); }} />
                </td>
                <td colSpan={6} style={{textAlign: "left", padding: "3px 6px"}}>
                  {newName.trim()
                    ? <button className="cm-link" disabled={busy} onClick={addNew}>이름 넣고 Enter — 또는 여기를 눌러 추가</button>
                    : <span style={{fontSize: 12, color: "#b6ab9b"}}>이름을 치면 새 학생이 만들어져요</span>}
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// 표의 한 줄. 칸을 고치면 바로 저장한다 (엑셀처럼).
// 고르는 칸(학교·학년·담임)은 즉시, 이름은 칸을 벗어날 때.
function StudentRow({ person, teachers, schoolOpts, curated, expanded, onToggle, onChanged, onMsg }) {
  const [name, setName] = useState(person.name || "");
  const [school, setSchool] = useState(person.school || "");
  const [busy, setBusy] = useState(false);
  const [ok, setOk] = useState(false);
  useEffect(() => { setName(person.name || ""); }, [person.name]);
  useEffect(() => { setSchool(person.school || ""); }, [person.school]);

  function flash() { setOk(true); setTimeout(() => setOk(false), 1200); }
  async function patch(data) {
    if (busy) return;
    setBusy(true);
    try {
      await saveStudent(person.pid, data);
      await syncStudentToRosters({ pid: person.pid,
        name: data.name !== undefined ? data.name : person.name,
        school: data.school !== undefined ? data.school : person.school,
        grade: data.grade !== undefined ? data.grade : person.grade });
      flash(); onChanged && onChanged();
    } catch (e) { onMsg("저장 실패: " + friendlyErr(e)); }
    setBusy(false);
  }
  // 치는 동안은 그대로 두고, 칸을 벗어날 때 아는 이름으로 맞춰 저장한다
  function settleSchool() {
    const v = matchSchool(school, schoolOpts);
    setSchool(v);
    if (v !== (person.school || "")) patch({ school: v });
  }
  async function remove() {
    if (!confirm(person.name + " 학생 정보를 지울까요?" + "\n" +
      "반 명단과 출결·과제 기록은 그대로 남아요. 학교·학년·담임만 사라집니다.")) return;
    setBusy(true);
    try { await deleteStudent(person.pid); onChanged && onChanged(); }
    catch (e) { onMsg("삭제 실패: " + friendlyErr(e)); setBusy(false); }
  }

  const mine = classesOfPerson(person.pid);
  const odd = !!person.school && (curated || []).indexOf(person.school) < 0;
  const cellStyle = { padding: 3, background: ok ? "#e6f0e9" : undefined, transition: "background .4s" };
  return (<>
    <tr>
      <td className="cm-ab-name" style={cellStyle}>
        <input className="cm-sheet-in" value={name} disabled={busy}
          onChange={(e) => setName(e.target.value)}
          onBlur={() => { const v = name.trim(); if (v && v !== person.name) patch({ name: v }); else setName(person.name || ""); }}
          onKeyDown={(e) => { if (e.key === "Enter") e.target.blur(); }} />
      </td>
      <td style={cellStyle}>
        <input className={"cm-sheet-in" + (odd ? " odd" : "")} list="cm-school-list" value={school} disabled={busy}
          title={odd ? "아는 학교 목록에 없어요. 이름이 맞는지 확인해주세요." : undefined}
          placeholder="—" onChange={(e) => setSchool(e.target.value)} onBlur={settleSchool}
          onKeyDown={(e) => { if (e.key === "Enter") e.target.blur(); }} />
      </td>
      <td style={cellStyle}>
        <select className="cm-sheet-in" value={person.grade || ""} disabled={busy} onChange={(e) => patch({ grade: e.target.value })}>
          <option value="">—</option>
          {GRADES.map((g) => <option key={g} value={g}>{g}</option>)}
        </select>
      </td>
      <td style={cellStyle}>
        <select className="cm-sheet-in" value={person.homeroom || ""} disabled={busy} onChange={(e) => patch({ homeroom: e.target.value })}>
          <option value="">—</option>
          {teachers.filter((t) => (t.status || "active") !== "pending").map((t) => (
            <option key={t.tid} value={t.tid}>{t.name}</option>
          ))}
        </select>
      </td>
      <td style={{ ...cellStyle, textAlign: "left", fontSize: 12, overflow: "hidden", textOverflow: "ellipsis" }}>
        <button className="cm-link" style={{padding: 0, textDecoration: "none"}} onClick={onToggle}>
          {mine.length ? mine.map((x) => x.cls.name).join(" · ") : <span style={{color: "#b6ab9b"}}>없음</span>}
          {" "}{expanded ? "▾" : "▸"}
        </button>
      </td>
      <td style={cellStyle}>
        <button className="cm-link" style={{color: "#d6453f", padding: 0}} disabled={busy} onClick={remove}>삭제</button>
      </td>
      <td style={cellStyle}></td>
    </tr>
    {expanded && (
      <tr>
        <td colSpan={7} style={{textAlign: "left", padding: "8px 10px", background: "#fafbfd"}}>
          <ClassAssign person={person} onChanged={onChanged} onMsg={onMsg} />
        </td>
      </tr>
    )}
  </>);
}

// 반 배정 — 누르면 넣고 뺀다
function ClassAssign({ person, onChanged, onMsg }) {
  const [busy, setBusy] = useState(false);
  const [note, setNote] = useState("");
  async function toggle(c, inIt) {
    if (busy) return;
    if (inIt) {
      if (!confirm(person.name + " 학생을 " + c.name + " 명단에서 뺄까요?" + "\n\n" +
        "출석·과제·질문 기록은 지워지지 않고 남아요. 명단·출석부에서만 사라집니다." +
        (isIndividual(c) ? "\n개별진도반이라 등원요일·교재 설정도 함께 사라져요." : ""))) return;
      setBusy(true); setNote("");
      try { await unassignFromClass(c.id, person.pid); onChanged && onChanged(); }
      catch (e) { onMsg("빼지 못했어요: " + friendlyErr(e)); }
      setBusy(false);
      return;
    }
    setBusy(true); setNote("");
    try {
      await assignToClass(c.id, person);
      setNote(isIndividual(c) ? c.name + "에 넣었어요. 등원요일·교재는 반 설정 → 학생별 설정에서 정해주세요." : "");
      onChanged && onChanged();
    } catch (e) { onMsg("넣지 못했어요: " + friendlyErr(e)); }
    setBusy(false);
  }
  return (
    <div>
      <div style={{fontSize: 12, color: "var(--muted)", marginBottom: 6}}>반 배정 — 누르면 넣고 빼요</div>
      <div style={{display: "flex", gap: 6, flexWrap: "wrap"}}>
        {activeClasses().map((c) => {
          const inIt = (c.roster || []).some((r) => r.pid === person.pid);
          return <button key={c.id} className={"cm-ab-tab" + (inIt ? " on" : "")} disabled={busy}
            onClick={() => toggle(c, inIt)}>{c.name}</button>;
        })}
      </div>
      {note && <div className="cm-hint" style={{marginTop: 6, color: "#c2703f"}}>{note}</div>}
    </div>
  );
}

// 선생님이 학생 대신 넣는 칸. 전화로 받아적거나 학생이 안 내면 여기서 채운다.
// 학생 폼과 같은 곳(exams/{회차}__{sid})에 쓰므로 나중에 학생이 내면 그 위에 덮인다.
function ExamEntry({ cls, term, st, cur, schoolOpts, onDone }) {
  const [f, setF] = useState({
    school: (cur && cur.school) || st.school || "", grade: (cur && cur.grade) || st.grade || "",
    start: (cur && cur.start) || "", end: (cur && cur.end) || "",
    math: (cur && cur.math) || "", prep: (cur && cur.prep) || "",
    back: (cur && cur.back) || "", note: (cur && cur.note) || "",
  });
  const [q, setQ] = useState("");
  const [etc, setEtc] = useState(false);
  const [etcName, setEtcName] = useState("");
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);
  const [mode, setMode] = useState("exam");
  const [anchor, setAnchor] = useState("");
  const [pmonth, setPmonth] = useState(((cur && cur.start) || todayStr).slice(0, 7));
  const [days, setDays] = useState(
    (cur && cur.days && cur.days.length) ? cur.days
      : (isIndividual(cls) ? ((st.days || []).slice()) : ((cls.classDays || []).slice())));

  // 칠할 달의 날짜들
  const paintDays = [];
  {
    const yy = Number(pmonth.slice(0, 4)), mm = Number(pmonth.slice(5, 7));
    const last = new Date(yy, mm, 0).getDate();
    for (let i = 1; i <= last; i++) paintDays.push(ymd(new Date(yy, mm - 1, i)));
  }
  function paintMark(d) {
    if (f.math && d === f.math) return EXAM_MARKS.math;
    if (f.prep && d === f.prep) return EXAM_MARKS.prep;
    if (f.back && d === f.back) return EXAM_MARKS.back;
    if (anchor && d === anchor) return EXAM_MARKS.exam;
    if (f.start && f.end && d >= f.start && d <= f.end) return EXAM_MARKS.exam;
    return null;
  }
  function paint(d) {
    if (mode === "erase") {
      setF((p) => {
        const n = { ...p };
        if (p.math === d) n.math = "";
        if (p.prep === d) n.prep = "";
        if (p.back === d) n.back = "";
        if (p.start && p.end && d >= p.start && d <= p.end) { n.start = ""; n.end = ""; }
        return n;
      });
      setAnchor("");
      return;
    }
    if (mode === "exam") {
      if (!anchor) { setAnchor(d); setF((p) => ({ ...p, start: d, end: d })); return; }
      const a = anchor < d ? anchor : d, b = anchor < d ? d : anchor;
      setF((p) => ({ ...p, start: a, end: b }));
      setAnchor("");
      return;
    }
    // math / prep / back — 한 날짜. 같은 날 다시 누르면 지운다
    set(mode, f[mode] === d ? "" : d);
  }

  // 이 달 등원 회차 (선생님이 칠하면서 바로 확인할 수 있게)
  const liveCount = (() => {
    const outS = f.prep ? dayAfter(f.prep) : f.start;
    const outE = f.back ? dayBefore(f.back) : f.end;
    const come = {};
    paintDays.forEach((d) => {
      if (days.indexOf(new Date(d + "T00:00:00").getDay()) < 0) return;
      if (!isActiveOn(st, d)) return;
      if (outS && outE && d >= outS && d <= outE) return;
      come[d] = 1;
    });
    [f.prep, f.back].forEach((d) => { if (d && d.slice(0, 7) === pmonth) come[d] = 1; });
    return Object.keys(come).length;
  })();

  function set(k, v) {
    setF((p) => {
      const n = { ...p, [k]: v };
      if (k === "math" && (!p.prep || p.prep === dayBefore(p.math))) n.prep = dayBefore(v);
      return n;
    });
  }
  async function save() {
    if (busy) return;
    if (!f.school) { setMsg("학교를 골라주세요"); return; }
    if (!f.grade) { setMsg("학년을 골라주세요"); return; }
    if (!f.start || !f.end) { setMsg("내신 기간을 넣어주세요"); return; }
    if (f.end < f.start) { setMsg("종료일이 시작일보다 빠를 수 없어요"); return; }
    setBusy(true); setMsg("");
    try {
      await saveExam(cls.id, term, st.id, { name: st.name, school: f.school, grade: f.grade,
        start: f.start, end: f.end, math: f.math, prep: f.prep, back: f.back, note: f.note.trim(),
        days: days, byTeacher: true });
      onDone();
    } catch (e) { setMsg("저장 실패: " + e.message); setBusy(false); }
  }
  return (
    <div style={{background: "#fff", border: "1px solid var(--line)", borderRadius: 12, padding: "12px 14px", marginTop: 8}}>
      <div style={{fontWeight: 700, marginBottom: 8}}>{st.name} <span className="cm-h-hint">— 대신 입력</span></div>

      <label className="cm-label" style={{marginTop: 0}}>학교</label>
      {f.school ? (
        <div style={{display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap"}}>
          <span className="cm-chip" style={{background: "#eef1f6", color: "var(--navy)", fontSize: 14}}>{f.school}</span>
          <button className="cm-link" onClick={() => { set("school", ""); setQ(""); }}>바꾸기</button>
        </div>
      ) : (<>
        <input className="cm-input" placeholder="학교 이름 일부 (예: 중동)" value={q} onChange={(e) => setQ(e.target.value)} />
        <div style={{display: "flex", gap: 6, flexWrap: "wrap", marginTop: 6}}>
          {schoolOpts.filter((x) => !q.trim() || x.includes(q.trim())).slice(0, 12).map((x) => (
            <button key={x} className="cm-ab-tab" onClick={() => { setEtc(false); set("school", x); }}>{x}</button>
          ))}
          <button className={"cm-ab-tab" + (etc ? " on" : "")} onClick={() => { setEtc(true); setEtcName(q.trim()); }}>기타 (직접 입력)</button>
        </div>
        {etc && (
          <div style={{display: "flex", gap: 8, alignItems: "center", marginTop: 8, flexWrap: "wrap"}}>
            <input className="cm-input" style={{margin: 0, flex: 1, minWidth: 140}} autoFocus placeholder="학교 이름"
              value={etcName} onChange={(e) => setEtcName(e.target.value)} />
            <button className="cm-btn cm-btn-ghost" style={{margin: 0, width: "auto", padding: "8px 13px"}}
              disabled={!etcName.trim()} onClick={() => { set("school", etcName.trim()); setEtc(false); }}>이 학교로</button>
          </div>
        )}
      </>)}

      <label className="cm-label">학년</label>
      <div style={{display: "flex", gap: 6, flexWrap: "wrap"}}>
        {GRADES.map((g) => (
          <button key={g} className={"cm-ab-tab" + (f.grade === g ? " on" : "")} onClick={() => set("grade", g)}>{g}</button>
        ))}
      </div>

      <label className="cm-label">수업 요일 <span className="cm-h-hint">(달력의 수업일과 등원 회차가 여기서 나와요)</span></label>
      <div style={{display: "flex", gap: 6, flexWrap: "wrap"}}>
        {DAY_NAMES.map((d, i) => (
          <button key={i} className={"cm-ab-tab" + (days.indexOf(i) >= 0 ? " on" : "")}
            onClick={() => setDays((p) => (p.indexOf(i) >= 0 ? p.filter((x) => x !== i) : p.concat([i]).sort()))}>{d}</button>
        ))}
      </div>

      <label className="cm-label">달력에 칠하기</label>
      <div style={{display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center", marginBottom: 8}}>
        {PAINT_MODES.map((pm) => (
          <button key={pm.key} className={"cm-ab-tab" + (mode === pm.key ? " on" : "")}
            style={mode === pm.key ? undefined : { background: pm.bg, color: pm.fg, borderColor: pm.bg }}
            onClick={() => { setMode(pm.key); setAnchor(""); }}>{pm.label}</button>
        ))}
        <span style={{marginLeft: "auto", display: "flex", gap: 4, alignItems: "center"}}>
          <button className="cm-ab-tab" onClick={() => setPmonth(shiftMonthStr(pmonth, -1))}>‹</button>
          <b style={{fontSize: 13}}>{Number(pmonth.slice(5))}월</b>
          <button className="cm-ab-tab" onClick={() => setPmonth(shiftMonthStr(pmonth, 1))}>›</button>
        </span>
      </div>
      <div style={{fontSize: 12, color: "var(--muted)", marginBottom: 6}}>
        {mode === "exam"
          ? (anchor ? "끝나는 날을 한 번 더 누르세요" : "시험 시작일을 누르고, 끝나는 날을 누르세요")
          : (mode === "erase" ? "지울 칸을 누르세요" : "해당 날짜를 누르세요 (다시 누르면 지워져요)")}
      </div>
      <div className="cm-ab-wrap" data-no-swipe>
        <table className="cm-ab-table">
          <thead>
            <tr>{paintDays.map((d) => {
              const day = Number(d.slice(8));
              return <th key={d} style={{minWidth: day === 1 ? 28 : 20, padding: "3px 1px"}}>{day === 1 ? Number(d.slice(5, 7)) + "/1" : day}</th>;
            })}</tr>
            <tr>{paintDays.map((d) => {
              const w = new Date(d + "T00:00:00").getDay();
              return <th key={d} style={{fontSize: 9, padding: "1px", color: w === 0 ? "#d6453f" : (w === 6 ? "#2b5f8a" : "#8a7f72")}}>{DAY_NAMES[w]}</th>;
            })}</tr>
          </thead>
          <tbody>
            <tr>{paintDays.map((d) => {
              const mk = paintMark(d);
              const isDay = days.indexOf(new Date(d + "T00:00:00").getDay()) >= 0;
              const stl = mk ? { background: mk.bg, color: mk.fg, fontWeight: 700, padding: "6px 1px", cursor: "pointer" }
                             : { padding: "6px 1px", cursor: "pointer", background: isDay ? "#f4f6f9" : undefined };
              return <td key={d} style={stl} onClick={() => paint(d)}>{mk ? mk.t : (isDay ? "·" : "")}</td>;
            })}</tr>
          </tbody>
        </table>
      </div>
      <div style={{fontSize: 12, color: "var(--muted)", margin: "6px 0 2px"}}>
        {f.start ? <>내신 <b>{shortDate(f.start)}~{shortDate(f.end || f.start)}</b></> : "내신 기간 미정"}
        {f.math ? <> · 수학 <b>{shortDate(f.math)}</b></> : null}
        {f.prep ? <> · 직보 <b>{shortDate(f.prep)}</b></> : null}
        {f.back ? <> · 복귀 <b>{shortDate(f.back)}</b></> : null}
        {" · "}<b style={{color: "var(--navy)"}}>{Number(pmonth.slice(5))}월 등원 {liveCount}회</b>
      </div>
      <label className="cm-label">비고 (선택)</label>
      <input className="cm-input" value={f.note} onChange={(e) => set("note", e.target.value)} />

      {msg && <div className="cm-err">{msg}</div>}
      <div style={{display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap"}}>
        <button className="cm-btn cm-btn-primary" style={{margin: 0, width: "auto", padding: "9px 16px"}}
          disabled={busy} onClick={save}>{busy ? "저장 중..." : "저장"}</button>
        <button className="cm-link" onClick={onDone}>취소</button>
      </div>
    </div>
  );
}

// ----- 내신: 선생님이 모아 보기 (반 선택 전 · 전체) -----
// 반별로 보면 "이번 주에 누가 빠지나"를 못 본다. 담당 반 전체를 한 화면에 모은다.
// ----- 학교 일정 화면 -----
// 학교·학년별로 내신 기간과 수학시험 날짜를 한 번 적어두는 곳.
// 줄은 학생이 실제로 다니는 학교만 뜬다 (34개 × 4학년을 다 늘어놓으면 못 본다).
function SchoolTermBoard({ onBack }) {
  const [term, setTerm] = useState(null);
  const [draft, setDraft] = useState("");
  const [editTerm, setEditTerm] = useState(false);
  const [all, setAll] = useState(null);
  const [people, setPeople] = useState(null);
  const [shared, setShared] = useState([]);
  const [msg, setMsg] = useState("");
  const [addS, setAddS] = useState("");
  const [addG, setAddG] = useState("고1");
  const backRef = useSwipeBack(onBack);
  // 날짜 칸이 여덟이라 좁은 컬럼에 안 들어간다 (참여표·안내문과 같은 처리)
  useEffect(() => {
    const el = document.querySelector(".cm-shell");
    if (!el) return;
    el.classList.add("cm-shell-wide");
    return () => el.classList.remove("cm-shell-wide");
  }, []);
  useEffect(() => listenExamTerm((t) => { setTerm(t); setDraft(t); }), []);
  useEffect(() => listenSchoolTerms(setAll), []);
  useEffect(() => listenStudents(setPeople, () => setPeople([])), []);
  useEffect(() => listenSchools(setShared), []);

  if (term === null || all === null || people === null)
    return <div className="cm-card"><div className="cm-empty">불러오는 중…</div></div>;

  const curated = Array.from(new Set(KNOWN_SCHOOLS.concat(shared)));
  const schoolOpts = Array.from(new Set(curated.concat(people.map((x) => x.school).filter(Boolean))))
    .sort((a, b) => a.localeCompare(b, "ko"));

  // 줄 = 학생이 다니는 (학교·학년) ∪ 이미 적어둔 (학교·학년)
  const rows = {};
  people.forEach((x) => {
    if (!x.school || !x.grade) return;
    const k = x.school + "|" + x.grade;
    rows[k] = rows[k] || { school: x.school, grade: x.grade, n: 0 };
    rows[k].n++;
  });
  schoolTermsOf(all, term).forEach((v) => {
    const k = v.school + "|" + v.grade;
    rows[k] = rows[k] || { school: v.school, grade: v.grade, n: 0 };
  });
  const list = Object.keys(rows).map((k) => rows[k]).sort((a, b) =>
    a.school.localeCompare(b.school, "ko") || (GRADES.indexOf(a.grade) - GRADES.indexOf(b.grade)));

  const done = list.filter((r) => { const v = all[schedKey(term, r.school, r.grade)]; return v && v.start && v.end; });
  const coveredN = done.reduce((a, r) => a + r.n, 0);
  const noSchool = people.filter((x) => !x.school || !x.grade).length;

  async function addRow() {
    const sc = matchSchool(addS, schoolOpts);

    catch (e) { setMsg("추가 실패: " + friendlyErr(e)); }

        <div className="cm-admin-top" style={{marginBottom: 10}}>

          <button className="cm-link cm-home-back" onClick={onBack}>← 돌아가기</button>
