        <div className="rp-note">{comment || "(작성 전)"}</div>
      </div>

      <div className="rp-foot">
        <span>CLIMATH 수학전문학원</span>
        <span>발행일 {fmtDate(todayStr)}</span>
      </div>
    </div>
  );
}

function ReportCenter({ onBack }) {
  const [picked, setPicked] = useState(null); // { cls, st }
  const [ym, setYm] = useState(todayStr.slice(0, 7));
  const [data, setData] = useState(null);
  const [comment, setComment] = useState("");
  const [busy, setBusy] = useState(false);
  const [saved, setSaved] = useState(false);
  const [q, setQ] = useState("");
  const backRef = useSwipeBack(onBack);
  const backRef2 = useSwipeBack(() => setPicked(null));

  const norm = (s) => (s || "").replace(/\s+/g, "");
  const everyone = [];
  // 종강한 반도 남긴다 — 지난 학기 보고서를 뽑을 일이 있다. 다만 목록 아래로 내리고 표시를 붙인다
  CLASSES.forEach((c) => (c.roster || []).filter((r) => !r.teacher && !isEnded(r)).forEach((st) => everyone.push({ cls: c, st })));
  everyone.sort((a, b) =>
    (isClassEnded(a.cls) ? 1 : 0) - (isClassEnded(b.cls) ? 1 : 0)
    || a.st.name.localeCompare(b.st.name, "ko") || a.cls.name.localeCompare(b.cls.name, "ko"));
  const filtered = q ? everyone.filter((x) => norm(x.st.name).includes(norm(q))) : everyone;

  const monthOpts = recentMonths(12);

  async function load(cls, st, m) {
    setData(null); setSaved(false); setBusy(true);
    try {
      const d = await buildReportData(cls, st, m);
      const existing = await getReport(cls.id, st.id, m);
      setData(d);
      setComment(existing && existing.comment ? existing.comment : "");
    } catch (e) { alert("불러오기 실패: " + e.message); }
    setBusy(false);
  }

  async function save() {
    if (!picked || !data) return;
    setBusy(true);
    try {
      await saveReport(picked.cls.id, picked.st.id, ym, { comment, hwSnapshot: data.hwSnapshot, sname: picked.st.name, cname: picked.cls.name });
      setSaved(true);
    } catch (e) { alert("저장 실패: " + e.message); }
    setBusy(false);
  }

  if (picked) {
    return (
      <div key="rp-detail" ref={backRef2} className="cm-stack cm-slide-in" style={{willChange: "transform"}}>
        <div className="cm-card rp-noprint">
          <div className="cm-admin-top" style={{marginBottom: 10}}>
            <h2 className="cm-h2" style={{margin: 0}}>{picked.st.name}</h2>
            <button className="cm-link" onClick={() => setPicked(null)}>← 목록</button>
          </div>
          <div style={{fontSize: 13, color: "var(--muted)"}}>{picked.cls.name}</div>
          <label className="cm-label">보고서 기준 월</label>
          <select className="cm-input" value={ym} onChange={(e) => { setYm(e.target.value); load(picked.cls, picked.st, e.target.value); }}>
            {monthOpts.map((m) => <option key={m} value={m}>{m.split("-")[0]}년 {Number(m.split("-")[1])}월</option>)}
          </select>
          <label className="cm-label">담당 선생님 코멘트</label>
          <textarea className="cm-input cm-notice-ta" rows={4} placeholder="한 달간 학습 태도, 강점, 보완할 점 등을 적어주세요"
            value={comment} onChange={(e) => { setComment(e.target.value); setSaved(false); }} />
          <div style={{display: "flex", gap: 10, flexWrap: "wrap"}}>
            <button className="cm-btn cm-btn-primary" style={{margin: 0}} disabled={busy || !data} onClick={save}>
              {busy ? "처리 중..." : saved ? "저장됨 ✓" : "코멘트 저장"}
            </button>
            <button className="cm-btn cm-btn-ghost" style={{margin: 0}} disabled={!data} onClick={() => window.print()}>인쇄 / PDF 저장</button>
          </div>
          <div className="cm-hint" style={{marginTop: 8}}>아래 미리보기에서 <b>수업 기록을 눌러 수정하거나 빠진 날을 채워 넣을</b> 수 있어요. 비어 있는 날은 인쇄에 나오지 않아요. 인쇄 창에서 <b>대상을 "PDF로 저장"</b>으로 바꾸면 파일로 받을 수 있어요. 저장하면 이번 달 진도가 기록돼서 다음 달 보고서에 <b>한 달간 진행 분량</b>이 표시돼요.</div>
        </div>

        {busy && !data && <div className="cm-card rp-noprint"><div className="cm-empty">집계하는 중…</div></div>}
        {data && <ReportSheet cls={picked.cls} st={picked.st} ym={ym} data={data} comment={comment}
          editable onNoteChange={(date, text) => {
            setData((d) => {
              let notes = d.notes || [];
              if (!text) notes = notes.filter((n) => n.date !== date);
              else if (notes.some((n) => n.date === date)) notes = notes.map((n) => (n.date === date ? { ...n, text } : n));
              else notes = [...notes, { sid: picked.st.id, sname: picked.st.name, date, text }].sort((a, b) => a.date.localeCompare(b.date));
              return { ...d, notes };
            });
          }} />}
      </div>
    );
  }

  return (
    <div key="rp-list" ref={backRef} className="cm-stack cm-slide-in" style={{willChange: "transform"}}>
      <div className="cm-card">
        <div className="cm-admin-top" style={{marginBottom: 12}}>
          <h2 className="cm-h2" style={{margin: 0}}>학습관리 보고서</h2>
          <button className="cm-link cm-home-back" onClick={onBack}>← 돌아가기</button>
        </div>
        <input className="cm-input" style={{margin: 0}} placeholder="학생 이름 검색" value={q} onChange={(e) => setQ(e.target.value)} />
        <div className="cm-hint" style={{marginTop: 8}}>학생을 고르면 출결·진도·상담이 자동으로 집계돼요. 코멘트만 쓰고 인쇄하면 됩니다.</div>
      </div>
      <div className="cm-card">
        <h3 className="cm-h3">학생 {filtered.length}명</h3>
        {filtered.length === 0 && <div className="cm-empty">검색 결과가 없어요</div>}
        {filtered.map(({ cls, st }) => (
          <button key={cls.id + st.id} className="cm-day" style={isClassEnded(cls) ? {opacity: .62} : undefined}
            onClick={() => { setPicked({ cls, st }); load(cls, st, ym); }}>
            <div className="cm-day-left">
              <span className="cm-day-date">{st.name}</span>
              <span className="cm-day-sub">{cls.name}{isClassEnded(cls) ? " · " + cls.endDate + " 종강" : ""}</span>
            </div>
            <span className="cm-day-arrow">›</span>
          </button>
        ))}
      </div>
    </div>
  );
}

function MakeupCenter({ onBack }) {
  const [picked, setPicked] = useState(null); // { name, entries:[{cls,st}] }
  const [pickedDate, setPickedDate] = useState(null);
  const [mkByClass, setMkByClass] = useState({});
  const [q, setQ] = useState("");
  const [weeks, setWeeks] = useState(8);

  useEffect(() => {
    const unsubs = activeClasses().map((c) => listenMakeups(c.id, (m) => setMkByClass((p) => ({ ...p, [c.id]: m }))));
    return () => unsubs.forEach((u) => u && u());
  }, []);

  const norm = (s) => (s || "").replace(/\s+/g, "");
  // 이름 기준으로 통합 (같은 이름 = 같은 사람)
  const peopleMap = {};
  activeClasses().forEach((c) => (c.roster || []).filter((r) => !r.teacher && !isEnded(r)).forEach((st) => {
    const key = norm(st.name);
    if (!peopleMap[key]) peopleMap[key] = { name: st.name, entries: [] };
    peopleMap[key].entries.push({ cls: c, st });
  }));
  const people = Object.values(peopleMap).sort((a, b) => a.name.localeCompare(b.name, "ko"));
  const filtered = q ? people.filter((p) => norm(p.name).includes(norm(q))) : people;

  const mkOf = (cid, sid, date) => (mkByClass[cid] || {})[sid + "_" + date];

  const allPending = [];
  activeClasses().forEach((c) => Object.values(mkByClass[c.id] || {}).forEach((mm) => {
    if (mm.planned && !mm.videoDone) allPending.push({ ...mm, cname: c.name, cid: c.id });
  }));
  allPending.sort((a, b) => (a.date || "").localeCompare(b.date || ""));
  const overdue = allPending.filter((mm) => mm.date < todayStr);

  const backRef1 = useSwipeBack(onBack);
  const backRef2 = useSwipeBack(() => setPicked(null));
  const backRef3 = useSwipeBack(() => setPickedDate(null));

  // ---- 3단계: 날짜의 수업 선택 ----
  if (picked && pickedDate) {
    const dow = new Date(pickedDate + "T00:00:00").getDay();
    // 본인 반 중 그날 수업 있는 것
    const sessions = picked.entries.filter(({ cls, st }) => {
      if (!isActiveOn(st, pickedDate)) return false;
      const dows = isIndividual(cls) ? (st.days || []) : (cls.classDays || []);
      return dows.includes(dow);
    });
    // 본인 반이 아니지만 그날 수업이 열리는 반 (보강 참석 등)
    const myCids = picked.entries.map((e) => e.cls.id);
    const others = activeClasses().filter((c) => {
      if (myCids.includes(c.id)) return false;
      if (isIndividual(c)) return false; // 개별진도반은 학생별 요일이라 제외
      return (c.classDays || []).includes(dow);
    });
    return (
      <div key="mk-session" ref={backRef3} className="cm-stack cm-slide-in" style={{willChange: "transform"}}>
        <div className="cm-card">
          <div className="cm-admin-top" style={{marginBottom: 10}}>
            <h2 className="cm-h2" style={{margin: 0}}>{picked.name}</h2>
            <button className="cm-link" onClick={() => setPickedDate(null)}>← 날짜</button>
          </div>
          <div style={{fontSize: 14, color: "var(--ink)", fontWeight: 600}}>{fmtDate(pickedDate)}</div>
          <div className="cm-hint" style={{marginTop: 8}}>빠지는 수업을 눌러 표시하세요. 한 번 더 누르면 <b>동영상 보강 완료</b>, 또 누르면 해제돼요.</div>
        </div>
        <div className="cm-card">
          <h3 className="cm-h3">이 날 수업</h3>
          {sessions.length === 0 && <div className="cm-empty">이 날은 수업이 없어요</div>}
          {sessions.map(({ cls, st }) => {
            const mm = mkOf(cls.id, st.id, pickedDate) || {};
            const on = mm.planned, vd = mm.videoDone;
            return (
              <button key={cls.id} className="cm-day" style={{
                borderLeft: "4px solid " + (vd ? "#2b5f8a" : on ? "#c2703f" : "transparent"),
                background: vd ? "#e3edf5" : on ? "#f6e7df" : undefined,
              }} onClick={() => {
                if (vd) clearMakeup(cls.id, st.id, pickedDate);
                else if (on) setMakeup(cls.id, st.id, st.name, pickedDate, { videoDone: true });
                else setMakeup(cls.id, st.id, st.name, pickedDate, { planned: true, videoDone: false });
              }}>
                <div className="cm-day-left">
                  <span className="cm-day-date">{cls.name}</span>
                  <span className="cm-day-sub" style={{color: vd ? "#2b5f8a" : on ? "#c2703f" : undefined}}>
                    {vd ? "동영상 보강 완료" : on ? "결석 예정" : "정상 출석 예정"}
                  </span>
                </div>
                <span className="cm-day-arrow">{vd ? "▶" : on ? "✕" : "○"}</span>
              </button>
            );
          })}

          {others.length > 0 && (<>
            <div className="cm-mini-h" style={{marginTop: 16}}>다른 반 수업 <span className="cm-h-hint">(보강 참석 등)</span></div>
            {others.map((c) => {
              const st = picked.entries[0].st; // 이름·id는 본인 소속 기준으로 기록
              const mm = mkOf(c.id, st.id, pickedDate) || {};
              const on = mm.planned, vd = mm.videoDone;
              return (
                <button key={"o" + c.id} className="cm-day" style={{
                  borderLeft: "4px solid " + (vd ? "#2b5f8a" : on ? "#c2703f" : "transparent"),
                  background: vd ? "#e3edf5" : on ? "#f6e7df" : undefined,
                }} onClick={() => {
                  if (vd) clearMakeup(c.id, st.id, pickedDate);
                  else if (on) setMakeup(c.id, st.id, st.name, pickedDate, { videoDone: true });
                  else setMakeup(c.id, st.id, st.name, pickedDate, { planned: true, videoDone: false });
                }}>
                  <div className="cm-day-left">
                    <span className="cm-day-date">{c.name}</span>
                    <span className="cm-day-sub" style={{color: vd ? "#2b5f8a" : on ? "#c2703f" : undefined}}>
                      {vd ? "동영상 보강 완료" : on ? "결석 예정" : "이 반 수업에 참석 예정이면 표시"}
                    </span>
                  </div>
                  <span className="cm-day-arrow">{vd ? "▶" : on ? "✕" : "○"}</span>
                </button>
              );
            })}
          </>)}
        </div>
      </div>
    );
  }

  // ---- 2단계: 날짜 선택 ----
  if (picked) {
    // 이 사람이 속한 모든 반의 수업일 합집합
    const dateMap = {};
    picked.entries.forEach(({ cls, st }) => {
      upcomingSessions(cls, st, weeks).forEach((d) => {
        (dateMap[d] = dateMap[d] || []).push({ cls, st });
      });
    });
    const dates = Object.keys(dateMap).sort();
    const pastRecords = [];
    picked.entries.forEach(({ cls, st }) => {
      Object.values(mkByClass[cls.id] || {}).filter((mm) => mm.sid === st.id && mm.date < todayStr)
        .forEach((mm) => pastRecords.push({ ...mm, cname: cls.name, cid: cls.id }));
    });
    pastRecords.sort((a, b) => b.date.localeCompare(a.date));
    return (
      <div key="mk-date" ref={backRef2} className="cm-stack cm-slide-in" style={{willChange: "transform"}}>
        <div className="cm-card">
          <div className="cm-admin-top" style={{marginBottom: 10}}>
            <h2 className="cm-h2" style={{margin: 0}}>{picked.name}</h2>
            <button className="cm-link" onClick={() => setPicked(null)}>← 목록</button>
          </div>
          <div style={{fontSize: 13, color: "var(--muted)"}}>{picked.entries.map((e) => e.cls.name).join(" · ")}</div>
          <div className="cm-hint" style={{marginTop: 10}}>빠지는 날짜를 고르세요. 아래 목록에 없는 날(보강 참석 등)은 직접 지정할 수 있어요.</div>
          <div style={{display: "flex", gap: 6, marginTop: 10, alignItems: "center", flexWrap: "wrap"}}>
            {[4, 8, 12].map((w) => (
              <button key={w} className={"cm-ab-tab" + (weeks === w ? " on" : "")} onClick={() => setWeeks(w)}>{w}주</button>
            ))}
            <input className="cm-input" style={{margin: 0, width: 150, marginLeft: "auto"}} type="date"
              title="지난 날짜도 지정할 수 있어요"
              onChange={(e) => e.target.value && setPickedDate(e.target.value)} />
          </div>
        </div>
        <div className="cm-card">
          <h3 className="cm-h3">다가올 수업일</h3>
          {dates.length === 0 && <div className="cm-empty">예정된 수업이 없어요 (요일 설정을 확인해주세요)</div>}
          <div style={{display: "flex", flexWrap: "wrap", gap: 8}}>
            {dates.map((d) => {
              const items = dateMap[d];
              const states = items.map(({ cls, st }) => mkOf(cls.id, st.id, d) || {});
              const anyPlan = states.some((s) => s.planned && !s.videoDone);
              const anyDone = states.some((s) => s.videoDone);
              return (
                <button key={d} onClick={() => setPickedDate(d)} style={{
                  border: "1.5px solid " + (anyPlan ? "#c2703f" : anyDone ? "#2b5f8a" : "var(--line)"),
                  background: anyPlan ? "#f6e7df" : anyDone ? "#e3edf5" : "#fff",
                  color: anyPlan ? "#c2703f" : anyDone ? "#2b5f8a" : "var(--ink)",
                  borderRadius: 10, padding: "9px 12px", cursor: "pointer", fontFamily: "inherit",
                  fontSize: 13, minWidth: 90, textAlign: "center", lineHeight: 1.35,
                }}>
                  <div style={{fontWeight: 600}}>{fmtDate(d)}</div>
                  <div style={{fontSize: 11, marginTop: 2}}>
                    {anyPlan ? "결석 예정" : anyDone ? "동영상 완료" : (items.length > 1 ? items.length + "개 수업" : "정상")}
                  </div>
                </button>
              );
            })}
          </div>
        </div>
        {pastRecords.length > 0 && (
          <div className="cm-card">
            <h3 className="cm-h3">지난 기록</h3>
            {pastRecords.map((mm) => (
              <div key={mm.cid + mm.date} style={{display: "flex", alignItems: "center", gap: 8, padding: "9px 0", borderBottom: "1px solid var(--line)", flexWrap: "wrap"}}>
                <span style={{fontSize: 13}}>{fmtDate(mm.date)}</span>
                <span className="cm-day-sub">{mm.cname}</span>
                <span className="cm-chip" style={{background: mm.videoDone ? "#e3edf5" : "#fae3e2", color: mm.videoDone ? "#2b5f8a" : "#d6453f"}}>
                  {mm.videoDone ? "동영상 완료" : "미이수"}
                </span>
                <span style={{marginLeft: "auto", display: "flex", gap: 4}}>
                  {!mm.videoDone && <button className="cm-link" onClick={() => setMakeup(mm.cid, mm.sid, mm.sname, mm.date, { videoDone: true })}>보강 완료</button>}
                  <button className="cm-link" style={{color: "#d6453f"}} onClick={() => clearMakeup(mm.cid, mm.sid, mm.date)}>삭제</button>
                </span>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  // ---- 1단계: 학생 목록 (가나다순, 이름 통합) ----
  return (
    <div key="mk-list" ref={backRef1} className="cm-stack cm-slide-in" style={{willChange: "transform"}}>
      <div className="cm-card">
        <div className="cm-admin-top" style={{marginBottom: 12}}>
          <h2 className="cm-h2" style={{margin: 0}}>보강 관리</h2>
          <button className="cm-link cm-home-back" onClick={onBack}>← 돌아가기</button>
        </div>
        <input className="cm-input" style={{margin: 0}} placeholder="학생 이름 검색" value={q} onChange={(e) => setQ(e.target.value)} />
        <div className="cm-hint" style={{marginTop: 8}}>학생 → 날짜 → 수업 순서로 골라 결석을 표시해요.</div>
      </div>

      {overdue.length > 0 && (
        <div className="cm-card" style={{borderLeft: "4px solid #d6453f"}}>
          <h3 className="cm-h3" style={{color: "#d6453f"}}>보강 안 한 결석 {overdue.length}건</h3>
          {overdue.map((mm) => (
            <div key={mm.cid + mm.sid + mm.date} style={{display: "flex", alignItems: "center", gap: 8, padding: "9px 0", borderBottom: "1px solid var(--line)", flexWrap: "wrap"}}>
              <strong>{mm.sname}</strong>
              <span className="cm-day-sub">{mm.cname}</span>
              <span style={{fontSize: 13, color: "var(--muted)"}}>{fmtDate(mm.date)}</span>
              <button className="cm-link" style={{marginLeft: "auto"}} onClick={() => setMakeup(mm.cid, mm.sid, mm.sname, mm.date, { videoDone: true })}>보강 완료</button>
            </div>
          ))}
        </div>
      )}

      <div className="cm-card">
        <h3 className="cm-h3">학생 {filtered.length}명</h3>
        {filtered.length === 0 && <div className="cm-empty">검색 결과가 없어요</div>}
        {filtered.map((p) => {
          let pend = 0;
          p.entries.forEach(({ cls, st }) => {
            pend += Object.values(mkByClass[cls.id] || {}).filter((mm) => mm.sid === st.id && mm.planned && !mm.videoDone).length;
          });
          return (
            <button key={p.name} className="cm-day" onClick={() => { setPicked(p); setPickedDate(null); }}>
              <div className="cm-day-left">
                <span className="cm-day-date">{p.name}</span>
                <span className="cm-day-sub">{p.entries.map((e) => e.cls.name).join(" · ")}</span>
                {pend > 0 && <span className="cm-chip" style={{background: "#f6e7df", color: "#c2703f"}}>결석 {pend}</span>}
              </div>
              <span className="cm-day-arrow">›</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function RiskDashboard({ onBack }) {
  const [data, setData] = useState(null);
  const [tab, setTab] = useState("flag"); // flag | gap
  const [gapDays, setGapDays] = useState(60);
  function reload() {
    setData(null);
    computeRiskData().then(setData).catch((e) => { console.error(e); setData({ flagged: [], gaps: [] }); });
  }
  useEffect(() => { reload(); }, []);

  const flagged = data ? data.flagged : [];
  const overdue = data ? data.gaps.filter((g) => g.gapDays === null || g.gapDays >= gapDays) : [];
  const counts = { 3: flagged.filter((x) => x.risk === 3).length, 2: flagged.filter((x) => x.risk === 2).length, 1: flagged.filter((x) => x.risk === 1).length };
  const gapText = (g) => g.gapDays === null ? "상담 기록 없음" : g.gapDays + "일째";
  const riskBackRef = useSwipeBack(onBack);

  return (
    <div ref={riskBackRef} className="cm-stack cm-slide-in" style={{willChange: "transform"}}>
      <div className="cm-card">
        <div className="cm-admin-top" style={{marginBottom: 12}}>
          <h2 className="cm-h2" style={{margin: 0}}>위험신호</h2>
          <button className="cm-link cm-home-back" onClick={onBack}>← 돌아가기</button>
        </div>
        <div style={{display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center"}}>
          <button className={"cm-ab-tab" + (tab === "flag" ? " on" : "")} onClick={() => setTab("flag")}>표시된 신호 {flagged.length}</button>
          <button className={"cm-ab-tab" + (tab === "gap" ? " on" : "")} onClick={() => setTab("gap")}>상담 공백 {overdue.length}</button>
          <button className="cm-link" style={{marginLeft: "auto"}} onClick={reload}>새로고침</button>
        </div>
      </div>

      {data === null && <div className="cm-card"><div className="cm-empty">불러오는 중…</div></div>}

      {/* ---- 표시된 신호 ---- */}
      {data !== null && tab === "flag" && (<>
        <div className="cm-card">
          <div style={{display: "flex", gap: 10}}>
            {[3, 2, 1].map((v) => {
              const ri = riskInfo(v);
              return (
                <div key={v} style={{flex: 1, background: ri.bg, borderRadius: 12, padding: "11px 8px", textAlign: "center"}}>
                  <div style={{fontSize: 22, fontWeight: 700, color: ri.color, fontFamily: "'Fraunces',serif"}}>{counts[v] || 0}</div>
                  <div style={{fontSize: 12, color: ri.color}}>{ri.label}</div>
                </div>
              );
            })}
          </div>
          <div className="cm-hint" style={{marginTop: 10}}>상담에 표시한 신호예요. 학생마다 <b>가장 최근 상담</b> 기준이고, 나아지면 다음 상담에서 "없음"으로 기록하면 내려가요.</div>
        </div>

        {flagged.length === 0 && <div className="cm-card"><div className="cm-empty">표시된 위험 신호가 없어요 👍</div></div>}

        {flagged.map((x) => {
          const ri = riskInfo(x.risk);
          const ci = catInfo(x.cat);
          const stale = x.ageDays !== null && x.ageDays >= 45;
          return (
            <div key={x.cid + ":" + x.sid} className="cm-card" style={{borderLeft: "4px solid " + ri.color, padding: "14px 16px"}}>
              <div style={{display: "flex", alignItems: "center", gap: 7, flexWrap: "wrap"}}>
                <strong style={{fontSize: 16}}>{x.sname}</strong>
                <span className="cm-day-sub">{x.cname}</span>
                <span className="cm-chip" style={{background: ci.bg, color: ci.color}}>{ci.label}</span>
                <span style={{marginLeft: "auto", fontSize: 12, fontWeight: 700, color: ri.color}}>⚠ {ri.label}</span>
              </div>
              <div style={{fontSize: 14, lineHeight: 1.6, marginTop: 8, whiteSpace: "pre-wrap"}}>{x.content}</div>
              {x.pendingFollow > 0 && (
                <div style={{background: "#f6e7df", borderRadius: 10, padding: "9px 12px", marginTop: 10}}>
                  <div style={{fontSize: 12, fontWeight: 700, color: "#c2703f", marginBottom: 3}}>후속 조치 대기 {x.pendingFollow}건</div>
                  {x.pendingNotes.map((n, i) => <div key={i} style={{fontSize: 13, marginTop: 2}}>· {n}</div>)}
                </div>
              )}
              {stale && (
                <div style={{background: "#f0ece5", borderRadius: 10, padding: "8px 12px", marginTop: 10, fontSize: 12, color: "#7c6f5f"}}>
                  이 신호가 표시된 지 {x.ageDays}일 됐어요. 지금도 유효한지 확인이 필요해요.
                </div>
              )}
              <div style={{fontSize: 11, color: "var(--muted)", marginTop: 9}}>
                {x.date}{x.ageDays !== null && " (" + (x.ageDays === 0 ? "오늘" : x.ageDays + "일 전") + ")"} · {x.withWho === "parent" ? "학부모 상담" : "학생 상담"}{x.teacher ? " · " + x.teacher + " 선생님" : ""} · 누적 {x.total}회
              </div>
            </div>
          );
        })}
      </>)}

      {/* ---- 상담 공백 ---- */}
      {data !== null && tab === "gap" && (<>
        <div className="cm-card">
          <div style={{display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center"}}>
            <span style={{fontSize: 13, color: "var(--muted)"}}>기준</span>
            {[30, 60, 90].map((v) => (
              <button key={v} className={"cm-ab-tab" + (gapDays === v ? " on" : "")} onClick={() => setGapDays(v)}>{v}일 이상</button>
            ))}
          </div>
          <div className="cm-hint" style={{marginTop: 10}}>마지막 상담으로부터 오래된 순이에요. 위험 여부를 판단한 게 아니라, <b>한동안 이야기 나눈 적 없는 학생</b>을 알려주는 목록이에요.</div>
        </div>

        {overdue.length === 0 && <div className="cm-card"><div className="cm-empty">모든 학생을 최근에 만났어요 👍</div></div>}

        {overdue.map((g) => {
          const never = g.gapDays === null;
          const hot = never || g.gapDays >= 90;
          return (
            <div key={g.cid + ":" + g.sid} className="cm-card" style={{borderLeft: "4px solid " + (hot ? "#c2703f" : "#c9bfae"), padding: "13px 16px"}}>
              <div style={{display: "flex", alignItems: "center", gap: 7, flexWrap: "wrap"}}>
                <strong style={{fontSize: 15}}>{g.sname}</strong>
                <span className="cm-day-sub">{g.cname}</span>
                {g.hasRisk && <span className="cm-chip" style={{background: "#fae3e2", color: "#d6453f"}}>위험 표시됨</span>}
                <span style={{marginLeft: "auto", fontSize: 13, fontWeight: 700, color: hot ? "#c2703f" : "var(--muted)"}}>{gapText(g)}</span>
              </div>
              <div style={{fontSize: 11, color: "var(--muted)", marginTop: 6}}>
                {never ? "아직 상담 기록이 없어요" : "마지막 상담 " + g.lastDate + " · 누적 " + g.total + "회"}
              </div>
            </div>
          );
        })}
      </>)}
    </div>
  );
}

function AdminView() {
  const [teachers, setTeachers] = useState(null); // null=로딩중
  const [me, setMe] = useState(null);
  const [picked, setPicked] = useState(null); // 로그인 시도 중인 선생님
  const [pin, setPin] = useState("");
  const [err, setErr] = useState("");
  const [mode, setMode] = useState("login"); // login | register | manage
  const [classView, setClassView] = useState("days"); // 반 내부 화면
  const [dayPick, setDayPick] = useState(null);      // 선택한 날짜
  const [rosterCid, setRosterCid] = useState("");    // 반 설정에서 학생 명단으로 넘어올 때 켤 반
  const [editOrder, setEditOrder] = useState(false);
  const [orderList, setOrderList] = useState(null); // 편집 중 임시 순서
  const [orderBusy, setOrderBusy] = useState(false);
  const [showEnded, setShowEnded] = useState(false); // 종강한 반 펼치기
  const [cls, setCls] = useState(null);
  const [busyLogin, setBusyLogin] = useState(false);
  // 안내문이 생기면서 일반반의 "진도표"는 대개 안 쓰게 됐다. 다만 개별진도반은
  // 학생마다 진도계획표가 따로라 안내문(반 하나짜리)으로 대체되지 않는다.
  // 개진반은 그대로 두고, 일반반은 올려둔 파일이 있을 때만 메뉴를 띄운다.
  const [hasProgFile, setHasProgFile] = useState(false);
  useEffect(() => {
    setHasProgFile(false);
    if (!cls || isIndividual(cls)) return;
    return progressDoc(cls.id, "class").onSnapshot((d) => setHasProgFile(d.exists), () => {});
  }, [cls && cls.id]);

  // 로그인 화면 목록은 서버에서 받는다 — 이름/역할/승인상태만 오고 PIN은 안 온다.
  // (예전에는 teachers 문서를 통째로 받아 PIN이 브라우저에 다 있었다)
  async function refreshTeachers() {
    const r = await authApi({ action: "teachers" });
    setTeachers(r.teachers || []);
    return r.teachers || [];
  }
  useEffect(() => {
    refreshTeachers().catch(() => setTeachers([]));
    // 새로고침해도 로그인이 유지되도록 복구한다. 신분은 토큰이 증명하고,
    // 담당 반 정보는 본인 문서에서 읽는다(규칙이 본인 것만 열어준다).
    (async () => {
      try {
        const u = firebase.auth().currentUser;
        if (!u) return;
        const claims = (await u.getIdTokenResult()).claims;
        if (claims.role !== "teacher" && claims.role !== "owner") return;
        if (!CLASSES.length) await loadClasses();
        const d = await teachersCol().doc(claims.tid).get();
        if (d.exists) { const t = { tid: claims.tid, ...d.data() }; applyScope(t); setMe(t); }
      } catch (e) { /* 복구 실패하면 그냥 로그인 화면 */ }
    })();
  }, []);

  async function tryLogin() {
    if (busyLogin) return;
    if (isPending(picked)) { setErr("관리자 승인 대기 중입니다. 승인 후 로그인할 수 있어요."); return; }
    if (pin.length !== 4) { setErr("PIN 4자리를 입력해주세요"); return; }
    setBusyLogin(true); setErr("");
    try {
      const r = await authApi({ action: "login", kind: "teacher", tid: picked.tid, pin });
      await signInWithToken(r.token);
      const d = await teachersCol().doc(picked.tid).get();
      const t = d.exists ? { tid: picked.tid, ...d.data() } : { tid: picked.tid, name: r.name, role: r.role, classIds: [] };
      applyScope(t); setMe(t);
      setPicked(null); setPin("");
    } catch (e) { setErr(e.message); }
    setBusyLogin(false);
  }
  async function logout() {
    await signOutAll();
    setMe(null); setCls(null); setMode("login"); setTeachers(null);
    refreshTeachers().catch(() => setTeachers([]));
  }
  const canEdit = (c) => me && (me.role === "owner" || (me.classIds || []).includes(c.id));

  if (teachers === null) return <div className="cm-card"><div className="cm-empty">불러오는 중...</div></div>;

  // ---- 로그인 전 ----
  if (!me) {
    if (mode === "register") return <TeacherRegister onDone={async () => { await refreshTeachers(); setMode("login"); alert("등록 요청이 접수됐어요. 관리자 승인 후 로그인할 수 있습니다."); }} onCancel={() => setMode("login")} />;
    if (picked) {
      return (
        <div className="cm-card">
          <h2 className="cm-h2">{picked.name} 선생님</h2>
          <label className="cm-label">PIN</label>
          <input className="cm-input" type="password" inputMode="numeric" autoFocus value={pin}
            onChange={(e) => setPin(e.target.value)} onKeyDown={(e) => e.key === "Enter" && tryLogin()} />
          {err && <div className="cm-err">{err}</div>}
          <button className="cm-btn cm-btn-primary" disabled={busyLogin} onClick={tryLogin}>{busyLogin ? "확인 중..." : "들어가기"}</button>
          <button className="cm-link" onClick={() => { setPicked(null); setPin(""); setErr(""); }}>← 다른 선생님</button>
        </div>
      );
    }
    return (
      <div className="cm-stack"><div className="cm-card">
        <h2 className="cm-h2">선생님 로그인</h2>
        <div className="cm-daylist">
          {teachers.map((t) => (
            <button key={t.tid} className="cm-day" onClick={() => setPicked(t)}>
              <div className="cm-day-left"><span className="cm-day-date">{t.name}</span>
                {t.role === "owner" && <span className="cm-day-sub">관리자</span>}
                {isPending(t) && <span className="cm-day-sub" style={{color: "#d6453f"}}>승인 대기</span>}</div>
              <span className="cm-day-arrow">›</span>
            </button>
          ))}
        </div>
        <button className="cm-link" onClick={() => setMode("register")}>+ 새 선생님 등록</button>
      </div></div>
    );
  }

  // ---- 전역 메뉴 사이드바 (반 내부가 아닌 모든 화면 공통) ----
  // ---- 통합 사이드바: 어느 화면에서든 항목 위치가 동일 ----
  const activeKey = cls ? "c:" + classView : (mode === "login" ? "classes" : mode);
  const homeSide = (
    <Sidebar title={me.name + " 선생님"} active={activeKey} onSelect={(k) => {
      if (k.startsWith("c:")) { setClassView(k.slice(2)); setDayPick(null); return; }
      if (k === "classes") { setCls(null); setMode("login"); return; }
      if (k === "logout") { logout(); return; }
      setCls(null); setMode(k);
    }}
      items={[
        { key: "classes", ico: "▤", label: "내 수업" },
        { sep: true },
        { key: "makeup", ico: "▷", label: "보강 관리" },
        { key: "risk", ico: "⚠", label: "위험신호" },
        { key: "report", ico: "▣", label: "학습관리 보고서" },
        { key: "schoolcal", ico: "▦", label: "학교 일정" },
        { key: "exams", ico: "▤", label: "내신 참여표" },
        { key: "roster", ico: "☰", label: "학생 명단" },
        ...(cls ? [
          { sep: true },
          { group: cls.name + (isClassEnded(cls) ? " (종강)" : "") },
          { key: "c:days", ico: "▤", label: "날짜별" },
          // 종강한 반에서는 수업 로그를 새로 찍을 일이 없다
          ...(isIndividual(cls) && !isClassEnded(cls) ? [{ key: "c:live", ico: "◐", label: "수업 로그" }] : []),
          { key: "c:book", ico: "▦", label: "월간 출석부" },
          { key: "c:scores", ico: "◐", label: "점수 추이" },
          { key: "c:notice", ico: "◑", label: "공지" },
          { key: "c:flyer", ico: "▤", label: "안내문" },
          ...(isIndividual(cls) || hasProgFile ? [{ key: "c:progress", ico: "◈", label: "진도표" }] : []),
          { key: "c:notes", ico: "✎", label: "강의노트" },
          { key: "c:ailog", ico: "✦", label: "AI 질문" },
          { key: "c:consult", ico: "◉", label: "상담" },
          { key: "c:textbooks", ico: "⚙", label: "반 설정" },
        ] : []),
        { sep: true },
        { key: "newclass", ico: "+", label: "새 반 만들기" },
        ...(me.role === "owner" ? [{ key: "manage", ico: "⚙", label: "선생님 관리" }] : []),
        { key: "mypin", ico: "✧", label: "내 PIN 변경" },
        { key: "logout", ico: "→", label: "로그아웃" },
      ]} />
  );

  // ---- 새 반 만들기 ----
  if (mode === "newclass") return <>{homeSide}<ClassCreate me={me} onDone={async (newId) => {
    // 담당 배정은 서버가 한다 (선생님은 자기 teachers 문서를 못 쓴다).
    // 실패해도 반은 이미 만들어졌으므로 그대로 두고 알려만 준다 —
    // 관리자가 선생님 관리에서 담당을 넣어주면 된다.
    try {
      const ids = await claimNewClass(newId);
      const t = { ...me, classIds: ids };
      applyScope(t); setMe(t);
    } catch (e) {
      alert("반은 만들어졌는데 담당 배정에 실패했어요.\n" +
            "관리자에게 담당 반 지정을 부탁해주세요.\n\n" + e.message);
    }
    await refreshTeachers();
    setMode("login");
  }} onCancel={() => setMode("login")} /></>;

  // ---- 선생님 관리 (관리자 전용) ----
  if (mode === "manage") return <>{homeSide}<TeacherManage me={me} teachers={teachers} onRefresh={refreshTeachers} onBack={() => setMode("login")} /></>;

  // ---- 위험신호 / 보강 / 보고서 ----
  if (mode === "mypin") return <>{homeSide}<TeacherPinChange me={me} onBack={() => setMode("login")} /></>;
  if (mode === "risk") return <>{homeSide}<RiskDashboard onBack={() => setMode("login")} /></>;
  if (mode === "makeup") return <>{homeSide}<MakeupCenter onBack={() => setMode("login")} /></>;
  if (mode === "report") return <>{homeSide}<ReportCenter onBack={() => setMode("login")} /></>;
  if (mode === "schoolcal") return <>{homeSide}<SchoolTermBoard onBack={() => setMode("login")} /></>;
  if (mode === "exams") return <>{homeSide}<ExamBoard onBack={() => setMode("login")} /></>;
  if (mode === "roster") return <>{homeSide}<StudentDirectory key={"dir" + (rosterCid || "")} me={me}
    initialCls={rosterCid} onBack={() => { setRosterCid(""); setMode("login"); }} /></>;

  // ---- 반 선택 ----
  if (!cls) {
    return (<>
      {homeSide}
      <div className="cm-stack"><div className="cm-card">
        <div className="cm-admin-top" style={{marginBottom: 12}}>
          <h3 className="cm-h3" style={{margin: 0}}>{me.name} 선생님</h3>
          {!editOrder && <button className="cm-link cm-home-back" onClick={logout}>로그아웃</button>}
        </div>

        {!editOrder && (<>
          <div className="cm-daylist">
            {activeClasses().map((c) => (
              <button key={c.id} className="cm-day" onClick={() => { setCls(c); setClassView("days"); setDayPick(null); }}>
                <div className="cm-day-left"><span className="cm-day-date">{c.name}</span>
                  <span className="cm-day-sub">{canEdit(c) ? "담당" : "열람 전용"}</span></div>
                <span className="cm-day-arrow">›</span>
              </button>
            ))}
            {activeClasses().length === 0 && <div className="cm-empty">진행 중인 반이 없어요.</div>}
          </div>

          {/* 종강한 반 — 접어두되 언제든 들어가서 볼 수 있다. 기록은 하나도 지워지지 않는다 */}
          {endedClasses().length > 0 && (<>
            <button className="cm-link" style={{marginTop: 10}} onClick={() => setShowEnded((v) => !v)}>
              {showEnded ? "▾" : "▸"} 종강한 반 {endedClasses().length}개
            </button>
            {showEnded && (
              <div className="cm-daylist" style={{marginTop: 6}}>
                {endedClasses().map((c) => (
                  <button key={c.id} className="cm-day" style={{opacity: .62}}
                    onClick={() => { setCls(c); setClassView("days"); setDayPick(null); }}>
                    <div className="cm-day-left"><span className="cm-day-date">{c.name}</span>
                      <span className="cm-day-sub">{c.endDate} 종강</span></div>
                    <span className="cm-day-arrow">›</span>
                  </button>
                ))}
              </div>
            )}
          </>)}
        </>)}

        {editOrder && orderList && (<>
          <div className="cm-hint" style={{marginBottom: 10}}>▲▼로 순서를 바꾸세요. 자주 쓰는 반을 위로 올리면 편해요.</div>
          <div className="cm-daylist">
            {orderList.map((c, i) => (
              <div key={c.id} className="cm-day" style={{cursor: "default"}}>
                <div className="cm-day-left"><span className="cm-day-date">{c.name}</span></div>
                <span style={{display: "flex", gap: 2}}>
                  <button className="cm-link" disabled={i === 0} style={{padding: "0 6px", opacity: i === 0 ? .3 : 1}}
                    onClick={() => setOrderList((L) => { const a = [...L]; [a[i - 1], a[i]] = [a[i], a[i - 1]]; return a; })}>▲</button>
                  <button className="cm-link" disabled={i === orderList.length - 1} style={{padding: "0 6px", opacity: i === orderList.length - 1 ? .3 : 1}}
                    onClick={() => setOrderList((L) => { const a = [...L]; [a[i + 1], a[i]] = [a[i], a[i + 1]]; return a; })}>▼</button>
                </span>
              </div>
            ))}
          </div>
          <div style={{display: "flex", gap: 10, marginTop: 12}}>
            <button className="cm-btn cm-btn-primary" style={{margin: 0}} disabled={orderBusy} onClick={async () => {
              setOrderBusy(true);
              // 종강한 반은 편집 대상이 아니므로 뒤에 붙여 order 값이 엇갈리지 않게 한다
              try { await saveClassOrder(orderList.map((c) => c.id).concat(endedClasses().map((c) => c.id))); setEditOrder(false); setOrderList(null); }
              catch (e) { alert("저장 실패: " + e.message); }
              setOrderBusy(false);
            }}>{orderBusy ? "저장 중..." : "순서 저장"}</button>
            <button className="cm-btn cm-btn-ghost" style={{margin: 0}} onClick={() => { setEditOrder(false); setOrderList(null); }}>취소</button>
          </div>
        </>)}

        {!editOrder && activeClasses().length > 1 && (
          <button className="cm-link" style={{marginTop: 10}} onClick={() => { setOrderList(activeClasses()); setEditOrder(true); }}>↕ 순서 편집</button>
        )}
      </div></div>
    </>);
  }
  return <><AdminDays cls={cls} canEdit={canEdit(cls)} isOwner={me.role === "owner"} meName={me.name}
    activeView={classView} setActiveView={setClassView} selected={dayPick} setSelected={setDayPick}
    side={homeSide} onBack={() => { setCls(null); setClassView("days"); setDayPick(null); }}
    onOpenDirectory={() => { setRosterCid(cls.id); setCls(null); setMode("roster"); }}
    onClassChanged={() => setCls(findClass(cls.id) || cls)} /></>;
}

function BookEditor({ books, onChange }) {
  function setRow(i, patch) { onChange(books.map((b, j) => j === i ? { ...b, ...patch } : b)); }
  function removeRow(i) { onChange(books.filter((_, j) => j !== i)); }
  return (
    <div>
      {books.map((b, i) => (
        <div key={i} style={{display: "flex", gap: 8, marginBottom: 8, alignItems: "center"}}>
          <input className="cm-input" style={{margin: 0, flex: 1}} placeholder="교재 이름"
            value={b.name} onChange={(e) => setRow(i, { name: e.target.value })} />
          <input className="cm-input" style={{margin: 0, width: 80}} inputMode="numeric" placeholder="문항수"
            value={b.total || ""} onChange={(e) => setRow(i, { total: parseInt(e.target.value.replace(/\D/g, "")) || 0 })} />
          <button className="cm-link" style={{flex: "none"}} onClick={() => removeRow(i)}>삭제</button>
        </div>
      ))}
      <button className="cm-link" onClick={() => onChange([...books, { name: "", total: 0 }])}>+ 교재 추가</button>
    </div>
  );
}

function validateBooks(books) {
  const cleaned = books.map((b) => ({ name: b.name.trim(), total: b.total }));
  if (cleaned.some((b) => !b.name)) return { err: "교재 이름이 비어있어요" };
  if (cleaned.some((b) => !b.total || b.total <= 0)) return { err: "문항수는 1 이상이어야 해요" };
  const names = cleaned.map((b) => b.name);
  if (new Set(names).size !== names.length) return { err: "교재 이름이 중복돼요" };
  return { books: cleaned };
}

function BookManager({ cls, canEdit }) {
  const [books, setBooks, dirty, settleBooks] = useEditable(getBooks(cls), cls.id);
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);
  async function save() {
    if (busy) return;
    const v = validateBooks(books);
    if (v.err) { setMsg(v.err); return; }
    setBusy(true); setMsg("");
    try {
      await saveClassBooks(cls.id, v.books);
      cls.books = v.books;
      settleBooks(v.books.map((b) => ({ ...b })));
      setMsg("저장됐어요 ✓");
    } catch (e) { setMsg("저장 실패: " + e.message); }
    setBusy(false);
  }
  if (!canEdit) {
    const list = getBooks(cls);
    return list.length === 0 ? <div className="cm-empty">등록된 교재가 없어요</div> : (
      <div>{list.map((b) => (
        <div key={b.name} style={{display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: "1px solid var(--line)"}}>
          <span>{b.name}</span><span style={{color: "var(--muted)"}}>{b.total}문항</span>
        </div>
      ))}</div>
    );
  }
  return (
    <div>
      <div className="cm-hint" style={{marginBottom: 12}}>교재 <b>이름을 바꾸면</b> 그 교재로 쌓인 기존 과제·질문 기록과 <b>연결이 끊겨요</b>. 문항수만 바꾸는 건 안전해요.</div>
      <BookEditor books={books} onChange={setBooks} />
      {dirty && <div className="cm-hint" style={{color: "#c2703f", marginTop: 6}}>아직 저장 안 됐어요 — 아래 저장을 눌러주세요</div>}
      {msg && <div className={msg.includes("✓") ? "cm-done" : "cm-err"}>{msg}</div>}
      <button className="cm-btn cm-btn-primary" disabled={busy} onClick={save}>{busy ? "저장 중..." : (dirty ? "저장 •" : "저장")}</button>
    </div>
  );
}

function FileContentViewer({ meta, loader, height }) {
  const [src, setSrc] = useState(null);
  useEffect(() => {
    let revoke = null; let alive = true;
    setSrc(null);
    if (meta.html) { setSrc({ kind: "srcdoc", value: meta.html }); return; } // 구버전 호환
    loader().then((b64) => {
      if (!alive) return;
      if (meta.mime === "text/html") {
        const text = new TextDecoder("utf-8").decode(Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)));
        setSrc({ kind: "srcdoc", value: text });
      } else {
        const url = URL.createObjectURL(b64ToBlob(b64, meta.mime));
        revoke = url;
        setSrc({ kind: meta.mime.startsWith("image/") ? "img" : "iframe", value: url });
      }
    }).catch(() => alive && setSrc({ kind: "err" }));
    return () => { alive = false; if (revoke) URL.revokeObjectURL(revoke); };
  }, [meta]);
  const h = height || 420;
  if (!src) return <div className="cm-empty">불러오는 중…</div>;
  if (src.kind === "err") return <div className="cm-err">파일을 불러오지 못했어요</div>;
  if (src.kind === "img") return <img src={src.value} style={{width: "100%", borderRadius: 10, border: "1px solid var(--line)"}} />;
  if (src.kind === "srcdoc") return <iframe srcDoc={src.value} sandbox="allow-scripts" style={{width: "100%", height: h, border: "1px solid var(--line)", borderRadius: 10, background: "#fff"}} />;
  return (<>
    <iframe src={src.value} style={{width: "100%", height: h, border: "1px solid var(--line)", borderRadius: 10, background: "#fff"}} />
    <button className="cm-link" onClick={() => window.open(src.value, "_blank")}>새 창에서 크게 보기</button>
  </>);
}

function ProgressFileViewer({ cid, pkey, meta, height }) {

function ProgressEditor({ cid, pkey, canEdit, title }) {
  const [meta, setMeta] = useState(undefined);
  const [msg, setMsg] = useState("");
  const [msgOk, setMsgOk] = useState(false);   // 안내인가(회색) 실패인가(빨강)
  const [busy, setBusy] = useState(false);
  const fileRef = React.useRef(null);
  useEffect(() => progressDoc(cid, pkey).onSnapshot((d) => setMeta(d.exists ? d.data() : null)), [cid, pkey]);
  // doneMsg: 올리고 나서도 남겨야 하는 안내 (없으면 지운다).
  // 진행 문구를 덮어쓰기 때문에 여기서 받지 않으면 안내가 그냥 사라진다.
  async function upload(file, doneMsg) {
    if (!file || busy) return;
    setBusy(true); setMsg("올리는 중... (파일 크기에 따라 잠시 걸려요)");
    try { await saveProgressFile(cid, pkey, file); setMsgOk(true); setMsg(doneMsg || ""); }
    catch (err) { setMsgOk(false); setMsg(err.message); }
    setBusy(false);
  }
  function onFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    upload(file);
  }
  // 진도계획표는 한 장짜리라 드롭은 곧 "교체"다.
  // 버튼은 두 단계(누르고 고르고)지만 드롭은 한 번에 끝나서 실수가 그대로 통과한다.
  // 이미 게시된 게 있을 때만 한 번 묻는다.
  function onDropFiles(list) {
    const ok = list.filter(isNoteFile);
    if (!ok.length) {
      alert("HTML · PDF · 이미지만 올릴 수 있어요.\n\n뺀 파일: " + list.map((f) => f.name).join(", "));
      return;
    }
    const file = ok[0];
    const note = (ok.length > 1 || ok.length < list.length)
      ? "진도계획표는 한 장만 올라가요 — “" + file.name + "”으로 올렸어요" : "";
    if (meta && !confirm("이미 게시된 진도계획표를 “" + file.name + "”으로 바꿀까요?\n(이전 파일은 사라져요)")) return;
    upload(file, note);
  }
  const drop = useFileDrop(onDropFiles, canEdit && !busy);
  async function remove() {
    if (!confirm((title || "이") + " 진도계획표를 삭제할까요?")) return;
    setBusy(true);
    try { await deleteProgressFile(cid, pkey); } catch (e) { setMsgOk(false); setMsg("삭제 실패: " + e.message); }
    setBusy(false);
  }
  if (meta === undefined) return <div className="cm-empty">불러오는 중…</div>;
  return (
    <div className={"cm-drop" + (drop.over ? " over" : "")} {...drop.handlers}>
      <input ref={fileRef} type="file" accept=".html,.htm,.pdf,image/*" style={{display: "none"}} onChange={onFile} />
      {drop.over && <div className="cm-drop-hint">↓ 여기에 놓으면 {meta ? "지금 게시본을 바꿔요" : "게시돼요"}</div>}
      {meta && (<>
        <ProgressFileViewer cid={cid} pkey={pkey} meta={meta} />
        <div style={{display: "flex", gap: 10, alignItems: "center", marginTop: 8, flexWrap: "wrap"}}>
          <span style={{fontSize: 12, color: "var(--muted)"}}>{meta.name ? meta.name + " · " : ""}{fmtDate(ymd(new Date(meta.time)))} 게시</span>
          {canEdit && (<span style={{marginLeft: "auto"}}>
            <button className="cm-link" disabled={busy} onClick={() => fileRef.current.click()}>교체</button>
            <button className="cm-link" style={{color: "#d6453f"}} disabled={busy} onClick={remove}>삭제</button>
          </span>)}
        </div>
      </>)}
      {!meta && (
        canEdit
          ? <>
              <button className="cm-btn cm-btn-ghost" disabled={busy} onClick={() => fileRef.current.click()}>+ 파일 올려서 게시하기 (HTML · PDF · 이미지)</button>
              {canDragDrop && !drop.over && <div className="cm-hint" style={{textAlign: "center", marginTop: 6}}>파일을 여기로 끌어다 놓아도 돼요</div>}
            </>
          : <div className="cm-empty">아직 게시된 진도계획표가 없어요</div>
      )}
      {msg && <div className={(busy || msgOk) ? "cm-hint" : "cm-err"} style={{marginTop: 8}}>{msg}</div>}
    </div>
  );
}

function NoteUnit({ cls, unit, canEdit }) {
  const [open, setOpen] = useState(false);
  const [files, setFiles] = useState(null);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");
  const fileRef = React.useRef(null);
  useEffect(() => {
    if (!open) return;
    return noteFilesCol(cls.id, unit.uid).orderBy("time").onSnapshot((s) => {
      const arr = []; s.forEach((d) => arr.push({ fid: d.id, ...d.data() }));
      setFiles(arr);
    });
  }, [open, cls.id, unit.uid]);
  async function uploadFiles(list) {
    if (!list.length || busy) return;
    // 드래그로는 아무 파일이나 들어온다. 파일 선택창의 accept와 같은 기준으로 먼저 거른다
    const ok = list.filter(isNoteFile);
    const bad = list.filter((f) => !isNoteFile(f));
    if (bad.length) {
      alert("이미지 · PDF · HTML만 올릴 수 있어요.\n\n뺀 파일: " + bad.map((f) => f.name).join(", "));
    }
    if (!ok.length) return;
    setBusy(true);
    for (let i = 0; i < ok.length; i++) {
      const f = ok[i];
      setMsg((ok.length > 1 ? "(" + (i + 1) + "/" + ok.length + ") " : "") + '"' + f.name + '" 올리는 중...');
      try { await addNoteFile(cls.id, unit.uid, f); }
      catch (err) { alert(f.name + ": " + err.message); }
    }
    setMsg(""); setBusy(false);
  }
  function onFile(e) {
    const list = Array.from(e.target.files || []);
    e.target.value = "";
    uploadFiles(list);
  }
  const drop = useFileDrop(uploadFiles, canEdit && open && !busy);
  return (
    <div style={{borderBottom: "1px solid var(--line)", padding: "10px 0"}}>
      <input ref={fileRef} type="file" accept=".html,.htm,.pdf,image/*" multiple style={{display: "none"}} onChange={onFile} />
      <div style={{display: "flex", alignItems: "center", gap: 8, cursor: "pointer"}} onClick={() => setOpen(!open)}>
        <strong>{unit.title}</strong>
        <span style={{marginLeft: "auto"}}>
          {canEdit && open && (<>
            <button className="cm-link" onClick={(e) => {
              e.stopPropagation();
              const t = prompt("단원 이름 수정", unit.title);
              if (t && t.trim()) renameNoteUnit(cls.id, unit.uid, t.trim());
            }}>이름 수정</button>
            <button className="cm-link" style={{color: "#d6453f"}} onClick={(e) => {
              e.stopPropagation();
              if (confirm('"' + unit.title + '" 단원과 안의 노트를 전부 삭제할까요?')) deleteNoteUnit(cls.id, unit.uid);
            }}>삭제</button>
          </>)}
          {open ? "▾" : "▸"}
        </span>
      </div>
      {open && (
        <div style={{marginTop: 6}} className={"cm-drop" + (drop.over ? " over" : "")} {...drop.handlers}>
          {files === null && <div className="cm-empty">불러오는 중…</div>}
          {files && files.length === 0 && !drop.over && <div className="cm-empty">아직 올라온 노트가 없어요{canEdit && canDragDrop && <><br/><span style={{fontSize: 12}}>파일을 여기로 끌어다 놓아도 돼요</span></>}</div>}
          {files && files.map((f) => <NoteFileRow key={f.fid} cls={cls} unit={unit} file={f} canEdit={canEdit} />)}
          {drop.over && <div className="cm-drop-hint">↓ 여기에 놓으면 “{unit.title}”에 올라가요</div>}
          {canEdit && <button className="cm-btn cm-btn-ghost" disabled={busy} style={{marginTop: 10}} onClick={() => fileRef.current.click()}>+ 노트 올리기 (이미지 · PDF · HTML, 여러 장 가능)</button>}
          {msg && <div className="cm-hint" style={{marginTop: 6}}>{msg}</div>}
        </div>
      )}
    </div>
  );
}

// ----- 안내문 -----
// flyer.html은 자체 style·script를 가진 완결된 문서라 앱 DOM에 인라인하면 CSS가 서로 밟는다.
// iframe으로 띄우고 postMessage로만 주고받는다. 저장은 앱이 Firestore에 한다.
function FlyerEditor({ cls, canEdit, onOpenProgress }) {
  const ref = React.useRef(null);
  const [draft, setDraft] = useState(undefined);   // undefined=로딩, null=빈 것
  const [pub, setPub] = useState(null);
  const [dirty, setDirty] = useState(false);
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);
  const draftRef = React.useRef(null);
  draftRef.current = draft;

  useEffect(() => { loadFlyer(cls.id).then((d) => setDraft(d || null)).catch(() => setDraft(null)); }, [cls.id]);
  // 이 화면에 있는 동안만 좌우 폭 제한을 푼다 (편집 패널 440px + 미리보기가 들어가야 한다)
  useEffect(() => {
    const el = document.querySelector(".cm-shell");
    if (!el) return;
    el.classList.add("cm-shell-wide");
    return () => el.classList.remove("cm-shell-wide");
  }, []);
  // 화면 높이에 맞춰 늘린다. 창 크기가 바뀌면 따라간다
  const [vh, setVh] = useState(window.innerHeight);
  useEffect(() => {
    const on = () => setVh(window.innerHeight);
    window.addEventListener("resize", on);
    return () => window.removeEventListener("resize", on);
  }, []);
  useEffect(() => listenFlyerPub(cls.id, setPub), [cls.id]);

  // iframe이 준비됐다고 알리면 데이터를 내려보낸다
  useEffect(() => {
    function onMsg(ev) {
      const m = ev.data;
      if (!m || m.src !== "climath-flyer") return;
      if (m.type === "ready") send();
      if (m.type === "change") { draftRef.current = m.data; setDraft(m.data); setDirty(true); }
    }
    window.addEventListener("message", onMsg);
    return () => window.removeEventListener("message", onMsg);
  }, [cls.id]);
  function send() {
    const w = ref.current && ref.current.contentWindow;
    if (w) w.postMessage({ src: "climath-app", type: "load", data: draftRef.current || null }, "*");
  }
  useEffect(() => { if (draft !== undefined) send(); }, [draft === undefined]);

  async function doSave() {
    if (busy) return;
    setBusy(true); setMsg("");
    try { await saveFlyer(cls.id, draftRef.current || {}); setDirty(false); setMsg("저장됐어요 ✓"); }
    catch (e) { setMsg("저장 실패: " + e.message); }
    setBusy(false);
  }
  async function doPublish() {
    if (busy) return;
    if (!confirm("지금 내용을 학생 화면에 게시할까요?" + "\n" + "학생과 학부모가 바로 볼 수 있게 됩니다.")) return;
    setBusy(true); setMsg("");
    try {
      await saveFlyer(cls.id, draftRef.current || {});
      await publishFlyer(cls.id, draftRef.current || {});
      setDirty(false); setMsg("게시됐어요 ✓");
    } catch (e) { setMsg("게시 실패: " + e.message); }
    setBusy(false);
  }
  async function doUnpublish() {
    if (!confirm("학생 화면에서 안내문을 내릴까요? (초안은 그대로 남아요)")) return;
    setBusy(true);
    try { await unpublishFlyer(cls.id); setMsg("내렸어요"); } catch (e) { setMsg("실패: " + e.message); }
    setBusy(false);
  }

  const live = pub && pub.active;
  const url = "/flyer.html?cid=" + encodeURIComponent(cls.id);
  if (draft === undefined) return <div className="cm-empty">불러오는 중…</div>;
  return (
    <div>
      <div className="cm-hint" style={{marginBottom: 10}}>
        왼쪽을 채우면 오른쪽 안내문이 바뀌어요. 다 만들면 <b>저장</b>하고, 학생에게 보여줄 땐 <b>게시</b>하세요.
        인쇄는 <b>새 창에서 열기</b>가 편해요.
        {canEdit && !isIndividual(cls) && onOpenProgress && (<>
          {" "}직접 만든 PDF·이미지를 대신 올리시려면{" "}
          <button className="cm-link" style={{padding: 0}} onClick={onOpenProgress}>진도표</button>로 가세요.
        </>)}
      </div>
      <div className="cm-fly-bar">
        {canEdit && <button className="cm-btn cm-btn-primary" disabled={busy}
          onClick={doSave}>{busy ? "…" : (dirty ? "저장 •" : "저장")}</button>}
        {canEdit && <button className="cm-btn cm-btn-ghost" disabled={busy}
          onClick={doPublish}>학생에게 게시</button>}
        <button className="cm-link" onClick={() => window.open(url, "_blank")}>새 창에서 열기 (인쇄)</button>
        {live && canEdit && <button className="cm-link" style={{color: "#d6453f"}} onClick={doUnpublish}>게시 내리기</button>}
      </div>
      <div style={{marginBottom: 8}}>
        {live
          ? <span className="cm-chip" style={{background: "#e6f0e9", color: "#3f7d5e"}}>학생 화면에 게시 중 · {fmtDate(ymd(new Date(pub.time)))}</span>
          : <span className="cm-chip" style={{background: "#f0ece5", color: "#7c6f5f"}}>아직 게시 안 함 (선생님만 보임)</span>}
        {dirty && <span className="cm-chip" style={{background: "#f6e7df", color: "#c2703f", marginLeft: 6}}>저장 안 된 변경</span>}
      </div>
      {msg && <div className={msg.includes("✓") ? "cm-done" : "cm-err"} style={{marginBottom: 8}}>{msg}</div>}
      <iframe ref={ref} src={url} title="안내문 편집"
        style={{width: "100%", height: Math.max(560, vh - 300),
                border: "1px solid var(--line)", borderRadius: 12, background: "#fff"}} />
    </div>
  );
}

// 학생·학부모가 보는 게시본. 편집 패널 없이 안내문만 (flyer.html의 view=1)
function FlyerView({ cls }) {
  const ref = React.useRef(null);
  const [pub, setPub] = useState(undefined);
  const pubRef = React.useRef(null);
  pubRef.current = pub;
  useEffect(() => listenFlyerPub(cls.id, (d) => setPub(d && d.active ? d : null)), [cls.id]);
  useEffect(() => {
    function onMsg(ev) {
      const m = ev.data;
      if (!m || m.src !== "climath-flyer" || m.type !== "ready") return;
      const w = ref.current && ref.current.contentWindow;
      if (w) w.postMessage({ src: "climath-app", type: "load", data: (pubRef.current || {}).data || null }, "*");
    }
    window.addEventListener("message", onMsg);
    return () => window.removeEventListener("message", onMsg);
  }, []);
  useEffect(() => {
    const w = ref.current && ref.current.contentWindow;
    if (w && pub) w.postMessage({ src: "climath-app", type: "load", data: pub.data || null }, "*");
  }, [pub]);
  if (pub === undefined) return <div className="cm-empty">불러오는 중…</div>;
  if (!pub) return <div className="cm-empty">아직 게시된 안내문이 없어요</div>;
  return (
    <div className="cm-card">
      <h3 className="cm-h3">안내문</h3>
      <iframe ref={ref} src={"/flyer.html?view=1&cid=" + encodeURIComponent(cls.id)} title="안내문"
        style={{width: "100%", height: Math.max(480, Math.round(window.innerHeight * 0.7)),
                border: "1px solid var(--line)", borderRadius: 12, background: "#fff"}} />
    </div>
  );
}
