          <option value="">-- 학생을 선택하세요 --</option>
          {students.map((r) => (
            <option key={r.id} value={r.id}>
              {r.name}{activeDms[r.id]?.active && activeDms[r.id]?.text ? " 📩" : ""}
            </option>
          ))}
        </select>
        {dmStudent && (
          <>
            <label className="cm-label">메시지</label>
            <textarea className="cm-input cm-notice-ta" rows={3}
              placeholder="해당 학생에게만 보이는 메시지를 입력하세요"
              value={dmText} onChange={(e) => setDmText(e.target.value)} />
            <div style={{ display: "flex", gap: 10, marginTop: 12 }}>
              <button className="cm-btn cm-btn-primary" style={{ margin: 0 }}
                onClick={() => dmText.trim() && postDm(cls.id, dmStudent, dmText.trim())}>보내기</button>
              {activeDms[dmStudent]?.active && activeDms[dmStudent]?.text && (
                <button className="cm-btn cm-btn-ghost" style={{ margin: 0 }}
                  onClick={() => { clearDm(cls.id, dmStudent); setDmText(""); }}>지우기</button>
              )}
            </div>
          </>
        )}
        {Object.entries(activeDms).filter(([, v]) => v.active && v.text).length > 0 && (
          <div style={{ marginTop: 16, borderTop: "1px dashed var(--line)", paddingTop: 12 }}>
            <div className="cm-mini-h">현재 보내진 개인 공지</div>
            {Object.entries(activeDms).filter(([, v]) => v.active && v.text).map(([sid, v]) => {
              const st = students.find((r) => r.id === sid);
              return st ? (
                <div key={sid} className="cm-sent-item">
                  <span><b>{st.name}</b> · {v.text.length > 24 ? v.text.slice(0, 24) + "…" : v.text}</span>
                  <button className="cm-link" onClick={() => { clearDm(cls.id, sid); if (dmStudent === sid) setDmText(""); }}>지우기</button>
                </div>
              ) : null;
            })}
          </div>
        )}
      </div>
      )}
      </>)}

      {activeView === "days" && (
        <div className="cm-card">
          <h3 className="cm-h3">날짜 선택</h3>
          {!days ? (<div className="cm-empty">불러오는 중…</div>) : (
            <div className="cm-daylist">
              {days.map((d) => (
                <button key={d} className={"cm-day" + (d === todayStr ? " today" : "")} onClick={() => setSelected(d)}>
                  <div className="cm-day-left"><span className="cm-day-date">{fmtDate(d)}</span>{d === todayStr && <span className="cm-day-badge">오늘</span>}</div>
                  <span className="cm-day-arrow">›</span>
                </button>
              ))}
            </div>
          )}
        </div>
      )}

      {activeView === "book" && (
        <div className="cm-card">
          <h3 className="cm-h3">월간 출석부</h3>
          <AttendanceBook cls={cls} canEdit={canEdit} />
        </div>
      )}

      {activeView === "live" && isIndividual(cls) && !isClassEnded(cls) && (
        <div className="cm-card">
          <h3 className="cm-h3">수업 로그 <span className="cm-h-hint">(누구와 몇 분을 했는지)</span></h3>
          <LessonLogger cls={cls} canEdit={canEdit} meName={meName} />
        </div>
      )}

      {activeView === "progress" && (
        <div className="cm-card">
          <h3 className="cm-h3">진도계획표 {isIndividual(cls) && <span className="cm-h-hint">(학생별 게시)</span>}</h3>
          <ProgressManager cls={cls} canEdit={canEdit} />
        </div>
      )}

      {activeView === "notes" && (
        <div className="cm-card">
          <h3 className="cm-h3">강의노트 <span className="cm-h-hint">(단원별 손필기)</span></h3>
          <NotesManager cls={cls} canEdit={canEdit} />
        </div>
      )}

      {activeView === "ailog" && (
        <div className="cm-card">
          <h3 className="cm-h3">AI 힌트 질문 내역 <span className="cm-h-hint">(학생이 AI에게 물어본 것)</span></h3>
          <AILogView cls={cls} />
        </div>
      )}

      {activeView === "consult" && (
        <div className="cm-card">
          <h3 className="cm-h3">상담 기록 <span className="cm-h-hint">(학생 · 학부모)</span></h3>
          <ConsultView cls={cls} canEdit={canEdit} meName={meName} />
        </div>
      )}

      {activeView === "textbooks" && (<>
        {isOwner && (
          <div className="cm-card">
            <h3 className="cm-h3">반 정보 <span className="cm-h-hint">(관리자 전용)</span></h3>
            <ClassMetaEditor cls={cls} onSaved={() => { bumpVer((v) => v + 1); onClassChanged && onClassChanged(); }} onDeleted={onBack} />
          </div>
        )}
        {isOwner && !isIndividual(cls) && (
          <div className="cm-card">
            <h3 className="cm-h3">합반 설정 <span className="cm-h-hint">(질문 공유 · 관리자 전용)</span></h3>
            <MergeManager cls={cls} onSaved={() => bumpVer((v) => v + 1)} />
          </div>
        )}
        <div className="cm-card">
          <h3 className="cm-h3">학생 명단</h3>
          <RosterManager key={"rm" + cfgVer} cls={cls} canEdit={canEdit}
            onChanged={() => bumpVer((v) => v + 1)} onOpenDirectory={onOpenDirectory} />
        </div>
        {isIndividual(cls) ? (
          <div className="cm-card">
            <h3 className="cm-h3">학생별 설정 <span className="cm-h-hint">(등원요일 · 교재)</span></h3>
            <StudentConfig key={"sc" + rosterVer} cls={cls} canEdit={canEdit} onChanged={() => bumpCfg((v) => v + 1)} />
          </div>
        ) : (
          <div className="cm-card">
            <h3 className="cm-h3">교재 설정</h3>
            <BookManager cls={cls} canEdit={canEdit} />
          </div>
        )}
      </>)}
    </div>
    </>
  );
}

// ===== 월간 출석부 =====
function AttendanceBook({ cls, canEdit }) {
  const students = cls.roster.filter((r) => !r.teacher);
  const [days, setDays] = React.useState([]);
  const [attData, setAttData] = React.useState({});   // { date: { sid: true } }
  const [scoreData, setScoreData] = React.useState({}); // { date: { sid: score } }
  const [hwData, setHwData] = React.useState({});     // { sid: { bookName: count } }
  const [loading, setLoading] = React.useState(true);

  // 현재 월 (YYYY-MM)
  const nowYM = todayStr.slice(0, 7);
  const [month, setMonth] = React.useState(nowYM);
  const [makeups, setMakeups] = React.useState({});
  React.useEffect(() => listenMakeups(cls.id, setMakeups), [cls.id]);

  // 최근 12개월 옵션
  const monthOptions = recentMonths(12);
  function shiftMonth(delta) {
    const [y, m] = month.split("-").map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    setMonth(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"));
  }
  const monthLabel = (ym) => {
    const [y, m] = ym.split("-");
    return Number(m) + "월" + (ym.slice(0, 4) !== nowYM.slice(0, 4) ? " (" + y + ")" : "");
  };
  const canNext = month < nowYM;
  const MonthNav = ({ extra }) => (
    <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>
      <button className="cm-ab-tab" style={{ padding: "5px 11px" }} onClick={() => shiftMonth(-1)}>‹</button>
      <select className="cm-ab-month-sel" style={{ marginBottom: 0, fontWeight: 600 }} value={month} onChange={(e) => setMonth(e.target.value)}>
        {monthOptions.map((m) => <option key={m} value={m}>{monthLabel(m)}</option>)}
      </select>
      <button className="cm-ab-tab" style={{ padding: "5px 11px", opacity: canNext ? 1 : .35 }} disabled={!canNext} onClick={() => shiftMonth(1)}>›</button>
      {month !== nowYM && <button className="cm-link" onClick={() => setMonth(nowYM)}>이번 달</button>}
      {extra}
      <span style={{ fontSize: 11, color: "#8a7f72", width: "100%", marginTop: 2 }}>
        칸을 누르면 <b>O</b>출석 → <b style={{color:"#c2703f"}}>예</b>결석예정 → <b style={{color:"#2b5f8a"}}>영</b>동영상보강 → <b>/</b>미출석 순으로 바뀌어요
      </span>
    </div>
  );

  useEffect(() => {
    setLoading(true);
    // 해당 월의 days 목록 불러오기
    // 기록이 있는 날 ∪ 수업이 있었어야 할 날(오늘까지).
    // 앞엣것만 쓰면 출석을 안 찍은 날은 칸이 아예 없어서 나중에 못 채운다.
    // 뒤엣것만 쓰면 요일 밖에 한 보강수업이 사라진다. 둘을 합쳐야 한다.
    daysCol(cls.id).get().then((snap) => {
      const real = [];
      snap.forEach((d) => { if (String(d.id).startsWith(month)) real.push(d.id); });
      const sched = scheduledDates(cls, month).filter((d) => d <= todayStr);
      const set = {};
      real.concat(sched).forEach((d) => { set[d] = 1; });
      // 요일이 하나도 설정 안 된 반이면 오늘이라도 보여준다 (예전 동작 유지)
      if (!sched.length && month === nowYM) set[todayStr] = 1;
      const filtered = Object.keys(set).sort();
      setDays(filtered);

      if (filtered.length === 0) { setLoading(false); return; }

      const attMap = {};
      const scoreMap = {};
      let pending = filtered.length * 2;
      const done = () => { if (--pending === 0) setLoading(false); };

      filtered.forEach((date) => {
        attMap[date] = {};
        scoreMap[date] = {};
        // 출석
        attCol(cls.id, date).get().then((s) => {
          s.forEach((d) => { attMap[date][d.id] = true; });
          setAttData({ ...attMap });
          done();
        }).catch(done);
        // 점수 (가장 최근 제출)
        scoresCol(cls.id, date).orderBy("time").get().then((s) => {
          s.forEach((d) => {
            const data = d.data();
            scoreMap[date][data.sid] = data.score;
          });
          setScoreData({ ...scoreMap });
          done();
        }).catch(done);
      });

      // 과제 (전체, 날짜 무관)
      hwCol(cls.id).get().then((s) => {
        const hw = {};
        s.forEach((d) => {
          const books = d.data().books || {};
          hw[d.id] = {};
          getBooks(cls).forEach((b) => {
            hw[d.id][b.name] = (books[b.name] || []).length;
          });
        });
        setHwData(hw);
      });
    });
  }, [cls.id, month]);

  // 출결 토글
  // 셀 상태 순환: 출석(O) → 결석예정(예) → 동영상완료(영) → 미출석(/)
  async function cycleCell(date, student) {
    const present = attData[date] && attData[date][student.id];
    const mk = makeups[student.id + "_" + date] || {};
    if (present) {
      await attCol(cls.id, date).doc(student.id).delete();
      setAttData((p) => { const n = { ...p, [date]: { ...(p[date] || {}) } }; delete n[date][student.id]; return n; });
      await setMakeup(cls.id, student.id, student.name, date, { planned: true, videoDone: false });
    } else if (mk.planned && !mk.videoDone) {
      await setMakeup(cls.id, student.id, student.name, date, { planned: true, videoDone: true });
    } else if (mk.videoDone) {
      await clearMakeup(cls.id, student.id, date);
    } else {
      await attCol(cls.id, date).doc(student.id).set({ name: student.name, time: Date.now() });
      touchDay(cls.id, date);
      setAttData((p) => ({ ...p, [date]: { ...(p[date] || {}), [student.id]: true } }));
    }
  }
  function cellView(date, student) {
    const present = attData[date] && attData[date][student.id];
    const mk = makeups[student.id + "_" + date] || {};
    if (present) return { t: "O", cls: "cm-ab-att-o", title: "출석" };
    if (mk.videoDone) return { t: "영", cls: "cm-ab-att-v", title: "동영상 보강 완료" };
    if (mk.planned) return { t: "예", cls: "cm-ab-att-p", title: "결석 예정" };
    return { t: "/", cls: "cm-ab-att-x", title: "미출석" };
  }

  async function toggleAttendance(date, student) {
    const present = attData[date] && attData[date][student.id];
    if (present) {
      await attCol(cls.id, date).doc(student.id).delete();
    } else {
      await attCol(cls.id, date).doc(student.id).set({ name: student.name, time: Date.now() });
      touchDay(cls.id, date);
    }
    setAttData((prev) => {
      const next = { ...prev, [date]: { ...(prev[date] || {}) } };
      if (present) delete next[date][student.id];
      else next[date][student.id] = true;
      return next;
    });
  }

  // 날짜 포맷 M/D

  if (loading) return <div><MonthNav /><div className="cm-empty">불러오는 중…</div></div>;
  if (days.length === 0) return <div><MonthNav /><div className="cm-empty">이 달에 수업 기록이 없어요</div></div>;

  // ---- 개별진도반: 학생별 자기 요일만 표시 ----
  if (isIndividual(cls)) {
    const dowOf = (d) => new Date(d + "T00:00:00").getDay();
    return (
      <div>
        <MonthNav />
        <div className="cm-ab-wrap" data-no-swipe>
          <table className="cm-ab-table">
            <thead>
              <tr>
                <th className="cm-ab-name">이름</th>
                <th style={{textAlign: "left"}}>등원일 (출결 탭하여 변경)</th>
                <th style={{ minWidth: 60 }}>과제</th>
              </tr>
            </thead>
            <tbody>
              {students.map((st) => {
                const myDays = days.filter((d) => (st.days || []).includes(dowOf(d)) && isActiveOn(st, d));
                const hw = hwData[st.id] || {};
                const myBooks = getStudentBooks(cls, st);
                const myTotal = myBooks.reduce((s, b) => s + b.total, 0);
                const myDone = myBooks.reduce((s, b) => s + (hw[b.name] || 0), 0);
                const hwPct = myTotal > 0 ? Math.round(myDone / myTotal * 100) : 0;
                const attCount = myDays.filter((d) => (attData[d] && attData[d][st.id]) || (makeups[st.id + "_" + d] || {}).videoDone).length;
                return (
                  <tr key={st.id}>
                    <td className="cm-ab-name" style={isEnded(st) ? {opacity: .55} : undefined}>{st.name}<br/><span style={{fontSize:10,color:"#8a7f72"}}>{isEnded(st) ? "수강 종료" : ((st.days || []).map((d) => DAY_NAMES[d]).join("·") || "요일 미설정")}</span></td>
                    <td style={{textAlign: "left"}}>
                      {myDays.length === 0 ? <span style={{color: "#bbb", fontSize: 12}}>이 달 기록 없음</span> : (
                        <div style={{display: "flex", gap: 5, flexWrap: "wrap"}}>
                          {myDays.map((d) => {
                            const cv = cellView(d, st);
                            const score = scoreData[d] && scoreData[d][st.id];
                            return (
                              <span key={d} onClick={() => canEdit && cycleCell(d, st)} title={cv.title}
                                className={cv.cls}
                                style={{display: "inline-flex", flexDirection: "column", alignItems: "center", padding: "3px 7px", borderRadius: 7, cursor: canEdit ? "pointer" : "default", border: "1px solid var(--line)"}}>
                                <span style={{fontSize: 10, color: "#8a7f72"}}>{shortDate(d)}</span>
                                <span>{cv.t}</span>
                                {score != null && <span style={{fontSize: 9, color: "#8a7f72"}}>{score}점</span>}
                              </span>
                            );
                          })}
                        </div>
                      )}
                    </td>
                    <td className="cm-ab-hw">{hwPct}%<br/><span style={{fontSize:9,color:"#bbb"}}>{attCount}/{myDays.length}</span></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    );
  }

  // 교재별 과제 완성률 (전체 합산)
  const totalHwPages = getBooks(cls).reduce((s, b) => s + b.total, 0);

  return (
    <div>
      <MonthNav extra={<span style={{ fontSize: 12, color: "#8a7f72" }}>총 {days.length}회차</span>} />
      <div className="cm-ab-wrap" data-no-swipe>
        <table className="cm-ab-table">
          <thead>
            <tr>
              <th className="cm-ab-name">이름</th>
              {days.map((d) => (
                <th key={d} colSpan={3} style={{ minWidth: 72 }}>{shortDate(d)}</th>
              ))}
              <th style={{ minWidth: 60 }}>과제</th>
            </tr>
            <tr>
              <th className="cm-ab-name"></th>
              {days.map((d) => (
                <React.Fragment key={d}>
                  <th style={{ fontSize: 10, color: "#8a7f72" }}>출결</th>
                  <th style={{ fontSize: 10, color: "#8a7f72" }}>과제</th>
                  <th style={{ fontSize: 10, color: "#8a7f72" }}>점수</th>
                </React.Fragment>
              ))}
              <th style={{ fontSize: 10, color: "#8a7f72" }}>완성률</th>
            </tr>
          </thead>
          <tbody>
            {students.map((st) => {
              const hw = hwData[st.id] || {};
              const totalDone = getBooks(cls).reduce((s, b) => s + (hw[b.name] || 0), 0);
              const hwPct = totalHwPages > 0 ? Math.round(totalDone / totalHwPages * 100) : 0;
              const attCount = days.filter((d) => (attData[d] && attData[d][st.id]) || (makeups[st.id + "_" + d] || {}).videoDone).length;
              return (
                <tr key={st.id}>
                  <td className="cm-ab-name">{st.name}</td>
                  {days.map((d) => {
                    const present = attData[d] && attData[d][st.id];
                    const score = scoreData[d] && scoreData[d][st.id];
                    return (
                      <React.Fragment key={d}>
                        {(() => { const cv = cellView(d, st); return (
                        <td className={cv.cls} title={cv.title} onClick={() => canEdit && cycleCell(d, st)} style={canEdit ? undefined : {cursor: "default"}}>{cv.t}</td>
                      ); })()}
                        <td></td>
                        <td className="cm-ab-score">{score != null ? score : ""}</td>
                      </React.Fragment>
                    );
                  })}
                  <td className="cm-ab-hw">{hwPct}%<br/><span style={{fontSize:9,color:"#bbb"}}>{attCount}/{days.length}</span></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

const RESOLVED_PAGE_SIZE = 5;

function QuestionQueue({ questions, clsId, date, canEdit, books, merged }) {
  const BOOK_TABS = ["전체", ...(books || []).map((b) => b.name)];
  const [activeBook, setActiveBook] = React.useState("전체");
  const [resolvedPage, setResolvedPage] = React.useState(0);

  const sortByNum = (arr) => arr.slice().sort((a, b) => {
    const na = parseFloat(a.num) || 0, nb = parseFloat(b.num) || 0;
    return na !== nb ? na - nb : a.time - b.time;
  });

  const filtered = activeBook === "전체" ? questions : questions.filter((q) => q.book === activeBook);
  const pending = sortByNum(filtered.filter((q) => !q.resolved));
  // 해결완료: 최신순 (time 내림차순)
  const resolved = filtered.filter((q) => q.resolved).slice().sort((a, b) => b.time - a.time);
  const resolvedTotal = resolved.length;
  const resolvedPages = Math.ceil(resolvedTotal / RESOLVED_PAGE_SIZE);
  const resolvedShown = resolved.slice(resolvedPage * RESOLVED_PAGE_SIZE, (resolvedPage + 1) * RESOLVED_PAGE_SIZE);

  const renderQ = (q) => (
    <div key={q.qid} className={"cm-q" + (q.resolved ? " done" : "")}>
      <div className="cm-q-main">
        <div className="cm-q-top"><span className="cm-q-name">{q.name}{merged && q.fromClass && <span className="cm-day-sub" style={{marginLeft: 6, fontSize: 10}}>{q.fromClass}</span>}</span><span className="cm-q-time">{hhmm(q.time)}</span></div>
        <div className="cm-q-body">{q.book} <b>{q.num}</b>번{q.memo && <span className="cm-q-memo"> · {q.memo}</span>}</div>
      </div>
      {q.resolved
        ? <span className="cm-q-resolved">✓ 해결완료</span>
        : canEdit ? <button className="cm-btn cm-btn-ghost" onClick={() => resolveQuestion(clsId, date, q.qid)}>해결</button> : null}
    </div>
  );

  if (questions.length === 0) return <div className="cm-empty">들어온 질문이 없어요</div>;

  return (
    <div>
      <div className="cm-q-tabs">
        {BOOK_TABS.map((t) => (
          <button key={t} className={"cm-q-tab" + (activeBook === t ? " on" : "")}
            onClick={() => { setActiveBook(t); setResolvedPage(0); }}>{t}</button>
        ))}
      </div>
      {pending.length === 0 && <div className="cm-empty">대기 중인 질문이 없어요</div>}
      {pending.map(renderQ)}
      {resolvedTotal > 0 && (
        <details className="cm-resolved-box" style={{marginTop: 12}}>
          <summary className="cm-resolved-summary">해결완료 {resolvedTotal}건</summary>
          {resolvedShown.map(renderQ)}
          {resolvedPages > 1 && (
            <div className="cm-q-pages">
              <button className="cm-q-page-btn" disabled={resolvedPage === 0} onClick={() => setResolvedPage((p) => p - 1)}>◀</button>
              <span>{resolvedPage + 1} / {resolvedPages}</span>
              <button className="cm-q-page-btn" disabled={resolvedPage >= resolvedPages - 1} onClick={() => setResolvedPage((p) => p + 1)}>▶</button>
            </div>
          )}
        </details>
      )}
    </div>
  );
}

/* ==================== 수업 로그 (개별진도반) ====================
   개진반은 한 교실에서 학생마다 다른 단원을 한다. 녹화본을 학생별로 가르려면
   "몇 분부터 몇 분까지가 누구 것인지"가 필요한데, 그건 수업이 끝나면 사라진다.
   여기서 그 자리에 적는다. 마이크는 그걸 대신 눌러주는 게 아니라 제안만 한다.
   ── 이유: 자동자막은 이름을 자주 틀린다(지오→지옥, 승훈→성훈·승우).
      틀린 자동 전환은 나중에 영상을 다 잘라놓고 나서야 발견된다.       */

const CL_PALETTE = ["#27406e", "#c2703f", "#3f7d5e", "#7c3aed", "#be123c", "#0e7490"];
const CL_KIND = {
  lesson: { label: "강의", keep: true },
  qa:     { label: "질문응대", keep: false },
  brk:    { label: "쉬는시간", keep: false },
  mic:    { label: "마이크꺼짐", keep: false },
  etc:    { label: "기타", keep: false },
};
// 내 수업 계량 지표 — 볼트 [[내 수업 분석]]의 "확인은 많고 요구는 없다" 두 축
// 전역(/g) 플래그를 쓰지 않는다. 발화 하나에 여러 패턴이 걸려도 한 번으로 센다
// ("왜 그런지 말해봐"는 요구 하나지 둘이 아니다). 부풀리느니 모자라게 세는 쪽이 낫다 —
// 본인은 늘 "물어봤다"고 느낀다는 게 원래 문제였다.
const CL_CLOSED = /알겠(어|지|죠|나|니)|알았(어|지|죠)|맞(죠|지|나요)|이해(했|됐|되)|됐(죠|지)|그렇(죠|지)|오케이|알지\?/;
const CL_OPEN = /왜\s*(그런|이렇|저렇|그렇)|말해\s*(봐|볼)|설명해\s*(봐|볼)|어디(서|가)?\s*(막|헷)|어떻게\s*(하면|되|풀)|어떤\s*(생각|방법)|뭐라고\s*생각|써\s*(봐|보세)|풀어\s*(봐|볼)|해\s*볼래/;
// 발화 단위로 센다. entries = [{t,text}]
function clCountUtt(entries, re) { return (entries || []).filter((e) => re.test(e.text || "")).length; }

function clHms(sec) {
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const p = (n) => String(n).padStart(2, "0");
  return h > 0 ? h + ":" + p(m) + ":" + p(s) : p(m) + ":" + p(s);
}
function clMins(sec) { return Math.round(sec / 60) + "분"; }

// ---- 한글 자모 분해: 자동자막이 틀린 이름을 잡아내려면 글자 단위로는 부족하다 ----
const CL_CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ".split("");
const CL_JUNG = "ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ".split("");
const CL_JONG = ["", "ㄱ", "ㄲ", "ㄳ", "ㄴ", "ㄵ", "ㄶ", "ㄷ", "ㄹ", "ㄺ", "ㄻ", "ㄼ", "ㄽ", "ㄾ", "ㄿ", "ㅀ", "ㅁ", "ㅂ", "ㅄ", "ㅅ", "ㅆ", "ㅇ", "ㅈ", "ㅊ", "ㅋ", "ㅌ", "ㅍ", "ㅎ"];
function clJamo(str) {
  let out = "";
  for (const ch of String(str || "")) {
    const c = ch.charCodeAt(0) - 0xac00;
    if (c >= 0 && c <= 11171) {
      out += CL_CHO[Math.floor(c / 588)] + CL_JUNG[Math.floor((c % 588) / 28)] + CL_JONG[c % 28];
    } else out += ch;
  }
  return out;
}
function clEdit(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}
function clSim(a, b) {
  const x = clJamo(a), y = clJamo(b);
  const L = Math.max(x.length, y.length);
  return L ? 1 - clEdit(x, y) / L : 0;
}

/* 들린 말에서 학생 이름을 찾는다.
   people = [{ sid, name, aliases:[], units:[] }]
   이름은 자모 유사도로, 단원은 그냥 포함 여부로 본다.
   단원 쪽이 훨씬 믿을 만하다 — 수학 용어는 자동자막이 잘 받아쓴다. */
function clDetect(text, people) {
  const flat = String(text || "").replace(/\s+/g, "");
  let best = null;
  for (const p of people) {
    let score = 0, why = "";
    const cands = [p.name, ...(p.aliases || [])].filter(Boolean);
    for (const cand of cands) {
      const c = cand.replace(/\s+/g, "");
      if (!c) continue;
      const w = c.length;
      for (let i = 0; i + w - 1 <= flat.length; i++) {
        for (const len of [w, w + 1]) {          // "지오"가 "지오야"로 붙어 나오는 경우
          const piece = flat.slice(i, i + len);
          if (piece.length < 2) continue;
          const s = clSim(c, piece);
          if (s > score) { score = s; why = piece; }
        }
      }
    }
    let nameHit = score >= 0.72 ? score : 0;
    let unitHit = 0, unitWhy = "";
    for (const u of (p.units || [])) {
      const uu = String(u).replace(/\s+/g, "");
      if (uu.length >= 2 && flat.includes(uu)) { unitHit = 1; unitWhy = u; break; }
    }
    const total = Math.max(nameHit, unitHit ? 0.9 : 0);
    if (total > 0 && (!best || total > best.score)) {
      best = { sid: p.sid, name: p.name, score: total, why: unitHit ? unitWhy : why, kind: unitHit ? "단원" : "이름" };
    }
  }
  return best;
}

function clSegments(marks, startedAt, endAt, shift) {
  const end = endAt != null ? endAt : Date.now();
  const sh = shift || 0;
  return (marks || []).map((mk, i) => {
    const nx = i + 1 < marks.length ? marks[i + 1].t : end;
    return {
      sid: mk.sid || null, name: mk.name || "", kind: mk.kind, unit: mk.unit || "",
      start: (mk.t - startedAt) / 1000 + sh, end: (nx - startedAt) / 1000 + sh,
    };
  });
}
function clSafeName(t) { return String(t).replace(/[\\/:*?"<>|]/g, "").replace(/\s+/g, " ").trim(); }

/* ── 영상 맞추기 ──────────────────────────────────────────────────
   로그의 0초(수업 시작을 누른 순간)가 영상에서 몇 초 지점인가 = shift.
   녹화를 켜고 앱을 여는 사이의 공백이 여기 들어간다.

   두 가지로 적을 수 있다. 어느 쪽인지는 형식을 보고 고르되,
   고른 결과를 반드시 화면에 문장으로 적어 사람이 확인하게 한다
   (마이크 자동전환과 같은 원칙 — 틀리면 영상을 다 자른 뒤에야 안다).
     "3:12"   영상 지점  → 그대로 shift
     "16:58"  벽시계 시각 → 녹화를 켠 시각. startedAt과의 차이가 shift
   16:58은 양쪽으로 다 읽힌다. 그래서 시(hour)가 그날 수업 시작 시각
   언저리(같은 시 또는 직전 시)일 때만 시각으로 본다. 나머지는 영상 지점. */
function clParseHms(text) {
  const t = String(text || "").trim().replace(/\s+/g, "");
  if (!t) return null;
  if (/^\d{1,5}$/.test(t)) return { parts: [+t], sec: +t };          // 그냥 초
  if (!/^\d{1,2}(:\d{1,2}){1,2}$/.test(t)) return null;
  const p = t.split(":").map(Number);
  if (p.slice(1).some((n) => n > 59)) return null;
  return { parts: p, sec: p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p[0] * 60 + p[1] };
}
// 벽시계로 읽었을 때의 shift(초). 읽을 수 없으면 null
function clClockShift(parts, startedAt) {
  if (!startedAt || parts.length < 2 || parts[0] > 23) return null;
  const d = new Date(startedAt);
  const rec = new Date(d.getFullYear(), d.getMonth(), d.getDate(), parts[0], parts[1], parts[2] || 0).getTime();
  return Math.round((startedAt - rec) / 1000);
}
// mode: "" 자동판별 / "vid" 영상 지점 / "clk" 벽시계 시각
function clShiftInfo(text, startedAt, mode) {
  const t = String(text || "").trim();
  if (!t) return { ok: true, sec: 0, mode: "vid", label: "" };
  const p = clParseHms(t);
  if (!p) return { ok: false, sec: 0, mode: mode || "vid", label: "3:12 (영상 지점) 또는 16:58 (녹화 켠 시각) 처럼 적어주세요" };
  const clk = clClockShift(p.parts, startedAt);
  const hh = startedAt ? new Date(startedAt).getHours() : -9;
  const clkLikely = clk != null && clk >= 0 && clk <= 7200 && (p.parts[0] === hh || p.parts[0] === (hh + 23) % 24);
  const use = mode || (clkLikely ? "clk" : "vid");
  if (use === "clk") {
    if (clk == null) return { ok: false, sec: 0, mode: "clk", label: "시각으로 읽을 수 없어요 (16:58 처럼)" };
    return { ok: true, sec: clk, mode: "clk",
      label: clHms(p.sec) + "에 녹화 시작 → " + (clk < 0
        ? "수업 시작을 누른 게 녹화보다 " + clHms(-clk) + " 빨랐다"
        : "수업 시작을 누른 건 영상 " + clHms(clk) + " 지점") };
  }
  return { ok: true, sec: p.sec, mode: "vid", label: "영상 " + clHms(p.sec) + " 지점에서 수업 시작을 눌렀다" };
}
/* 저장본에서 구간을 다시 계산한다. marks가 남아 있으므로 shift는 나중에 몇 번이고 고칠 수 있다.
   (구버전 문서엔 marks가 없을 수 있어 그때는 저장된 segments를 통째로 민다) */
function clReseg(doc, sh) {
  if (!doc) return [];
  if (doc.marks && doc.startedAt) return clSegments(doc.marks, doc.startedAt, doc.endedAt || null, sh);
  const d = sh - (doc.shift || 0);
  return (doc.segments || []).map((g) => ({ ...g, start: g.start + d, end: g.end + d }));
}

// 학생별로 남길 조각을 모은다. 붙어 있는 것은 합치고, 20초 미만은 오탭으로 본다.
// subjOf(sid) → 과목명. 파일명을 "날짜 이름 과목 단원"으로 맞추기 위한 것
function clGroup(segments, date, subjOf) {
  const by = {};
  (segments || []).forEach((g) => {
    if (!g.sid || !CL_KIND[g.kind] || !CL_KIND[g.kind].keep) return;
    if (g.end - g.start < 20) return;
    (by[g.sid] = by[g.sid] || []).push({ start: g.start, end: g.end, unit: g.unit || "", name: g.name });
  });
  return Object.keys(by).map((sid) => {
    const raw = by[sid].sort((a, b) => a.start - b.start), parts = [];
    raw.forEach((p) => {
      const last = parts[parts.length - 1];
      if (last && p.start - last.end < 2) { last.end = p.end; if (p.unit && !last.unit) last.unit = p.unit; }
      else parts.push({ ...p });
    });
    // 영상 맞추기가 음수면(녹화를 늦게 켰다) 앞부분은 영상에 없다. 없는 데를 자르라고 하지 않는다
    for (let i = parts.length - 1; i >= 0; i--) {
      if (parts[i].end <= 0) parts.splice(i, 1);
      else if (parts[i].start < 0) parts[i].start = 0;
    }
    if (!parts.length) return null;
    const units = [];
    parts.forEach((p) => { if (p.unit && units.indexOf(p.unit) < 0) units.push(p.unit); });
    const total = parts.reduce((a, p) => a + (p.end - p.start), 0);
    const nm = raw[0].name || "학생";
    const subj = subjOf ? subjOf(sid) : "";
    return { sid, name: nm, subject: subj, units, parts, total,
      filename: clSafeName([date, nm, subj, units.join("+")].filter(Boolean).join(" ")) + ".mp4" };
  }).filter(Boolean).sort((a, b) => b.total - a.total);
}

function clFfmpeg(groups, src) {
  if (!groups.length) return "(남길 구간이 없습니다)";
  const s = src || "원본.mp4", L = [];
  L.push("# 조각을 TS로 뜬 뒤 이어붙인다 (fps·타임베이스가 섞여도 버틴다)");
  L.push("# 시각은 초 단위 정수 — 00:60:30 표기는 ffmpeg가 거부한다");
  groups.forEach((g, gi) => {
    L.push("");
    L.push("# ── " + g.name + " ── " + g.filename + "  (" + clHms(g.total) + ")");
    g.parts.forEach((p, i) => {
      L.push('ffmpeg -y -ss ' + Math.round(p.start) + ' -to ' + Math.round(p.end) + ' -i "' + s + '"' +
        ' -c copy -bsf:v h264_mp4toannexb -f mpegts p' + gi + '_' + i + '.ts   # ' + clHms(p.start) + '–' + clHms(p.end));
    });
    L.push('ffmpeg -y -i "concat:' + g.parts.map((_, i) => 'p' + gi + '_' + i + '.ts').join("|") +
      '" -c copy -bsf:a aac_adtstoasc -movflags +faststart "' + g.filename + '"');
  });
  L.push("");
  L.push("# 붙인 뒤 이음매 직후 프레임을 꼭 확인할 것. split_by_log.py 를 쓰면 자동으로 한다.");
  return L.join("\n");
}

/* 받아쓴 발화를 학생 구간에 맞춰 나눈다.
   transcript = [{t(초), text}], segments = clSegments 결과.
   이게 있어야 "이 말은 누구에게 한 말인가"가 정해진다. */
function clSplitTranscript(transcript, segments) {
  const by = {};
  (transcript || []).forEach((e) => {
    const seg = (segments || []).find((g) => g.sid && e.t >= g.start && e.t < g.end);
    if (!seg || !CL_KIND[seg.kind] || !CL_KIND[seg.kind].keep) return;
    (by[seg.sid] = by[seg.sid] || []).push(e.text);
  });
  return by;
}

async function clMakeNote(text, student, units) {
  const r = await fetch("/api/note", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text, student, units }),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "요청 실패");
  return d.note;
}

/* ── 소리 슬레이트 ────────────────────────────────────────────────
   시작·종료에 짧은 두겹 순음을 낸다. 캠코더가 그걸 같이 녹음하므로
   PC에서 tools/fix_sync.py 가 그 지점을 찾아 "로그 0초 = 영상 몇 초"를
   자동으로 채운다. 영화 촬영의 슬레이트와 같은 원리 —
   영상과 로그가 공유하는 신호가 하나라도 있으면 사람이 맞출 일이 없어진다.

   순음을 두 개 겹치는 이유: 말소리에는 이런 스펙트럼이 없어서 오검출이 거의 없다.
   1000Hz와 1600Hz는 배음 관계가 아니라(1.6배) 서로의 하모닉으로 오인되지 않는다. */
const CL_TONES = [1000, 1600], CL_TONE_DUR = 0.35, CL_BEEP_LEAD = 0.12;

/* ── 표식음을 실제로 나게 하기 ──────────────────────────────────
   두 가지 장벽이 있고 둘 다 넘어야 한다.

   1) 무음 모드. `navigator.audioSession = "playback"`(사파리 16.4+)으로
      이 페이지의 소리를 벨소리가 아니라 "음악·영상"으로 취급하게 한다.
      안 되는 기기를 위해 소리를 <video>로도 흘려보낸다 — iOS는 video 재생을
      무음 스위치와 무관하게 다룬다.
   2) 잠금 해제. iOS는 페이지가 **소리를 한 번 내본 뒤에야** 소리가 난다.
      그 첫 한 번이 잠금 해제에 잡아먹혀 조용히 사라진다.
      → 화면에 들어오면 첫 터치에 무음 버퍼를 흘려 미리 풀어둔다(clUnlock).
      "수업 시작"의 첫 삐를 놓치면 **영상에도 안 남는다.** 그게 제일 중요한 한 번이다.

   AudioContext는 하나만 만들어 계속 쓴다. 매번 새로 만들면 그때마다 첫 소리가
   묻히고, iOS는 동시에 만들 수 있는 개수도 적다.
   미디어 볼륨 0은 웹에서 못 올린다 — 그래서 "소리 시험" 단추가 있다. */
let clCtx = null, clDest = null, clSinkEl = null, clUnlocked = false;

function clAudioSession(type) {
  try { if (navigator.audioSession) navigator.audioSession.type = type; } catch (e) {}
}
function clCtxGet() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!clCtx || clCtx.state === "closed") clCtx = new AC();
  return clCtx;
}
function clSinkStart() {                       // 무음 스위치 우회로
  const ctx = clCtxGet();
  if (!ctx || !ctx.createMediaStreamDestination) return null;
  try {
    if (!clDest) clDest = ctx.createMediaStreamDestination();
    if (!clSinkEl) {
      clSinkEl = document.createElement("video");
      clSinkEl.setAttribute("playsinline", "");
      clSinkEl.muted = false; clSinkEl.volume = 1;
      clSinkEl.style.cssText = "position:fixed;width:1px;height:1px;opacity:0;pointer-events:none";
      document.body.appendChild(clSinkEl);
    }
    if (clSinkEl.srcObject !== clDest.stream) clSinkEl.srcObject = clDest.stream;
    if (clSinkEl.paused) { const p = clSinkEl.play(); if (p && p.catch) p.catch(() => {}); }
    return clDest;
  } catch (e) { return null; }
}
function clSoundRelease() {                    // 화면을 떠나면 오디오 세션을 돌려준다
  try { if (clSinkEl) { clSinkEl.pause(); clSinkEl.srcObject = null; } } catch (e) {}
  clAudioSession("auto");
}
function clUnlock() {
  if (clUnlocked) return;
  const ctx = clCtxGet();
  if (!ctx) return;
  clUnlocked = true;
  clAudioSession("playback");
  try {                                        // 1샘플짜리 무음 — 이걸로 잠금이 풀린다
    const src = ctx.createBufferSource();
    src.buffer = ctx.createBuffer(1, 1, 22050);
    src.connect(ctx.destination); src.start(0);
  } catch (e) {}
  try { const p = ctx.resume(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
  clSinkStart();
}
/* onFired(절대시각ms) — 톤이 실제로 울리는 시각. resume을 기다리느라
   늦게 울릴 수 있으므로 그 자리에서 알려준다(로그 0초와의 차이가 곧 오차다). */
function clBeep(onFired) {
  try {
    const ctx = clCtxGet();
    if (!ctx) return false;
    clAudioSession("playback");
    clUnlock();
    const dest = clSinkStart();
    const fire = () => {
      const t0 = ctx.currentTime + CL_BEEP_LEAD;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t0);                                // 딸깍 소리 방지
      g.gain.linearRampToValueAtTime(0.7, t0 + 0.02);
      g.gain.setValueAtTime(0.7, t0 + CL_TONE_DUR - 0.03);
      g.gain.linearRampToValueAtTime(0, t0 + CL_TONE_DUR);
      g.connect(ctx.destination);
      if (dest) g.connect(dest);
      CL_TONES.forEach((f) => {
        const o = ctx.createOscillator();
        o.type = "sine"; o.frequency.value = f;
        o.connect(g); o.start(t0); o.stop(t0 + CL_TONE_DUR + 0.05);
      });
      if (onFired) onFired(Date.now() + Math.round(CL_BEEP_LEAD * 1000));
    };
    if (ctx.state === "running") fire();
    else { const p = ctx.resume(); if (p && p.then) p.then(fire, fire); else fire(); }
    return true;
  } catch (e) { return false; }
}
const clSoundOn = () => localStorage.getItem("cl-beep") !== "0";

function clDownload(name, text) {
  // BOM을 붙이지 않는다 — 여기서 나가는 건 JSON뿐이고, 파이썬 json.load는 BOM에서 죽는다
  const b = new Blob([text], { type: "application/json;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ---- 마이크 ----
   Web Speech API는 조용하면 알아서 끊긴다. 두 시간을 버티려면 onend에서 되살려야 한다.
   Chrome 전용이고 데스크톱에서는 음성이 구글 서버를 거친다.                */
function useLessonMic(on, cbRef) {
  const liveRef = useRef(on);
  liveRef.current = on;
  useEffect(() => {
    if (!on) return;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return;
    let dead = false;
    let rec;
    try { rec = new SR(); } catch (e) { return; }
    rec.lang = "ko-KR"; rec.continuous = true; rec.interimResults = true;
    rec.onresult = (e) => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i], t = (r[0] && r[0].transcript || "").trim();
        if (!t) continue;
        if (r.isFinal) cbRef.current.final(t); else cbRef.current.interim(t);
      }
    };
    rec.onend = () => { if (!dead && liveRef.current) { try { rec.start(); } catch (e) {} } };
    rec.onerror = (e) => { if (e.error === "not-allowed" || e.error === "service-not-allowed") cbRef.current.denied(); };
    try { rec.start(); } catch (e) {}
    return () => { dead = true; try { rec.abort(); } catch (e) {} };
  }, [on]);
}

function LessonLogger({ cls, canEdit, meName }) {
  const [log, setLog] = useState(null);          // 진행 중 { startedAt, marks, shift }
  const [saved, setSaved] = useState(null);      // 오늘 저장본
  const [hist, setHist] = useState([]);
  const [cfg, setCfg] = useState({ aliases: {}, units: {} });
  const [micOn, setMicOn] = useState(false);
  const [micErr, setMicErr] = useState("");
  const [heard, setHeard] = useState("");
  const [trans, setTrans] = useState([]);
  const [sug, setSug] = useState(null);
  const [autoSw, setAutoSw] = useState(false);
  const [srcPath, setSrcPath] = useState("");
  const [shiftTxt, setShiftTxt] = useState("");     // 영상 맞추기 입력값 (원문 그대로)
  const [shiftMode, setShiftMode] = useState("");   // "" 자동판별 / "vid" / "clk"
  const [shiftSaved, setShiftSaved] = useState(false);
  const [sound, setSound] = useState(clSoundOn());
  const [beepAsk, setBeepAsk] = useState(false);
  const [noteState, setNoteState] = useState({});   // sid → {src,note,busy,saving,done,err}
  const [, tick] = useState(0);

  const date = todayStr;
  const people = (cls.roster || []).filter((r) => !r.teacher && isActiveOn(r, date));
  const colorOf = (sid) => CL_PALETTE[Math.max(0, people.findIndex((p) => p.id === sid)) % CL_PALETTE.length];
  const nameOf = (sid) => { const p = people.find((x) => x.id === sid); return p ? p.name : "학생"; };

  useEffect(() => {
    let alive = true;
    getLessonLog(cls.id, date).then((d) => {
      if (!alive) return;
      setSaved(d);
      if (d && d.shift) { setShiftTxt(clHms(Math.abs(d.shift))); setShiftMode("vid"); }
      if (d && d.marks && !d.endedAt) setLog({ startedAt: d.startedAt, marks: d.marks, shift: d.shift || 0, beeped: !!d.beeped });
    });
    listLessonLogs(cls.id).then((a) => alive && setHist(a));
    classDoc(cls.id).collection("config").doc("lessonLog").get()
      .then((d) => { if (alive && d.exists) setCfg({ aliases: {}, units: {}, ...d.data() }); });
    return () => { alive = false; };
  }, [cls.id]);

  useEffect(() => { if (!log) return; const h = setInterval(() => tick((n) => n + 1), 1000); return () => clearInterval(h); }, [!!log]);

  /* iOS는 페이지가 소리를 한 번 내본 뒤에야 소리가 난다. 첫 삐가 그 잠금 해제에
     잡아먹히면 영상에 표식이 안 남는다 — 화면에 들어오자마자 아무 터치에나 미리 푼다.
     "수업 시작"을 누르는 터치도 pointerdown이 click보다 먼저라 그 전에 풀린다. */
  useEffect(() => {
    const h = () => clUnlock();
    document.addEventListener("pointerdown", h, { once: true, capture: true });
    document.addEventListener("touchend", h, { once: true, capture: true });
    return () => {
      document.removeEventListener("pointerdown", h, { capture: true });
      document.removeEventListener("touchend", h, { capture: true });
      clSoundRelease();
    };
  }, []);

  const detectPeople = people.map((p) => ({
    sid: p.id, name: p.name,
    aliases: cfg.aliases[p.id] || [],
    units: (cfg.units[p.id] || []).concat(p.books || []),
  }));

  const cur = log && log.marks.length ? log.marks[log.marks.length - 1] : null;

  const cbRef = useRef({});
  cbRef.current = {
    interim: (t) => setHeard(t),
    denied: () => { setMicOn(false); setMicErr("마이크 권한이 거부됐습니다. 주소창 자물쇠 → 마이크 허용."); },
    final: (t) => {
      setHeard("");
      if (!log) return;
      const at = (Date.now() - log.startedAt) / 1000;
      setTrans((L) => [...L, { t: Math.round(at), text: t }]);
      const hit = clDetect(t, detectPeople);
      if (!hit) return;
      if (cur && cur.sid === hit.sid && cur.kind === "lesson") return;   // 이미 그 학생
      if (autoSw) clMark(hit.sid, "lesson");
      else setSug({ ...hit, text: t, at: Date.now() });
    },
  };
  useLessonMic(micOn && !!log, cbRef);

  useEffect(() => { if (!sug) return; const h = setTimeout(() => setSug(null), 25000); return () => clearTimeout(h); }, [sug]);

  function persist(next, extra) {
    if (!next) return;
    saveLessonLog(cls.id, date, {
      startedAt: next.startedAt, shift: next.shift || 0, marks: next.marks,
      teacher: meName, transcript: trans.slice(-400), ...(extra || {}),
    }).catch(() => {});
  }

  function clStart() {
    const next = { startedAt: Date.now(), marks: [], shift: 0, beeped: !!sound };
    setLog(next); setSaved(null); setTrans([]);
    // 문서를 먼저 쓴다 — 삐가 울린 시각을 그 뒤에 덮어써야 하므로 순서가 뒤집히면 안 된다
    persist(next, { endedAt: null, segments: [], beeped: !!sound, beepAt: null, endBeepAt: null });
    if (!sound) return;
    const ok = clBeep((at) => saveLessonLog(cls.id, date, { beepAt: at }).catch(() => {}));
    if (!ok) saveLessonLog(cls.id, date, { beeped: false }).catch(() => {});
  }
  // 상태 갱신 함수 안에서 Firestore를 부르지 않는다 — 업데이터는 두 번 호출될 수 있다
  function clMark(sid, kind) {
    setSug(null);
    if (!log) return;
    const last = log.marks[log.marks.length - 1];
    if (last && last.sid === sid && last.kind === kind) return;
    const unit = sid ? (cfg.units[sid] || [])[0] || "" : "";
    const next = { ...log, marks: [...log.marks, { t: Date.now(), sid, name: sid ? nameOf(sid) : "", kind, unit }] };
    setLog(next); persist(next);
  }
  function clUndo() {
    if (!log || !log.marks.length) return;
    const next = { ...log, marks: log.marks.slice(0, -1) };
    setLog(next); persist(next);
  }
  function clSetUnit(sid) {
    const list = cfg.units[sid] || [];
    const msg = nameOf(sid) + " — 지금 하는 단원" + (list.length ? "\n\n" + list.map((u, i) => (i + 1) + ". " + u).join("\n") + "\n\n번호를 넣거나 새로 적으세요." : "");
    const v = prompt(msg, list[0] || "");
    if (v === null) return;
    let unit = v.trim();
    const n = parseInt(unit, 10);
    if (String(n) === unit && n >= 1 && n <= list.length) unit = list[n - 1];
    if (!unit) return;
    const nextUnits = { ...cfg.units, [sid]: [unit, ...list.filter((u) => u !== unit)].slice(0, 8) };
    setCfg((c) => ({ ...c, units: nextUnits }));
    classDoc(cls.id).collection("config").doc("lessonLog").set({ units: nextUnits }, { merge: true }).catch(() => {});
    if (!log || !log.marks.length) return;
    const last = log.marks[log.marks.length - 1];
    if (!last || last.sid !== sid) return;
    const next = { ...log, marks: [...log.marks.slice(0, -1), { ...last, unit }] };
    setLog(next); persist(next);
  }
  /* 자동자막은 이름을 자주 틀린다. 유사도만으로는 한계가 있어서
     (승훈→승우 0.67은 태경→세경 0.60과 너무 가깝다. 문턱을 내리면 오탐이 산다)
     실제로 틀리게 들리는 말을 직접 등록해 둔다. */
  function clSetAlias(sid) {
    const list = cfg.aliases[sid] || [];
    const v = prompt(
      nameOf(sid) + " — 자동자막이 이 학생을 뭐라고 잘못 받아쓰나요?\n쉼표로 구분해 적으세요. 예: 승우, 성훈",
      list.join(", ")
    );
    if (v === null) return;
    const arr = v.split(",").map((x) => x.trim()).filter(Boolean).slice(0, 10);
    const next = { ...cfg.aliases, [sid]: arr };
    setCfg((c) => ({ ...c, aliases: next }));
    classDoc(cls.id).collection("config").doc("lessonLog").set({ aliases: next }, { merge: true }).catch(() => {});
  }

  async function clEnd() {
    if (!log) return;
    if (!log.marks.length) { if (!confirm("기록된 구간이 없습니다. 그냥 버릴까요?")) return; setLog(null); setMicOn(false); return; }
    const segs = clSegments(log.marks, log.startedAt, Date.now(), log.shift || 0);
    const doc = { startedAt: log.startedAt, endedAt: Date.now(), shift: log.shift || 0, marks: log.marks, segments: segs, transcript: trans.slice(-400), teacher: meName, date, endBeepAt: null, beeped: !!log.beeped };
    await saveLessonLog(cls.id, date, doc);
    setSaved(doc); setLog(null); setMicOn(false);
    // setSaved(doc) 뒤에 울려야 한다 — 먼저 울리면 아래 doc이 endBeepAt을 다시 지운다
    if (sound) clBeep((at) => {
      setSaved((d) => (d ? { ...d, endBeepAt: at } : d));
      saveLessonLog(cls.id, date, { endBeepAt: at }).catch(() => {});
    });
    listLessonLogs(cls.id).then(setHist);
  }

  /* 영상 맞추기 값을 저장한다. segments도 같이 다시 써서 다음에 열 때 그대로 나오게 한다.
     marks는 그대로 두므로 몇 번이고 고칠 수 있다 */
  function applyShift(sec) {
    const segments = clReseg(saved, sec);
    setSaved((d) => (d ? { ...d, shift: sec, segments } : d));
    setShiftSaved(true);
    setTimeout(() => setShiftSaved(false), 2500);
    saveLessonLog(cls.id, date, { shift: sec, segments }).catch(() => {});
  }

  // ---- 집계 ----
  const anchorAt = log ? log.startedAt : (saved && saved.startedAt) || 0;
  const shInfo = clShiftInfo(shiftTxt, anchorAt, shiftMode);
  const shift = shInfo.ok ? shInfo.sec : (saved && saved.shift) || 0;
  const segs = log ? clSegments(log.marks, log.startedAt, null, log.shift || 0) : clReseg(saved, shift);
  /* 값이 멎으면 저장한다. blur에 걸면 모드 단추를 누를 때 저장이 먼저 일어나
     바뀌기 전 해석("3:12"을 시각으로 읽은 값)이 들어간다 */
  const shiftSaveable = !log && !!(saved && saved.endedAt) && shInfo.ok && shift !== (saved.shift || 0);
  useEffect(() => {
    if (!shiftSaveable) return;
    const h = setTimeout(() => applyShift(shift), 800);
    return () => clearTimeout(h);
  }, [shiftSaveable, shift]);
  const tot = {}, qat = {};
  segs.forEach((g) => {
    if (!g.sid) return;
    const d = g.end - g.start;
    if (CL_KIND[g.kind] && CL_KIND[g.kind].keep) tot[g.sid] = (tot[g.sid] || 0) + d;
    else if (g.kind === "qa") qat[g.sid] = (qat[g.sid] || 0) + d;

  const maxT = Math.max(1, ...Object.values(tot));
  const elapsed = log ? (Date.now() - log.startedAt) / 1000 : 0;
  const nClosed = clCountUtt(trans, CL_CLOSED);
  const nOpen = clCountUtt(trans, CL_OPEN);
  const perH = (n) => (elapsed > 120 ? (n / (elapsed / 3600)).toFixed(1) : "–");

  const subjOf = (sid) => { const p = people.find((x) => x.id === sid); return p ? (p.books || []).join("+") : ""; };
  const groups = clGroup(segs, date, subjOf);
