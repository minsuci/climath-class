<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>진도계획 안내문 만들기</title>
<style>
/* ============================================================
   진도계획 안내문 — 한 반, 한 파일, A4 한 장
   왼쪽을 채우면 오른쪽 안내문이 바뀐다. 인쇄(Ctrl+P) → "PDF로 저장".
   반이 여럿이면 이 파일을 복사해 반마다 하나씩 쓴다(저장 자리가 파일별로 따로다).
   ============================================================ */

:root{
  --ink:#161a22; --ink-2:#3a4250; --ink-3:#6b7484;
  --line:#e3e6ec; --bg:#dde4ea; --panel:#fff;
  --accent:#1b3a5b; --accent-soft:#e9eff5; --radius:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:#f4f5f8; color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","맑은 고딕","Malgun Gothic",sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- 앱 틀 ---------- */
#app{display:flex;flex-direction:column;height:100vh}
#topbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px;
  background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(20,25,40,.04)}
#topbar h1{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
#topbar h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
#topbar .who{font-size:12.5px;font-weight:700;color:var(--ink-3);padding-left:4px}
#topbar .spacer{flex:1}
#pageBadge{font-size:11.5px;font-weight:600;color:var(--ink-3);white-space:nowrap;margin-right:4px}
#pageBadge.warn{color:#b06a22}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;
  font-size:13px;font-weight:600;color:var(--ink-2);transition:.12s}
.btn:hover{border-color:#c9cfda;background:#fafbfd}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.15)}
.btn.ghost{border-color:transparent;color:var(--ink-3)}
.btn.ghost:hover{background:#eef0f4}
#main{flex:1;display:flex;min-height:0}

/* ---------- 편집 패널 ---------- */
#editor{flex:0 0 440px;max-width:47vw;overflow-y:auto;background:var(--panel);
  border-right:1px solid var(--line);padding:14px 16px 80px}
#editor::-webkit-scrollbar{width:10px}
#editor::-webkit-scrollbar-thumb{background:#d7dbe3;border-radius:5px;border:3px solid #fff}
.sec{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;background:#fff}
.sec > summary{list-style:none;cursor:pointer;padding:11px 13px;font-weight:700;font-size:13px;
  display:flex;align-items:center;gap:8px;background:#fafbfd;border-bottom:1px solid transparent;user-select:none}
.sec[open] > summary{border-bottom-color:var(--line)}
.sec > summary::-webkit-details-marker{display:none}
.sec > summary::before{content:"›";display:inline-block;transform:rotate(90deg);color:var(--ink-3);
  font-size:16px;line-height:1;transition:.15s}
.sec:not([open]) > summary::before{transform:rotate(0deg)}
.sec > summary .count{margin-left:auto;font-weight:600;font-size:11px;color:var(--ink-3);
  background:#eef0f4;padding:2px 7px;border-radius:20px}
.sec-body{padding:12px 13px}
label.f{display:block;margin-bottom:10px}
label.f > span, span.lab{display:block;font-size:11.5px;font-weight:600;color:var(--ink-3);margin-bottom:4px}
.i,textarea.i,select.i{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;
  background:#fff;outline:none;transition:.12s}
.i:focus,textarea.i:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.i{resize:vertical;min-height:56px;line-height:1.55;font-size:13px}
.row2{display:flex;gap:8px}
.row2 > *{flex:1;min-width:0}
.row2 > .icon-btn{flex:0 0 auto}
.hint{font-size:11.5px;color:var(--ink-3);margin:-4px 0 10px;line-height:1.55}
.hint code{background:#eef0f4;padding:1px 4px;border-radius:3px;font-size:11px}
.icon-btn{border:none;background:transparent;cursor:pointer;color:var(--ink-3);padding:3px 6px;border-radius:5px;font-size:13px;line-height:1}
.icon-btn:hover{background:#e9ecf1;color:var(--ink)}
.color-picks{display:flex;gap:5px;flex-wrap:wrap}
.color-picks button{width:18px;height:18px;border-radius:4px;border:2px solid transparent;cursor:pointer;padding:0}
.color-picks button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}
.card{border:1px solid var(--line);border-radius:9px;margin-bottom:9px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:8px;padding:7px 9px;background:#fafbfd;border-bottom:1px solid var(--line)}
.card-h .sw{width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.12)}
.card-h .nm{font-weight:700;font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-b{padding:9px}
.goal-edit{display:flex;gap:6px;align-items:center;margin-bottom:5px}
.goal-edit .gnum{flex:0 0 16px;text-align:center;font-size:11px;font-weight:800;color:var(--ink-3)}
.goal-edit .i{padding:5px 8px;font-size:12.5px}
.goal-edit .i:first-of-type{flex:0 0 128px}
.goal-edit .i:last-child{flex:1;min-width:0}
.grid-edit{border:1px solid var(--line);border-radius:8px;overflow:auto}
.ge-head,.ge-row{display:grid;gap:4px;align-items:center;min-width:340px}
.ge-head{padding:5px 6px;background:#fafbfd;border-bottom:1px solid var(--line)}
.ge-head span{font-size:10.5px;font-weight:700;color:var(--ink-3);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ge-row{padding:3px 6px;border-bottom:1px solid #f1f3f6}
.ge-row:last-child{border-bottom:none}
.ge-row .i{padding:4px 7px;font-size:12.5px;border-radius:6px}
.ge-row .i.dt{text-align:center;font-variant-numeric:tabular-nums}
.ge-foot{display:flex;align-items:center;gap:8px;margin-top:7px}
.ge-foot .btn{white-space:nowrap;flex:0 0 auto}
.ge-tip{font-size:11px;color:var(--ink-3);line-height:1.45}

/* ---------- 미리보기 ---------- */
#previewWrap{flex:1;min-width:0;overflow:auto;padding:24px 20px 60px;
  background:radial-gradient(circle at 1px 1px,#cbd5df 1px,transparent 0) 0 0/22px 22px,var(--bg);
  display:flex;justify-content:center;align-items:flex-start}
#zoomHost{transform-origin:top center}

/* ============================================================
   안내문(종이) — 클라이매쓰 안내문 서식
   ============================================================ */
.sheet{
  --navy:#1b3a5b; --navy2:#2b5680; --accent-o:#e08a3c; --accent2:#f3b54a;
  --p-ink:#16202b; --p-sec:#5e6c79; --p-ter:#8a97a2; --p-line:#d6dee6; --p-line2:#e3ebf1; --p-soft:#eef3f7;
  --sun:#c0584f; --sat:#3a6da8;
  width:210mm;min-height:297mm;background:#fff;overflow:hidden;border-radius:4px;
  box-shadow:0 6px 26px rgba(27,58,91,.16);color:var(--p-ink);
  display:flex;flex-direction:column;
}
.sheet.serif{font-family:"Nanum Myeongjo","바탕","Batang",serif}

/* 상단 띠 */
.doc-topbar{display:flex;align-items:center;gap:12px;padding:5.5mm 10mm;color:#fff;
  background:linear-gradient(120deg,var(--navy),var(--navy2));border-bottom:4px solid var(--accent-o)}
.doc-logo{height:24px;width:auto;display:block;filter:brightness(0) invert(1)}
.doc-tt{margin-left:2px;font-size:15px;font-weight:900;letter-spacing:-.01em;line-height:1.3}
.doc-tt b{font-weight:900}
.doc-tt small{display:block;font-size:10px;font-weight:800;color:var(--accent2);letter-spacing:.06em;margin-top:2px}
.doc-ts{margin-left:auto;text-align:right;font-size:10px;font-weight:800;color:rgba(255,255,255,.82);line-height:1.5}
.doc-body{padding:4.5mm 10mm 5mm;flex:1;display:flex;flex-direction:column}

/* 구획 머리 */
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--navy);
  border-left:5px solid var(--accent-o);padding:4.5px 12px;border-radius:3px;margin:7px 0 5px;
  break-after:avoid;page-break-after:avoid}
.sec-h:first-child{margin-top:0}
.sec-h b{color:#fff;font-size:12.5px;font-weight:900}
.sec-h span{color:#cdddea;font-size:9.5px;font-weight:800}

/* 표 공통 */
.sheet table{width:100%;border-collapse:collapse;table-layout:fixed}
.sheet th{font-size:10px;font-weight:900;color:var(--p-sec);padding:4px 6px;border:1px solid var(--p-line2);
  background:#f2f6f9;text-align:center}
.sheet td{border:1px solid var(--p-line2);padding:4px 6px;font-size:10.5px;color:var(--p-ink);vertical-align:middle}

/* 시간표 */
.tt td{text-align:center;height:8mm}
.tt .tchr{font-weight:900;color:var(--navy);background:#f7f9fb;font-size:11px}
.tt .pd{font-weight:900;color:var(--navy);background:#f7f9fb;font-size:10px}
.tt .hm{color:var(--p-sec);font-weight:700;font-variant-numeric:tabular-nums;font-size:10px}
.tt .cls{font-weight:800}
.tt th.dow{background:var(--navy);color:#fff;font-size:11px}

/* 교재구성 */
.bk td{height:8.2mm}
.bk .name{text-align:center;font-weight:900;font-size:11px;background:var(--p-soft)}
.bk .feat{font-size:10px;line-height:1.45;word-break:keep-all;color:#2c3742}
.bk .when{text-align:center;font-size:9.5px;font-weight:800;color:var(--p-sec);line-height:1.4}
.bk .term{text-align:center;font-size:9.5px;font-weight:800;color:var(--navy);line-height:1.4}
.bk .term b{color:var(--accent-o);font-weight:900}

/* 목표 세 칸 */
.goal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;break-inside:avoid}
.goal{border:1px solid var(--p-line);border-top:2.5px solid var(--navy);border-radius:4px;padding:6px 8px;background:#fbfdfe}
.goal .gn{display:block;font-size:8px;font-weight:900;letter-spacing:.1em;color:var(--accent-o);margin-bottom:2px}
.goal .gt{font-size:11px;font-weight:900;color:var(--navy);line-height:1.25;margin-bottom:2px;word-break:keep-all}
.goal .gd{font-size:9.2px;color:#4c5a66;line-height:1.45;font-weight:600;word-break:keep-all}

/* 달력 */
.cal-box{border:1px solid #cfd9e2;border-radius:12px;overflow:hidden;break-inside:avoid}
.cal{width:100%;table-layout:fixed;border-collapse:collapse}
.cal th{font-size:10px;font-weight:900;padding:3.5px 0;background:var(--p-soft);color:var(--p-sec);border:1px solid var(--p-line2)}
.cal th.sun{color:var(--sun)}
.cal th.sat{color:var(--sat)}
.cal td.day{vertical-align:top;height:var(--dayh,12mm);padding:2px 3px;border:1px solid #e6edf2;background:#fff}
.cal td.day.off{background:#fafcfd}
.cal td.day.has{background:#f6faf8}
.cal td.day.out .dn{opacity:.55}
.cal .dn{font-size:9.5px;font-weight:900;color:#98a4af;line-height:1;margin-bottom:1.5px}
.cal .dn.sun{color:var(--sun)}
.cal .dn.sat{color:var(--sat)}
.cal .dn .mo{font-size:8px;color:var(--p-ter)}
.chip{display:block;border-radius:3px;padding:1px 4px;margin-top:1.2px;font-size:8.2px;font-weight:800;
  line-height:1.3;word-break:keep-all;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .k{font-size:7.5px;font-weight:900;opacity:.75;margin-right:3px}
.tag{display:inline-block;margin-top:1.5px;padding:.5px 5px;border-radius:999px;font-size:7.5px;font-weight:900;
  background:var(--accent-o);color:#fff;letter-spacing:.02em}
.tag.end{background:var(--navy2)}
.cal td.holi{background:#fdf3ef;border:1px solid #f0d8ce}
.cal td.holi .dn{color:var(--sun)}
.cal td.holi .hl{font-size:9px;font-weight:900;color:#b8453a;letter-spacing:.12em;text-align:center;margin-top:3px}
.cal td.sp{background:#fff8ec;border:1px solid #f0e0c3}
.cal td.sp .hl{font-size:9px;font-weight:900;color:#a1650d;letter-spacing:.08em;text-align:center;margin-top:3px}
.cal tr.band td{background:#fff5e9;border:1px solid #f0dcc3;text-align:center;padding:3px 0;
  font-size:10px;font-weight:900;color:#b06a22;letter-spacing:.18em}

/* 범례 · 안내 · 꼬리말 */
.legend{display:flex;align-items:center;gap:12px;margin-top:6px;font-size:9px;font-weight:800;color:var(--p-sec)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.legend .rt{margin-left:auto;font-weight:700;color:var(--p-ter)}
.legend .rt b{color:var(--navy)}
.notice{margin-top:6px;border:1px solid #cfd9e2;border-left:4px solid var(--accent-o);border-radius:8px;
  padding:7px 11px;font-size:9.5px;color:#4c5a66;font-weight:700;line-height:1.65;break-inside:avoid}
.notice > b{color:var(--navy);font-weight:900;display:block;margin-bottom:2px;font-size:10px}
.notice ul{margin:0;padding-left:13px}
.notice li{margin-top:1px}
.notice li b{color:var(--navy);font-weight:900}
.doc-foot{display:flex;justify-content:space-between;margin-top:auto;padding-top:5px;font-size:9px;color:#9aa8b4;font-weight:700}
.doc-foot b{color:var(--navy)}
.empty-note{border:1px dashed #cfd9e2;border-radius:8px;padding:14px;text-align:center;color:#9aa8b4;font-size:10.5px;font-weight:700}

/* 밀도 */
.sheet.dense .cal td.day{--dayh:10.5mm}
.sheet.dense .doc-body{padding:4mm 9mm 4.5mm}
.sheet.dense .sec-h{margin:5px 0 4px}
.sheet.loose .cal td.day{--dayh:14mm}

/* ---------- 인쇄 ---------- */
@page{size:A4 portrait;margin:0}
@media print{
  *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
  body{background:#fff}
  #topbar,#editor{display:none !important}
  #main{display:block;height:auto}
  #previewWrap{overflow:visible;padding:0;display:block;background:#fff}
  #zoomHost{transform:none !important;height:auto !important;width:auto !important}
  .sheet{box-shadow:none;border-radius:0;width:210mm;min-height:0}
}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <h1><span class="dot"></span>진도계획 안내문</h1>
    <span class="who" id="whoLabel"></span>
    <span class="spacer"></span>
    <span id="pageBadge"></span>
    <button class="btn ghost" id="btnClear">비우기</button>
    <button class="btn" id="btnLoad">불러오기</button>
    <button class="btn" id="btnSave">저장(.json)</button>
    <button class="btn primary" id="btnPrint">인쇄 · PDF</button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
  </div>
  <div id="main">
    <div id="editor"></div>
    <div id="previewWrap"><div id="zoomHost"><div class="sheet" id="sheet"></div></div></div>
  </div>
</div>

function blankState(){
  return {
    style:{ font:"gothic", density:"normal", showGoals:false, showTT:true, showBooks:true, showList:false },
    cls:{ campus:"", dept:"고등부", name:"", subject:"", teacher:"" },
    info:{ docSub:"", start:"", end:"", ttNote:"", bookNote:"", footNote:"" },
    goals:[{t:"",d:""},{t:"",d:""},{t:"",d:""}],
    books:[{name:"", color:BOOK_COLORS[0], feat:"", when:"", term:""}],
    timetable:[],
    rows:[{date:"", cells:[""]}],
    schedule:[],
    notices:[]
  };
}

function normalize(d){
  const b = blankState(), s = Object.assign(b, d || {});
  s.style = Object.assign(b.style, s.style || {});
  s.cls   = Object.assign(b.cls,   s.cls   || {});
  s.info  = Object.assign(b.info,  s.info  || {});
  s.goals = Array.isArray(s.goals) ? s.goals : [];
  while(s.goals.length < 3) s.goals.push({t:"",d:""});
  s.goals = s.goals.slice(0,3);
  s.books = Array.isArray(s.books) && s.books.length ? s.books : [{name:"", color:BOOK_COLORS[0], feat:"", when:"", term:""}];
  s.books.forEach((bk,i)=>{ if(!bk.color) bk.color = BOOK_COLORS[i % BOOK_COLORS.length]; });
  s.timetable = Array.isArray(s.timetable) ? s.timetable : [];
  s.schedule  = Array.isArray(s.schedule) ? s.schedule : [];
  s.notices   = Array.isArray(s.notices) ? s.notices : [];
  // 예전 판(진도 한 줄 = 회차·단원·날짜)에서 오면 교재 하나짜리로 옮긴다
  if(Array.isArray(s.rows) && s.rows.length && s.rows[0] && s.rows[0].unit !== undefined){
    s.rows = s.rows.map(r=>({date:r.date||"", cells:[[r.no?r.no+"회":"", r.unit||""].filter(Boolean).join(" ")]}));
  }
  s.rows = Array.isArray(s.rows) ? s.rows : [];
  s.rows.forEach(r=>{
    if(!Array.isArray(r.cells)) r.cells = [];
    while(r.cells.length < s.books.length) r.cells.push("");
    r.cells = r.cells.slice(0, s.books.length);
  });
  if(!s.rows.length) s.rows.push({date:"", cells:s.books.map(()=>"")});
  return s;
}

let S = normalize(load() || JSON.parse(JSON.stringify(DEFAULT)));
function load(){
  try{
    const r = localStorage.getItem(KEY);
    if(r) return JSON.parse(r);
    // 앞선 판(한 반 = 한 파일)으로 저장해 둔 게 있으면 그대로 옮겨 온다
    const old = localStorage.getItem("climath-flyer-one::" + decodeURIComponent(location.pathname));
    if(old) return fromV2(JSON.parse(old));
  }catch(e){}
  return null;
}

function fromV2(d){
  if(!d || !d.cls || d.books) return d;
  const c = d.cls || {}, i = d.info || {}, f = d.foot || {};
  return {
    style:{ font:(d.style&&d.style.font)||"gothic", density:"normal",
            showGoals:!!(d.goals||[]).filter(g=>g&&(g.t||g.d)).length, showTT:true, showBooks:true },
    cls:{ campus:"", dept:"", name:c.name||"", subject:"", teacher:c.teacher||"" },
    info:{ docSub:i.title||"", start:i.start||"", end:i.end||"", ttNote:"", bookNote:"",
           footNote:f.who||"" },
    goals: d.goals || [],
    books: [{name:c.book||"진도", color:c.color||"#1b3a5b", feat:c.note||i.subtitle||"", when:"", term:""}],
    timetable: [],
    rows: d.rows || [],                       // {no,unit,date} 는 normalize 가 옮긴다
    schedule: d.schedule || [],
    notices: (d.notices||[]).concat(f.msg ? [f.msg] : [])
  };
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ============================================================
   2. 날짜 유틸
   ============================================================ */
const esc = v => String(v==null?"":v)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const lines = t => String(t||"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean);

function md(str){
  const t = String(str||"").replace(/[~〜]/g,"").trim();
  let m = t.match(/(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/);
  if(m) return {y:+m[1], m:+m[2], d:+m[3]};
  m = t.match(/(\d{1,2})\s*[\/.\-월]\s*(\d{1,2})/);
  if(m) return {y:null, m:+m[1], d:+m[2]};
  return null;
}
function yearFor(mm){
  const st = md(S.info.start) || {y:new Date().getFullYear(), m:1};
  const y0 = st.y || new Date().getFullYear();
  return mm < st.m ? y0 + 1 : y0;
}
const keyOf = o => o ? (o.y || yearFor(o.m)) + "-" + o.m + "-" + o.d : "";
const dateOf = o => o ? new Date(o.y || yearFor(o.m), o.m-1, o.d) : null;

function expandDates(str){
  const out = [];
  String(str||"").split(/\s*,\s*/).forEach(part=>{
    const rng = part.split(/\s*[~〜]\s*/);
    if(rng.length === 2){
      const a = md(rng[0]), b = md(rng[1]);
      if(a && b){
        let cur = dateOf(a); const end = dateOf(b);
        let guard = 0;
        while(cur <= end && guard++ < 400){
          out.push(cur.getFullYear()+"-"+(cur.getMonth()+1)+"-"+cur.getDate());
          cur.setDate(cur.getDate()+1);
        }
      }
      return;
    }
    const o = md(part);
    if(o) out.push(keyOf(o));
  });
  return out;
}

/* 수업일 = 날짜가 있고 교재 칸이 하나라도 찬 줄 */
function classRows(){
  return S.rows
    .map(r=>({date:String(r.date||"").trim(), cells:(r.cells||[]).map(c=>String(c||"").trim())}))
    .filter(r=>r.date && r.cells.some(Boolean));
}
function weekdaysOf(){
  const d = {};
  classRows().forEach(r=>{ const o = md(r.date); if(o) d[dateOf(o).getDay()] = (d[dateOf(o).getDay()]||0)+1; });
  return Object.keys(d).sort((a,b)=>d[b]-d[a]).slice(0,3).sort((a,b)=>+a-+b).map(w=>+w);
}
function fmtDay(str){
  const o = md(str); if(!o) return "";
  const dt = dateOf(o);
  return `${o.m}/${o.d}(${DOW[dt.getDay()]})`;
}
function periodLine(){
  const a = md(S.info.start), b = md(S.info.end);
  if(a && b) return `${fmtDay(S.info.start)} 개강 ~ ${fmtDay(S.info.end)} 종강`;
  const rs = classRows();
  if(rs.length) return `${fmtDay(rs[0].date)} 개강 ~ ${fmtDay(rs[rs.length-1].date)} 종강`;
  return "";
}

/* 달력에 얹을 표시 */
function marks(){
  const cls = {}, sch = {};
  classRows().forEach(r=>{ const o = md(r.date); if(o) cls[keyOf(o)] = r.cells; });
  S.schedule.forEach(r=>{
    const t = String(r.t||"기타").trim();
    expandDates(r.d).forEach(k=>{ sch[k] = {type:t, text:String(r.x||"").trim()}; });
  });
  return {cls, sch};
}
function monthRange(M){
  const keys = Object.keys(M.cls).concat(Object.keys(M.sch));
  const a = md(S.info.start), b = md(S.info.end);
  let from, to;
  if(keys.length){
    const ds = keys.map(k=>{ const p = k.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); });
    from = new Date(Math.min.apply(null, ds));
    to   = new Date(Math.max.apply(null, ds));
  }else if(a && b){ from = dateOf(a); to = dateOf(b); }
  else return null;
  if(a && dateOf(a) < from) from = dateOf(a);
  if(b && dateOf(b) > to)   to = dateOf(b);
  return {from, to};
}

function periodTermCell(){
  const a = md(S.info.start), b = md(S.info.end);
  if(a && b) return `<b>${fmtDay(S.info.start)}</b> 개강<br>~ <b>${fmtDay(S.info.end)}</b> 종강`;
  const rs = classRows();
  if(rs.length) return `<b>${fmtDay(rs[0].date)}</b> 개강<br>~ <b>${fmtDay(rs[rs.length-1].date)}</b> 종강`;
  return "";
}
function calTitle(range){
  if(!range) return "";
  const a = range.from, b = range.to;
  return a.getFullYear() + ". " + (a.getMonth()+1) +
         (a.getMonth() === b.getMonth() ? "" : " ~ " + (b.getMonth()+1));
}

function calendarHTML(M, range, books, rows){
  const first = new Date(range.from); first.setDate(first.getDate() - first.getDay());
  const last  = new Date(range.to);   last.setDate(last.getDate() + (6 - last.getDay()));
  const firstKey = rows.length ? keyOf(md(rows[0].date)) : "";
  const lastKey  = rows.length ? keyOf(md(rows[rows.length-1].date)) : "";

  let html = `<div class="cal-box"><table class="cal"><tr>` +
    DOW.map((d,i)=>`<th class="${i===0?"sun":(i===6?"sat":"")}">${d}</th>`).join("") + `</tr>`;

  let cur = new Date(first), guard = 0;
  let bandShown = {};
  while(cur <= last && guard++ < 60){
    // 이 주에 시험 기간이 걸리면 위에 띠를 하나 넣는다
    const week = [];
    for(let i=0;i<7;i++){ const d = new Date(cur); d.setDate(d.getDate()+i); week.push(d); }
    const bandText = week.map(d=>{
      const s = M.sch[d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()];
      return (s && s.type === "시험") ? (s.text || "시험 기간") : null;
    }).filter(Boolean)[0];
    if(bandText){
      html += `<tr class="band"><td colspan="7">${esc(spaced(bandText))}</td></tr>`;
      bandShown[bandText] = true;
    }

    html += "<tr>";
    const kOf = d => d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
    for(let i=0;i<7;i++){
      const d = week[i], k = kOf(d);
      const inRange = d >= new Date(range.from.getFullYear(), range.from.getMonth(), 1) &&
                      d <= new Date(range.to.getFullYear(), range.to.getMonth()+1, 0);
      const cells = M.cls[k], sc = M.sch[k];
      const dnum = (d.getDate()===1 || d.getTime()===first.getTime())
        ? `<span class="mo">${d.getMonth()+1}/</span>${d.getDate()}` : String(d.getDate());
      const dn = `<div class="dn${i===0?" sun":(i===6?" sat":"")}">${dnum}</div>`;

      // 수업 없는 날의 연속된 휴강 · 특강은 한 칸으로 묶는다
      if(!cells && sc && (sc.type === "휴강" || sc.type === "특강")){
        let span = 1, days = [d];
        while(i + span < 7){
          const nd = week[i+span], nk = kOf(nd), ns = M.sch[nk];
          if(M.cls[nk] || !ns || ns.type !== sc.type || (ns.text||"") !== (sc.text||"")) break;
          days.push(nd); span++;
        }
        const label = sc.text || sc.type;
        const nums = days.map((x,xi)=>{
          const one = (x.getDate()===1) ? `<span class="mo">${x.getMonth()+1}/</span>${x.getDate()}` : x.getDate();
          return one;
        }).join(" · ");
        html += `<td class="${sc.type === "휴강" ? "holi" : "sp"}" colspan="${span}">
          <div class="dn${i===0?" sun":""}">${nums}</div>
          <div class="hl">${esc(span > 1 ? spaced(label) : label)}</div></td>`;
        i += span - 1;
        continue;
      }

      let cls = "day", inner = dn;
      if(!inRange) cls += " out";
      if(cells){
        cls += " has";
        if(k === firstKey) inner += `<span class="tag">개강</span>`;
        if(k === lastKey)  inner += `<span class="tag end">종강</span>`;
        cells.forEach((txt,bi)=>{
          if(!txt) return;
          const b = books[bi] || S.books[bi];
          if(!b) return;
          inner += `<span class="chip" style="background:${esc(b.color)}">${
            b.name?`<span class="k">${esc(b.name)}</span>`:""}${esc(txt)}</span>`;
        });
        if(sc && sc.text) inner += `<div class="hl" style="color:#b06a22">${esc(sc.text)}</div>`;
      }
      else cls += " off";
      html += `<td class="${cls}">${inner}</td>`;
    }
    html += "</tr>";
    cur.setDate(cur.getDate()+7);
  }
  return html + `</table></div>`;
}
function spaced(t){
  t = String(t||"").trim();
  return t.length <= 8 ? t.split("").join(" ") : t;
}

function get(path){ return path.split(".").reduce((o,k)=>(o==null?undefined:o[/^\d+$/.test(k)?+k:k]), S) ?? ""; }
function set(path,val){
  const ks = path.split(".");
  let o = S;
  for(let i=0;i<ks.length-1;i++) o = o[/^\d+$/.test(ks[i])?+ks[i]:ks[i]];
  const last = ks[ks.length-1];
  o[/^\d+$/.test(last)?+last:last] = val;
}
function field(label, path, o){
  o = o || {};
  const v = get(path);
  if(o.type === "textarea")
    return `<label class="f"><span>${label}</span><textarea class="i" data-path="${path}" rows="${o.rows||2}" placeholder="${esc(o.ph||"")}">${esc(v)}</textarea></label>`;
  return `<label class="f"><span>${label}</span><input class="i" type="${o.t||"text"}" data-path="${path}" value="${esc(v)}" placeholder="${esc(o.ph||"")}"></label>`;
}
function chk(path,label,on){
  return `<label class="f" style="display:flex;align-items:center;gap:8px;margin-bottom:7px">
    <input type="checkbox" data-path="${path}" ${on?"checked":""} style="width:auto">
    <span style="margin:0">${label}</span></label>`;
}

    <summary>⑧ 꾸미기</summary>
    <div class="sec-body">
      <div class="row2">
        <label class="f"><span>글꼴</span>
          <select class="i" data-path="style.font">
            <option value="gothic"${st.font==="gothic"?" selected":""}>고딕</option>
            <option value="serif"${st.font==="serif"?" selected":""}>명조</option>
          </select></label>
        <label class="f"><span>밀도</span>
          <select class="i" data-path="style.density">
            <option value="loose"${st.density==="loose"?" selected":""}>여유롭게</option>
            <option value="normal"${st.density==="normal"?" selected":""}>보통</option>
            <option value="dense"${st.density==="dense"?" selected":""}>촘촘하게</option>
          </select></label>
      </div>
      ${chk("style.showTT","시간표 넣기",st.showTT)}
      ${chk("style.showBooks","교재 구성 표 넣기",st.showBooks)}
      ${chk("style.showGoals","목표 세 칸 넣기",st.showGoals)}
    </div>
  </details>`;

  document.getElementById("editor").innerHTML = h;
}

/* ============================================================
   5. 이벤트
   ============================================================ */
const editor = document.getElementById("editor");

editor.addEventListener("input", e=>{
  const el = e.target;
  if(el.id === "noticeBox"){ S.notices = lines(el.value); return commit(false); }
  const path = el.dataset.path;
  if(!path) return;
  const v = el.type === "checkbox" ? el.checked : el.value;
  set(path, v);
  // 이름·색은 패널을 다시 그리지 않는다(다시 그리면 한 글자마다 커서가 날아간다)
  const bm = /^books\.(\d+)\.(name|color)$/.exec(path);
  if(bm){
    const bi = +bm[1], card = el.closest(".card");
    if(bm[2] === "name"){
      if(card){ const nm = card.querySelector(".nm"); if(nm) nm.textContent = v || "이름 없는 교재"; }
      const head = editor.querySelector('details[data-k="rows"] .ge-head');
      if(head && head.children[bi+1]) head.children[bi+1].textContent = v || "교재";
      const tt = editor.querySelector('details[data-k="tt"]');   // 시간표 안내 문구는 그대로 둔다
      void tt;
    }else{
      if(card){ const sw = card.querySelector(".sw"); if(sw) sw.style.background = v; }
      editor.querySelectorAll('[data-bcolor][data-i="' + bi + '"]').forEach(b=>{
        b.setAttribute("aria-pressed", b.dataset.bcolor === v);
      });
    }
    return commit(false);
  }
  commit(false);
});
editor.addEventListener("change", e=>{
  if(e.target.tagName === "SELECT" || e.target.type === "checkbox") commit(false);
});

editor.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.addbook){
    S.books.push({name:"새 교재", color:BOOK_COLORS[S.books.length % BOOK_COLORS.length], feat:"", when:"", term:""});
    S.rows.forEach(r=>r.cells.push(""));
    return commit(true);
  }
  if(b.dataset.delbook){
    const i = +b.dataset.delbook;
    if(S.books.length === 1) return alert("교재는 하나 이상 있어야 합니다.");
    if(!confirm(`"${S.books[i].name||"이 교재"}"를 지울까요? 진도의 그 칸도 함께 지워집니다.`)) return;
    S.books.splice(i,1);
    S.rows.forEach(r=>r.cells.splice(i,1));
    return commit(true);
  }
  if(b.dataset.bcolor){ S.books[+b.dataset.i].color = b.dataset.bcolor; return commit(true); }
  if(b.dataset.addrow){ S.rows.push({date:"", cells:S.books.map(()=>"")}); renderEditor(); commit(false); return focusCell(S.rows.length-1,-1); }
  if(b.dataset.delrow){ S.rows.splice(+b.dataset.delrow,1); if(!S.rows.length) S.rows.push({date:"",cells:S.books.map(()=>"")}); return commit(true); }
  if(b.dataset.addtt){ S.timetable.push({pd:"", time:"", book:S.books[0]?S.books[0].name:""}); return commit(true); }
  if(b.dataset.deltt){ S.timetable.splice(+b.dataset.deltt,1); return commit(true); }
  if(b.dataset.addsch){ S.schedule.push({d:"",t:"",x:""}); return commit(true); }
  if(b.dataset.delsch){ S.schedule.splice(+b.dataset.delsch,1); return commit(true); }
});

/* 진도 칸: Enter 로 다음 줄, 엑셀 표 붙여넣기 */
const CELL = /^rows\.(\d+)\.(date|cells\.(\d+))$/;
function focusCell(j, bi){
  const p = bi < 0 ? `rows.${j}.date` : `rows.${j}.cells.${bi}`;
  const el = editor.querySelector(`[data-path="${p}"]`);
  if(el){ el.focus(); el.select(); el.scrollIntoView({block:"nearest"}); }
}
editor.addEventListener("keydown", e=>{
  if(e.key !== "Enter") return;
  const m = CELL.exec((e.target.dataset||{}).path || "");
  if(!m) return;
  e.preventDefault();
  const j = +m[1], bi = m[3] === undefined ? -1 : +m[3];
  if(e.shiftKey){ if(j > 0) focusCell(j-1, bi); return; }
  if(j === S.rows.length - 1){ S.rows.push({date:"", cells:S.books.map(()=>"")}); renderEditor(); commit(false); }
  focusCell(j+1, bi);
});
editor.addEventListener("paste", e=>{
  const m = CELL.exec((e.target.dataset||{}).path || "");
  if(!m) return;
  const txt = (e.clipboardData || window.clipboardData).getData("text");
  if(!txt || !/[\t\n]/.test(txt)) return;
  e.preventDefault();
  const j = +m[1], startCol = m[3] === undefined ? -1 : +m[3];
  txt.split(/\r?\n/).filter(l=>l.trim()).forEach((line,k)=>{
    const parts = line.split(/\t|\s*\|\s*/).map(x=>x.trim());
    const at = j + k;
    if(!S.rows[at]) S.rows[at] = {date:"", cells:S.books.map(()=>"")};
    let col = startCol;
    parts.forEach(p=>{
      if(col === -1) S.rows[at].date = p;
      else if(col < S.books.length) S.rows[at].cells[col] = p;
      col++;
    });
  });
  renderEditor(); commit(false);
});

function commit(redraw){
  save();
  if(redraw) renderEditor();
  renderSheet();
  fit();
}

/* 상단 버튼 */
document.getElementById("btnPrint").onclick = ()=>window.print();
document.getElementById("btnSave").onclick = ()=>{
  const name = ([S.cls.campus, S.cls.name, S.info.docSub].filter(Boolean).join(" ") || "안내문")
    .replace(/[\\/:*?"<>|]/g,"") + ".json";
  const blob = new Blob([JSON.stringify(S,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
document.getElementById("btnLoad").onclick = ()=>document.getElementById("fileIn").click();
document.getElementById("fileIn").onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ try{ S = normalize(JSON.parse(r.result)); commit(true); }
                   catch(err){ alert("불러오지 못했습니다: " + err.message); } };
  r.readAsText(f,"utf-8"); e.target.value = "";
};
document.getElementById("btnClear").onclick = ()=>{
  if(!confirm("이 안내문 내용을 전부 비웁니다. 계속할까요?")) return;
  S = normalize(blankState()); commit(true);
};

/* 배율 · 쪽수 */
function fit(){
  const wrap = document.getElementById("previewWrap");
  const host = document.getElementById("zoomHost");
  const sheet = document.getElementById("sheet");
  const avail = wrap.clientWidth - 40;
  const w = sheet.offsetWidth || 1;
  const z = Math.min(1, avail / w);
  host.style.transform = `scale(${z})`;
  host.style.width = w + "px";
  host.style.height = (sheet.offsetHeight * z) + "px";
  updatePages();
}
function updatePages(){
  const el = document.getElementById("pageBadge");
  const sheet = document.getElementById("sheet");
  const PX = 96/25.4;
  const n = Math.max(1, Math.ceil((sheet.scrollHeight - 4) / (297 * PX)));
  el.className = n > 1 ? "warn" : "";
  el.textContent = n > 1 ? `인쇄 ${n}쪽 — 한 장을 넘칩니다` : "인쇄 1쪽";
}
window.addEventListener("resize", fit);

/* 시작 */
renderEditor();
renderSheet();
fit();
setTimeout(fit,200);

/* ============================================================
   앱에 얹기 (CLIMATH 수업관리 앱의 "안내문" 메뉴)
   이 파일은 단독으로 열어도 예전 그대로 동작한다. 아래는 iframe 안에 있을 때만 켜진다.
     ?cid=<반id>  반 구분 (앱이 붙여준다)
     ?view=1      읽기 전용 — 편집 패널을 숨기고 안내문만 보여준다 (학생 화면)
   저장은 localStorage 대신 부모 앱으로 보내고, 앱이 Firestore에 넣는다.
   그래야 기기를 옮겨도 남고 다른 선생님도 같은 걸 본다.
   ============================================================ */
(function(){
  var q = new URLSearchParams(location.search);
  var embedded = window.parent && window.parent !== window;
  var readonly = q.get("view") === "1";

  if (readonly) {
    document.body.classList.add("ro");
    var st = document.createElement("style");
    st.textContent = "body.ro #editor{display:none}"
      + "body.ro #btnClear,body.ro #btnLoad,body.ro #btnSave{display:none}"
      + "body.ro #previewWrap{flex:1}"
      + "@media print{body.ro #topbar{display:none}}";
    document.head.appendChild(st);
  }
  if (!embedded) return;

  /* 저장을 부모로 돌린다. commit()이 save()를 전역으로 부르므로 바꿔치기가 먹는다. */
  var post = function(type, data){
    try { window.parent.postMessage({ src: "climath-flyer", type: type, cid: q.get("cid") || "", data: data }, "*"); }
    catch(e){}
  };
  // 부모가 내려준 데이터를 얹기 전까지는 "바뀌었다"고 알리지 않는다.
  // 초기화도 commit()을 거치는데 그걸 변경으로 세면 열자마자 "저장 안 됨"이 뜬다.
  var ready = false;
  window.save = function(){ if (!readonly && ready) post("change", S); };

  window.addEventListener("message", function(ev){
    var m = ev.data;
    if (!m || m.src !== "climath-app") return;
    if (m.type === "load") {
      try { S = normalize(m.data ? JSON.parse(JSON.stringify(m.data)) : blankState()); }
      catch(e){ S = normalize(blankState()); }
      commit(true);
      ready = true;
      post("loaded");
    }
    if (m.type === "print") window.print();
  });

  /* 부모가 데이터를 줄 때까지 빈 상태로 기다린다 (localStorage 값이 잠깐 비치지 않게) */
  S = normalize(blankState());
  commit(true);
  post("ready");
})();

</script>
