<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한민수의 대시보드</title>
<!--
  팀장 대시보드. 수업관리 앱(index.html)과 같은 Firebase 프로젝트·같은 로그인을 쓴다.
  관리자(owner) 한 사람만 쓰는 화면이라 빌드도 React도 없다 — 순수 JS로 그린다.
  (index.html이 Babel 변환 트릭을 쓰는 이유는 CLAUDE.md "먼저 알아야 할 것" 참고.
   여기는 JSX가 없으니 그 함정 자체가 없다.)

  읽는 곳:
    teachers / classes / students / appConfig.examTerm / appConfig.schoolTerms
    classes/{cid}/exams (회차별 내신 참여표) / classes/{cid}/days/{date}/scores (점수)
    team/tasks (팀 할 일) / team/config (연동 시트 목록)   ← owner 전용 규칙 필요
  구글시트는 /api/sheets 가 서비스 계정으로 읽어준다.
-->
<style>
  :root {
    --navy: #1b2a4a; --navy2: #24375f; --orange: #f08a24; --bg: #f3f5f9; --card: #fff;
    --line: #e3e7ee; --text: #1f2937; --muted: #6b7280; --red: #d94848; --green: #2f9e5f;
    --yellow: #f2c94c; --blue: #3b6fd9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
  a { color: var(--blue); text-decoration: none; }
  button { font: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; }
  .top { background: linear-gradient(90deg, var(--navy), var(--navy2)); color: #fff;
    padding: 12px 18px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .top h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
  .top h1 b { color: var(--orange); }
  .top .date { opacity: .85; font-size: 13px; }
  .top .sp { flex: 1; }
  .top a, .top button.link { color: #fff; opacity: .9; font-size: 13px; background: none;
    border: 1px solid rgba(255,255,255,.35); border-radius: 6px; padding: 4px 10px; }
  .top a:hover, .top button.link:hover { opacity: 1; background: rgba(255,255,255,.1); }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; min-width: 0; }
  .card.wide { grid-column: 1 / -1; }
  .card h2 { margin: 0 0 10px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .card h2 .n { font-weight: 400; color: var(--muted); font-size: 12px; }
  .card h2 .sp { flex: 1; }
  .card h2 button, .mini { font-size: 12px; padding: 3px 9px; border: 1px solid var(--line);
    background: #fff; border-radius: 6px; color: var(--text); }
  .card h2 button:hover, .mini:hover { background: #f5f7fb; }
  .mini.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .mini.warn { border-color: var(--orange); color: #b35d00; }
  .stat { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .stat div { background: #f7f8fb; border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 12px; min-width: 84px; }
  .stat b { display: block; font-size: 20px; line-height: 1.2; }
  .stat span { color: var(--muted); font-size: 12px; }
  .stat .bad b { color: var(--red); }
  .stat .good b { color: var(--green); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border-bottom: 1px solid var(--line); padding: 5px 7px; text-align: left;
    vertical-align: top; white-space: nowrap; }
  th { background: #f7f8fb; font-weight: 600; color: #374151; position: sticky; top: 0; }
  td.wrapc { white-space: normal; }
  .tbl { overflow: auto; max-height: 420px; border: 1px solid var(--line); border-radius: 8px; }
  .tbl.tall { max-height: 640px; }
  .muted { color: var(--muted); }
  .red { color: var(--red); } .green { color: var(--green); } .orange { color: #b35d00; }
  .pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px;
    background: #eef1f6; color: #374151; margin-right: 3px; }
  .pill.red { background: #fde8e8; color: #b42318; }
  .pill.green { background: #e3f5ea; color: #1f7a45; }
  .pill.yellow { background: #fff4d6; color: #8a5a00; }
  .pill.blue { background: #e4ecfb; color: #234e9e; }
  .bar { height: 8px; background: #eef1f6; border-radius: 4px; overflow: hidden; min-width: 80px; }
  .bar i { display: block; height: 100%; background: var(--green); }
  .bar.low i { background: var(--red); } .bar.mid i { background: var(--orange); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
  .row input[type=text], .row input[type=date], .row select, .row textarea {
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  .row input[type=text] { flex: 1; min-width: 140px; }
  .btn { background: var(--navy); color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; }
  .btn.o { background: var(--orange); }
  .btn.g { background: #fff; color: var(--text); border: 1px solid var(--line); }
  .btn:disabled { opacity: .5; cursor: default; }
  .task { display: flex; gap: 8px; align-items: flex-start; padding: 6px 4px;
    border-bottom: 1px solid var(--line); }
  .task:last-child { border-bottom: 0; }
  .task input[type=checkbox] { margin-top: 3px; }
  .task .t { flex: 1; min-width: 0; }
  .task .t.done { text-decoration: line-through; color: var(--muted); }
  .task .m { font-size: 12px; color: var(--muted); }
  .task .m .over { color: var(--red); font-weight: 600; }
  .task .m .soon { color: #b35d00; font-weight: 600; }
  .task .x { color: var(--muted); background: none; border: 0; font-size: 14px; padding: 0 4px; }
  .task .x:hover { color: var(--red); }
  .chips { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
  .banner { background: #fff4d6; border: 1px solid #f2c94c; border-radius: 8px; padding: 10px 14px;
    margin-bottom: 14px; }
  .banner pre { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 8px;
    font-size: 12px; overflow: auto; margin: 6px 0 0; }
  .err { color: var(--red); font-size: 13px; margin: 6px 0; white-space: pre-wrap; }
  .login { max-width: 380px; margin: 60px auto; }
  .login select, .login input { width: 100%; padding: 9px 10px; border: 1px solid var(--line);
    border-radius: 8px; margin-bottom: 10px; }
  .login .btn { width: 100%; padding: 10px; }
  .empty { color: var(--muted); padding: 12px 4px; }
  .sheet { margin-top: 10px; }
  .sheet h3 { margin: 0 0 6px; font-size: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .sheet h3 .sp { flex: 1; }
  .sheet .tbl { max-height: 360px; }
  .sheet td, .sheet th { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; margin: 6px 0; }
  @media (max-width: 760px) {
    .grid { grid-template-columns: 1fr; }
    .wrap { padding: 8px; }
    .card { padding: 12px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
"use strict";
// ---------- 기본 ----------
var firebaseConfig = {
  apiKey: "AIzaSyBIhpjPGsA1tH9AFspHtNifeeHUnhN0XUA",
  authDomain: "climath-class.firebaseapp.com",
  projectId: "climath-class",
  storageBucket: "climath-class.firebasestorage.app",
  messagingSenderId: "321968656061",
  appId: "1:321968656061:web:29d98c125c7480d44371d4"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();

var $ = function (s, el) { return (el || document).querySelector(s); };
var $$ = function (s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); };
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function pad2(n) { return (n < 10 ? "0" : "") + n; }
function ymd(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
var TODAY = ymd(new Date());
var DOW = ["일", "월", "화", "수", "목", "금", "토"];
function parseYmd(s) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
function fmtMD(s) { var d = parseYmd(s); return d ? (d.getMonth() + 1) + "/" + d.getDate() + "(" + DOW[d.getDay()] + ")" : (s || ""); }
function daysFromToday(s) { var d = parseYmd(s); if (!d) return null; return Math.round((d - parseYmd(TODAY)) / 864e5); }
function dday(s) { var n = daysFromToday(s); if (n === null) return ""; return n === 0 ? "오늘" : n > 0 ? "D-" + n : "D+" + (-n); }
function addDays(s, n) { var d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function isEnded(r) { return !!(r && r.endDate && TODAY > r.endDate); }
function activeClass(c) { return !(c.endDate && TODAY > c.endDate); }
var GRADES = ["중3", "고1", "고2", "고3"];
var gradeRank = function (g) { var i = GRADES.indexOf(g); return i < 0 ? 99 : i; };

// ---------- 상태 ----------
var S = {
  claims: null, teachers: [], classes: [], students: [], term: "", schoolTerms: {},
  exams: {},      // cid -> { sid -> doc }
  scores: {},     // cid -> [ {date, ...score} ]
  tasks: [], config: { sheets: [] }, teamOk: true, teamErr: "",
  filterWho: "", showAllStudents: false, showDone: false, saEmail: "",
  sheetData: {},  // sheetId -> { meta, tab, values, err, q }
};

async function authApi(body) {
  var r = await fetch("/api/auth", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  var j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((j && j.error) || ("요청 실패 (" + r.status + ")"));
  return j || {};
}
async function sheetsApi(body) {
  var u = firebase.auth().currentUser;
  if (!u) throw new Error("로그인이 필요합니다");
  var idToken = await u.getIdToken();
  var r = await fetch("/api/sheets", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ idToken: idToken }, body)) });
  var j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((j && j.error) || ("요청 실패 (" + r.status + ")"));
  return j || {};
}

// ---------- 로그인 ----------
var root = $("#root");
function renderLogin(msg) {
  root.innerHTML =
    '<div class="top"><h1>한민수의 <b>대시보드</b></h1><span class="date">' + fmtMD(TODAY) + '</span></div>' +
    '<div class="wrap"><div class="card login"><h2>선생님 로그인</h2>' +
    '<select id="lg-t"><option value="">불러오는 중...</option></select>' +
    '<input id="lg-p" type="password" inputmode="numeric" placeholder="PIN" autocomplete="current-password">' +
    '<button class="btn" id="lg-go">들어가기</button>' +
    '<div class="err" id="lg-err">' + esc(msg || "") + '</div>' +
    '<p class="muted" style="font-size:12px">수업관리 앱과 같은 계정이다. 관리자만 들어올 수 있다.</p></div></div>';
  authApi({ action: "teachers" }).then(function (r) {
    var ts = (r.teachers || []).filter(function (t) { return t.status !== "pending"; });
    $("#lg-t").innerHTML = ts.map(function (t) {
      return '<option value="' + esc(t.tid) + '"' + (t.role === "owner" ? " selected" : "") + '>' + esc(t.name) + (t.role === "owner" ? " (관리자)" : "") + '</option>';
    }).join("");
  }).catch(function (e) { $("#lg-err").textContent = e.message; });
  var go = async function () {
    var tid = $("#lg-t").value, pin = $("#lg-p").value;
    $("#lg-err").textContent = "";
    try {
      var r = await authApi({ action: "login", kind: "teacher", tid: tid, pin: pin });
      await firebase.auth().signInWithCustomToken(r.token);
      await boot();
    } catch (e) { $("#lg-err").textContent = e.message; }
  };
  $("#lg-go").onclick = go;
  $("#lg-p").addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
}

async function boot() {
  var u = firebase.auth().currentUser;
  if (!u) { renderLogin(); return; }
  var tr = await u.getIdTokenResult();
  var c = tr.claims || {};
  if (c.role !== "owner") {
    await firebase.auth().signOut();
    renderLogin("관리자 계정만 들어올 수 있습니다 (" + (c.role || "역할 없음") + ")");
    return;
  }
  S.claims = c;
  renderShell();
  await loadCore();
  renderAll();
  loadExams().then(renderExams);
  loadScores().then(renderScores);
  loadSheetsAll();
}
firebase.auth().onAuthStateChanged(function () { boot().catch(function (e) { renderLogin(e.message); }); });

// ---------- 뼈대 ----------
function renderShell() {
  root.innerHTML =
    '<div class="top"><h1>한민수의 <b>대시보드</b></h1><span class="date">' + fmtMD(TODAY) + '</span><span class="sp"></span>' +
    '<a href="/?admin=1" target="_blank">수업관리 앱</a>' +
    '<a href="/flyer.html" target="_blank">안내문</a>' +
    '<button class="link" id="btn-reload">새로고침</button>' +
    '<button class="link" id="btn-out">로그아웃</button></div>' +
    '<div class="wrap"><div id="banner"></div><div class="grid">' +
    '<div class="card" id="sec-tasks"></div>' +
    '<div class="card" id="sec-week"></div>' +
    '<div class="card" id="sec-students"></div>' +
    '<div class="card" id="sec-terms"></div>' +
    '<div class="card" id="sec-exams"></div>' +
    '<div class="card" id="sec-scores"></div>' +
    '<div class="card wide" id="sec-sheets"></div>' +
    '</div></div>';
  $("#btn-out").onclick = function () { firebase.auth().signOut(); };
  $("#btn-reload").onclick = function () { location.reload(); };
}
function renderAll() { renderBanner(); renderTasks(); renderWeek(); renderStudents(); renderTerms(); renderExams(); renderScores(); renderSheets(); }

// ---------- 불러오기 ----------
async function loadCore() {
  var jobs = [
    db.collection("teachers").orderBy("time").get().then(function (s) { S.teachers = []; s.forEach(function (d) { S.teachers.push(Object.assign({ tid: d.id }, d.data())); }); }),
    db.collection("classes").get().then(function (s) { S.classes = []; s.forEach(function (d) { S.classes.push(Object.assign({ id: d.id }, d.data())); }); S.classes.sort(function (a, b) { return (a.order || 0) - (b.order || 0); }); }),
    db.collection("students").get().then(function (s) { S.students = []; s.forEach(function (d) { S.students.push(Object.assign({ pid: d.id }, d.data())); }); }),
    db.collection("appConfig").doc("examTerm").get().then(function (d) { S.term = d.exists ? (d.data().term || "") : ""; }),
    db.collection("appConfig").doc("schoolTerms").get().then(function (d) { S.schoolTerms = d.exists ? d.data() : {}; }),
    db.collection("team").doc("tasks").get().then(function (d) { S.tasks = d.exists ? (d.data().items || []) : []; S.teamOk = true; })
      .catch(function (e) { S.teamOk = false; S.teamErr = e.code || e.message; }),
    db.collection("team").doc("config").get().then(function (d) { S.config = d.exists ? Object.assign({ sheets: [] }, d.data()) : { sheets: [] }; })
      .catch(function () {}),
  ];
  await Promise.all(jobs);
}
function teacherName(tid) { var t = S.teachers.filter(function (x) { return x.tid === tid; })[0]; return t ? t.name : (tid ? "?" : ""); }
function classTeachers(cid) { return S.teachers.filter(function (t) { return (t.classIds || []).indexOf(cid) >= 0; }).map(function (t) { return t.name; }); }
function className(cid) { var c = S.classes.filter(function (x) { return x.id === cid; })[0]; return c ? c.name : cid; }
function rosterStudents(c) { return (c.roster || []).filter(function (r) { return !r.teacher && !isEnded(r); }); }
function activeClasses() { return S.classes.filter(activeClass); }

// ---------- 규칙 배너 ----------
function renderBanner() {
  var el = $("#banner");
  if (S.teamOk) { el.innerHTML = ""; return; }
  el.innerHTML = '<div class="banner"><b>팀 할 일·시트 목록을 못 읽었다</b> (' + esc(S.teamErr) + ').<br>' +
    'Firestore 규칙에 아래 블록이 아직 게시되지 않은 것이다. 저장소 <code>firestore.rules</code>에는 들어 있으니 ' +
    '콘솔 → Firestore → 규칙에 전체를 붙여넣고 게시하면 된다. 나머지 화면은 그대로 돈다.' +
    '<pre>match /team/{doc} {\n  allow read, write: if isOwner();\n}</pre></div>';
}

// ---------- 팀 할 일 ----------
var STATUS = { open: "열림", doing: "진행", done: "완료", hold: "보류" };
async function saveTasks() {
  if (!S.teamOk) return;
  await db.collection("team").doc("tasks").set({ items: S.tasks, updated: Date.now() });
}
function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function whoChips() {
  var names = ["전원", "담임 전원", "고등부"].concat(S.teachers.map(function (t) { return t.name; }));
  var seen = {}; S.tasks.forEach(function (t) { (t.who || "").split(/[·,/]/).forEach(function (w) { w = w.trim(); if (w) seen[w] = 1; }); });
  names.forEach(function (n) { seen[n] = 1; });
  return Object.keys(seen);
}
function taskMatchesWho(t, who) {
  if (!who) return true;
  var w = t.who || "";
  return w.indexOf(who) >= 0;
}
function renderTasks() {
  var el = $("#sec-tasks");
  var open = S.tasks.filter(function (t) { return t.status !== "done"; });
  var overdue = open.filter(function (t) { var n = daysFromToday(t.due); return n !== null && n < 0; });
  var week = open.filter(function (t) { var n = daysFromToday(t.due); return n !== null && n >= 0 && n <= 7; });
  var list = (S.showDone ? S.tasks : open).filter(function (t) { return taskMatchesWho(t, S.filterWho); });
  list.sort(function (a, b) {
    var ad = a.status === "done", bd = b.status === "done"; if (ad !== bd) return ad ? 1 : -1;
    var x = a.due || "9999", y = b.due || "9999"; return x < y ? -1 : x > y ? 1 : 0;
  });
  var chips = whoChips();
  el.innerHTML =
    '<h2>팀 할 일 <span class="n">열림 ' + open.length + '</span><span class="sp"></span>' +
    '<button id="tk-done">' + (S.showDone ? "완료 숨기기" : "완료 보기") + '</button>' +
    '<button id="tk-import">볼트에서 붙여넣기</button></h2>' +
    '<div class="stat"><div class="' + (overdue.length ? "bad" : "") + '"><b>' + overdue.length + '</b><span>기한 지남</span></div>' +
    '<div><b>' + week.length + '</b><span>이번 주</span></div>' +
    '<div><b>' + open.filter(function (t) { return !t.who; }).length + '</b><span>담당 없음</span></div></div>' +
    '<div class="chips"><button class="mini ' + (!S.filterWho ? "on" : "") + '" data-who="">전체</button>' +
    chips.map(function (w) { return '<button class="mini ' + (S.filterWho === w ? "on" : "") + '" data-who="' + esc(w) + '">' + esc(w) + '</button>'; }).join("") + '</div>' +
    '<div id="tk-list">' + (list.length ? list.map(taskRow).join("") : '<div class="empty">' + (S.teamOk ? "할 일이 없다. 아래에 적거나 볼트에서 붙여넣는다." : "규칙을 게시하면 여기 저장된다.") + '</div>') + '</div>' +
    '<div class="row"><input type="text" id="tk-text" placeholder="새 할 일">' +
    '<input type="text" id="tk-who" placeholder="담당" style="flex:0 0 90px" list="who-list">' +
    '<input type="date" id="tk-due"><button class="btn" id="tk-add"' + (S.teamOk ? "" : " disabled") + '>추가</button></div>' +
    '<datalist id="who-list">' + chips.map(function (w) { return '<option value="' + esc(w) + '">'; }).join("") + '</datalist>' +
    '<div id="tk-imp" hidden><textarea id="tk-md" rows="6" style="width:100%" placeholder="볼트 「할 일 추적」의 표를 그대로 붙여넣기 (| 할 일 | 담당 | 기한 | 출처 | 상태 |)"></textarea>' +

// 볼트 「할 일 추적」 표 → 항목. 셀 순서는 할 일 | 담당 | 기한 | 출처 | 상태 (완료 표는 마지막이 완료일).
function importMarkdown(md) {
  var n = 0, have = {};
  S.tasks.forEach(function (t) { have[t.text] = 1; });
  md.split(/\r?\n/).forEach(function (line) {
    if (!/^\s*\|/.test(line)) return;
    var cells = line.split("|").slice(1, -1).map(function (c) { return c.replace(/\[\[|\]\]|\*\*/g, "").trim(); });
    if (cells.length < 3) return;
    if (/^-+$/.test(cells[0]) || cells[0] === "할 일") return;
    var text = cells[0]; if (!text || have[text]) return;
    var st = cells[4] || "";
    var status = /완료|^\d{4}-/.test(st) ? "done" : /진행/.test(st) ? "doing" : /보류/.test(st) ? "hold" : "open";
    S.tasks.push({ id: newId(), text: text, who: cells[1] || "", due: parseDueText(cells[2] || ""), dueText: cells[2] || "",
      src: cells[3] || "", status: status, created: TODAY, done: status === "done" ? (/^\d{4}-/.test(st) ? st.slice(0, 10) : TODAY) : "" });
    have[text] = 1; n++;
  });
  return n;
}
// "9/4 (목)" · "~9/11" · "9/4~5" 같은 글을 날짜로. 못 읽으면 글자를 그대로 둔다.
function parseDueText(s) {
  var m = /(\d{1,2})\s*\/\s*(\d{1,2})/.exec(s);
  if (!m) return s;
  var y = new Date().getFullYear(); var mo = +m[1], d = +m[2];
  // 12월에 1월 기한이면 다음 해
  if (mo < new Date().getMonth() + 1 - 6) y += 1;
  return y + "-" + pad2(mo) + "-" + pad2(d);
}

var SCORE_DAYS = 30;   // 최근 며칠을 보나
var SCORE_MAX_DOCS = 14; // 반 하나당 날짜 문서를 몇 개까지 읽나 (읽기 수 제한)
async function loadScores() {
  var since = addDays(TODAY, -SCORE_DAYS);
  await Promise.all(activeClasses().map(async function (c) {
    try {
      var ds = await db.collection("classes").doc(c.id).collection("days").get();
      var ids = []; ds.forEach(function (d) { if (d.id >= since && d.id <= TODAY) ids.push(d.id); });
      ids.sort().reverse(); ids = ids.slice(0, SCORE_MAX_DOCS);
      var out = [];
      await Promise.all(ids.map(function (date) {
        return db.collection("classes").doc(c.id).collection("days").doc(date).collection("scores").get().then(function (s) {
          s.forEach(function (d) { out.push(Object.assign({ date: date }, d.data())); });
        });
      }));
      S.scores[c.id] = out;
    } catch (e) { S.scores[c.id] = []; }
  }));
}
function renderScores() {
  var el = $("#sec-scores");
  var loaded = Object.keys(S.scores).length;
  if (!loaded) { el.innerHTML = '<h2>성적 입력 <span class="n">최근 ' + SCORE_DAYS + '일</span></h2><div class="empty">불러오는 중...</div>'; return; }
  var rows = [], byT = {};
  activeClasses().forEach(function (c) {
    var sc = S.scores[c.id] || []; var studs = rosterStudents(c); if (!studs.length) return;
    var last = sc.reduce(function (m, s) { return s.date > m ? s.date : m; }, "");
    var labels = {}; sc.forEach(function (s) { labels[s.label || "(이름 없음)"] = 1; });
    var withScore = {}; sc.forEach(function (s) { withScore[s.sid] = 1; });
    var covered = studs.filter(function (r) { return withScore[r.id]; }).length;
    var ts = classTeachers(c.id); if (!ts.length) ts = ["담당 없음"];
    ts.forEach(function (t) { (byT[t] = byT[t] || { c: 0, n: 0, tests: 0, last: "" }); byT[t].c++; byT[t].n += sc.length; byT[t].tests += Object.keys(labels).length; if (last > byT[t].last) byT[t].last = last; });
    rows.push({ c: c, t: ts.join("·"), n: sc.length, tests: Object.keys(labels).length, last: last, covered: covered, total: studs.length, labels: Object.keys(labels) });
  });
  rows.sort(function (a, b) { return (a.last || "") < (b.last || "") ? -1 : 1; });
  var silent = rows.filter(function (r) { return !r.last; });
  el.innerHTML = '<h2>성적 입력 <span class="n">최근 ' + SCORE_DAYS + '일</span><span class="sp"></span><button id="sc-re">다시 세기</button></h2>' +
    '<div class="stat"><div class="' + (silent.length ? "bad" : "good") + '"><b>' + silent.length + '</b><span>입력 없는 반</span></div>' +
    '<div><b>' + rows.reduce(function (a, r) { return a + r.n; }, 0) + '</b><span>점수 건수</span></div></div>' +
    '<div class="tbl" style="max-height:170px"><table><thead><tr><th>선생님</th><th>반</th><th>테스트</th><th>건수</th><th>마지막</th></tr></thead><tbody>' +
    Object.keys(byT).sort(function (a, b) { return (byT[a].last || "") < (byT[b].last || "") ? -1 : 1; }).map(function (t) {
      var v = byT[t];
      return '<tr><td>' + esc(t) + '</td><td>' + v.c + '</td><td>' + v.tests + '</td><td>' + v.n + '</td><td>' + (v.last ? esc(fmtMD(v.last)) : '<span class="red">없음</span>') + '</td></tr>';
    }).join("") + '</tbody></table></div>' +
    '<div class="tbl" style="margin-top:8px"><table><thead><tr><th>반</th><th>담당</th><th>마지막</th><th>테스트</th><th>학생 커버</th></tr></thead><tbody>' +
    rows.map(function (r) {
      var n = daysFromToday(r.last);
      return '<tr><td>' + esc(r.c.name) + '</td><td>' + esc(r.t) + '</td><td>' + (r.last ? esc(fmtMD(r.last)) + ' <span class="muted">' + (n === 0 ? "오늘" : (-n) + "일 전") + '</span>' : '<span class="red">없음</span>') + '</td>' +
        '<td class="wrapc">' + r.labels.slice(0, 4).map(function (l) { return '<span class="pill">' + esc(l) + '</span>'; }).join("") + (r.labels.length > 4 ? '<span class="muted">+' + (r.labels.length - 4) + '</span>' : "") + '</td>' +
        '<td>' + r.covered + '/' + r.total + '</td></tr>';
    }).join("") + '</tbody></table></div>' +
    '<p class="muted" style="font-size:12px;margin:6px 0 0">반마다 최근 ' + SCORE_MAX_DOCS + '개 날짜만 읽는다. 학생이 점수 탭에서 낸 것 + 선생님이 넣은 것.</p>';
  $("#sc-re").onclick = function () { S.scores = {}; renderScores(); loadScores().then(renderScores); };
}

// ---------- 구글시트 ----------
async function saveConfig() {
  if (!S.teamOk) return;
  await db.collection("team").doc("config").set({ sheets: S.config.sheets || [], updated: Date.now() }, { merge: true });
}
function sheetIdFrom(s) {
  var m = /\/d\/([A-Za-z0-9_-]{20,})/.exec(s) || /^([A-Za-z0-9_-]{20,})$/.exec(s.trim());
  return m ? m[1] : "";
}
function loadSheetsAll() {
  (S.config.sheets || []).forEach(function (sh) { loadSheet(sh); });
  sheetsApi({ action: "whoami" }).then(function (r) { S.saEmail = r.email; renderSheets(); }).catch(function () {});
}
async function loadSheet(sh) {
  var d = S.sheetData[sh.id] = S.sheetData[sh.id] || {};
  d.loading = true; d.err = ""; renderSheets();
  try {
    if (!d.meta) { d.meta = await sheetsApi({ action: "meta", spreadsheetId: sh.id }); if (!sh.title) sh.title = d.meta.title; }
    var tab = sh.tab || (d.meta.tabs[0] && d.meta.tabs[0].title) || "";
    var r = await sheetsApi({ action: "values", spreadsheetId: sh.id, range: "'" + tab.replace(/'/g, "''") + "'!A1:AZ" + (sh.rows || 300) });
    d.tab = tab; d.values = r.values || []; d.at = Date.now();
  } catch (e) { d.err = e.message; }
  d.loading = false; renderSheets();
}
function renderSheets() {
  var el = $("#sec-sheets");
  var sheets = S.config.sheets || [];
  el.innerHTML = '<h2>구글시트 <span class="n">' + sheets.length + '개 연동</span><span class="sp"></span><button id="sh-reload">전부 새로고침</button></h2>' +
    '<div class="row"><input type="text" id="sh-url" placeholder="시트 주소를 붙여넣기 (여러 개면 줄마다 하나)"><button class="btn" id="sh-add"' + (S.teamOk ? "" : " disabled") + '>연동</button></div>' +
    '<p class="muted" style="font-size:12px;margin:0 0 6px">시트마다 ' + (S.saEmail ? '<b>' + esc(S.saEmail) + '</b>' : "서비스 계정") + ' 을 <b>뷰어</b>로 공유해야 읽힌다. 남이 만든 시트도 편집 권한이 있으면 공유할 수 있다. 읽기만 하고 절대 쓰지 않는다.</p>' +
    (sheets.length ? sheets.map(sheetBlock).join("") : '<div class="empty">아직 연동한 시트가 없다.</div>');
  $("#sh-reload").onclick = function () { sheets.forEach(function (sh) { delete S.sheetData[sh.id]; loadSheet(sh); }); };
  $("#sh-add").onclick = async function () {
    var lines = $("#sh-url").value.split(/\r?\n/); var added = 0;
    lines.forEach(function (l) {
      var id = sheetIdFrom(l); if (!id) return;
      if (sheets.some(function (s) { return s.id === id; })) return;
      var m = /gid=(\d+)/.exec(l);
      sheets.push({ id: id, title: "", tab: "", rows: 300, gid: m ? +m[1] : null }); added++;
    });
    if (!added) { alert("시트 주소를 못 읽었다"); return; }
    S.config.sheets = sheets; await saveConfig(); renderSheets();
    sheets.slice(-added).forEach(loadSheet);
  };
  sheets.forEach(function (sh) {
    var box = $('[data-sheet="' + sh.id + '"]', el); if (!box) return;
    var sel = $("select.tab", box);
    if (sel) sel.onchange = async function () { sh.tab = sel.value; await saveConfig(); delete S.sheetData[sh.id].values; loadSheet(sh); };
    var q = $("input.q", box);
    if (q) q.oninput = function () { S.sheetData[sh.id].q = q.value; renderSheetTable(sh, $(".tbl", box)); };
    $(".rm", box).onclick = async function () {
      if (!confirm("연동을 풀까? " + (sh.title || sh.id))) return;
      S.config.sheets = sheets.filter(function (s) { return s.id !== sh.id; }); delete S.sheetData[sh.id]; await saveConfig(); renderSheets();
    };
    $(".re", box).onclick = function () { delete S.sheetData[sh.id]; loadSheet(sh); };
    var rowsSel = $("select.rows", box);
    if (rowsSel) rowsSel.onchange = async function () { sh.rows = +rowsSel.value; await saveConfig(); delete S.sheetData[sh.id].values; loadSheet(sh); };
  });
}
function sheetBlock(sh) {
  var d = S.sheetData[sh.id] || {};
  var tabs = (d.meta && d.meta.tabs) || [];
  return '<div class="sheet" data-sheet="' + esc(sh.id) + '"><h3>' + esc(sh.title || d.meta && d.meta.title || sh.id) +
    ' <a href="https://docs.google.com/spreadsheets/d/' + esc(sh.id) + '/edit' + (sh.gid != null ? "#gid=" + sh.gid : "") + '" target="_blank" class="mini">열기</a>' +
    (tabs.length ? '<select class="tab mini">' + tabs.map(function (t) { return '<option' + (t.title === d.tab ? " selected" : "") + '>' + esc(t.title) + '</option>'; }).join("") + '</select>' : "") +
    (d.values ? '<input type="text" class="q mini" placeholder="찾기" value="' + esc(d.q || "") + '" style="width:120px">' : "") +
    '<select class="rows mini" title="읽을 줄 수">' + [100, 300, 1000].map(function (n) { return '<option value="' + n + '"' + ((sh.rows || 300) === n ? " selected" : "") + '>' + n + '줄</option>'; }).join("") + '</select>' +
    '<span class="sp"></span>' + (d.loading ? '<span class="muted">읽는 중...</span>' : d.at ? '<span class="muted" style="font-size:12px">' + new Date(d.at).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }) + '</span>' : "") +
    '<button class="mini re">새로고침</button><button class="mini rm">풀기</button></h3>' +
    (d.err ? '<div class="err">' + esc(d.err) + '</div>' : "") +
    '<div class="tbl">' + sheetTableHtml(sh) + '</div></div>';
}
function renderSheetTable(sh, el) { el.innerHTML = sheetTableHtml(sh); }
function sheetTableHtml(sh) {
  var d = S.sheetData[sh.id] || {};
  var v = d.values; if (!v) return d.loading ? "" : '<div class="empty">아직 안 읽었다</div>';
  if (!v.length) return '<div class="empty">비어 있다</div>';
  var q = (d.q || "").trim().toLowerCase();
  var head = v[0] || []; var body = v.slice(1);
  if (q) body = body.filter(function (r) { return r.join(" ").toLowerCase().indexOf(q) >= 0; });
  var cols = Math.min(head.length || (body[0] || []).length, 26);
  return '<table><thead><tr>' + Array.apply(null, Array(cols)).map(function (_, i) { return '<th>' + esc(head[i] || "") + '</th>'; }).join("") + '</tr></thead><tbody>' +
    body.slice(0, 200).map(function (r) { return '<tr>' + Array.apply(null, Array(cols)).map(function (_, i) { return '<td title="' + esc(r[i] || "") + '">' + esc(r[i] || "") + '</td>'; }).join("") + '</tr>'; }).join("") +
    '</tbody></table>' + (body.length > 200 ? '<div class="muted" style="padding:6px">' + body.length + '줄 중 200줄만</div>' : "");
}
</script>
</body>
