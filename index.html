  const hasSR = !!(window.SpeechRecognition || window.webkitSpeechRecognition);

  if (!canEdit) return <div className="cm-empty">담당 선생님만 기록할 수 있어요</div>;

  return (
    <div>
      {/* ── 진행 중이 아닐 때 ── */}
      {!log && (
        <div style={{ textAlign: "center", padding: "18px 6px" }}>
          {saved && saved.endedAt
            ? <div className="cm-hint" style={{ marginBottom: 14 }}>오늘({date}) 수업은 기록이 끝났어요. 아래에서 내보낼 수 있어요.</div>
            : <div className="cm-hint" style={{ marginBottom: 14 }}>녹화를 먼저 켜고, 켜지면 아래를 누르세요.<br />
                {sound
                  ? <>누를 때 짧게 <b>삐</b> 소리가 납니다. 그 소리가 영상에 녹음되면<br />PC에서 <b>자동으로</b> 맞춰집니다 — 시각을 적어둘 필요 없어요.</>
                  : <>누른 순간이 <b>영상 00:00</b>이 됩니다. 늦게 누르셨어도<br />끝나고 <b>영상 맞추기</b>로 밀 수 있습니다.</>}
              </div>}
          <button className="cm-btn cm-btn-primary" style={{ maxWidth: 280, margin: "0 auto" }} onClick={clStart}>
            {saved && saved.endedAt ? "다시 기록 시작" : "수업 시작"}
          </button>
          <div style={{ display: "flex", gap: 10, alignItems: "center", justifyContent: "center", marginTop: 12, flexWrap: "wrap" }}>
            <label style={{ fontSize: 12, color: "var(--muted)", display: "flex", alignItems: "center", gap: 5 }}>
              <input type="checkbox" checked={sound}
                onChange={(e) => { setSound(e.target.checked); localStorage.setItem("cl-beep", e.target.checked ? "1" : "0"); }} />
              표식음 내기
            </label>
            <button className="cm-link" style={{ padding: 0 }}
              onClick={() => { if (!clBeep()) alert("이 브라우저는 소리를 낼 수 없어요"); else setTimeout(() => setBeepAsk(true), 700); }}>소리 시험</button>
          </div>
          {sound && !beepAsk && <div className="cm-hint" style={{ marginTop: 6, fontSize: 11 }}>캠코더가 이 소리를 담을 만큼 가까운지 한 번 시험해 보세요.</div>}
          {beepAsk && (
            <div className="cm-hint" style={{ marginTop: 8, textAlign: "left", background: "var(--cream)", padding: "10px 12px", borderRadius: 10 }}>
              <b>들리셨나요?</b> 안 들렸다면 <b>볼륨(미디어) 버튼을 올려주세요</b> — 무음 모드는 넘어가지만
              볼륨 0은 웹에서 못 올립니다. 그래도 안 나면 표식음을 끄고 <b>영상 맞추기</b>로 손으로 맞추면 됩니다.
              <div style={{ marginTop: 6 }}>
                <button className="cm-link" style={{ padding: 0 }} onClick={() => setBeepAsk(false)}>알겠어요</button>
              </div>
            </div>
          )}
        </div>
      )}

      {/* ── 진행 중 ── */}
      {log && (<>
        <div className={cur ? "cl-now" : "cl-now idle"}
          style={cur ? { background: cur.sid ? colorOf(cur.sid) : "#7c8294" } : null}>
          <div className="cl-who">{cur ? (cur.sid ? nameOf(cur.sid) : CL_KIND[cur.kind].label) : "누구부터 시작하나요?"}</div>
          <div className="cl-sub">
            {cur ? (cur.sid ? CL_KIND[cur.kind].label + (cur.unit ? " · " + cur.unit : "") : "이 구간은 잘라냅니다")
                 : "아래에서 학생을 누르면 기록이 시작됩니다"}
          </div>
          {cur && <div className="cl-clk">{clHms((Date.now() - cur.t) / 1000)}</div>}
        </div>

        {/* 마이크 */}
        <div className="cl-mic">
          <span className={"cl-dot" + (micOn ? " live" : "")} />
          <button className="cm-link" style={{ padding: 0 }} onClick={() => { setMicErr(""); setMicOn((v) => !v); }} disabled={!hasSR}>
            {micOn ? "마이크 끄기" : "마이크 켜기"}
          </button>
          <label style={{ fontSize: 12, color: "var(--muted)", display: "flex", alignItems: "center", gap: 4, marginLeft: "auto" }}>
            <input type="checkbox" checked={autoSw} onChange={(e) => setAutoSw(e.target.checked)} /> 자동 전환
          </label>
          {!hasSR && <div className="cl-heard">이 브라우저는 음성 인식을 지원하지 않아요 (크롬에서 열어주세요)</div>}
          {micErr && <div className="cl-heard" style={{ color: "#d6453f" }}>{micErr}</div>}
          {micOn && !micErr && <div className="cl-heard">{heard || "듣는 중…"}</div>}
          {micOn && (
            <div style={{ flex: "1 1 100%", display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap", borderTop: "1px solid var(--line)", paddingTop: 7, marginTop: 1 }}>
              <span style={{ fontSize: 11, color: "var(--muted)" }}>이름 보정</span>
              {people.map((p) => (
                <button key={p.id} className="cl-pen" style={{ position: "static" }} onClick={() => clSetAlias(p.id)}>
                  {p.name}{(cfg.aliases[p.id] || []).length ? " ·" + (cfg.aliases[p.id] || []).length : ""}
                </button>
              ))}
            </div>
          )}
        </div>

        {/* 제안 */}
        {sug && (
          <div className="cl-sug">
            <div><b>{sug.name}</b>{sug.kind === "단원" ? " 단원이 들렸어요" : " 이름이 들렸어요"} — 바꿀까요?</div>
            <div className="cl-quote">“{sug.text}”</div>
            <div style={{ display: "flex", gap: 8 }}>
              <button className="cm-btn cm-btn-primary" style={{ margin: 0, padding: "8px 14px" }} onClick={() => clMark(sug.sid, "lesson")}>{sug.name}(으)로 바꾸기</button>
              <button className="cm-btn cm-btn-ghost" style={{ margin: 0, padding: "8px 14px" }} onClick={() => setSug(null)}>무시</button>
            </div>
          </div>
        )}

        {/* 학생 카드 */}
        <div className="cl-grid">
          {people.map((p) => {
            const on = cur && cur.sid === p.id;
            const t = tot[p.id] || 0, q = qat[p.id] || 0;
            return (
              <div key={p.id} className={"cl-card" + (on ? " on" : "")} style={{ "--c": colorOf(p.id) }}>
                <button className="cl-main" onClick={() => clMark(p.id, "lesson")}>
                  <div className="cl-nm">{p.name}</div>
                  <div className="cl-un">{(cfg.units[p.id] || [])[0] || (p.books || []).join(", ") || "단원 미정"}</div>
                  <div className="cl-tm">강의 {clHms(t)}{q ? "  질문 " + clHms(q) : ""}</div>
                </button>
                <button className="cl-qa" onClick={() => clMark(p.id, "qa")}>질문</button>
                <button className="cl-pen" onClick={() => clSetUnit(p.id)}>단원</button>
                <div className="cl-bar"><i style={{ width: Math.round((t / maxT) * 100) + "%" }} /></div>
              </div>
            );
          })}
        </div>

        <div className="cl-other">
          {["brk", "mic", "etc"].map((k) => (
            <button key={k} className={cur && !cur.sid && cur.kind === k ? "on" : ""} onClick={() => clMark(null, k)}>{CL_KIND[k].label}</button>
          ))}
        </div>

        {/* 내 수업 계량 — 폐쇄형이 줄어든 자리를 개방형이 채우는지 그 자리에서 본다.
            micOn이 아니라 받아쓴 게 있는지로 건다. 마이크는 조용하면 저 혼자 끊긴다 */}
        {trans.length > 0 && (
          <div className="cl-meter">
            <div><div className="cl-v">{perH(nClosed)}</div><div className="cl-l">확인 /시간</div></div>
            <div><div className="cl-v">{perH(nOpen)}</div><div className="cl-l">요구 /시간</div></div>
            <div><div className="cl-v">{nOpen ? (nClosed / nOpen).toFixed(1) : "–"}</div><div className="cl-l">확인 : 요구</div></div>
          </div>
        )}
        {trans.length > 0 && (
          <div className="cm-hint" style={{ marginTop: 6, textAlign: "center" }}>
            낱말로 세는 대략치입니다. 판서만 하는 구간은 안 잡혀요 · 받아쓴 발화 {trans.length}개
          </div>
        )}

        <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 14 }}>
          <button className="cm-btn cm-btn-ghost" style={{ margin: 0, padding: "9px 14px" }} disabled={!log.marks.length} onClick={clUndo}>↶ 전환 취소</button>
          <span className="cm-hint" style={{ marginLeft: "auto" }}>경과 {clHms(elapsed)} · {log.marks.length}구간</span>
        </div>
        <button className="cm-btn cm-btn-ghost" style={{ marginTop: 10, color: "#d6453f", borderColor: "#d6453f" }} onClick={clEnd}>수업 종료</button>
      </>)}

      {/* ── 영상 맞추기 ── 로그 0초와 영상 0초를 맞춘다. 아래 표가 같이 움직이는 게 확인 수단 */}
      {!log && segs.length > 0 && (
        <div className="cm-card" style={{ marginTop: 16, padding: 12 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
            <b style={{ fontSize: 13 }}>영상 맞추기</b>
            <div style={{ display: "flex", gap: 5, marginLeft: "auto" }}>
              <button className={"cm-ab-tab" + (shInfo.mode === "vid" ? " on" : "")} onClick={() => setShiftMode("vid")}>영상 지점</button>
              <button className={"cm-ab-tab" + (shInfo.mode === "clk" ? " on" : "")} onClick={() => setShiftMode("clk")}>녹화 켠 시각</button>
            </div>
          </div>
          <input className="cm-input" style={{ marginTop: 8 }} inputMode="numeric"
            value={shiftTxt} placeholder="3:12 (영상 지점) 또는 16:58 (녹화 켠 시각)"
            onChange={(e) => setShiftTxt(e.target.value)} />
          <div className="cm-hint" style={{ marginTop: 6, color: shInfo.ok ? null : "#d6453f" }}>
            {shInfo.label || ((saved && saved.beeped)
              ? "표식음을 냈으니 손으로 적을 필요 없어요 — PC에서 fix_sync.py 가 영상에서 찾아 채웁니다. 소리를 못 찾았을 때만 여기에 적으세요."
              : "비워두면 누른 순간이 영상 00:00입니다. 영상을 열어 첫 강의가 시작되는 지점을 찾아 적으면 아래 시각이 전부 그만큼 밀려요.")}
          </div>
          {shInfo.ok && shift < 0 && (
            <div className="cm-hint" style={{ color: "#c2703f" }}>
              녹화가 수업 시작보다 <b>{clHms(-shift)} 늦게</b> 켜졌네요. 그 앞은 영상에 없어서 잘라냅니다.
            </div>
          )}
          {shiftSaved && <div className="cm-hint" style={{ color: "#3f7d5e" }}>저장됐어요 ✓</div>}
        </div>
      )}

      {/* ── 구간 목록 ── */}
      {segs.length > 0 && (
        <div style={{ marginTop: 16 }}>
          <h4 className="cm-h3" style={{ fontSize: 14 }}>{log ? "오늘 기록" : date + " 기록"}
            <span className="cm-h-hint">{shift ? " 영상 기준 (맞추기 " + (shift < 0 ? "-" : "+") + clHms(Math.abs(shift)) + " 적용)" : " 영상 기준"}</span></h4>
          <table className="cl-tbl"><tbody>
            {segs.slice().reverse().map((g, i) => (
              <tr key={i}>
                <td style={{ width: 66, color: "var(--muted)" }} className="n">{clHms(g.start)}</td>
                <td><b style={{ color: g.sid ? colorOf(g.sid) : "var(--muted)" }}>{g.sid ? nameOf(g.sid) : "—"}</b>{" "}
                  <span className={"cl-tag" + (CL_KIND[g.kind].keep ? " keep" : "")}>{CL_KIND[g.kind].label}</span>
                  {g.unit ? <span className="cm-day-sub"> {g.unit}</span> : null}</td>
                <td className="n">{clHms(g.end - g.start)}</td>
              </tr>
            ))}
          </tbody></table>
        </div>
      )}

      {/* 남길 구간은 있는데 전부 20초 미만이면 조용히 사라진다. 왜 없는지는 말해줘야 한다 */}
      {!log && groups.length === 0 && segs.some((g) => g.sid && CL_KIND[g.kind] && CL_KIND[g.kind].keep) && (
        <div className="cm-hint" style={{ marginTop: 16 }}>
          강의 구간이 전부 20초보다 짧아서 자를 영상이 없어요. 눌러보신 기록이라면 정상입니다 —
          실제 수업에서는 <b>영상 자르기</b>가 여기에 나타납니다.
        </div>
      )}

      {/* ── 내보내기 ── */}
      {!log && groups.length > 0 && (
        <div style={{ marginTop: 18 }}>
          <h4 className="cm-h3" style={{ fontSize: 14 }}>영상 자르기</h4>
          <label className="cm-label">원본 영상 경로 또는 유튜브 ID</label>
          <input className="cm-input" value={srcPath} onChange={(e) => setSrcPath(e.target.value)} placeholder="8FRYFOc1850" />
          {groups.map((g) => (
            <div key={g.sid} className="cm-notice-preview" style={{ borderLeftColor: colorOf(g.sid) }}>
              <b>{g.filename}</b><br />{g.parts.length}조각 · {clHms(g.total)}
            </div>
          ))}
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 8 }}>
            <button className="cm-btn cm-btn-primary" style={{ margin: 0, padding: "9px 14px" }}
              onClick={() => clDownload("컷리스트-" + date + ".json", JSON.stringify({
                date, source: srcPath,
                shift: 0,                       // 아래 시각에 이미 반영됨 — 또 더하지 말 것
                videoOffset: Math.round(shift), // 로그 0초가 영상 몇 초였는지 (기록용)
                startedAt: anchorAt || null,
                startedAtIso: anchorAt ? new Date(anchorAt).toISOString() : null,
                // 소리 슬레이트. fix_sync.py 가 이걸 보고 영상에서 표식음을 찾는다
                sync: {
                  beeped: !!(saved && saved.beeped),
                  tones: CL_TONES, dur: CL_TONE_DUR,
                  startBeepLogT: saved && saved.beepAt && saved.startedAt
                    ? Math.round((saved.beepAt - saved.startedAt) / 10) / 100 : 0,
                  endBeepLogT: saved && saved.endBeepAt && saved.startedAt
                    ? Math.round((saved.endBeepAt - saved.startedAt) / 10) / 100 : null,
                },
                outputs: groups.map((g) => ({ student: g.name, subject: g.subject, units: g.units, filename: g.filename, parts: g.parts.map((p) => ({ start: Math.round(p.start), end: Math.round(p.end), unit: p.unit })) })),
                segments: segs.map((g) => ({ student: g.sid ? nameOf(g.sid) : null, kind: g.kind, keep: !!CL_KIND[g.kind].keep, unit: g.unit, start: Math.round(g.start), end: Math.round(g.end) })),
                transcript: (saved && saved.transcript) || trans,
              }, null, 2))}>컷 리스트 (.json)</button>
            <button className="cm-btn cm-btn-ghost" style={{ margin: 0, padding: "9px 14px" }}
              onClick={() => { const t = clFfmpeg(groups, srcPath); if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert("복사했습니다"), () => alert(t)); else alert(t); }}>ffmpeg 명령 복사</button>
          </div>
          <div className="cm-hint" style={{ marginTop: 8 }}>
            {(saved && saved.beeped)
              ? <>PC에서 <code>python fix_sync.py 컷리스트.json 영상.mp4</code> 를 먼저 돌리세요 —
                 표식음을 찾아 시각을 맞춰줍니다. 그 다음 <code>split_by_log.py</code>.</>
              : <>컷 리스트를 <code>split_by_log.py</code> 와 같은 폴더에 두고 실행하면 학생별 파일이 나옵니다.</>}
          </div>
        </div>
      )}

      {/* ── 수업기록 초안 ── 여기서 저장하면 학습관리 보고서에 그대로 실린다 */}
      {!log && segs.some((g) => g.sid && CL_KIND[g.kind] && CL_KIND[g.kind].keep) && (
        <div style={{ marginTop: 20 }}>
          <h4 className="cm-h3" style={{ fontSize: 14 }}>수업기록 <span className="cm-h-hint">(저장하면 학습관리 보고서에 실려요)</span></h4>
          {groups.map((g) => {
            const heard = (byStudent[g.sid] || []).join(" ");
            const st = noteState[g.sid] || {};
            const srcText = (st.src != null ? st.src : heard);
            return (
              <div key={g.sid} className="cm-card" style={{ borderLeft: "4px solid " + colorOf(g.sid), padding: 12 }}>
                <div className="row" style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <b style={{ color: colorOf(g.sid) }}>{g.name}</b>
                  <span className="cm-day-sub">{g.units.join(", ")}</span>
                  <span className="cm-day-sub" style={{ marginLeft: "auto" }}>
                    {srcText ? srcText.length + "자" : "받아쓴 내용 없음"}
                  </span>
                </div>

                {!srcText && (
                  <div className="cm-hint" style={{ marginTop: 6 }}>
                    마이크를 안 켜셨네요. PC에서 <code>split_by_log.py --transcribe</code> 로 받아쓴 뒤
                    아래에 붙여넣으면 됩니다.
                  </div>
                )}

                <textarea className="cm-input" rows={srcText ? 3 : 2} style={{ marginTop: 8, fontSize: 13 }}
                  placeholder="받아쓴 원문 (붙여넣어도 됩니다)"
                  value={srcText}
                  onChange={(e) => setNoteState((s) => ({ ...s, [g.sid]: { ...s[g.sid], src: e.target.value } }))} />

                {st.note != null && (
                  <textarea className="cm-input" rows={4} style={{ marginTop: 8 }}
                    value={st.note}
                    onChange={(e) => setNoteState((s) => ({ ...s, [g.sid]: { ...s[g.sid], note: e.target.value } }))} />
                )}
                {st.err && <div className="cm-err">{st.err}</div>}

                <div style={{ display: "flex", gap: 8, marginTop: 8, flexWrap: "wrap" }}>
                  <button className="cm-btn cm-btn-ghost" style={{ margin: 0, padding: "8px 12px" }}
                    disabled={!srcText || srcText.length < 30 || st.busy}
                    onClick={async () => {
                      setNoteState((s) => ({ ...s, [g.sid]: { ...s[g.sid], busy: true, err: "" } }));
                      try {
                        const note = await clMakeNote(srcText, g.name, g.units);
                        setNoteState((s) => ({ ...s, [g.sid]: { ...s[g.sid], busy: false, note } }));
                      } catch (e) {
                        setNoteState((s) => ({ ...s, [g.sid]: { ...s[g.sid], busy: false, err: String(e.message || e) } }));
                      }
                    }}>{st.busy ? "쓰는 중..." : "초안 만들기"}</button>

                  {st.note != null && (
                    <button className="cm-btn cm-btn-primary" style={{ margin: 0, padding: "8px 12px" }}
                      disabled={st.saving}
                      onClick={async () => {
                        setNoteState((s) => ({ ...s, [g.sid]: { ...s[g.sid], saving: true } }));
                        try {
                          await saveDailyNote(cls.id, g.sid, g.name, date, st.note, meName);
                          setNoteState((s) => ({ ...s, [g.sid]: { ...s[g.sid], saving: false, done: true } }));
                        } catch (e) {
                          setNoteState((s) => ({ ...s, [g.sid]: { ...s[g.sid], saving: false, err: String(e.message || e) } }));
                        }
                      }}>{st.saving ? "저장 중..." : st.done ? "저장됨 ✓ 다시 저장" : "수업기록으로 저장"}</button>
                  )}
                </div>
              </div>
            );
          })}
          <div className="cm-hint">
            AI가 쓴 초안입니다. <b>저장 전에 반드시 읽고 고치세요</b> — 학부모에게 나가는 글입니다.
          </div>
        </div>
      )}

      {/* ── 지난 기록 ── */}
      {!log && hist.length > 0 && (
        <div style={{ marginTop: 20 }}>
          <h4 className="cm-h3" style={{ fontSize: 14 }}>학생별 누적</h4>
          <table className="cl-tbl"><tbody>
            {people.map((p) => {
              let L = 0, Q = 0, days = 0;
              hist.forEach((h) => {
                let any = false;
                (h.segments || []).forEach((g) => {
                  if (g.sid !== p.id) return;
                  const d = g.end - g.start;
                  if (CL_KIND[g.kind] && CL_KIND[g.kind].keep) { L += d; any = true; }
                  else if (g.kind === "qa") { Q += d; any = true; }
                });
                if (any) days++;
              });
              return (
                <tr key={p.id}>
                  <td><b style={{ color: colorOf(p.id) }}>{p.name}</b></td>
                  <td className="n" style={{ color: "var(--muted)" }}>{days}회</td>
                  <td className="n">강의 {clMins(L)}{Q ? " · 질문 " + clMins(Q) : ""}</td>
                </tr>
              );
            })}
          </tbody></table>
        </div>
      )}
    </div>
  );
}

function AdminDay({ cls, date, canEdit, side, meName, onBack }) {
  const [attendance, setAttendance] = useState({});
  const [questions, setQuestions] = useState([]);
  const [hwDone, setHwDone] = useState({});
  const [scores, setScores] = useState([]);
  const [questioned, setQuestioned] = useState({});
  const [detail, setDetail] = useState(null);
  const [mkMap, setMkMap] = useState({}); // "반id:학생id" → makeup

  const dow = new Date(date + "T00:00:00").getDay();
  // 합반: 해당 요일이면 짝 반의 출석·과제·점수도 함께 (저장은 각 반, 화면만 병합)
  const mergePartner = (cls.merge && cls.merge.partnerId && (cls.merge.days || []).includes(dow)) ? findClass(cls.merge.partnerId) : null;
  const mergeKey = mergePartner ? mergePartner.id : "";

  useEffect(() => {
    const cids = mergePartner ? [cls.id, mergePartner.id] : [cls.id];
    const attStore = {}, hwStore = {}, qdStore = {}, scStore = {};
    const flat = (store) => { const o = {}; cids.forEach((c) => Object.entries(store[c] || {}).forEach(([sid, v]) => (o[c + ":" + sid] = v))); return o; };
    const unsubs = [];
    cids.forEach((cid) => {
      unsubs.push(attCol(cid, date).onSnapshot((s) => { attStore[cid] = {}; s.forEach((d) => (attStore[cid][d.id] = d.data())); setAttendance(flat(attStore)); }));
      unsubs.push(listenMakeups(cid, (m) => {
        setMkMap((prev) => {
          const next = { ...prev };
          Object.keys(next).forEach((k) => { if (k.startsWith(cid + ":")) delete next[k]; });
          Object.values(m).forEach((v) => { if (v.date === date) next[cid + ":" + v.sid] = v; });
          return next;
        });
      }));
      unsubs.push(hwCol(cid).onSnapshot((s) => { hwStore[cid] = {}; s.forEach((d) => (hwStore[cid][d.id] = d.data().books || {})); setHwDone(flat(hwStore)); }));
      unsubs.push(questionedCol(cid).onSnapshot((s) => { qdStore[cid] = {}; s.forEach((d) => (qdStore[cid][d.id] = d.data().books || {})); setQuestioned(flat(qdStore)); }));
      unsubs.push(scoresCol(cid, date).orderBy("time").onSnapshot((s) => {
        scStore[cid] = []; s.forEach((d) => scStore[cid].push({ id: cid + ":" + d.id, _cid: cid, ...d.data() }));
        const all = []; cids.forEach((c) => all.push(...(scStore[c] || []))); all.sort((a, b) => a.time - b.time); setScores(all);
      }));
    });
    // 질문은 합반 대표 반 한 곳
    unsubs.push(qCol(questionCid(cls, date), date).orderBy("time").onSnapshot((s) => { const arr = []; s.forEach((d) => arr.push({ qid: d.id, ...d.data() })); setQuestions(arr); }));
    return () => unsubs.forEach((u) => u && u());
  }, [cls.id, date, mergeKey]);

  const withKey = (r, cid) => ({ ...r, _cid: cid, _key: cid + ":" + r.id });
  let roster = cls.roster.filter((r) => !r.teacher && attendsOn(cls, r, date)).map((r) => withKey(r, cls.id));
  if (mergePartner) roster = roster.concat(mergePartner.roster.filter((r) => !r.teacher && attendsOn(mergePartner, r, date)).map((r) => withKey(r, mergePartner.id)));
  const presentIds = Object.keys(attendance);
  const plannedCount = roster.filter((r) => !attendance[r._key] && (mkMap[r._cid + ":" + r.id] || {}).planned).length;
  const waiting = questions.filter((q) => !q.resolved);
  const hwStudents = roster.filter((r) => hwDone[r._key] && getStudentBooks(findClass(r._cid) || cls, r).some((b) => (hwDone[r._key][b.name] || []).length > 0));

  const dayRef = useSwipeBack(onBack);

  if (detail) return <StudentDetail cls={findClass(detail._cid) || cls} student={detail} hwDone={{ [detail.id]: hwDone[detail._key] || {} }} questioned={{ [detail.id]: questioned[detail._key] || {} }} canEdit={canEdit} date={date} meName={meName} onBack={() => setDetail(null)} />;

  return (
    <>
    {side}
    <div ref={dayRef} className="cm-stack cm-slide-in" style={{willChange: "transform"}}>
      <div className="cm-daybar">
        <button className="cm-back" onClick={onBack}>‹ 날짜 선택</button>
        <div className="cm-daybar-date">{cls.name} · {fmtDate(date)}{date === todayStr && <span className="cm-live">● LIVE</span>}{!canEdit && <span className="cm-day-sub">열람 전용</span>}</div>
      </div>

      <div className="cm-card cm-admin-top">
        <div className="cm-stat"><div className="cm-stat-num">{presentIds.length}<span>/{roster.length - plannedCount}</span></div><div className="cm-stat-lab">출석{plannedCount > 0 && <span style={{color: "#c2703f"}}> · 결석예정 {plannedCount}</span>}</div></div>
        <div className="cm-stat"><div className="cm-stat-num cm-clay">{waiting.length}</div><div className="cm-stat-lab">대기 질문</div></div>
      </div>

      <div className="cm-card">
        <h3 className="cm-h3">질문 대기열</h3>
        <QuestionQueue questions={questions} clsId={questionCid(cls, date)} date={date} canEdit={canEdit} books={getClassAllBooks(cls)} merged={questionCid(cls, date) !== cls.id} />
      </div>

      <div className="cm-card">
        <div style={{display: "flex", alignItems: "center", gap: 8, marginBottom: 4, flexWrap: "wrap"}}>
          <h3 className="cm-h3" style={{margin: 0}}>출석 현황 <span className="cm-h-hint">(체크로 출석 · 이름 누르면 상세)</span></h3>
          {canEdit && roster.length > 0 && (
            <button className="cm-link" style={{marginLeft: "auto"}} onClick={async () => {
              const missing = roster.filter((r) => !attendance[r._key]);
              if (missing.length === 0) { if (confirm("모두 출석 상태예요. 전체 출석을 취소할까요?")) { for (const r of roster) await markAttendance(r._cid, date, r, false); } return; }
              if (!confirm("미출석 " + missing.length + "명을 모두 출석 처리할까요?")) return;
              for (const r of missing) await markAttendance(r._cid, date, r, true);
            }}>{roster.every((r) => attendance[r._key]) ? "전체 취소" : "전체 출석"}</button>
          )}
        </div>
        <div className="cm-roster">
          {roster.map((r) => {
            const a = attendance[r._key];
            const mk = mkMap[r._cid + ":" + r.id] || {};
            const planned = mk.planned && !a;
            const vdone = mk.videoDone;
            const boxColor = a ? "var(--green)" : vdone ? "#2b5f8a" : planned ? "#c2703f" : "var(--line)";
            return (
              <div key={r._key} className={"cm-rost " + (a ? "in" : "")} style={{display: "flex", alignItems: "center", gap: 10, cursor: "default", opacity: planned && !vdone ? .8 : 1}}>
                <span onClick={(e) => { e.stopPropagation(); if (canEdit) markAttendance(r._cid, date, r, !a); }}
                  title={canEdit ? "탭하여 출석 처리" : ""}
                  style={{width: 26, height: 26, flex: "none", borderRadius: 8, border: "1.5px solid " + boxColor,
                    background: a ? "var(--green)" : vdone ? "#e3edf5" : planned ? "#f6e7df" : "#fff",
                    color: a ? "#fff" : vdone ? "#2b5f8a" : "#c2703f", display: "flex", alignItems: "center", justifyContent: "center",
                    fontSize: a ? 15 : 12, fontWeight: 700, cursor: canEdit ? "pointer" : "default"}}>{a ? "✓" : vdone ? "영" : planned ? "예" : ""}</span>
                <span style={{flex: 1, minWidth: 0, cursor: "pointer"}} onClick={() => setDetail(r)}>
                  <span className="cm-rost-name" style={{display: "block"}}>{r.name}</span>
                  <span className="cm-rost-sub">
                    {mergePartner && r._cid !== cls.id ? mergePartner.name + " · " : ""}
                    {a ? hhmm(a.time) : vdone ? "동영상 보강" : planned ? ("결석 예정" + (mk.memo ? " · " + mk.memo : "")) : "미출석"}
                  </span>
                </span>
                <span className="cm-rost-t" style={{cursor: "pointer", color: "#b3a89a"}} onClick={() => setDetail(r)}>›</span>
              </div>
            );
          })}
        </div>
      </div>

      <div className="cm-card">
        <h3 className="cm-h3">과제 현황 <span className="cm-h-hint">(누적)</span></h3>
        {hwStudents.length === 0 ? (<div className="cm-empty">등록된 과제가 없어요</div>) : (
          hwStudents.map((r) => (
            <div key={r._key} className="cm-hw-row">
              <button className="cm-hw-name cm-hw-name-btn" onClick={() => setDetail(r)}>{r.name}</button>
              <div className="cm-hw-items">
                {getStudentBooks(findClass(r._cid) || cls, r).filter((b) => (hwDone[r._key][b.name] || []).length > 0).map((b) => (<span key={b.name} className="cm-chip">{b.name} {hwDone[r._key][b.name].length}문제</span>))}
              </div>
            </div>
          ))
        )}
      </div>

      <div className="cm-card">
        <h3 className="cm-h3">테스트 점수</h3>
        {scores.length === 0 ? (<div className="cm-empty">제출된 점수가 없어요</div>) : (
          scores.slice().reverse().map((s) => (
            <div key={s.id} className="cm-score-row">
              <span className="cm-score-name">{s.name}{mergePartner && s._cid && s._cid !== cls.id && <span className="cm-day-sub" style={{marginLeft: 5, fontSize: 10}}>{mergePartner.name}</span>}</span>
              <span className="cm-score-detail">{s.label ? s.label + " · " : ""}{s.correct}/{s.total}</span>
              <span className="cm-score-num">{s.score}점</span>
            </div>
          ))
        )}
      </div>

    </div>
    </>
  );
}

function DailyNoteCard({ cid, student, date, canEdit, meName }) {
  const [note, setNote] = useState(undefined);
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const [saved, setSaved] = useState(false);
  useEffect(() => listenDailyNote(cid, student.id, date, (n) => {
    setNote(n); setText(n ? n.text : ""); setSaved(false);
  }), [cid, student.id, date]);

  async function save() {
    if (busy) return;
    setBusy(true);
    try { await saveDailyNote(cid, student.id, student.name, date, text, meName); setSaved(true); }
    catch (e) { alert("저장 실패: " + e.message); }
    setBusy(false);
  }
  const dirty = note ? text.trim() !== note.text : !!text.trim();

  return (
    <div className="cm-card">
      <div className="cm-book-head">
        <h3 className="cm-h3" style={{margin: 0}}>오늘 수업 코멘트 <span className="cm-h-hint">({fmtDate(date)})</span></h3>
        {saved && !dirty && <span style={{fontSize: 12, color: "var(--green)"}}>저장됨 ✓</span>}
      </div>
      {canEdit ? (<>
        <textarea className="cm-input cm-notice-ta" rows={3}
          placeholder="예: 이차함수 최대·최소 파트 이해도 좋음. 계산 실수 줄이는 연습 필요."
          value={text} onChange={(e) => { setText(e.target.value); setSaved(false); }} />
        <div style={{display: "flex", gap: 10, alignItems: "center"}}>
          <button className="cm-btn cm-btn-primary" style={{margin: 0}} disabled={busy || !dirty} onClick={save}>
            {busy ? "저장 중..." : "저장"}
          </button>
          <span style={{fontSize: 11, color: "var(--muted)"}}>한 달치가 모여 학습관리 보고서에 실려요</span>
        </div>
      </>) : (
        note ? <div style={{fontSize: 14, lineHeight: 1.6, whiteSpace: "pre-wrap"}}>{note.text}</div>
             : <div className="cm-empty">작성된 코멘트가 없어요</div>
      )}
    </div>
  );
}

function StudentDetail({ cls, student, hwDone, questioned, canEdit, date, meName, onBack }) {
  const mine = hwDone[student.id] || {};
  const qmine = (questioned && questioned[student.id]) || {};
  const detailDivRef = useSwipeBack(onBack);
  const [editHw, setEditHw] = useState(false);
  const targetCid = student._cid || cls.id;
  return (
    <div ref={detailDivRef} className="cm-stack cm-slide-in" style={{willChange: "transform"}}>
      <div className="cm-daybar">
        <button className="cm-back" onClick={onBack}>‹ 현황으로</button>
        <div className="cm-daybar-date">{student.name} · 누적 진도</div>
        {canEdit && <button className="cm-link" style={{marginLeft: "auto"}} onClick={() => setEditHw(!editHw)}>{editHw ? "완료" : "과제 체크"}</button>}
      </div>
      {date && <DailyNoteCard cid={targetCid} student={student} date={date} canEdit={canEdit} meName={meName} />}

      {editHw && <div className="cm-hint">번호를 눌러 체크하거나, 길게 눌러 드래그하면 여러 개를 한 번에 칠할 수 있어요. 학생이 직접 체크한 것과 똑같이 기록돼요.</div>}
      {getStudentBooks(cls, student).map((b) => {
        const qnums = qmine[b.name] || [];
        if (editHw) {
          return (
            <BookHwCard key={"e" + b.name} book={b} initial={mine[b.name] || []} qNumbers={qnums}
              onClearQuestion={(n) => removeQuestioned(targetCid, student.id, b.name, n)}
              onChange={(arr) => saveHwBookFor(targetCid, student.id, student.name, b.name, arr)} />
          );
        }
        return (
          <div className="cm-card" key={b.name}>
            <div className="cm-book-head">
              <h3 className="cm-h3" style={{ margin: 0 }}>{b.name}</h3>
              <span className="cm-book-count">{(mine[b.name] || []).length} / {b.total}<span className="cm-book-pct"> ({b.total > 0 ? Math.round((mine[b.name] || []).length / b.total * 100) : 0}%)</span></span>
            </div>
            {qnums.length > 0 && (
              <div className="cm-qchips">
                <span className="cm-qchips-label">질문한 번호</span>
                {qnums.slice().sort((x, y) => x - y).map((n) => (
                  <button key={n} className="cm-qchip" onClick={() => removeQuestioned(targetCid, student.id, b.name, n)}>{n} ✕</button>
                ))}
              </div>
            )}
            <HwGrid total={b.total} set={new Set(mine[b.name] || [])} qset={new Set(qnums)} />
          </div>
        );
      })}
    </div>
  );
}

// ===== 앱 루트 =====
function App() {
  const params = new URLSearchParams(window.location.search);
  const isAdmin = params.get("admin") === "1";
  const urlClass = findClass(params.get("class"));
  const [gateCls, setGateCls] = useState(null);
  const [sideOpen, setSideOpen] = useState(false);
  const [hasSide, setHasSide] = useState(0);
  useBlockStrayDrop();

  let sub, main;
  if (isAdmin) { sub = "수업 관리"; main = <AdminView />; }
  else if (urlClass) { sub = urlClass.name + " · " + todayStr; main = <StudentView cls={urlClass} onBack={null} />; }
  else { sub = gateCls ? gateCls.name + " · " + todayStr : "로그인"; main = <StudentGate onClsChange={setGateCls} />; }

  return (
    <SideCtx.Provider value={{ open: sideOpen, setOpen: setSideOpen, setHasSide }}>
      <header className="cm-header">
        {hasSide > 0 && <button className="cm-hamb" onClick={() => setSideOpen(true)}>☰</button>}
        <div className="cm-brand" style={{flex: 1}}><span className="cm-logo">CLIMATH</span><span className="cm-sub">{sub}</span></div>
      </header>
      <div className="cm-shell"><main className="cm-main">{main}</main></div>
    </SideCtx.Provider>
  );
}

// ===== 앱 시작 =====
// 익명 로그인을 하지 않는다. 예전에는 방문자 전원을 자동 로그인시켰고 규칙이
// `request.auth != null`이라, 주소를 연 누구나 전체 DB를 읽고 쓸 수 있었다.
// 이제 /api/auth 가 발급한 토큰으로만 들어오고, 그 전에는 아무것도 못 읽는다.
// 로그인 화면은 반 목록이 필요 없으므로 바로 렌더한다.
const rootEl = document.getElementById("root");
let rendered = false;
function renderApp() { if (rendered) return; rendered = true; ReactDOM.createRoot(rootEl).render(<App />); }
try {
  // 이미 로그인돼 있으면(새로고침) 반 목록을 먼저 채우고 그린다
  firebase.auth().onAuthStateChanged((u) => {
    if (u && !rendered) { loadClasses().catch(() => {}).then(renderApp); }
    else renderApp();
  });
} catch (e) { renderApp(); }
setTimeout(renderApp, 4000);

</script>

<script>
  // 우리 앱 코드를 직접 Babel로 변환해서 전역 실행 (자동 변환/외부 스크립트 간섭 회피)
  (function () {
    function runApp() {
      try {
        var src = document.getElementById("__appSource").textContent;
        var out = Babel.transform(src, { presets: ["react"], sourceType: "script" }).code;
        var s = document.createElement("script");
        s.textContent = out;
        document.body.appendChild(s);
      } catch (e) {
        document.getElementById("root").innerHTML =
          '<div style="padding:40px;text-align:center;color:#c2703f;font-family:sans-serif">앱 로딩 오류<br><br>' + (e && e.message ? e.message : e) + '</div>';
        console.error("앱 변환/실행 오류:", e);
      }
    }
    if (typeof Babel !== "undefined") runApp();
    else {
      var wait = setInterval(function () {
        if (typeof Babel !== "undefined") { clearInterval(wait); runApp(); }
      }, 50);
      setTimeout(function () { clearInterval(wait); }, 10000);
    }
  })();
</script>
